# ════════════════════════════════════════════════════════════
# BVC — Contrôle de séance
#
# Le critère de succès du projet est « trente jours consécutifs sans échec ».
# Il n'était pas mesurable : rien ne prévenait quand un run manquait, il
# fallait que quelqu'un regarde.
#
# Ce workflow regarde à sa place, une fois par jour ouvré, après le filet de
# sécurité de 18h. S'il échoue, GitHub envoie un courriel au propriétaire du
# dépôt — c'est l'alerte, et elle ne demande ni service tiers ni secret.
#
# ⚠️ Il ne commite RIEN et ne déclenche donc aucune reconstruction de Pages.
# Le quota de publication est la ressource rare du projet ; un contrôle qui
# le consommerait irait contre son propre but.
# ════════════════════════════════════════════════════════════

name: BVC Contrôle de séance

on:
  schedule:
    # 18h30 UTC = 19h30 Casablanca. Après le run de 18h, et assez tard pour
    # absorber les 30 à 50 minutes de retard que GitHub applique à ses tâches
    # programmées — mesuré trois fois le 24/08 : 34, 49 et 39 minutes.
    - cron: '32 18 * * 1-5'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bvc-controle-seance
  cancel-in-progress: true

jobs:
  controler:
    runs-on: ubuntu-latest
    # 5 min suffisaient aux contrôles du dépôt ; l'installation de Chromium pour
    # les contrôles Bourse de Casablanca (20/10/2026) en demande davantage.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Aucune dépendance : le script ne lit que des fichiers du dépôt avec la
      # bibliothèque standard. Rien à installer, rien à faire tomber en panne.
      - name: Contrôler la dernière séance échue
        run: python pipeline/verifier_seance.py

      # ── Bourse de Casablanca (20/10/2026) ─────────────────────────────
      # Deux contrôles sur le site public : volume global contre nos bougies,
      # publications d'émetteurs contre ce que nous avons intégré. Le site
      # n'est lisible qu'avec un vrai navigateur (curl refuse sa chaîne de
      # certificats ; Chromium l'ouvre en TLS strict, sans contournement).
      #
      # ⚠️ TOUTES ces étapes sont `continue-on-error` : la disponibilité d'un
      # site tiers ne doit jamais faire tomber les contrôles de séance
      # ci-dessus, qui sont l'alerte du projet. Et le contrôle de volume est en
      # OBSERVATION (aucun seuil sans mesure, R12) : il ne rend jamais d'échec.
      #
      # Playwright est installé dans $RUNNER_TEMP, version figée, sans scripts
      # d'installation : ni package.json ni node_modules dans le dépôt.
      - name: Installer Playwright (Bourse de Casablanca)
        id: playwright
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/pw" "$RUNNER_TEMP/bourse"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --ignore-scripts playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps --only-shell chromium

      - name: Relever le site de la Bourse de Casablanca
        if: always() && steps.playwright.outcome == 'success'
        continue-on-error: true
        env:
          BVC_PLAYWRIGHT: ${{ runner.temp }}/pw/node_modules/playwright
          BVC_CHROMIUM: ''
        run: |
          node tools/bourse_casablanca.js accueil > "$RUNNER_TEMP/bourse/accueil.json" || rm -f "$RUNNER_TEMP/bourse/accueil.json"
          node tools/bourse_casablanca.js publications > "$RUNNER_TEMP/bourse/publications.json" || rm -f "$RUNNER_TEMP/bourse/publications.json"

      # Liste officielle des émetteurs (20/10/2026). La capitalisation publiée
      # est cours × nombre d'actions de `datasets/bourse_emetteurs.json` : un
      # relevé neuf est comparé à ce fichier, et tout nombre d'actions changé
      # est listé dans le résumé — c'est le signal pour rafraîchir le fichier,
      # après vérification sur pièce (R11). Rien n'est commité.
      - name: Liste des émetteurs — nombres d'actions changés
        if: always() && steps.playwright.outcome == 'success'
        continue-on-error: true
        env:
          BVC_PLAYWRIGHT: ${{ runner.temp }}/pw/node_modules/playwright
          BVC_CHROMIUM: ''
          BVC_SORTIE: ${{ runner.temp }}/bourse/emetteurs.json
        run: |
          node tools/releve_emetteurs_bourse.js
          python tools/comparer_emetteurs.py --releve datasets/bourse_emetteurs.json \
            --nouveau "$RUNNER_TEMP/bourse/emetteurs.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Contrôles Bourse de Casablanca (observation)
        if: always()
        continue-on-error: true
        run: |
          python pipeline/controle_bourse.py \
            --accueil "$RUNNER_TEMP/bourse/accueil.json" \
            --publications "$RUNNER_TEMP/bourse/publications.json" \
            --sortie "$RUNNER_TEMP/bourse"

      - name: Artefact Bourse de Casablanca
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bourse-casablanca
          path: ${{ runner.temp }}/bourse
          if-no-files-found: ignore
          retention-days: 90

      # File d'attente des comptes (30/09/2026) : dépôts AMMC pas encore
      # intégrés, écrits dans le résumé du run. Toujours exécutée, jamais
      # bloquante — une file non vide n'est pas une panne de séance.
      # `--bourse` (20/10/2026) y ajoute la seconde source, à côté de l'AMMC ;
      # un fichier absent est ignoré.
      - name: Comptes déposés à lire
        if: always()
        run: python pipeline/file_attente_comptes.py --bourse "$RUNNER_TEMP/bourse/candidats_comptes_bourse.json"
