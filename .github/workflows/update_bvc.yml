# ════════════════════════════════════════════════════════════
# BVC Data Auto-Update — GitHub Actions
# Toutes les 15 min pendant la session BVC (9h30–15h45 Casablanca)
# Stratégie double fiabilité :
#   1. Crons explicites (plus fiables que */15 que GitHub saute)
#   2. Auto-relais : chaque run réussi déclenche le suivant
# ════════════════════════════════════════════════════════════

name: BVC Data Update

on:
  schedule:
    # Crons explicites UTC (Casablanca = UTC+1).
    #
    # Quatre passages, et non plus vingt-sept. Le produit est J+1 : sa promesse
    # est « dernière clôture fiable », pas le temps réel. Vingt-sept runs ne
    # servaient aucune promesse tenue, et chaque run pousse un commit qui
    # déclenche une reconstruction de GitHub Pages — quota d'environ dix par
    # heure. Relevé sur huit jours : 112 commits par jour, pic à 135.
    #
    # ⚠️ GitHub décale les tâches programmées de 30 à 50 minutes selon la
    # charge (mesuré le 11/08). Les heures ci-dessous sont donc des bornes
    # basses, ce qui est sans conséquence ici : aucune ne vise une minute
    # précise, et celle qui compte est postérieure à la clôture.
    - cron: '40 8 * * 1-5'    # ≈09h40 — dix minutes après l'ouverture, le
                              #          temps que les titres peu liquides
                              #          impriment un premier cours. À 9h30
                              #          pile, ils n'ont encore rien coté et
                              #          le run les compte comme périmés.
    - cron:  '0 11 * * 1-5'   # ≈12h00 — mi-séance
    - cron: '45 14 * * 1-5'   # ≈15h45 — LE run qui compte : 15 min après la
                              #          clôture de 15h30, il fixe le cours
                              #          définitif de la séance
    - cron:  '0 17 * * 1-5'   # ≈18h00 — filet de sécurité, après que
                              #          generate_candles (17h) soit passé

    # ── Redondance du soir, ajoutée le 31/08/2026 ────────────────────────
    # ⚠️ Le décalage n'est plus de 30 à 50 minutes mais de 2 à 8 HEURES, et
    # certains crons ne partent pas du tout. Mesuré : le cron de 17h00 du
    # vendredi 28 s'est déclenché le samedi à 00h47 ; celui du lundi 31 à
    # 08h40 n'est jamais parti — le terminal est resté sur la clôture de
    # vendredi jusqu'à un déclenchement manuel à 11h35.
    #
    # La parade tient à une observation : pour un bulletin J+1, l'échéance
    # est 8h00 du matin, pas 18h00. Un run qui aboutit à 1h du matin publie
    # à temps. Trois créneaux du soir donnent donc trois chances d'atterrir
    # avant l'ouverture, là où un seul est un point unique de défaillance.
    #
    # Le coût est nul : un run qui ne modifie aucun fichier ne commite pas,
    # donc le quota de reconstruction de Pages n'est pas entamé. Ce n'est
    # PAS un retour aux vingt-sept crons — ceux-là visaient un temps réel
    # que le produit ne promet pas ; ceux-ci protègent la seule promesse
    # qu'il tient.
    - cron:  '0 19 * * 1-5'   # ≈20h00 — deuxième chance
    - cron:  '0 21 * * 1-5'   # ≈22h00 — troisième chance

  # ⚠️ NE PAS réintroduire « BVC News Fetch » ici. Les deux workflows se
  # déclenchaient mutuellement — BVC → news → BVC → news, un cycle toutes les
  # 3 à 5 minutes pendant toute la séance. C'était la source réelle des
  # 112 commits quotidiens, bien avant les crons. La boucle est rompue côté
  # update_bvc ici, et côté fetch_news dans son propre fichier ; les deux
  # coupures sont nécessaires, une seule laisserait le cycle repartir.
  #
  # Le pipeline v9 reste, et pour une raison précise : il écrit data.json sans
  # émettre les blocs `_meta`. Un run d'update_bvc derrière lui les rétablit.
  # Il est déclenché à la main, donc sans effet sur le volume.
  workflow_run:
    workflows: ["BVC Financial Data Pipeline v9"]
    types: [completed]

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (afficher sans écrire)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  actions: write   # nécessaire pour le self-dispatch (auto-relais)

# Groupe partagé avec le pipeline v9 : tous deux poussent sur main.
concurrency:
  group: bvc-main-push
  cancel-in-progress: false

jobs:
  update-bvc-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ── 0. Gate session BVC ───────────────────────────────
      - name: Vérifier session BVC
        id: gate
        run: |
          TRIGGER="${{ github.event_name }}"
          if [ "$TRIGGER" = "workflow_dispatch" ] || [ "$TRIGGER" = "schedule" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          NOW=$(TZ="Africa/Casablanca" date +%H%M)
          DAY=$(TZ="Africa/Casablanca" date +%u)
          if [ "$DAY" -le 5 ] && [ "$NOW" -ge 0915 ] && [ "$NOW" -lt 1540 ]; then
            echo "run=true"  >> $GITHUB_OUTPUT
            echo "✅ Session BVC ouverte (${NOW} Casablanca)"
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "⏸️ Hors session BVC — skip (${NOW} Casablanca, jour=$DAY)"
          fi

      # ── 1. Checkout ──────────────────────────────────────
      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ────────────────────────────────────────
      - name: Setup Python 3.11
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer dépendances
        if: steps.gate.outputs.run == 'true'
        run: pip install requests numpy pandas -q

      # ── 3. Mise à jour données ────────────────────────────
      - name: Mise à jour data.json (dry-run)
        if: steps.gate.outputs.run == 'true' && github.event.inputs.dry_run == 'true'
        run: python update_data.py --dry-run

      - name: Mise à jour data.json
        if: steps.gate.outputs.run == 'true' && github.event.inputs.dry_run != 'true'
        run: python update_data.py

      # ── 4. Commit et push ─────────────────────────────────
      - name: Commit data.json si modifié
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "BVC Bot"
          git config user.email "noreply@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset origin/main
            git add data.json
            if [ -d pipeline/candles ] && [ "$(ls pipeline/candles/*.json 2>/dev/null | wc -l)" -gt 0 ]; then
              git add pipeline/candles/
            fi
            if git diff --cached --quiet; then
              echo "Aucun changement — skip commit"
              exit 0
            fi
            HEURE=$(TZ="Africa/Casablanca" date +'%Y-%m-%d %H:%M')
            git commit -m "data: BVC update ${HEURE} (Casablanca)"
            git push origin HEAD:main && echo "✅ Pushé" && exit 0
            echo "⚠️ Push échoué (tentative $attempt/3), retry..."
            sleep $((attempt * 3))
          done
          exit 1

      # ── 4a. Suite de tests ────────────────────────────────
      # ⚠️ Elle est ici parce que `tests.yml` NE VOIT PAS les données publiées.
      # Relevé le 01/09 : sur six exécutions, toutes portaient sur un commit
      # humain, aucune sur un commit « data: BVC update ». GitHub ne déclenche
      # pas de workflow sur les commits poussés avec son propre jeton — une
      # protection contre les boucles infinies, qui rend le filtre `paths:
      # data.json` de tests.yml purement décoratif.
      #
      # Or les tests des règles R1 à R10 portent justement sur le data.json
      # RÉELLEMENT PUBLIÉ. Sans cette étape, ils ne l'examinent jamais.
      #
      # Non bloquant : un run qui a déjà écrit et poussé ne doit pas être
      # marqué en échec pour un test — le fichier est publié de toute façon.
      # Le contrôle de séance ci-dessous, lui, échoue et alerte.
      - name: Suite de tests
        if: always()
        continue-on-error: true
        run: |
          pip install --quiet pytest
          python -m pytest --tb=line -q || echo "::warning::La suite de tests signale un écart sur les données publiées."

      # ── 4b. Contrôle qualité ──────────────────────────────
      # Le contrôle vit aussi dans verifier_seance.yml, mais celui-ci dépend
      # du déclencheur `schedule` de GitHub — devenu inutilisable sur ce dépôt :
      # mesuré les 26, 27 et 28/08, les tâches partent avec 2 à 8 heures de
      # retard, le cron de 17h00 s'étant déclenché à 01h12 le lendemain.
      # L'alarme était donc branchée sur le courant qu'elle surveille.
      #
      # L'attacher ici la rend indépendante : quelle que soit la façon dont ce
      # run a été déclenché — cron, dispatch manuel, réveil externe — la séance
      # est contrôlée juste après avoir été écrite.
      #
      # ⚠️ Il n'échoue que sur le passage du soir (≥ 17h00 UTC, soit 18h00 à
      # Casablanca). En journée la séance est encore en cours : exiger qu'elle
      # soit complète ferait échouer le contrôle tous les matins, et une alarme
      # toujours allumée n'alerte plus — c'est la leçon du drapeau `stale` du
      # 14/08. Le reste du temps il informe sans bloquer.
      - name: Contrôle de la séance
        if: always()
        run: |
          set +e
          python pipeline/verifier_seance.py
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ] && [ "$(date -u +%H)" -ge 17 ]; then
            echo "::error::Le contrôle de séance a échoué sur le passage du soir."
            exit 1
          fi
          [ "$CODE" -ne 0 ] && echo "::notice::Contrôle non conforme — séance en cours, non bloquant."
          exit 0

      # ── 5. Résumé ─────────────────────────────────────────
      - name: Résumé
        if: always()
        run: |
          echo "## BVC Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Date** : $(TZ='Africa/Casablanca' date +'%Y-%m-%d %H:%M') (Casablanca)" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger** : ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          if [ -f data.json ]; then
            python3 - <<'PYEOF' >> $GITHUB_STEP_SUMMARY
          import json
          d = json.load(open('data.json'))
          tickers = d.get('tickers', [])
          print(f"- **Tickers** : {len(tickers)}")
          print(f"- **Statut marché** : {d.get('market_status','?')}")
          chg_ok  = sum(1 for t in tickers if t.get('chg', 0) != 0)
          vol_ok  = sum(1 for t in tickers if t.get('vol', 0) != 0)
          print(f"- **chg ≠ 0** : {chg_ok}/{len(tickers)}")
          print(f"- **vol ≠ 0** : {vol_ok}/{len(tickers)}")
          PYEOF
          fi
