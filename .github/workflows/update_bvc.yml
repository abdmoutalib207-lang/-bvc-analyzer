# ════════════════════════════════════════════════════════════
# BVC Data Auto-Update — GitHub Actions
# Toutes les 15 min pendant la session BVC (9h30–15h45 Casablanca)
# Stratégie double fiabilité :
#   1. Crons explicites (plus fiables que */15 que GitHub saute)
#   2. Auto-relais : chaque run réussi déclenche le suivant
# ════════════════════════════════════════════════════════════

name: BVC Data Update

on:
  schedule:
    # ⚠️ REFONTE DU 23/09/2026 — « LE MOTEUR TOURNE QUAND LA BVC EST FERMÉE
    # ET MANQUE À L'OUVERTURE »
    # ─────────────────────────────────────────────────────────────────────
    # Constat de Noure, vérifié : entre 19h et 01h46 Casablanca, SEPT runs se
    # sont déclenchés — la Bourse était fermée. Puis plus rien de 07h09 à
    # 12h32, alors que la séance était ouverte depuis trois heures.
    #
    # Deux causes cumulées :
    #   1. le cron de rattrapage était `25 * * * 1-5`, soit TOUTES LES HEURES,
    #      NUIT COMPRISE. La porte de rattrapage écartait bien ces runs, mais
    #      ils partaient quand même : du bruit, du quota, et zéro utilité ;
    #   2. deux crons de « redondance du soir » à 20h et 22h Casablanca, posés
    #      le 31/08 contre les retards de GitHub — mais placés là où rien ne
    #      peut plus être collecté.
    #
    # La redondance n'était donc pas absente : elle était AU MAUVAIS ENDROIT.
    # Elle est ramenée là où elle sert — dans la fenêtre de cotation.
    #
    # ⚠️ Le remède au retard de GitHub n'est pas d'avancer les heures — ça ne
    # ferait que décaler le problème — mais de MULTIPLIER LES OCCASIONS dans
    # la fenêtre utile. La porte de rattrapage (`pipeline/porte_rattrapage.py`)
    # filtre : un run qui n'a rien à rapporter s'arrête avant d'écrire, donc
    # sans commit et sans consommer le quota de publication de Pages.
    #
    # Casablanca = UTC+1 toute l'année.

    # ── Les quatre passages qui portent la promesse ──────────────────────
    - cron: '40 8 * * 1-5'    # ≈09h40 — dix minutes après l'ouverture, le
                              #          temps que les titres peu liquides
                              #          impriment un premier cours
    - cron:  '0 11 * * 1-5'   # ≈12h00 — mi-séance
    - cron: '45 14 * * 1-5'   # ≈15h45 — LE run qui compte : 15 min après la
                              #          clôture de 15h30, il fixe le cours
    - cron:  '0 17 * * 1-5'   # ≈18h00 — filet, après generate_candles (17h)

    # ── La redondance, DANS la fenêtre de cotation ───────────────────────
    #
    # Toutes les trente minutes de 09h25 à 18h55 Casablanca. Chacune passe par
    # la porte : si `data.json` porte déjà la séance en cours, le run s'arrête
    # avant toute écriture. Ce qui reste, ce sont les occasions de rattraper un
    # cron sauté — et il en faut plusieurs, puisqu'on ne sait pas lequel sautera.
    #
    # ⚠️ RIEN AVANT 08h25 UTC NI APRÈS 17h55 UTC. Hors séance, il n'y a rien à
    # collecter : un run nocturne ne peut que republier ce qu'on a déjà.
    - cron: '25,55 8-17 * * 1-5'

  workflow_run:
    workflows: ["BVC Financial Data Pipeline v9"]
    types: [completed]

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (afficher sans écrire)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  actions: write   # nécessaire pour le self-dispatch (auto-relais)

# Groupe partagé avec le pipeline v9 : tous deux poussent sur main.
concurrency:
  group: bvc-main-push
  cancel-in-progress: false

jobs:
  update-bvc-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ── 0. Le dépôt, AVANT la porte ───────────────────────
      #
      # ⚠️ La porte lit maintenant `data.json` et appelle un module du dépôt :
      # elle ne peut plus s'exécuter sur un runner vide. Le checkout passe donc
      # devant, et sans condition — c'est deux secondes, et cela supprime la
      # classe de défauts « une étape qui se prononce sur un dépôt absent »,
      # celle des 18 runs rouges du 15/09.
      #
      # Elle lit le fichier du dépôt plutôt que celui servi par
      # raw.githubusercontent : c'est le même contenu, sans appel réseau et
      # sans le retard de cache de l'un ni le risque d'échec de l'autre.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 1. Gate session BVC ───────────────────────────────
      - name: Vérifier session BVC
        id: gate
        run: |
          TRIGGER="${{ github.event_name }}"
          CRON="${{ github.event.schedule }}"

          # ── LE CRON DE RATTRAPAGE ──────────────────────────────────────
          #
          # ⚠️ IL JUGEAIT SUR LA DATE DU FICHIER, PAS SUR LA SÉANCE QU'IL PORTE.
          #
          # Mercredi 16/09/2026, 11h08 Casablanca — une heure trente-huit après
          # l'ouverture : le terminal servait encore la clôture du 15.
          # `data.json` portait `updated: 2026-09-16T03:15` et 78 titres sur 80
          # au `prix_asof` du 15/09. Le cron de 09h40 n'était pas parti (le mal
          # connu), et le filet de sécurité a répondu « à jour ».
          #
          # Il avait tort pour deux raisons cumulées : un run de 3h du matin —
          # un rattrapage tardif de la VEILLE — lui suffisait à croire la
          # journée couverte, et sa première règle exigeait de surcroît qu'il
          # soit 10h30 passées. Entre 9h30 et 16h30, un fichier fabriqué avant
          # l'ouverture était donc réputé à jour.
          #
          # La décision est désormais dans `pipeline/porte_rattrapage.py`, où
          # elle est testable : quinze situations passent par la table de
          # `tests/test_porte_rattrapage.py`. Une décision de quarante lignes
          # de shell, personne ne l'éprouve.
          # ⚠️ LE CRON DE RATTRAPAGE EST RECONNU PAR SA FORME, PAS PAR UNE
          # CHAÎNE EXACTE. Le 23/09, il est passé de `25 * * * 1-5` à
          # `25,55 8-17 * * 1-5` pour cesser de tourner la nuit. Une égalité
          # stricte aurait silencieusement cessé de le reconnaître : les runs
          # de rattrapage auraient alors contourné la porte et publié à chaque
          # demi-heure, soit exactement ce que la porte existe pour empêcher.
          case "$CRON" in
            25*|55*) RATTRAPAGE=1 ;;
            *)       RATTRAPAGE=0 ;;
          esac
          if [ "$RATTRAPAGE" = "1" ] || [ "$TRIGGER" = "workflow_run" ]; then
            SORTIE=$(python3 pipeline/porte_rattrapage.py)
            echo "$SORTIE"
            echo "$SORTIE" | grep -q "run=true" \
              && echo "run=true"  >> $GITHUB_OUTPUT \
              || echo "run=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$TRIGGER" = "workflow_dispatch" ] || [ "$TRIGGER" = "schedule" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          NOW=$(TZ="Africa/Casablanca" date +%H%M)
          DAY=$(TZ="Africa/Casablanca" date +%u)
          if [ "$DAY" -le 5 ] && [ "$NOW" -ge 0915 ] && [ "$NOW" -lt 1540 ]; then
            echo "run=true"  >> $GITHUB_OUTPUT
            echo "✅ Session BVC ouverte (${NOW} Casablanca)"
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "⏸️ Hors session BVC — skip (${NOW} Casablanca, jour=$DAY)"
          fi


      # ── 2. Python ────────────────────────────────────────
      - name: Setup Python 3.11
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer dépendances
        if: steps.gate.outputs.run == 'true'
        run: pip install requests numpy pandas -q

      # ── 3. Mise à jour données ────────────────────────────
      - name: Mise à jour data.json (dry-run)
        if: steps.gate.outputs.run == 'true' && github.event.inputs.dry_run == 'true'
        run: python update_data.py --dry-run

      - name: Mise à jour data.json
        if: steps.gate.outputs.run == 'true' && github.event.inputs.dry_run != 'true'
        run: python update_data.py

      # ── 3a. SYNCHRONISER LE CACHE DÉRIVÉ ────────────────────
      # Une bougie ajoutée/remplacée rend immédiatement l'entrée correspondante
      # de historical_data.json obsolète. La garde doit donc voir cache et
      # chandelles issus du même état, pas un instantané de la veille.
      - name: Synchroniser le cache historique des chandelles modifiées
        if: steps.gate.outputs.run == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          TICKERS=$(git diff --name-only -- 'pipeline/candles/*.json' \
            | sed -n 's#^pipeline/candles/\(.*\)\.json$#\1#p' \
            | sort -u | tr '\n' ' ')
          if [ -z "$TICKERS" ]; then
            echo "Aucune chandelle modifiée — cache inchangé"
            exit 0
          fi
          echo "Synchronisation incrémentale sûre du cache pour: $TICKERS"
          python pipeline/recalculer_cache.py --sync-ajouts $TICKERS --ecrire

      # ── 3b. CONTRÔLES BLOQUANTS — avant toute publication ──
      #
      # ⚠️ Ajouté le 10/09/2026, après l'audit externe du 09/09.
      #
      # L'ordre était : générer → PUBLIER → tester, et les tests étaient
      # `continue-on-error`. Un data.json fautif partait donc en production,
      # après quoi la suite émettait un avertissement que personne ne lisait.
      # Le 09/09 à 23h50, le fichier publié portait un signal hors contrat
      # (SUSPENDU), un rendement de 0,5 % sur une société qui n'a rien versé,
      # et une variation de -3,35 % sur un titre qui ne cote plus. La suite
      # « signalait » les trois. Le site les servait quand même.
      #
      # L'obstacle réel était ailleurs, et le commentaire ci-dessous l'avait
      # bien identifié : `tests.yml` ne voit jamais les commits du robot, donc
      # les tests de données ne s'exécutaient jamais sur le fichier publié.
      # La solution n'était pas de tester APRÈS le push, mais de tester le
      # fichier FRAÎCHEMENT ÉCRIT, avant qu'il ne parte. Il est déjà sur le
      # disque du runner : les tests le lisent tel qu'il sera publié.
      #
      # Deux familles, deux traitements :
      #   · les CONTRÔLES DE DONNÉES bloquent la publication ;
      #   · le reste de la suite reste informatif (un test décrivant le code
      #     n'a pas à empêcher la diffusion d'une séance juste).
      # ⚠️ LA SUITE ENTIÈRE, ET PAS UNE SÉLECTION.
      #
      # Première version du 10/09 : seuls `test_contrat_data_json.py` et
      # `test_regles_donnees.py` bloquaient. L'auditeur externe a objecté
      # qu'« un échec critique ne doit pas devenir acceptable simplement parce
      # qu'il appartient à un autre fichier de tests ». Mesuré dans la foulée :
      # TREIZE fichiers relisent les données publiées et restaient dehors —
      # dont la cohérence des chandelles (test_ohlc), les séances fantômes,
      # le cliquet de séance et les faits financiers. Objection fondée.
      #
      # Choisir quels tests méritent de bloquer, c'est refaire chaque semaine
      # un arbitrage qu'on finira par rater. La suite entière tranche seule :
      # un test de code en échec signale un moteur cassé, et un moteur cassé
      # n'a pas à publier de données non plus.
      #
      # Le coût est assumé : un test rouge suspend le bulletin du matin. C'est
      # le sens même d'un contrôle bloquant, et l'échec du job envoie un
      # courriel au propriétaire.
      - name: Contrôles bloquants sur le fichier généré
        if: steps.gate.outputs.run == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          # ⚠️ LA SUITE ENTIÈRE, DONC SES DÉPENDANCES ENTIÈRES.
          # Cette ligne installait `pytest` SEUL. Le 12/09, la garde a refusé
          # de publier sur un ModuleNotFoundError : `tests/test_workflow_tests.py`
          # importe `yaml`, déclaré dans requirements_dev.txt que ce workflow
          # n'installait pas. Les données étaient saines — 80/80 titres, 12/12
          # contrôles de séance — et rien n'est parti, ce qui est le bon
          # comportement ; mais l'échec venait de l'outillage, pas des données.
          #
          # Faire tourner la suite complète avec un sous-ensemble de ses
          # dépendances, c'est se préparer à un rouge qu'on finira par
          # contourner. `tests.yml` installe requirements_dev.txt ; ici aussi.
          pip install --quiet -r requirements_dev.txt
          echo "Suite complète sur le data.json généré, AVANT publication."
          python -m pytest --tb=short -q

      # ── 4. Commit et push ─────────────────────────────────
      # N'est atteint que si les contrôles bloquants ci-dessus ont réussi :
      # une étape en échec interrompt le job.
      - name: Commit data.json si modifié
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "BVC Bot"
          git config user.email "noreply@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset origin/main
            git add data.json pipeline/masi_history.json
            if [ -f pipeline/historical_data.json ]; then
              git add pipeline/historical_data.json
            fi
            if [ -d pipeline/candles ] && [ "$(ls pipeline/candles/*.json 2>/dev/null | wc -l)" -gt 0 ]; then
              git add pipeline/candles/
            fi
            if git diff --cached --quiet; then
              echo "Aucun changement — skip commit"
              exit 0
            fi
            HEURE=$(TZ="Africa/Casablanca" date +'%Y-%m-%d %H:%M')
            git commit -m "data: BVC update ${HEURE} (Casablanca)"
            git push origin HEAD:main && echo "✅ Pushé" && exit 0
            echo "⚠️ Push échoué (tentative $attempt/3), retry..."
            sleep $((attempt * 3))
          done
          exit 1

      # ── 4a. Suite de tests ────────────────────────────────
      # ⚠️ Elle est ici parce que `tests.yml` NE VOIT PAS les données publiées.
      # Relevé le 01/09 : sur six exécutions, toutes portaient sur un commit
      # humain, aucune sur un commit « data: BVC update ». GitHub ne déclenche
      # pas de workflow sur les commits poussés avec son propre jeton — une
      # protection contre les boucles infinies, qui rend le filtre `paths:
      # data.json` de tests.yml purement décoratif.
      #
      # Or les tests des règles R1 à R10 portent justement sur le data.json
      # RÉELLEMENT PUBLIÉ. Sans cette étape, ils ne l'examinent jamais.
      #
      # ⚠️ Cette étape est devenue REDONDANTE le 10/09/2026 : la suite entière
      # tourne désormais à l'étape 3b, avant publication, et elle bloque. On la
      # garde uniquement pour tracer l'état APRÈS écriture — utile lorsqu'une
      # étape ultérieure modifie un fichier. Elle ne protège plus rien à elle
      # seule, et ne doit jamais redevenir le seul contrôle : c'est cette
      # configuration qui a laissé publier, le 09/09 à 23h50, un rendement de
      # 0,5 % sur une société sans dividende et une variation de −3,35 % sur un
      # titre suspendu. Le journal de ce run est formel : la suite n'a signalé
      # QUE le signal hors contrat, un seul échec sur 295 tests. Les deux
      # autres anomalies n'étaient couvertes par aucun test.
      # ⚠️ `always()` NE SUFFIT PAS : IL FAUT AUSSI QU'IL Y AIT UN DÉPÔT.
      # Quand la porte décide qu'il n'y a rien à faire, le `checkout` est sauté
      # — et cette étape s'exécutait quand même, sur un runner vide :
      #     ERROR: Could not open requirements file: requirements_dev.txt
      # Elle est `continue-on-error`, donc elle ne faisait « que » du bruit.
      # L'étape suivante, elle, ne l'est pas : voir son propre encadré.
      - name: Suite de tests (trace, après écriture)
        if: always() && steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          # ⚠️ LA SUITE ENTIÈRE, DONC SES DÉPENDANCES ENTIÈRES.
          # Cette ligne installait `pytest` SEUL. Le 12/09, la garde a refusé
          # de publier sur un ModuleNotFoundError : `tests/test_workflow_tests.py`
          # importe `yaml`, déclaré dans requirements_dev.txt que ce workflow
          # n'installait pas. Les données étaient saines — 80/80 titres, 12/12
          # contrôles de séance — et rien n'est parti, ce qui est le bon
          # comportement ; mais l'échec venait de l'outillage, pas des données.
          #
          # Faire tourner la suite complète avec un sous-ensemble de ses
          # dépendances, c'est se préparer à un rouge qu'on finira par
          # contourner. `tests.yml` installe requirements_dev.txt ; ici aussi.
          pip install --quiet -r requirements_dev.txt
          python -m pytest --tb=line -q || echo "::warning::La suite de tests signale un écart sur les données publiées."

      # ── 4b. Contrôle qualité ──────────────────────────────
      # Le contrôle vit aussi dans verifier_seance.yml, mais celui-ci dépend
      # du déclencheur `schedule` de GitHub — devenu inutilisable sur ce dépôt :
      # mesuré les 26, 27 et 28/08, les tâches partent avec 2 à 8 heures de
      # retard, le cron de 17h00 s'étant déclenché à 01h12 le lendemain.
      # L'alarme était donc branchée sur le courant qu'elle surveille.
      #
      # L'attacher ici la rend indépendante : quelle que soit la façon dont ce
      # run a été déclenché — cron, dispatch manuel, réveil externe — la séance
      # est contrôlée juste après avoir été écrite.
      #
      # ⚠️ Il n'échoue que sur le passage du soir (≥ 17h00 UTC, soit 18h00 à
      # Casablanca). En journée la séance est encore en cours : exiger qu'elle
      # soit complète ferait échouer le contrôle tous les matins, et une alarme
      # toujours allumée n'alerte plus — c'est la leçon du drapeau `stale` du
      # 14/08. Le reste du temps il informe sans bloquer.
      #
      # ⚠️ ET IL FAUT UN DÉPÔT POUR CONTRÔLER QUELQUE CHOSE.
      # Mesuré le 15/09/2026 sur les 100 derniers runs : **18 échecs** dont
      # aucune donnée n'était en cause. Leur signature ne laisse aucun doute —
      # ils tombent TOUS entre 17h et 23h UTC, c'est-à-dire exactement dans la
      # fenêtre où la condition ci-dessous transforme un code de retour non nul
      # en `exit 1`. Ce qui échouait n'était pas la séance :
      #     python: can't open file '.../pipeline/verifier_seance.py'
      # La porte avait décidé qu'il n'y avait rien à faire, le `checkout` avait
      # donc été sauté, et le contrôle s'exécutait sur un runner vide.
      #
      # Conséquence, et c'est la vraie : 18 courriels d'échec pour rien, mêlés
      # à 11 échecs réels dans la même liste, sans rien qui les distingue. Une
      # alarme qui se déclenche sans motif finit ignorée puis désactivée —
      # c'est mot pour mot la leçon du drapeau `stale` du 14/08.
      - name: Contrôle de la séance
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          set +e
          python pipeline/verifier_seance.py
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ] && [ "$(date -u +%H)" -ge 17 ]; then
            echo "::error::Le contrôle de séance a échoué sur le passage du soir."
            exit 1
          fi
          [ "$CODE" -ne 0 ] && echo "::notice::Contrôle non conforme — séance en cours, non bloquant."
          exit 0

      # ── 5. Résumé ─────────────────────────────────────────
      - name: Résumé
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          echo "## BVC Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Date** : $(TZ='Africa/Casablanca' date +'%Y-%m-%d %H:%M') (Casablanca)" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger** : ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          if [ -f data.json ]; then
            python3 - <<'PYEOF' >> $GITHUB_STEP_SUMMARY
          import json
          d = json.load(open('data.json'))
          tickers = d.get('tickers', [])
          print(f"- **Tickers** : {len(tickers)}")
          print(f"- **Statut marché** : {d.get('market_status','?')}")
          chg_ok  = sum(1 for t in tickers if t.get('chg', 0) != 0)
          vol_ok  = sum(1 for t in tickers if t.get('vol', 0) != 0)
          print(f"- **chg ≠ 0** : {chg_ok}/{len(tickers)}")
          print(f"- **vol ≠ 0** : {vol_ok}/{len(tickers)}")
          PYEOF
          fi
