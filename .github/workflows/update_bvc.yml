# ════════════════════════════════════════════════════════════
# BVC Data Auto-Update — GitHub Actions
# Mise à jour automatique de data.json toutes les 15 min
# pendant la session BVC (9h30–15h45 Casablanca = UTC+1)
# ════════════════════════════════════════════════════════════

name: BVC Data Update

on:
  schedule:
    # Toutes les 15 min de 8h30 à 14h45 UTC (9h30–15h45 Casablanca)
    # Le script gère lui-même les runs hors session (skip si marché fermé)
    - cron: '*/15 8-14 * * 1-5'

  # Déclenchement automatique après le pipeline financier (sync garantie)
  workflow_run:
    workflows: ["BVC Financial Data Pipeline v9"]
    types: [completed]

  # Déclenchement manuel depuis l'onglet Actions de GitHub
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (afficher sans écrire)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write   # nécessaire pour git push

# Empêche deux runs simultanés d'écrire data.json en même temps
# cancel-in-progress: true → chaque nouveau run annule le précédent en attente
# évite l'accumulation de runs dans la queue (cause des skips GitHub)
concurrency:
  group: bvc-live-update
  cancel-in-progress: true

jobs:
  update-bvc-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ── 1. Checkout ──────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main          # toujours mettre à jour main (GitHub Pages)
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer dépendances
        run: pip install requests numpy pandas -q

      # ── 3. Mise à jour données ────────────────────────────
      - name: Mise à jour data.json (dry-run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: python update_data.py --dry-run

      - name: Mise à jour data.json
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: python update_data.py

      # ── 4. Scraping PDF + Web (optionnel, clôture seule) ──
      # Décommentez pour scraper les sites à la clôture
      # - name: Enrichissement fondamentaux.json (clôture)
      #   if: github.event.schedule == '30 14 * * 1-5'
      #   run: python pdf_scraper.py --auto --tickers SMI,MNG,CSR

      # ── 5. Commit et push ─────────────────────────────────
      - name: Commit data.json si modifié
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "BVC Bot"
          git config user.email "noreply@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          # Boucle retry : fetch → reset sur origin/main → commit → push
          # Évite git pull --rebase qui échoue si un autre workflow a pushé en parallèle
          for attempt in 1 2 3; do
            git fetch origin main
            git reset origin/main          # mixed reset : préserve data.json généré
            git add data.json
            # Inclure les candles OHLCV si régénérées
            if [ -d pipeline/candles ] && [ "$(ls pipeline/candles/*.json 2>/dev/null | wc -l)" -gt 0 ]; then
              git add pipeline/candles/
            fi
            if git diff --cached --quiet; then
              echo "Aucun changement — skip commit"
              exit 0
            fi
            HEURE=$(TZ="Africa/Casablanca" date +'%Y-%m-%d %H:%M')
            git commit -m "data: BVC update ${HEURE} (Casablanca)"
            git push origin HEAD:main && echo "✅ data.json + candles mis à jour et pushés" && exit 0
            echo "⚠️ Push échoué (tentative $attempt/3), retry dans $((attempt * 3))s..."
            sleep $((attempt * 3))
          done
          echo "❌ Push échoué après 3 tentatives"
          exit 1

      # ── 6. Résumé dans les logs ───────────────────────────
      - name: Résumé
        if: always()
        run: |
          echo "## BVC Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Date** : $(TZ='Africa/Casablanca' date +'%Y-%m-%d %H:%M') (Casablanca)" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger** : ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          if [ -f data.json ]; then
            python3 - <<'PYEOF' >> $GITHUB_STEP_SUMMARY
          import json
          d = json.load(open('data.json'))
          tickers = d.get('tickers', [])
          print(f"- **Tickers** : {len(tickers)}")
          print(f"- **Statut marché** : {d.get('market_status','?')}")
          chg_ok  = sum(1 for t in tickers if t.get('chg', 0) != 0)
          vol_ok  = sum(1 for t in tickers if t.get('vol', 0) != 0)
          print(f"- **chg ≠ 0** : {chg_ok}/{len(tickers)}")
          print(f"- **vol ≠ 0** : {vol_ok}/{len(tickers)}")
          anomalies = [t['symbol'] for t in tickers
                       if t.get('price',0) > 0 and t.get('ma20',0) > 0
                       and max(t['ma20'], t['price']) / min(t['ma20'], t['price']) > 2.5]
          if anomalies:
              print(f"- **⚠️ Anomalies MA/prix** : {', '.join(anomalies)}")
          PYEOF
          fi
