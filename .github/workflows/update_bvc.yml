# ════════════════════════════════════════════════════════════
# BVC Data Auto-Update — GitHub Actions
# Mise à jour automatique de data.json toutes les 15 min
# pendant la session BVC (9h30–15h45 Casablanca = UTC+1)
# ════════════════════════════════════════════════════════════

name: BVC Data Update

on:
  schedule:
    # Toutes les 15 min, lun-ven 8h-15h UTC (9h-16h Casablanca)
    # marge large — le gate step filtre l'heure exacte de session BVC
    - cron: '*/15 8-14 * * 1-5'
    # Clôture officielle : capture les cours de clôture à 15h40 et 16h Casablanca
    - cron: '45 14 * * 1-5'
    - cron: '0 15 * * 1-5'

  # Déclenchement automatique après le pipeline financier (sync garantie)
  # + après chaque run du bot news (toutes les heures, 7j/7) — filet de sécurité
  # si GitHub rate un cron planifié, le bot news prend le relais
  workflow_run:
    workflows: ["BVC Financial Data Pipeline v9", "BVC News Fetch"]
    types: [completed]

  # Déclenchement manuel depuis l'onglet Actions de GitHub
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (afficher sans écrire)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write   # nécessaire pour git push

# Empêche deux runs simultanés d'écrire data.json en même temps
# cancel-in-progress: true → chaque nouveau run annule le précédent en attente
# évite l'accumulation de runs dans la queue (cause des skips GitHub)
concurrency:
  group: bvc-live-update
  cancel-in-progress: true

jobs:
  update-bvc-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ── 0. Gate session BVC ───────────────────────────────
      # Pour les triggers workflow_run (news bot, pipeline) : ne pas tourner
      # hors session BVC (nuit, week-end). Les crons et workflow_dispatch passent.
      - name: Vérifier session BVC
        id: gate
        run: |
          TRIGGER="${{ github.event_name }}"
          # schedule et workflow_dispatch → toujours exécuter
          if [ "$TRIGGER" = "workflow_dispatch" ] || [ "$TRIGGER" = "schedule" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # workflow_run → vérifier heure Casablanca
          NOW=$(TZ="Africa/Casablanca" date +%H%M)
          DAY=$(TZ="Africa/Casablanca" date +%u)   # 1=lun … 7=dim
          if [ "$DAY" -le 5 ] && [ "$NOW" -ge 0915 ] && [ "$NOW" -lt 1540 ]; then
            echo "run=true"  >> $GITHUB_OUTPUT
            echo "✅ Session BVC ouverte (${NOW} Casablanca)"
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "⏸️ Hors session BVC — skip (${NOW} Casablanca, jour=$DAY)"
          fi

      # ── 1. Checkout ──────────────────────────────────────
      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main          # toujours mettre à jour main (GitHub Pages)
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ────────────────────────────────────────
      - name: Setup Python 3.11
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer dépendances
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements_pipeline.txt -q

      # ── 3. Mise à jour données ────────────────────────────
      - name: Mise à jour data.json (dry-run)
        if: steps.gate.outputs.run == 'true' && github.event.inputs.dry_run == 'true'
        run: python update_data.py --dry-run

      - name: Mise à jour data.json
        if: steps.gate.outputs.run == 'true' && github.event.inputs.dry_run != 'true'
        run: python update_data.py

      # ── 5. Commit et push ─────────────────────────────────
      - name: Commit data.json si modifié
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "BVC Bot"
          git config user.email "noreply@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          # Boucle retry : fetch → reset sur origin/main → commit → push
          for attempt in 1 2 3; do
            git fetch origin main
            git reset origin/main          # mixed reset : préserve data.json généré
            git add data.json
            # Inclure les candles OHLCV si régénérées
            if [ -d pipeline/candles ] && [ "$(ls pipeline/candles/*.json 2>/dev/null | wc -l)" -gt 0 ]; then
              git add pipeline/candles/
            fi
            if git diff --cached --quiet; then
              echo "Aucun changement — skip commit"
              exit 0
            fi
            HEURE=$(TZ="Africa/Casablanca" date +'%Y-%m-%d %H:%M')
            git commit -m "data: BVC update ${HEURE} (Casablanca)"
            git push origin HEAD:main && echo "✅ data.json mis à jour et pushé" && exit 0
            echo "⚠️ Push échoué (tentative $attempt/3), retry dans $((attempt * 3))s..."
            sleep $((attempt * 3))
          done
          echo "❌ Push échoué après 3 tentatives"
          exit 1

      # ── 6. Résumé dans les logs ───────────────────────────
      - name: Résumé
        if: always()
        run: |
          echo "## BVC Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Date** : $(TZ='Africa/Casablanca' date +'%Y-%m-%d %H:%M') (Casablanca)" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger** : ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          if [ -f data.json ]; then
            python3 - <<'PYEOF' >> $GITHUB_STEP_SUMMARY
          import json
          d = json.load(open('data.json'))
          tickers = d.get('tickers', [])
          print(f"- **Tickers** : {len(tickers)}")
          print(f"- **Statut marché** : {d.get('market_status','?')}")
          chg_ok  = sum(1 for t in tickers if t.get('chg', 0) != 0)
          vol_ok  = sum(1 for t in tickers if t.get('vol', 0) != 0)
          print(f"- **chg ≠ 0** : {chg_ok}/{len(tickers)}")
          print(f"- **vol ≠ 0** : {vol_ok}/{len(tickers)}")
          anomalies = [t['symbol'] for t in tickers
                       if t.get('price',0) > 0 and t.get('ma20',0) > 0
                       and max(t['ma20'], t['price']) / min(t['ma20'], t['price']) > 2.5]
          if anomalies:
              print(f"- **⚠️ Anomalies MA/prix** : {', '.join(anomalies)}")
          PYEOF
          fi
