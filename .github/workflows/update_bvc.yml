# ════════════════════════════════════════════════════════════
# BVC Data Auto-Update — GitHub Actions
# Toutes les 15 min pendant la session BVC (9h30–15h45 Casablanca)
# Stratégie double fiabilité :
#   1. Crons explicites (plus fiables que */15 que GitHub saute)
#   2. Auto-relais : chaque run réussi déclenche le suivant
# ════════════════════════════════════════════════════════════

name: BVC Data Update

on:
  schedule:
    # Crons explicites UTC (Casablanca = UTC+1)
    # Session BVC : 09h30–15h45 Casablanca = 08h30–14h45 UTC
    - cron: '30 8 * * 1-5'    # 09h30 — ouverture
    - cron: '45 8 * * 1-5'    # 09h45
    - cron:  '0 9 * * 1-5'    # 10h00
    - cron: '15 9 * * 1-5'    # 10h15
    - cron: '30 9 * * 1-5'    # 10h30
    - cron: '45 9 * * 1-5'    # 10h45
    - cron:  '0 10 * * 1-5'   # 11h00
    - cron: '15 10 * * 1-5'   # 11h15
    - cron: '30 10 * * 1-5'   # 11h30
    - cron: '45 10 * * 1-5'   # 11h45
    - cron:  '0 11 * * 1-5'   # 12h00
    - cron: '15 11 * * 1-5'   # 12h15
    - cron: '30 11 * * 1-5'   # 12h30
    - cron: '45 11 * * 1-5'   # 12h45
    - cron:  '0 12 * * 1-5'   # 13h00
    - cron: '15 12 * * 1-5'   # 13h15
    - cron: '30 12 * * 1-5'   # 13h30
    - cron: '45 12 * * 1-5'   # 13h45
    - cron:  '0 13 * * 1-5'   # 14h00
    - cron: '15 13 * * 1-5'   # 14h15
    - cron: '30 13 * * 1-5'   # 14h30
    - cron: '45 13 * * 1-5'   # 14h45
    - cron:  '0 14 * * 1-5'   # 15h00
    - cron: '15 14 * * 1-5'   # 15h15
    - cron: '30 14 * * 1-5'   # 15h30
    - cron: '45 14 * * 1-5'   # 15h45 — clôture
    - cron:  '0 15 * * 1-5'   # 16h00 — post-clôture

  workflow_run:
    workflows: ["BVC Financial Data Pipeline v9", "BVC News Fetch"]
    types: [completed]

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (afficher sans écrire)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  actions: write   # nécessaire pour le self-dispatch (auto-relais)

concurrency:
  group: bvc-live-update
  cancel-in-progress: true

jobs:
  update-bvc-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ── 0. Gate session BVC ───────────────────────────────
      - name: Vérifier session BVC
        id: gate
        run: |
          TRIGGER="${{ github.event_name }}"
          if [ "$TRIGGER" = "workflow_dispatch" ] || [ "$TRIGGER" = "schedule" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          NOW=$(TZ="Africa/Casablanca" date +%H%M)
          DAY=$(TZ="Africa/Casablanca" date +%u)
          if [ "$DAY" -le 5 ] && [ "$NOW" -ge 0915 ] && [ "$NOW" -lt 1540 ]; then
            echo "run=true"  >> $GITHUB_OUTPUT
            echo "✅ Session BVC ouverte (${NOW} Casablanca)"
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "⏸️ Hors session BVC — skip (${NOW} Casablanca, jour=$DAY)"
          fi

      # ── 1. Checkout ──────────────────────────────────────
      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ────────────────────────────────────────
      - name: Setup Python 3.11
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer dépendances
        if: steps.gate.outputs.run == 'true'
        run: pip install requests numpy pandas -q

      # ── 3. Mise à jour données ────────────────────────────
      - name: Mise à jour data.json (dry-run)
        if: steps.gate.outputs.run == 'true' && github.event.inputs.dry_run == 'true'
        run: python update_data.py --dry-run

      - name: Mise à jour data.json
        if: steps.gate.outputs.run == 'true' && github.event.inputs.dry_run != 'true'
        run: python update_data.py

      # ── 4. Commit et push ─────────────────────────────────
      - name: Commit data.json si modifié
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "BVC Bot"
          git config user.email "noreply@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset origin/main
            git add data.json
            if [ -d pipeline/candles ] && [ "$(ls pipeline/candles/*.json 2>/dev/null | wc -l)" -gt 0 ]; then
              git add pipeline/candles/
            fi
            if git diff --cached --quiet; then
              echo "Aucun changement — skip commit"
              exit 0
            fi
            HEURE=$(TZ="Africa/Casablanca" date +'%Y-%m-%d %H:%M')
            git commit -m "data: BVC update ${HEURE} (Casablanca)"
            git push origin HEAD:main && echo "✅ Pushé" && exit 0
            echo "⚠️ Push échoué (tentative $attempt/3), retry..."
            sleep $((attempt * 3))
          done
          exit 1

      # ── 5. Auto-relais : déclenche le prochain run ────────
      # Filet de sécurité contre les crons sautés par GitHub.
      # Si on est encore en session, on dispatche le run suivant via API.
      # Le concurrency group cancel-in-progress garantit qu'un seul run tourne.
      - name: Auto-relais (prochain run dans ~15 min via cron)
        if: steps.gate.outputs.run == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOW=$(TZ="Africa/Casablanca" date +%H%M)
          DAY=$(TZ="Africa/Casablanca" date +%u)
          # On ne relance le prochain que si on est encore en session (avant 15h30)
          if [ "$DAY" -le 5 ] && [ "$NOW" -ge 0930 ] && [ "$NOW" -lt 1530 ]; then
            echo "📡 Auto-relais actif — le prochain cron explicit prendra le relais dans ≤15 min"
            # Dispatch de secours : si le cron suivant rate, ce dispatch sera dans la queue
            curl -s -o /dev/null -w "HTTP %{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update_bvc.yml/dispatches" \
              -d '{"ref":"main"}' || true
            echo " — dispatch de secours envoyé"
          else
            echo "⏸️ Fin de session — pas de relais (${NOW} Casablanca)"
          fi

      # ── 6. Résumé ─────────────────────────────────────────
      - name: Résumé
        if: always()
        run: |
          echo "## BVC Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Date** : $(TZ='Africa/Casablanca' date +'%Y-%m-%d %H:%M') (Casablanca)" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger** : ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          if [ -f data.json ]; then
            python3 - <<'PYEOF' >> $GITHUB_STEP_SUMMARY
          import json
          d = json.load(open('data.json'))
          tickers = d.get('tickers', [])
          print(f"- **Tickers** : {len(tickers)}")
          print(f"- **Statut marché** : {d.get('market_status','?')}")
          chg_ok  = sum(1 for t in tickers if t.get('chg', 0) != 0)
          vol_ok  = sum(1 for t in tickers if t.get('vol', 0) != 0)
          print(f"- **chg ≠ 0** : {chg_ok}/{len(tickers)}")
          print(f"- **vol ≠ 0** : {vol_ok}/{len(tickers)}")
          PYEOF
          fi
