name: Diagnostic Cache Prefix
on:
  push:
    branches: [fix/cancelled-session-bound-20260919]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cancelled-session-bound-20260919
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -q requests numpy pandas
      - name: Diagnostic reproductibilité cache
        run: python tools/diag_cache_prefix.py
