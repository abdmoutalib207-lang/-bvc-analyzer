name: Apply cache append safety

on:
  push:
    branches: ["fix/publish-18sep-candles"]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/publish-18sep-candles
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances de test
        run: pip install -r requirements_dev.txt
      - name: Appliquer le patch et tester sa règle dédiée
        run: |
          python tools/patch_cache_append_safety.py
          python -m pytest -q tests/test_cache_append_preserve_pivot.py
      - name: Enregistrer le code patché
        run: |
          git config user.name "BVC Repair Bot"
          git config user.email "noreply@github.com"
          git rm tools/patch_cache_append_safety.py
          git add pipeline/recalculer_cache.py tests/test_cache_append_preserve_pivot.py
          git commit -m "fix: préserver le pivot corrigé lors du cache append"
          git push origin HEAD:fix/publish-18sep-candles
