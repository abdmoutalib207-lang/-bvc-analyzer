name: BVC Financial Data Pipeline v9

on:
  schedule:
    # Casablanca UTC+1 toute l'année — BVC: 9h30-15h30
    - cron: "30 8  * * 1-5"  # 09h30 — ouverture BVC
    - cron: "0  11 * * 1-5"  # 12h00 — mi-séance
    - cron: "30 14 * * 1-5"  # 15h30 — clôture officielle
    - cron: "45 14 * * 1-5"  # 15h45 — règlement définitif
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (fallback uniquement)"
        required: false
        default: "false"
        type: boolean
      tickers:
        description: "Tickers spécifiques (ex: MNG,SMI,ADI)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

# Même groupe que update_bvc.yml pour éviter les push simultanés sur main
concurrency:
  group: bvc-data-push
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements_pipeline.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements_pipeline.txt

      - name: Run pipeline v9
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            ARGS="$ARGS --tickers ${{ github.event.inputs.tickers }}"
          fi
          python pipeline/collect_financial_data.py $ARGS

      - name: Commit & push data files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "BVC Bot v9"
          git config user.email "noreply@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          # Boucle retry : fetch → reset sur origin/main → commit → push
          # Évite git pull --rebase qui échoue si un autre workflow a pushé en parallèle
          for attempt in 1 2 3; do
            git fetch origin main
            git reset origin/main          # mixed reset : préserve les fichiers générés
            git add financial_data.json data.json || true
            if git diff --cached --quiet; then
              echo "Aucun changement vs origin/main — skip commit"
              exit 0
            fi
            HEURE=$(TZ="Africa/Casablanca" date "+%H:%M")
            DATE=$(TZ="Africa/Casablanca" date "+%d/%m/%Y")
            git commit -m "data: BVC pipeline v9 — ${DATE} ${HEURE} (Casablanca)"
            git push origin HEAD:main && echo "✅ Push réussi (tentative $attempt)" && exit 0
            echo "⚠️ Push échoué (tentative $attempt/3), retry dans $((attempt * 3))s..."
            sleep $((attempt * 3))
          done
          echo "❌ Push échoué après 3 tentatives"
          exit 1

      - name: Summary
        run: |
          HEURE=$(TZ="Africa/Casablanca" date "+%H:%M")
          DATE=$(TZ="Africa/Casablanca" date "+%d/%m/%Y")
          NB=$(python -c "import json; d=json.load(open('financial_data.json')); print(len(d.get('data',{})))" 2>/dev/null || echo "?")
          STALE=$(python -c "import json; d=json.load(open('financial_data.json')); print(sum(1 for v in d.get('data',{}).values() if v.get('flags',{}).get('stale')))" 2>/dev/null || echo "?")
          echo "## BVC Pipeline v9 — Résumé" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Champ | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Date (Casablanca) | ${DATE} ${HEURE} |" >> $GITHUB_STEP_SUMMARY
          echo "| Déclencheur | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tickers collectés | ${NB} / 19 |" >> $GITHUB_STEP_SUMMARY
          echo "| Tickers stale | ${STALE} |" >> $GITHUB_STEP_SUMMARY
