name: Diagnose 18sep candles

on:
  push:
    branches: ["fix/publish-18sep-candles"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/publish-18sep-candles
          fetch-depth: 0
      - name: Examiner le commit 729ece et l'état courant
        run: |
          python - <<'PY'
          import json, subprocess
          from collections import Counter
          from pathlib import Path

          C='729ece9f35adaef11c92b4384db02717db632f72'
          P='87cbcbed4b09dac480e7cdd648185ae6e743f3bb'
          files=subprocess.check_output(['git','diff','--name-only',P,C,'--','pipeline/candles/*.json'],text=True).splitlines()
          print('FICHIERS_MODIFIES=',len(files))
          stats=Counter(); details=[]
          for path in files:
              def charge(ref):
                  raw=subprocess.check_output(['git','show',f'{ref}:{path}'],text=True)
                  return json.loads(raw)
              av=charge(P); ap=charge(C); cur=json.loads(Path(path).read_text())
              dav={str(x.get('d'))[:10]:x for x in av if x.get('d')}
              dap={str(x.get('d'))[:10]:x for x in ap if x.get('d')}
              dcur={str(x.get('d'))[:10]:x for x in cur if x.get('d')}
              ajoutees=sorted(set(dap)-set(dav))
              retirees=sorted(set(dav)-set(dap))
              changees=sorted(d for d in set(dap)&set(dav) if dap[d]!=dav[d])
              latest_av=max(dav) if dav else ''
              latest_ap=max(dap) if dap else ''
              latest_cur=max(dcur) if dcur else ''
              cat=('AJOUT_18' if '2026-09-18' in ajoutees else
                   'CHANGE_18' if '2026-09-18' in changees else
                   'AUTRE')
              stats[cat]+=1
              details.append((Path(path).stem,latest_av,latest_ap,latest_cur,ajoutees[-4:],retirees[-4:],changees[-4:],dap.get('2026-09-18')))
          print('CATEGORIES=',dict(stats))
          for row in details:
              print('DETAIL',repr(row))

          # Etat courant global : dernières dates et nombre de bougies du 18/09.
          latest=Counter(); avec18=[]
          for f in Path('pipeline/candles').glob('*.json'):
              try: s=json.loads(f.read_text())
              except Exception: continue
              dates=[str(x.get('d'))[:10] for x in s if x.get('d')]
              if dates:
                  latest[max(dates)]+=1
              if any(d=='2026-09-18' for d in dates): avec18.append(f.stem)
          print('LATEST_CURRENT=',dict(sorted(latest.items())))
          print('AVEC_2026_09_18=',len(avec18),sorted(avec18))
          PY
