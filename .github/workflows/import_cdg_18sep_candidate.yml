name: Import CDG 18sep candidate

on:
  push:
    branches: ["fix/publish-18sep-candles"]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  import-session:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/publish-18sep-candles
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances de test
        run: pip install -r requirements_dev.txt
      - name: Préparer le garde-fou cache quotidien
        run: python tools/patch_cache_delivery_guard.py
      - name: Importer les cotations validées du 18 septembre
        run: |
          mkdir -p .ci
          python pipeline/import_cdg_session.py \
            pipeline/bulletins/cdg_2026-09-18.json \
            --ecrire --rapport .ci/import_18sep.json
      - name: Vérifier que l'import est un append strict de 66 séries
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          r=json.loads(Path('.ci/import_18sep.json').read_text())
          assert r['n_ajoutes']==66, r
          assert len(r['tickers'])==66, r
          assert not r['hors_univers'], r
          attendus=set(r['tickers'])
          modifies={Path(x).stem for x in subprocess.check_output(
              ['git','diff','--name-only','origin/main','--','pipeline/candles'],
              text=True).splitlines() if x.endswith('.json')}
          assert modifies==attendus, (len(modifies), sorted(modifies^attendus))
          for t in sorted(attendus):
              path=f'pipeline/candles/{t}.json'
              base=json.loads(subprocess.check_output(['git','show',f'origin/main:{path}'],text=True))
              cur=json.loads(Path(path).read_text())
              assert len(cur)==len(base)+1, (t,len(base),len(cur))
              assert cur[:-1]==base, f'{t}: historique antérieur modifié'
              assert cur[-1]['d']=='2026-09-18', (t,cur[-1])
          samples={'SNA':1800.0,'STK':63.26,'TGCC':672.0,'AKD':1120.0,
                   'ADI':377.0,'ADH':32.5,'IMI':91.6,'SMI':6700.0,'T2S':215.6}
          for t,c in samples.items():
              cur=json.loads(Path(f'pipeline/candles/{t}.json').read_text())
              assert cur[-1]['c']==c, (t,cur[-1])
          print('IMPORT_OK',len(attendus))
          PY
      - name: Synchroniser le cache sans réécrire le passé
        run: |
          TICKERS=$(python - <<'PY'
          import json
          print(' '.join(json.load(open('.ci/import_18sep.json'))['tickers']))
          PY
          )
          python pipeline/recalculer_cache.py --sync-ajouts $TICKERS --ecrire | tee .ci/cache_sync_18sep.log
      - name: Régénérer le snapshot public
        run: |
          python update_data.py
          python pipeline/finaliser_snapshot.py
      - name: Contrôler chandelles, cache et data.json
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          r=json.loads(Path('.ci/import_18sep.json').read_text())
          attendus=set(r['tickers'])
          modifies={Path(x).stem for x in subprocess.check_output(
              ['git','diff','--name-only','origin/main','--','pipeline/candles'],
              text=True).splitlines() if x.endswith('.json')}
          assert modifies==attendus, ('candles inattendues',sorted(modifies^attendus))
          for t in sorted(attendus):
              path=f'pipeline/candles/{t}.json'
              base=json.loads(subprocess.check_output(['git','show',f'origin/main:{path}'],text=True))
              cur=json.loads(Path(path).read_text())
              assert cur[:-1]==base, f'{t}: passé modifié après régénération'
              assert cur[-1]['d']=='2026-09-18'

          data=json.loads(Path('data.json').read_text())
          rows={x['symbol']:x for x in data['tickers']}
          manquants=sorted(t for t in attendus if t not in rows)
          assert not manquants, manquants
          retards={t:(rows[t].get('_meta') or {}).get('prix_asof') for t in attendus
                   if str((rows[t].get('_meta') or {}).get('prix_asof') or '')[:10] != '2026-09-18'}
          assert not retards, ('data.json pas au 18/09',retards)
          samples={'SNA':1800.0,'STK':63.26,'TGCC':672.0,'AKD':1120.0,
                   'ADI':377.0,'ADH':32.5,'IMI':91.6,'SMI':6700.0,'T2S':215.6}
          for t,c in samples.items():
              assert float(rows[t]['price'])==c, (t,rows[t]['price'],c)
          assert all(str((x.get('_meta') or {}).get('prix_asof') or '')[:10] != '2026-09-17'
                     for x in data['tickers'])

          cache=json.loads(Path('pipeline/historical_data.json').read_text())
          couverts=[t for t in attendus if t in cache]
          avances=[t for t in couverts if str(cache[t].get('last_date') or '')[:10]=='2026-09-18']
          print('DATA_18SEP_OK',len(attendus),'CACHE_18SEP',len(avances),'SUR',len(couverts))
          PY
      - name: Lancer toute la suite de tests
        run: python -m pytest --tb=short -q
      - name: Enregistrer le candidat validé
        run: |
          git config user.name "BVC Repair Bot"
          git config user.email "noreply@github.com"
          git rm tools/patch_cache_delivery_guard.py
          git add data.json pipeline/historical_data.json pipeline/candles tests/test_serie_et_cache.py
          git status --short
          git commit -m "data: intégrer la séance BVC du 18 septembre 2026"
          git push origin HEAD:fix/publish-18sep-candles
