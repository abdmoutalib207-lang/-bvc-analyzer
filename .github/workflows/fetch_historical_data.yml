name: Fetch BVC Historical Data (BVCscrap)

on:
  schedule:
    - cron: '30 15 * * 1-5'   # Lun-Ven 15h30 UTC = après clôture BVC (15h30 Casablanca)
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Tickers separés par virgule (vide = tous)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  collect-history:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy openpyxl BVCscrap rapidfuzz

      - name: Collect historical data & compute indicators
        run: |
          TICKERS="${{ github.event.inputs.tickers }}"
          ARGS=""
          if [ -n "$TICKERS" ]; then
            ARGS="--tickers $TICKERS"
          fi
          python pipeline/collect_history_bvcscrap.py $ARGS

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/historical_data.json pipeline/candles/
          git diff --cached --stat
          git commit -m "data: historical_data.json + candles $(date +%Y-%m-%d)" || echo "Rien a committer"
          git push origin main
