name: Fetch BVC Historical Data (BVCscrap)

on:
  schedule:
    - cron: '0 4 * * 0'   # Dimanche 04h00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: 'Nombre de jours d historique (defaut 95)'
        required: false
        default: '95'
      tickers:
        description: 'Tickers separés par virgule (vide = tous)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  collect-history:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy beautifulsoup4 lxml bvcscrap casabourse

      - name: Collect historical data & compute indicators
        run: |
          DAYS="${{ github.event.inputs.days }}"
          TICKERS="${{ github.event.inputs.tickers }}"
          ARGS="--days ${DAYS:-95}"
          if [ -n "$TICKERS" ]; then
            ARGS="$ARGS --tickers $TICKERS"
          fi
          python pipeline/collect_history_bvcscrap.py $ARGS

      - name: Commit and push historical_data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/historical_data.json
          git diff --cached --stat
          git commit -m "data: historical_data.json BVCscrap $(date +%Y-%m-%d)" || echo "Rien a committer"
          git push origin main
