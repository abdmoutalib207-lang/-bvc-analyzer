# ════════════════════════════════════════════════════════════
# BVC NewsEngine — GitHub Actions
# Récupère les actualités financières marocaines (BVC, AMMC,
# Médias24, presse éco, HCP, BAM…) et génère news.json
# Fréquence : toutes les 60 min — 7j/7 — 24h/24
# ════════════════════════════════════════════════════════════

name: BVC News Fetch

on:
  schedule:
    # Toutes les heures pile — 7j/7 — 24h/24 (filet de sécurité si la chaîne se casse)
    - cron: '0 * * * *'

  # Chaîne auto-entretenue : BVC Data Update termine → déclenche news
  # News termine → déclenche BVC Data Update (avec gate session)
  # Cycle : BVC → news → BVC → news pendant toute la session (≈3-5 min/cycle)
  # Hors session : news tourne seul via le cron horaire
  workflow_run:
    workflows: ["BVC Data Update"]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bvc-news-fetch
  cancel-in-progress: true

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ── 1. Checkout ──────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer dépendances
        # rapidfuzz volontairement ABSENT : la passe floue de _tag_tickers
        # utilise token_set_ratio, bien trop permissif — mesuré le 09/08, elle
        # taggue 40 sociétés sur un article traitant du taux de chômage. Tant
        # qu'elle n'est pas revue, seule la correspondance exacte doit courir.
        run: pip install requests -q

      # ── 3. Fetch actualités ───────────────────────────────
      - name: Fetch actualités BVC
        run: python pipeline/fetch_news.py

      # ── Relais Telegram (facultatif) ────────────────────────────────
      # Placé AVANT le commit : la mémoire des alertes (.radar_envoyes.json)
      # doit être versionnée, sinon chaque run CI repartirait d'une copie
      # neuve et renverrait les mêmes alertes indéfiniment.
      # Étape ajoutée ici plutôt que dans un workflow dédié : la file est déjà
      # saturée par la chaîne update_bvc ↔ fetch_news.
      - name: Relais Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Le contexte `secrets` n'est pas exploitable dans un `if:` de step.
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Relais Telegram non configuré — étape ignorée."
            exit 0
          fi
          python3 pipeline/radar_telegram.py --max 3

      # ── 4. Commit et push ─────────────────────────────────
      - name: Commit news.json si modifié
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "BVC Bot"
          git config user.email "noreply@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset origin/main
            git add news.json pipeline/.radar_envoyes.json pipeline/.radar_liens_courts.json
            if git diff --cached --quiet; then
              echo "Aucune modification dans news.json — skip commit"
              exit 0
            fi
            HEURE=$(TZ="Africa/Casablanca" date +'%Y-%m-%d %H:%M')
            git commit -m "news: BVC actualités ${HEURE} (Casablanca)"
            git push origin HEAD:main && echo "✅ news.json mis à jour et pushé" && exit 0
            echo "⚠️ Push échoué (tentative $attempt/3), retry dans $((attempt * 3))s..."
            sleep $((attempt * 3))
          done
          echo "❌ Push échoué après 3 tentatives"
          exit 1

      # ── 5. Résumé ─────────────────────────────────────────
      - name: Résumé
        if: always()
        run: |
          echo "## BVC News Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger** : ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Date** : $(TZ='Africa/Casablanca' date +'%Y-%m-%d %H:%M') (Casablanca)" >> $GITHUB_STEP_SUMMARY
          if [ -f news.json ]; then
            python3 - <<'PYEOF' >> $GITHUB_STEP_SUMMARY
          import json
          try:
              d = json.load(open('news.json'))
              articles = d.get('articles', [])
              print(f"- **Articles** : {d.get('count', len(articles))}")
              print(f"- **Mis à jour** : {d.get('updated','?')}")
              tickers = sorted(set(t for a in articles for t in a.get('tickers', [])))
              print(f"- **Tickers couverts** : {len(tickers)} ({', '.join(tickers[:12])}{'...' if len(tickers)>12 else ''})")
              pos = sum(1 for a in articles if a.get('sentiment')=='POSITIF')
              neg = sum(1 for a in articles if a.get('sentiment')=='NEGATIF')
              print(f"- **Sentiment** : ✅ {pos} positifs · ❌ {neg} négatifs · ◦ {len(articles)-pos-neg} neutres")
              sources = {}
              for a in articles:
                  s = a.get('source','?')
                  sources[s] = sources.get(s,0)+1
              for src,cnt in sorted(sources.items(), key=lambda x:-x[1])[:5]:
                  print(f"  - {src} : {cnt} articles")
          except Exception as e:
              print(f"- **Erreur** : {e}")
          PYEOF
          fi
