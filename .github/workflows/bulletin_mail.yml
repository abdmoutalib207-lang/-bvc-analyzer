name: Bulletin quotidien par courriel

# Envoie chaque matin ouvré la dernière clôture fiable, avant l'ouverture.
#
# ⚠️ HORAIRE CHOISI POUR SURVIVRE AUX RETARDS DE GITHUB, pas pour être précis.
# Mesuré fin août 2026 : les tâches programmées partent avec 2 à 8 heures de
# retard, et certaines ne partent pas du tout. En visant 03h00 UTC (04h00 à
# Casablanca), même un retard de quatre heures laisse le courriel arriver avant
# l'ouverture de 9h30. Un créneau de secours à 05h00 UTC double la chance.
#
# ⚠️ Le doublon est assumé : recevoir deux fois le même bulletin est un
# désagrément, ne pas le recevoir est une promesse rompue. Le sujet porte la
# date de SÉANCE, donc deux exemplaires se reconnaissent au premier coup d'œil.
#
# ⚠️ Il ne commite rien. Le quota de reconstruction de GitHub Pages est la
# ressource rare du projet.

on:
  schedule:
    - cron: '0 3 * * 1-5'    # ≈04h00 Casablanca
    - cron: '0 5 * * 1-5'    # ≈06h00 — deuxième chance
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bulletin-mail
  cancel-in-progress: false

jobs:
  envoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Compose le bulletin depuis le data.json publié. Le script sort en code 2
      # si la collecte est trop pauvre — dans ce cas AUCUN courriel ne part.
      # Un bulletin qui arrive tous les matins finit par être lu sans
      # vérification : il ne doit jamais porter une séance non établie.
      - name: Composer le bulletin
        id: compose
        run: |
          if python pipeline/bulletin_mail.py; then
            echo "envoyer=true" >> $GITHUB_OUTPUT
            {
              echo "sujet<<FIN"
              cat bulletin_out/sujet.txt
              echo ""
              echo "FIN"
            } >> $GITHUB_OUTPUT
          else
            echo "envoyer=false" >> $GITHUB_OUTPUT
            echo "::warning::Collecte insuffisante — bulletin non envoyé."
          fi

      # ── LA CONFIGURATION N'EST PAS UN INCIDENT ────────────────────────
      #
      # ⚠️ 20 EXÉCUTIONS DEPUIS LE 03/09, 20 ÉCHECS, ZÉRO COURRIEL ENVOYÉ.
      # Relevé le 16/09 : la totalité des exécutions de ce workflow depuis sa
      # création. Chacune s'arrêtait ici, sur `exit 1`, et chaque `exit 1`
      # envoie à Noure un courriel « workflow failed ». Deux par matinée
      # ouvrée, autour de 9h et 11h à Casablanca.
      #
      # La version du 10/09 avait raison sur un point et tort sur l'autre.
      # Raison : nommer le secret manquant et dire où le poser — le message
      # d'origine ne disait ni l'un ni l'autre. Tort : ÉCHOUER pour le dire.
      #
      # Un secret absent n'est pas une panne, c'est un état de configuration.
      # Il ne se répare pas en réessayant, et il ne changera pas parce qu'on
      # aura crié vingt fois. Ce que produit `exit 1`, ce n'est pas une
      # alerte : c'est un bruit quotidien qui finit par masquer les VRAIS
      # échecs — ceux d'`update_bvc`, qui eux demandent une intervention.
      # Le dépôt documente exactement ce piège depuis le 18/08 :
      # « une alerte toujours allumée n'alerte plus ».
      #
      # Donc : tant que la configuration manque, le job se termine VERT et
      # n'envoie rien. Ce qu'il a à dire, il le dit dans son résumé — et
      # l'absence est consignée dans `.claude/memory/EN_COURS.md`, là où elle
      # sera relue.
      #
      # ⚠️ Ce qui reste bloquant, c'est l'ENVOI. Le jour où les trois secrets
      # existeront, un échec SMTP fera de nouveau échouer le job — celui-là
      # est un vrai incident, et il mérite son courriel.
      - name: Vérifier la configuration du courriel
        id: config
        if: steps.compose.outputs.envoyer == 'true'
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          manquants=""
          [ -z "$MAIL_TO"       ] && manquants="$manquants MAIL_TO"
          [ -z "$MAIL_USERNAME" ] && manquants="$manquants MAIL_USERNAME"
          [ -z "$MAIL_PASSWORD" ] && manquants="$manquants MAIL_PASSWORD"
          if [ -n "$manquants" ]; then
            echo "configuree=false" >> $GITHUB_OUTPUT
            echo "::notice::Bulletin composé mais NON envoyé — secret(s) absent(s) :$manquants"
            {
              echo "## ⏸️ Bulletin composé, envoi en attente de configuration"
              echo ""
              echo "Le bulletin a été produit correctement. **Seul l'envoi manque.**"
              echo ""
              echo "Secret(s) à renseigner :\`$manquants\`"
              echo ""
              echo "**Settings → Secrets and variables → Actions → New repository secret**"
              echo ""
              echo "| Secret | Contenu attendu |"
              echo "|---|---|"
              echo "| \`MAIL_TO\` | l'adresse destinataire du bulletin |"
              echo "| \`MAIL_USERNAME\` | l'adresse Gmail expéditrice |"
              echo "| \`MAIL_PASSWORD\` | un **mot de passe d'application** Google, pas le mot de passe du compte |"
              echo ""
              echo "Ce job se termine en succès À DESSEIN : un secret absent est un"
              echo "état de configuration, pas une panne. Le faire échouer envoyait"
              echo "deux courriels d'alerte par matinée sans rien réparer, et noyait"
              echo "les échecs qui, eux, demandent une intervention."
            } >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "configuree=true" >> $GITHUB_OUTPUT
          echo "Configuration du courriel complète."

      # L'envoi, lui, reste bloquant : un refus du serveur SMTP est un vrai
      # incident, et il doit se voir.
      - name: Envoyer
        if: steps.compose.outputs.envoyer == 'true' && steps.config.outputs.configuree == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: BVC Analyzer
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.compose.outputs.sujet }}
          body: file://bulletin_out/corps.txt
          html_body: file://bulletin_out/corps.html
          convert_markdown: false

      - name: Résumé
        if: always()
        run: |
          echo "## Bulletin quotidien" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.compose.outputs.envoyer }}" != "true" ]; then
            echo "- **Non composé** — collecte insuffisante, aucun courriel ne part." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.config.outputs.configuree }}" = "true" ]; then
            echo "- Envoyé : \`$(cat bulletin_out/sujet.txt)\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Composé : \`$(cat bulletin_out/sujet.txt)\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Envoi en attente** — voir l'étape « Vérifier la configuration »." >> $GITHUB_STEP_SUMMARY
          fi
