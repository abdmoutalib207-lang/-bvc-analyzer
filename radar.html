<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#080d1a"/>
<title>Radar BVC — Console de publication</title>
<!--
  Console de publication Radar BVC.

  N'automatise RIEN sur WhatsApp : elle prépare le texte, l'utilisateur copie
  et colle lui-même dans sa chaîne. Aucune session, aucune API, aucun risque
  pour le numéro.

  Page autonome : aucune dépendance externe, aucun CDN. Elle lit news.json,
  le même fichier que le terminal — en lecture seule. Le moteur de cours n'est
  jamais sollicité.
-->
<style>
  :root{
    --bg:#080d1a; --card:#0f1626; --line:#1e2a42;
    --txt:#e6edf7; --dim:#8b9ab5; --accent:#2ee6a8; --warn:#ffb547;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;padding:16px 14px 60px;background:var(--bg);color:var(--txt);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  header{margin-bottom:18px}
  h1{font-size:19px;margin:0 0 4px;letter-spacing:.5px}
  h1 span{color:var(--accent)}
  .meta{color:var(--dim);font-size:12.5px}
  .tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
  .tab{
    flex:1;min-width:78px;padding:11px 8px;border:1px solid var(--line);
    border-radius:9px;background:var(--card);color:var(--dim);
    font-size:13px;text-align:center;cursor:pointer;transition:.15s;
  }
  .tab.on{border-color:var(--accent);color:var(--accent);background:#0d2b22}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px;margin-bottom:14px;
  }
  .card h2{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:600;
    text-transform:uppercase;letter-spacing:.6px}
  pre{
    white-space:pre-wrap;word-break:break-word;margin:0;font-size:13.5px;
    line-height:1.55;font-family:inherit;max-height:46vh;overflow:auto;
  }
  .count{color:var(--dim);font-size:12px;margin-top:10px}
  button{
    width:100%;padding:15px;margin-top:12px;border:0;border-radius:10px;
    background:var(--accent);color:#04150f;font-size:15.5px;font-weight:700;
    cursor:pointer;font-family:inherit;
  }
  button:active{transform:scale(.985)}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:500}
  .ok{background:var(--warn);color:#2a1a00}
  .note{
    color:var(--dim);font-size:12px;line-height:1.6;border-left:2px solid var(--line);
    padding-left:11px;margin-top:22px;
  }
  .err{color:var(--warn)}
</style>
</head>
<body>

<header>
  <h1>📡 RADAR <span>BVC</span></h1>
  <div class="meta" id="meta">Chargement…</div>
</header>

<div class="tabs" id="tabs"></div>

<div class="card">
  <h2 id="titreBloc">Bulletin</h2>
  <pre id="apercu">…</pre>
  <div class="count" id="compte"></div>
  <button id="copier">📋 Copier le message</button>
  <button class="ghost" id="ouvrir">Ouvrir WhatsApp</button>
</div>

<div class="note">
  Colle le message dans la chaîne <b>Radar BVC</b>.<br/>
  Cette page ne publie rien elle-même : elle prépare le texte, tu gardes la main
  sur ce qui part. Aucun risque pour ton numéro.
</div>

<script>
/* ── Rubriques : ordre d'affichage et libellés ────────────────────────── */
const RUBRIQUES = [
  ["bvc","🇲🇦 MARCHÉ BVC"], ["macro","🏛️ MACRO"], ["economie","📈 ÉCONOMIE"],
  ["commodites","🛢️ MATIÈRES PREMIÈRES"], ["geopolitique","🌍 GÉOPOLITIQUE"],
];
/* Quotas par rubrique : sans eux, « économie » — la plus volumineuse —
   occupe tout le bulletin et la BVC disparaît. */
const QUOTAS = {bvc:5, macro:2, economie:3, commodites:2, geopolitique:2};

/* Sujets écartés : les éditeurs généralistes publient sport et culture dans
   le même flux que l'économie. */
const HORS_SUJET = /\b(football|foot|athl[ée]tisme|basket|tennis|olympique|mondiaux|match|joueur|club|cin[ée]ma|festival|film|musique|concert|m[ée]t[ée]o|canicule|accident|pape|ramadan)\b/i;

const PRESETS = [
  {id:"6",  label:"6 h",  heures:6,  max:10},
  {id:"12", label:"12 h", heures:12, max:12},
  {id:"24", label:"Journée", heures:24, max:12},
  {id:"bvc",label:"BVC seul", heures:24, max:8, cat:"bvc"},
];

let articles = [], actif = PRESETS[0], texteCourant = "";

const dateDe = a => {
  const d = new Date((a.date||"").replace(" ","T"));
  return isNaN(d) ? null : d;
};

function construire(p){
  const limite = Date.now() - p.heures*3600*1000;
  const vus = new Set();
  let pool = articles.filter(a=>{
    const d = dateDe(a);
    if(!d || d.getTime() < limite) return false;
    const t = (a.title||"").trim();
    if(!t) return false;
    // Un article sans lien n'a pas sa place dans un bulletin : le lecteur ne
    // peut pas vérifier. Le flux AMMC en produit quelques-uns.
    if(!(a.url||"").trim()) return false;
    const cle = t.toLowerCase().replace(/\W+/g,"").slice(0,60);
    if(vus.has(cle)) return false;                      // le relais Google répète
    if(HORS_SUJET.test(t) && !(a.tickers||[]).length) return false;
    vus.add(cle);
    return true;
  });

  const rang = (x,y)=>{
    const tk = (b)=> (b.tickers||[]).length ? 1 : 0;
    if(tk(y)-tk(x)) return tk(y)-tk(x);
    const dir = (b)=> (b.url||"").includes("news.google.com") ? 0 : 1;
    if(dir(y)-dir(x)) return dir(y)-dir(x);
    return (dateDe(y)||0) - (dateDe(x)||0);
  };

  let retenus;
  if(p.cat){
    retenus = pool.filter(a=>a.category===p.cat).sort(rang).slice(0,p.max);
  }else{
    retenus = [];
    for(const [cat,quota] of Object.entries(QUOTAS)){
      retenus.push(...pool.filter(a=>a.category===cat).sort(rang).slice(0,quota));
    }
    retenus = retenus.slice(0,p.max);
  }
  if(!retenus.length) return {texte:"", n:0};

  const now = new Date();
  const hh = String(now.getHours()).padStart(2,"0"),
        mm = String(now.getMinutes()).padStart(2,"0"),
        jj = String(now.getDate()).padStart(2,"0"),
        mo = String(now.getMonth()+1).padStart(2,"0");
  const L = [`📡 *RADAR BVC* — ${jj}/${mo}/${now.getFullYear()} · ${hh}:${mm}`,
             `_Dernières ${p.heures}h · ${retenus.length} actualités_`, ""];
  for(const [cat,entete] of RUBRIQUES){
    const lot = retenus.filter(a=>a.category===cat);
    if(!lot.length) continue;
    L.push(`*${entete}*`);
    for(const a of lot){
      const puce = a.sentiment==="POSITIF" ? "🟢" : a.sentiment==="NEGATIF" ? "🔴" : "•";
      const tk = (a.tickers||[]).length ? " `"+a.tickers.slice(0,3).join(" ")+"`" : "";
      L.push(`${puce} ${(a.title||"").trim()}${tk}`);
      L.push(`   _${a.source||"?"}_ — ${a.url||""}`);
    }
    L.push("");
  }
  L.push("—", "_Information financière, pas un conseil en investissement._");
  return {texte:L.join("\n"), n:retenus.length};
}

function afficher(){
  const {texte,n} = construire(actif);
  texteCourant = texte;
  document.getElementById("titreBloc").textContent =
    actif.cat ? "Bulletin — marché BVC" : "Bulletin — " + actif.label;
  document.getElementById("apercu").textContent =
    texte || "Aucune actualité sur cette période.";
  document.getElementById("compte").textContent =
    n ? `${n} actualités · ${texte.length} caractères` : "";
  document.getElementById("copier").disabled = !n;
}

function onglets(){
  const box = document.getElementById("tabs");
  box.innerHTML = "";
  PRESETS.forEach(p=>{
    const b = document.createElement("div");
    b.className = "tab" + (p.id===actif.id ? " on" : "");
    b.textContent = p.label;
    b.onclick = ()=>{ actif = p; onglets(); afficher(); };
    box.appendChild(b);
  });
}

document.getElementById("copier").onclick = async ()=>{
  const btn = document.getElementById("copier");
  try{
    await navigator.clipboard.writeText(texteCourant);
  }catch(e){
    // Safari refuse l'API presse-papier hors geste direct ou en HTTP :
    // on retombe sur une sélection manuelle.
    const z = document.createElement("textarea");
    z.value = texteCourant; document.body.appendChild(z);
    z.select(); try{ document.execCommand("copy"); }catch(_){}
    document.body.removeChild(z);
  }
  btn.textContent = "✅ Copié — colle dans Radar BVC";
  btn.classList.add("ok");
  setTimeout(()=>{ btn.textContent="📋 Copier le message"; btn.classList.remove("ok"); }, 2600);
};

document.getElementById("ouvrir").onclick = ()=>{
  location.href = "https://whatsapp.com/channel/0029VbD0KnTLtOj4NmBCUR1Z";
};

fetch("news.json?t=" + Date.now())
  .then(r=>r.ok ? r.json() : Promise.reject(r.status))
  .then(d=>{
    articles = d.articles || (Array.isArray(d) ? d : []);
    const maj = d.updated || d.generated_at || "";
    document.getElementById("meta").textContent =
      `${articles.length} articles en base` + (maj ? ` · maj ${String(maj).slice(0,16).replace("T"," ")}` : "");
    onglets(); afficher();
  })
  .catch(e=>{
    document.getElementById("meta").innerHTML =
      `<span class="err">news.json illisible (${e})</span>`;
    document.getElementById("apercu").textContent =
      "Impossible de charger les actualités.";
  });
</script>
</body>
</html>
