<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#080d1a"/>

<!-- Nom affiché sous l'icône une fois ajouté à l'écran d'accueil : sans cette
     balise iOS reprendrait le <title> entier, bien trop long. -->
<meta name="apple-mobile-web-app-title" content="Radar BVC"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="manifest" href="radar.webmanifest"/>

<!-- Aperçu au partage (WhatsApp, Telegram…) : le destinataire voit « Radar BVC »
     et non l'URL complète. -->
<meta property="og:title" content="Radar BVC"/>
<meta property="og:description" content="Veille automatisée de la Bourse de Casablanca — 46 sources, 77 valeurs."/>
<meta property="og:type" content="website"/>
<meta name="twitter:card" content="summary"/>

<!-- Sans cela, une page ajoutée à l'écran d'accueil reste figée sur la version
     mise en cache par iOS, parfois pendant des jours. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>

<title>Radar BVC</title>
<!--
  Console de publication Radar BVC.

  Reprend la charte de l'onglet ACTUALITÉS du terminal (mêmes couleurs, mêmes
  filtres) et y ajoute ce qui lui manque : la sélection des articles à publier.
  On coche, on copie, on colle dans la chaîne WhatsApp.

  N'automatise RIEN sur WhatsApp : pas de session, pas d'API, pas de risque
  pour le numéro. Page autonome, aucun CDN. Lit news.json en lecture seule —
  le moteur de cours n'est jamais sollicité.
-->
<style>
  :root{
    --bg:#080d1a; --card:#0d1829; --line:#1e2a42;
    --txt:#c8d3e8; --dim:#8892a4;
    --vert:#00e5a0; --rouge:#ff4f5a; --bleu:#4db8ff;
    --jaune:#ffd740; --violet:#a78bfa; --orange:#fb923c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;padding:14px 12px 96px;background:var(--bg);color:var(--txt);
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,"IBM Plex Mono",monospace;
  }
  .entete{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
  .entete>div:first-child{flex:1;min-width:0}
  .refresh{
    flex:0 0 auto;width:46px;height:46px;padding:0;border-radius:12px;
    background:var(--card);border:1px solid var(--line);color:var(--vert);
    font-size:22px;line-height:1;font-weight:400;
  }
  .refresh:active{transform:rotate(180deg);transition:transform .3s}
  .refresh.tourne{animation:tourner .7s linear}
  @keyframes tourner{to{transform:rotate(360deg)}}

  h1{font-size:17px;margin:0 0 3px;letter-spacing:1px}
  h1 span{color:var(--vert)}
  .sub{color:var(--dim);font-size:11.5px;margin-bottom:14px}

  /* Bandeau des cours : défile en continu, comme sur un terminal de marché.
     Le contenu est dupliqué pour que la boucle soit sans couture. */
  .bandeau{
    overflow:hidden;white-space:nowrap;background:var(--card);
    border:1px solid var(--line);border-radius:8px;padding:8px 0;margin-bottom:12px;
  }
  .defile{display:inline-block;animation:glisse 90s linear infinite}
  .bandeau:hover .defile,.bandeau:active .defile{animation-play-state:paused}
  @keyframes glisse{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .val{display:inline-block;padding:0 14px;font-size:11.5px}
  .val b{color:#e6edf7;font-weight:600;margin-right:6px}
  @media (prefers-reduced-motion:reduce){.defile{animation:none}}

  .rech{
    width:100%;padding:11px 12px;margin-bottom:12px;border-radius:8px;
    border:1px solid var(--line);background:var(--card);color:var(--txt);
    font:13px/1.4 inherit;-webkit-appearance:none;
  }
  .rech:focus{outline:0;border-color:var(--vert)}
  .rech::placeholder{color:var(--dim)}

  .row{display:flex;gap:7px;margin-bottom:10px}
  .scope{
    flex:1;padding:12px 6px;border:1px solid var(--line);border-radius:9px;
    background:var(--card);text-align:center;font-size:11.5px;color:var(--dim);
    letter-spacing:.5px;cursor:pointer;
  }
  .scope b{display:block;font-size:15px;margin-top:3px;color:inherit}
  .scope.on{border-color:currentColor}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 7px}
  .stat i{display:block;font-style:normal;color:var(--dim);font-size:9.5px;letter-spacing:.5px}
  .stat b{display:block;font-size:17px;margin-top:3px}

  .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
  .chip{
    padding:6px 11px;border:1px solid var(--line);border-radius:6px;
    background:var(--card);color:var(--dim);font-size:11px;cursor:pointer;
  }
  .chip.on{border-color:var(--vert);color:var(--vert);background:rgba(0,229,160,.1)}
  .lbl{color:var(--dim);font-size:10.5px;letter-spacing:.5px;margin-right:2px}

  .art{
    display:flex;gap:10px;background:var(--card);border:1px solid var(--line);
    border-left:3px solid var(--line);border-radius:9px;padding:12px;margin-bottom:9px;
  }
  .art.sel{border-color:var(--vert);background:rgba(0,229,160,.07)}
  /* Zone de touche élargie : 20px de case dans 44px de cible, minimum
     recommandé sur mobile pour éviter les erreurs de sélection. */
  .box{
    flex:0 0 44px;height:44px;margin:-6px 0 0 -8px;display:flex;
    align-items:center;justify-content:center;cursor:pointer;
  }
  .box::before{
    content:attr(data-c);width:20px;height:20px;border:1.5px solid var(--line);
    border-radius:5px;display:flex;align-items:center;justify-content:center;
    font-size:12px;color:var(--bg);
  }
  .art.sel .box::before{background:var(--vert);border-color:var(--vert)}
  .corps{flex:1;min-width:0;color:inherit;text-decoration:none;display:block}
  .art h3{margin:0 0 5px;font-size:13.5px;line-height:1.45;font-weight:600;color:#e6edf7}
  .art p{margin:0 0 8px;font-size:11.5px;line-height:1.5;color:var(--dim)}
  .tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:9.5px}
  .tag{padding:2.5px 7px;border-radius:4px;border:1px solid}
  .src{margin-left:auto;color:var(--dim);font-size:10px}
  .date{color:var(--dim);font-size:10px;white-space:nowrap;margin-left:8px}

  .barre{
    position:fixed;left:0;right:0;bottom:0;padding:11px 12px calc(11px + env(safe-area-inset-bottom));
    background:rgba(8,13,26,.96);border-top:1px solid var(--line);
    backdrop-filter:blur(10px);display:flex;gap:8px;align-items:center;
  }
  .barre .n{color:var(--dim);font-size:11px;flex:1}
  .barre .n b{color:var(--vert);font-size:14px}
  button{
    padding:12px 15px;border:0;border-radius:8px;background:var(--vert);
    color:#04150f;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  button:disabled{opacity:.35}
  button.g{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:500}
  .vide{color:var(--dim);text-align:center;padding:36px 12px;font-size:12.5px}
</style>
</head>
<body>

<div class="entete">
  <div>
    <h1>📡 RADAR <span>BVC</span></h1>
    <div class="sub" id="maj">Chargement…</div>
  </div>
  <!-- Placé près de la date de mise à jour : c'est là qu'on regarde quand on
       se demande si les données sont fraîches. -->
  <button class="refresh" id="maj-btn" aria-label="Rafraîchir">↻</button>
</div>
<div class="sub" id="audience" style="margin-top:-8px"></div>

<div class="bandeau" id="bandeau" hidden><div class="defile" id="defile"></div></div>
<input class="rech" id="rech" type="search" inputmode="search"
       placeholder="Rechercher un titre, une source, un ticker…"/>
<div class="row" id="scopes"></div>
<div class="stats" id="stats"></div>
<div class="chips" id="fenetres"></div>
<div class="chips" id="tickers"></div>
<div id="liste"></div>

<div class="barre">
  <div class="n" id="compteur">Coche pour publier · touche le titre pour lire</div>
  <button class="g" id="tout">Tout</button>
  <button id="copier" disabled>Copier</button>
</div>

<script>
/* Même vocabulaire que l'onglet ACTUALITÉS du terminal, pour que l'utilisateur
   ne change pas de repères en passant de l'un à l'autre. */
const INTL = new Set(["geopolitique","commodites"]);
const CAT_LBL = {bvc:"BVC", economie:"Éco", macro:"Macro",
                 geopolitique:"Géopolitique", commodites:"Matières 1ères"};
const CAT_COL = {bvc:"#4db8ff", economie:"#8892a4", macro:"#ffd740",
                 geopolitique:"#a78bfa", commodites:"#fb923c"};
const CAT_ORDRE = ["bvc","macro","economie","commodites","geopolitique"];
const CAT_ENTETE = {bvc:"🇲🇦 MARCHÉ BVC", macro:"🏛️ MACRO", economie:"📈 ÉCONOMIE",
                    commodites:"🛢️ MATIÈRES PREMIÈRES", geopolitique:"🌍 GÉOPOLITIQUE"};

/* Les éditeurs généralistes publient sport et culture dans le même flux que
   l'économie ; ces articles héritent de la catégorie de leur source. */
const HORS_SUJET = /\b(football|foot|athl[ée]tisme|basket|tennis|olympique|mondiaux|match|joueur|club|cin[ée]ma|festival|film|musique|concert|m[ée]t[ée]o|canicule|accident|pape|ramadan)\b/i;

const FENETRES = [{h:6,l:"6 h"},{h:12,l:"12 h"},{h:24,l:"24 h"},{h:72,l:"3 j"}];

let tous = [], scope = "ALL", ticker = "ALL", fenetre = 24, recherche = "";
/* Nos codes internes → codes officiels BVC, pour l'affichage seulement.
   Le marché lit « SNA » comme Stokvis et « SID » comme Sonasid ; nos symboles
   restent la clé du filtrage et du tagging. Renseignée par data.json ; vide
   tant qu'il n'a pas répondu, auquel cas on affiche notre code. */
let codesBVC = {};
const codeAff = t => codesBVC[t] || t;
const choisis = new Set();

const dateDe = a => { const d = new Date((a.date||"").replace(" ","T")); return isNaN(d)?null:d; };
const fmt = d => d ? d.toLocaleString("fr-FR",{timeZone:"Africa/Casablanca",
              day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";
const cle = a => a.id || a.url || a.title;

/* Pertinents : dans la fenêtre, avec un lien, non dupliqués, hors sujets écartés. */
function pertinents(){
  const limite = Date.now() - fenetre*3600*1000, vus = new Set();
  return tous.filter(a=>{
    const d = dateDe(a), t = (a.title||"").trim();
    if(!d || d.getTime() < limite || !t || !(a.url||"").trim()) return false;
    const k = t.toLowerCase().replace(/\W+/g,"").slice(0,60);
    if(vus.has(k)) return false;
    if(HORS_SUJET.test(t) && !(a.tickers||[]).length) return false;
    vus.add(k); return true;
  });
}
const parScope = l => scope==="MAROC" ? l.filter(a=>!INTL.has(a.category||"economie"))
                    : scope==="INTL"  ? l.filter(a=> INTL.has(a.category||"economie")) : l;
/* Recherche insensible à la casse ET aux accents : « economie » doit trouver
   « économie ». Porte sur le titre, la source et les tickers. */
const sansAccent = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

const affichables = () => {
  let l = parScope(pertinents());
  if(ticker!=="ALL") l = l.filter(a=>(a.tickers||[]).includes(ticker));
  if(recherche){
    const q = sansAccent(recherche);
    l = l.filter(a => sansAccent(
      (a.title||"")+" "+(a.source||"")+" "+(a.tickers||[]).join(" ")+" "+(a.summary||"")
    ).includes(q));
  }
  // Ordre strictement chronologique, le plus récent en tête. On ne remonte plus
  // les articles tagués : dans une liste d'actualités, l'heure prime — sans quoi
  // une dépêche de la veille rattachée à un ticker passait devant une info du
  // matin, ce qui rend la lecture déroutante.
  return l.sort((x,y) => (dateDe(y)||0) - (dateDe(x)||0));
};

/* Une recherche infructueuse doit dire POURQUOI : le plus souvent l'article
   existe mais tombe hors de la fenêtre choisie. */
function vide(){
  if(!recherche) return `<div class="vide">Aucune actualité sur cette période.</div>`;
  const q = sansAccent(recherche);
  const ailleurs = tous.filter(a => sansAccent(
      (a.title||"")+" "+(a.source||"")+" "+(a.tickers||[]).join(" ")
    ).includes(q)).length;
  return ailleurs
    ? `<div class="vide">Rien sur cette période.<br/>
       <b style="color:var(--jaune)">${ailleurs}</b> résultat${ailleurs>1?"s":""}
       en élargissant la période ci-dessus.</div>`
    : `<div class="vide">Aucun résultat pour « ${recherche} ».</div>`;
}

function dessiner(){
  const base = pertinents();
  const nMa = base.filter(a=>!INTL.has(a.category||"economie")).length;
  const nIn = base.length - nMa;

  document.getElementById("scopes").innerHTML =
    [["ALL","TOUTES",base.length,"var(--txt)"],
     ["MAROC","🇲🇦 MAROC",nMa,"var(--vert)"],
     ["INTL","🌍 INTERNATIONAL",nIn,"var(--violet)"]]
    .map(([id,l,n,c])=>`<div class="scope${scope===id?" on":""}" data-s="${id}"
         style="color:${scope===id?c:"var(--dim)"}">${l}<b>${n}</b></div>`).join("");

  const vus = affichables();
  const pos = vus.filter(a=>a.sentiment==="POSITIF").length;
  const neg = vus.filter(a=>a.sentiment==="NEGATIF").length;
  document.getElementById("stats").innerHTML =
    `<div class="stat"><i>ARTICLES</i><b style="color:var(--bleu)">${vus.length}</b></div>
     <div class="stat"><i>TON POSITIF</i><b style="color:var(--vert)">${pos}</b></div>
     <div class="stat"><i>TON NÉGATIF</i><b style="color:var(--rouge)">${neg}</b></div>
     <div class="stat"><i>SÉLECTION</i><b style="color:var(--jaune)">${choisis.size}</b></div>`;

  document.getElementById("fenetres").innerHTML =
    `<span class="lbl">PÉRIODE</span>` + FENETRES.map(f=>
      `<span class="chip${fenetre===f.h?" on":""}" data-f="${f.h}">${f.l}</span>`).join("");

  const tk = new Set();
  parScope(pertinents()).forEach(a=>(a.tickers||[]).forEach(t=>tk.add(t)));
  document.getElementById("tickers").innerHTML =
    `<span class="lbl">TICKER</span><span class="chip${ticker==="ALL"?" on":""}" data-t="ALL">TOUS</span>` +
    [...tk].sort().map(t=>`<span class="chip${ticker===t?" on":""}" data-t="${t}">${codeAff(t)}</span>`).join("");

  document.getElementById("liste").innerHTML = vus.length ? vus.map(a=>{
    const c = a.category||"economie";
    const col = CAT_COL[c]||"#8892a4";
    const s = a.sentiment;
    const sc = s==="POSITIF"?"var(--vert)" : s==="NEGATIF"?"var(--rouge)" : "var(--dim)";
    const bord = s==="POSITIF"?"var(--vert)" : s==="NEGATIF"?"var(--rouge)" : "var(--line)";
    const k = cle(a), on = choisis.has(k);
    // Sur les articles relayés, le résumé reprend mot pour mot le titre :
    // on ne l'affiche que s'il apporte vraiment quelque chose.
    let ex = (a.summary||a.description||"").trim();
    const t0 = (a.title||"").trim().toLowerCase().slice(0,40);
    if(t0 && ex.toLowerCase().startsWith(t0)) ex = "";
    ex = ex.slice(0,150);
    const tags = (a.tickers||[]).map(t=>
      `<span class="tag" style="color:var(--bleu);border-color:rgba(77,184,255,.4)">${codeAff(t)}</span>`).join("");
    // Deux gestes distincts : la case sélectionne, le corps ouvre la source.
    // Un même clic ne peut pas faire les deux sans surprendre l'utilisateur.
    return `<div class="art${on?" sel":""}" style="border-left-color:${bord}">
      <div class="box" data-sel="${encodeURIComponent(k)}" data-c="${on?"✓":""}"></div>
      <a class="corps" href="${a.url||"#"}" target="_blank" rel="noopener">
        <div style="display:flex;align-items:flex-start">
          <h3>${a.title||""}</h3><span class="date">${fmt(dateDe(a))}</span>
        </div>
        ${ex?`<p>${ex}…</p>`:""}
        <div class="tags">
          ${s&&s!=="NEUTRE"?`<span class="tag" style="color:${sc};border-color:${sc}55">${s}</span>`:""}
          <span class="tag" style="color:${col};border-color:${col}55">${CAT_LBL[c]||c}</span>
          ${tags}<span class="src">${a.source||""} ↗</span>
        </div>
      </a></div>`;
  }).join("") : vide();

  document.getElementById("compteur").innerHTML = choisis.size
    ? `<b>${choisis.size}</b> article${choisis.size>1?"s":""} sélectionné${choisis.size>1?"s":""}`
    : "Coche pour publier · touche le titre pour lire";
  document.getElementById("copier").disabled = !choisis.size;
  document.getElementById("tout").textContent = choisis.size ? "Aucun" : "Tout";
}

/* Le message reprend la mise en forme WhatsApp : *gras*, _italique_. */
function composer(){
  const sel = affichables().filter(a=>choisis.has(cle(a)));
  const n = new Date();
  const p = x => String(x).padStart(2,"0");
  const L = [`📡 *RADAR BVC* — ${p(n.getDate())}/${p(n.getMonth()+1)}/${n.getFullYear()} · ${p(n.getHours())}:${p(n.getMinutes())}`,
             `_${sel.length} actualité${sel.length>1?"s":""}_`, ""];
  for(const c of CAT_ORDRE){
    const lot = sel.filter(a=>(a.category||"economie")===c);
    if(!lot.length) continue;
    L.push(`*${CAT_ENTETE[c]}*`);
    for(const a of lot){
      const puce = a.sentiment==="POSITIF"?"🟢" : a.sentiment==="NEGATIF"?"🔴" : "•";
      const tk = (a.tickers||[]).length ? " `"+a.tickers.slice(0,3).join(" ")+"`" : "";
      L.push(`${puce} ${(a.title||"").trim()}${tk}`);
      L.push(`   _${a.source||"?"}_ — ${a.url||""}`);
    }
    L.push("");
  }
  L.push("—","_Information financière, pas un conseil en investissement._");
  return L.join("\n");
}

document.addEventListener("click", e=>{
  const s=e.target.closest("[data-s]"), f=e.target.closest("[data-f]"),
        t=e.target.closest("[data-t]"), a=e.target.closest("[data-sel]");
  if(s){ scope=s.dataset.s; ticker="ALL"; dessiner(); }
  else if(f){ fenetre=+f.dataset.f; dessiner(); }
  else if(t){ ticker=t.dataset.t; dessiner(); }
  else if(a){
    const k=decodeURIComponent(a.dataset.sel);
    choisis.has(k)?choisis.delete(k):choisis.add(k);
    dessiner();
  }
});

let minuteur;
document.getElementById("rech").addEventListener("input", e=>{
  // léger différé : évite de redessiner la liste à chaque frappe
  clearTimeout(minuteur);
  const v = e.target.value.trim();
  minuteur = setTimeout(()=>{ recherche = v; dessiner(); }, 180);
});

document.getElementById("tout").onclick = ()=>{
  if(choisis.size) choisis.clear();
  else affichables().slice(0,12).forEach(a=>choisis.add(cle(a)));  // 12 max : au-delà
  dessiner();                                                      // le message devient illisible
};

document.getElementById("copier").onclick = async ()=>{
  const b=document.getElementById("copier"), txt=composer();
  try{ await navigator.clipboard.writeText(txt); }
  catch(_){
    // Safari refuse l'API presse-papier hors geste direct ou en HTTP.
    const z=document.createElement("textarea"); z.value=txt;
    document.body.appendChild(z); z.select();
    try{ document.execCommand("copy"); }catch(__){}
    document.body.removeChild(z);
  }
  b.textContent="✅ Copié"; b.style.background="var(--jaune)";
  setTimeout(()=>{
    b.textContent="Copier"; b.style.background="";
    location.href="https://whatsapp.com/channel/0029VbD0KnTLtOj4NmBCUR1Z";
  },900);
};

/* Bandeau des cours. Lit data.json — le même fichier que le terminal, en
   lecture seule. Son échec n'empêche jamais la console de fonctionner :
   les actualités sont l'essentiel, les cours un complément. */

/* ── Audience ──────────────────────────────────────────────────────────
   Service de compteur public (abacus), sans compte ni clé. Aucune donnée
   personnelle : on incrémente des entiers, rien d'autre — ni cookie, ni
   identifiant, ni adresse IP conservée de notre côté.

   « En ligne » est une approximation : on compte les ouvertures de page
   dans le seau de 5 minutes en cours. Un vrai suivi de présence exigerait
   un serveur maintenant des connexions ouvertes, ce dont on n'a pas besoin
   ici. Chaque session n'incrémente qu'une fois par seau, puis se contente
   de lire — sans quoi un onglet resté ouvert gonflerait le chiffre. */
/* Le paramètre ?r= sert uniquement à contourner le cache lors d'un
   rafraîchissement manuel. Une fois la page chargée il n'a plus d'objet et
   salit la barre d'adresse — on le retire sans recharger. */
if (location.search) {
  try { history.replaceState(null, "", location.pathname); } catch (_) {}
}

const AUDIENCE = "https://abacus.jasoncameron.dev";
const ESPACE   = "radarbvc-ma";
let totalVus = null;

/* Tranches de 5 minutes : un appareil actif est compté « en ligne » tant qu'il
   se manifeste dans la tranche courante. */
const seau = () => Math.floor(Date.now() / 300000);

/* Mémoire locale de l'appareil. Sans elle, le compteur additionnait les
   OUVERTURES de page et non les appareils : onze rechargements affichaient
   « 11 en ligne » pour une seule personne. On note donc la dernière tranche
   déjà signalée par cet appareil ; s'il revient dans la même tranche, il se
   contente de lire le compteur au lieu de l'incrémenter.
   Navigation privée : localStorage lève une exception, on retombe alors sur
   une mémoire en RAM — le comportement reste correct le temps de la session. */
const memoire = (() => {
  try {
    localStorage.setItem("__t", "1"); localStorage.removeItem("__t");
    return localStorage;
  } catch (_) {
    const ram = {};
    return { getItem: k => ram[k] ?? null, setItem: (k, v) => { ram[k] = String(v); } };
  }
})();

async function audience(){
  try{
    const s = String(seau());
    const nouvelleTranche = memoire.getItem("radar-seau") !== s;
    if (nouvelleTranche) memoire.setItem("radar-seau", s);

    // Le total ne compte que les appareils distincts : un même appareil ne
    // l'incrémente qu'à sa toute première visite.
    const jamaisVenu = !memoire.getItem("radar-connu");
    if (jamaisVenu) memoire.setItem("radar-connu", "1");

    const [enLigne, total] = await Promise.all([
      fetch(`${AUDIENCE}/${nouvelleTranche ? "hit" : "get"}/${ESPACE}/live-${s}`)
        .then(r => r.ok ? r.json() : null).catch(() => null),
      totalVus === null
        ? fetch(`${AUDIENCE}/${jamaisVenu ? "hit" : "get"}/${ESPACE}/appareils`)
            .then(r => r.ok ? r.json() : null).catch(() => null)
        : Promise.resolve({ value: totalVus }),
    ]);
    if (total) totalVus = total.value;

    const n = enLigne?.value;
    if (n) {
      document.getElementById("audience").innerHTML =
        `<span style="color:var(--vert)">●</span> ${n} en ligne` +
        (totalVus ? ` · ${totalVus.toLocaleString("fr-FR")} visiteur${totalVus > 1 ? "s" : ""}` : "");
    }
  }catch(_){ /* le compteur ne doit jamais gêner la console */ }
}
audience();
setInterval(audience, 60000);

/* Rafraîchissement manuel : une page ajoutée à l'écran d'accueil peut rester
   figée sur la version mise en cache par iOS. Recharger en contournant le
   cache est le seul moyen fiable de forcer la mise à jour. */
document.getElementById("maj-btn").onclick = (e)=>{
  e.currentTarget.classList.add("tourne");
  document.getElementById("maj").textContent = "Rafraîchissement…";
  setTimeout(()=>location.replace(location.pathname + "?r=" + Date.now()), 260);
};

fetch("data.json?t="+Date.now())
  .then(r=>r.ok?r.json():Promise.reject(r.status))
  .then(d=>{
    const ts=(d.tickers||[]).filter(t=>t.price);
    if(!ts.length) return;
    const item = t => {
      const c = Number(t.chg)||0;
      const col = c>0?"var(--vert)":c<0?"var(--rouge)":"var(--dim)";
      const fl = c>0?"▲":c<0?"▼":"—";
      const px = Number(t.price).toLocaleString("fr-FR",{maximumFractionDigits:2});
      // code officiel BVC quand il est présent : le marché lit « SNA » comme
      // Stokvis, pas comme Sonasid. Repli sur notre symbole sinon.
      const code = t.code_bvc || t.symbol;
      return `<span class="val"><b>${code}</b>${px}` +
             `<span style="color:${col}"> ${fl}${c?Math.abs(c).toFixed(2)+"%":""}</span></span>`;
    };
    // contenu dupliqué : l'animation translate de -50%, la boucle est invisible
    const html = ts.map(item).join("");
    document.getElementById("defile").innerHTML = html + html;
    document.getElementById("bandeau").hidden = false;
    // La liste d'actualités a pu être rendue avant l'arrivée de data.json :
    // on redessine une fois la correspondance connue.
    ts.forEach(t=>{ if(t.code_bvc) codesBVC[t.symbol] = t.code_bvc; });
    if(tous.length) dessiner();
  })
  .catch(()=>{});   // pas de cours : le bandeau reste masqué

fetch("news.json?t="+Date.now())
  .then(r=>r.ok?r.json():Promise.reject(r.status))
  .then(d=>{
    tous = d.articles || (Array.isArray(d)?d:[]);
    const m = d.updated || "";
    document.getElementById("maj").textContent =
      `${tous.length} articles en base` + (m?` · maj ${fmt(new Date(m))}`:"");
    dessiner();
  })
  .catch(e=>{
    document.getElementById("maj").innerHTML =
      `<span style="color:var(--rouge)">news.json illisible (${e})</span>`;
  });
</script>
</body>
</html>
