// ── SCORE PERSONNALISÉ ────────────────────────────────────────────────────────
// Recalcule un score d'affichage selon les composantes actives (F/N/T)
// Ne modifie PAS le score v5.3 stocké — lecture seule des sous-scores
/* Les composantes du score v5.3, transportées telles quelles depuis data.json.
   Déclarées ici, à côté de la fonction qui les consomme, plutôt que noyées
   dans le mapping de loadData où l'absence de score_tech est passée inaperçue
   pendant tout le temps qu'a duré le mode personnalisé. */
const CHAMPS_SCORE = ["score_tech", "score_fond", "score_nlp"];

/* Les trois composantes telles qu'elles sont DANS LE FICHIER, ou `null`.
   Aucune n'est devinée : une composante absente reste absente. */
function composantesScore(r) {
  return {
    f: r.score_fond != null ? r.score_fond : null,            // 0-10
    n: r.nlp != null ? (r.nlp + 1) * 5 : null,                // [-1,+1] → [0,10]
    t: r.score_tech != null ? r.score_tech : null,            // 0-10
  };
}

/* Ce qui MANQUE pour cette pondération. Une composante de poids nul n'est pas
   requise : en 70/30, l'absence de NLP ne gêne personne. */
function composantesManquantes(r, p) {
  if (!p || p.officiel) return [];
  const c = composantesScore(r), m = [];
  if ((p.f||0) > 0 && c.f == null) m.push("Fondamental");
  if ((p.n||0) > 0 && c.n == null) m.push("NLP");
  if ((p.t||0) > 0 && c.t == null) m.push("Technique");
  return m;
}

function computeDisplayScore(r, p) {
  // Le mode officiel rend le v5.3 du moteur TEL QUEL — bonus et malus compris.
  // Le recalculer ici donnerait un chiffre légèrement différent de celui du
  // bulletin, et personne ne saurait lequel croire.
  if (!p || p.officiel) return r.v53;

  /* ⚠️ AUCUN REPLI. Cette fonction rendait `r.bvc` quand `score_fond`
     manquait, et `RSI / 10` quand `score_tech` manquait.

     `r.bvc` est la note BVC DE RÉFÉRENCE, pas la note fondamentale : le mode
     personnalisé ne changeait donc pas seulement les POIDS mais les
     INGRÉDIENTS. Mesuré par l'audit du 09/09 : ADH 4,28 au lieu de 6,15.

     Le défaut a été corrigé côté moteur — mais il RESSORT pendant la fenêtre
     qui suit une fusion, tant que `data.json` n'a pas été régénéré : les
     composantes sont absentes de l'ancien fichier, et les replis reprenaient
     la main en silence. Mesuré le 11/09 : ADH réaffichait 5,01.

     Une note approchée ressemble à une note. Elle ne doit donc pas exister :
     si une composante requise manque, le score est INDISPONIBLE, et le tri
     comme l'export le traitent en tant que tel. */
  const total = (p.f||0) + (p.n||0) + (p.t||0);
  if (total === 0) return null;
  if (composantesManquantes(r, p).length) return null;

  const c = composantesScore(r);
  return +Math.min(10, Math.max(0,
    ((c.f ?? 0)*(p.f||0) + (c.n ?? 0)*(p.n||0) + (c.t ?? 0)*(p.t||0)) / total
  )).toFixed(2);
}

function scoreModeLabel(p) {
  if (!p || p.officiel) return "OFFICIEL";
  return `F${p.f}/T${p.t}`;
}

// Les poids À AFFICHER — ceux qui ont réellement produit le chiffre montré.
//
// ⚠️ Signalé par Abd Moutalib le 09/09/2026 : « le curseur ne bouge pas quand
// je change les pourcentages ». Les quatre endroits qui dessinent la
// répartition lisaient `r.poids`, c'est-à-dire les poids que le MOTEUR a
// retenus pour ce titre (le WeightEngine les module par titre). Choisir 60/40
// changeait la note sans changer la barre : l'écran montrait donc une note
// calculée avec une répartition, à côté d'une répartition qui n'était pas
// celle-là.
//
// C'est exactement le défaut de la fiche détaillée du 08/09, à un autre
// endroit. Même leçon, deux fois de suite : un réglage qui traverse
// l'interface doit être vérifié PARTOUT où il s'applique.
function poidsAffiches(r, p) {
  if (!p || p.officiel) return r.poids || null;
  return {f: p.f || 0, n: p.n || 0, t: p.t || 0};
}

// ── APP ───────────────────────────────────────────────────────────────────────
// Mention légale — permanente, non masquable, présente sur tous les onglets.
//
// Le terminal publie des notes colorées par palier sur des valeurs cotées
// (plus aucun mot d'action depuis le 07/10/2026). Sans agrément AMMC, cela doit être présenté comme une analyse
// quantitative et non comme un conseil en investissement. L'absence de cette
// mention était le risque le plus sérieux du projet, et le moins coûteux à
// écarter.
//
// ⚠️ Volontairement SANS bouton de fermeture. Un avertissement qu'on peut faire
// disparaître ne protège personne — ni l'utilisateur, ni l'éditeur.
const MentionLegale=()=>(
  <footer role="contentinfo" aria-label="Mentions légales"
    style={{marginTop:32,padding:"18px 20px",borderTop:"1px solid rgba(255,255,255,.08)",
            background:"rgba(255,255,255,.02)",fontSize:11,lineHeight:1.7,color:"#6b7689",
            fontFamily:"'IBM Plex Mono',monospace"}}>
    <div style={{maxWidth:900,margin:"0 auto"}}>
      <div style={{color:"#8892a4",fontWeight:700,marginBottom:6,letterSpacing:1}}>
        AVERTISSEMENT
      </div>
      <p style={{margin:"0 0 8px"}}>
        BVC Analyzer est un <strong style={{color:"#8892a4"}}>outil d'analyse
        quantitative à vocation informative</strong>. Les scores, signaux et
        indicateurs présentés ne constituent ni un conseil en investissement, ni
        une recommandation personnalisée, ni une offre ou sollicitation d'achat
        ou de vente d'instruments financiers.
      </p>
      <p style={{margin:"0 0 8px"}}>
        L'éditeur n'est pas agréé par l'AMMC en qualité de conseiller en
        investissement financier. Les données proviennent de sources publiques
        tierces, sont différées et peuvent comporter des erreurs ou des
        omissions&nbsp;; leur exactitude n'est pas garantie. L'indicateur de
        confiance ●●●○○ affiché sous chaque score indique le niveau de
        vérification réellement atteint pour cette valeur.
      </p>
      <p style={{margin:0}}>
        Les performances passées ne préjugent pas des performances futures.
        Toute décision d'investissement relève de votre seule responsabilité et
        devrait être précédée de l'avis d'un professionnel habilité.
      </p>
    </div>
  </footer>
);

function App(){
  const [tab,setTab]=useState(()=>localStorage.getItem("bvc_tab")||"accueil");
  const [sort,setSort]=useState("v53");
  const [scoreMode,setScoreMode]=useState(PONDERATIONS[0]);
  useEffect(()=>{setSort("v53");},[scoreMode]);
  const [sel,setSel]=useState("CMT");
  const [rows,setRows]=useState(STATIC);
  const [fav,setFav]=useState(()=>{try{return JSON.parse(localStorage.getItem("bvc_fav")||"[]");}catch{return [];}});
  const toggleFav=useCallback(sym=>{setFav(prev=>{const next=prev.includes(sym)?prev.filter(x=>x!==sym):[...prev,sym];localStorage.setItem("bvc_fav",JSON.stringify(next));return next;});},[]);
  const [ts,setTs]=useState(new Date().toLocaleString("fr-FR",{timeZone:"Africa/Casablanca",hour:"2-digit",minute:"2-digit"}));
  const [src,setSrc]=useState("connexion…");
  const [loading,setLoading]=useState(false);
  const [fetchErr,setFetchErr]=useState(false);
  const [mktStatus,setMktStatus]=useState(getMarketStatus());
  const [masi,setMasi]=useState(null);

  // Update market status every 30s
  useEffect(()=>{
    const t=setInterval(()=>setMktStatus(getMarketStatus()),30000);
    return()=>clearInterval(t);
  },[]);

  // MASI index — refresh toutes les 2 min
  useEffect(()=>{
    const load=()=>fetchMASI().then(m=>{if(m)setMasi(m);});
    load();
    const t=setInterval(load,120000);
    return()=>clearInterval(t);
  },[]);

  // Retour visible du bouton Actualiser : neuf = données plus récentes qu'avant.
  const [majMsg,setMajMsg]=useState(null);
  const dernierUpd=useRef(null);
  const annonce=useCallback((texte,neuf)=>{
    setMajMsg({texte,neuf});
    setTimeout(()=>setMajMsg(null),6000);
  },[]);

  // Merge live quote data into rows (functional update, no dep on rows)
  const mergeLive=useCallback((liveMap)=>{
    const propres=o=>Object.fromEntries(Object.entries(o).filter(([,v])=>v!==undefined));
    setRows(prev=>{
      const fusion=prev.map(s=>{
        const live=liveMap[s.symbol];
        return live?{...s,...propres(live)}:s;
      });
      /* Un titre présent dans data.json mais absent du tableau STATIC ne
         s'affichait jamais : prev.map() ne fait que mettre à jour l'existant.
         Toute nouvelle introduction en bourse restait donc invisible tant
         qu'on ne l'ajoutait pas à la main au frontend — c'était le cas de
         T2S, cotée depuis le 27/07/2026.
         On exige `name` pour n'ajouter que depuis data.json : l'overlay live
         de séance ne porte que des cours, il créerait une ligne sans nom ni
         score. */
      const connus=new Set(prev.map(s=>s.symbol||s.ticker));
      const nouveaux=Object.entries(liveMap)
        .filter(([sym,live])=>!connus.has(sym)&&live&&live.name)
        .map(([sym,live])=>({symbol:sym,...propres(live)}));
      return nouveaux.length?[...fusion,...nouveaux]:fusion;
    });
  },[]);

  // Load data: data.json (backend pipeline) → overlay live IDBourse/Médias24 pendant session
  const loadData=useCallback(async(manuel=false)=>{
    setLoading(true);
    // Étape 1 : data.json — source principale (pipeline GitHub Actions)
    let pipelineLoaded=false;
    let nLive=0;
    try{
      const d=await fetch("data.json?t="+Date.now()).then(r=>r.ok?r.json():null);
      if(d?.tickers&&d.tickers.length>0){
        const m={};
        d.tickers.forEach(t=>{m[t.symbol]={
          price:t.price,chg:t.chg,vol:t.vol||0,open:t.open,close:t.close,
          name:t.name,sector:t.sector,code_bvc:t.code_bvc,_meta:t._meta,
          pe:t.pe,pe_annuel:t.pe_annuel,pe_base:t.pe_base,pb:t.pb,div:t.div,cap:t.cap,fwd:t.fwd,
          h90:t.h90,l90:t.l90,ma200:t.ma200,h52w:t.h52w,l52w:t.l52w,
          rsi:t.rsi,ma20:t.ma20,ma50:t.ma50,
          macd:t.macd,macd_signal:t.macd_signal,macd_hist:t.macd_hist,
          bb_upper:t.bb_upper,bb_mid:t.bb_mid,bb_lower:t.bb_lower,
          stoch_k:t.stoch_k,stoch_d:t.stoch_d,
          v53:t.v53,nlp:t.nlp,score_version:t.score_version,
          /* ⚠️ LES COMPOSANTES DU SCORE, oubliées jusqu'au 10/09/2026.
             `score_tech` existait dans data.json et n'arrivait jamais ici :
             computeDisplayScore retombait donc sur son repli `RSI / 10`, qui
             n'est pas la même formule (le moteur tient aussi compte des
             moyennes mobiles et de la position dans la fourchette). Mesuré :
             ADI 7,50 → 5,72 · ADH 6,70 → 4,99 · Taqa 6,70 → 4,80.
             Signalé par l'audit externe du 09/09. Elles passent par une liste
             NOMMÉE pour qu'un oubli futur se voie — une énumération de
             quarante champs cache ce qui lui manque. */
          ...Object.fromEntries(CHAMPS_SCORE.map(c=>[c,t[c]])),
          alpha:t.alpha,win:t.win,sig:t.sig,biais:t.biais,reference:t.reference,
          bonus:t.bonus,poids:t.poids,warn:t.warn,warnMsg:t.warnMsg,
          bear:t.bear,base:t.base,bull:t.bull,upside:t.upside,flags:t.flags,alertes:t.alertes,ratios_publies:t.ratios_publies,
          conv:t.conv,setup:t.setup,
          obv:t.obv,adx:t.adx,adx_pdi:t.adx_pdi,adx_mdi:t.adx_mdi,
          /* ⚠️ DEUX CHAMPS CALCULÉS QUI N'ARRIVAIENT PAS JUSQU'ICI — 25/09.
             `rang_secteur`, publié le 24/09, et `niveaux`, le 25/09 : les
             deux composants d'affichage existaient, les données ne leur
             parvenaient jamais. Le rang sectoriel est donc resté INVISIBLE
             depuis sa livraison.

             ⚠️ Le test qui devait l'empêcher cherchait la chaîne
             « rang_secteur » DANS index.html. Elle y était — dans le
             composant. Il ne vérifiait pas le CHEMIN DE DONNÉES, et c'est
             le seul endroit où la rupture se produit.

             Le commentaire ci-dessus annonçait pourtant le risque : « une
             énumération de quarante champs cache ce qui lui manque ». Elle
             l'a caché une fois de plus. */
          rang_secteur:t.rang_secteur, niveaux:t.niveaux,
          /* ⚠️ Le montant RÉEL de la séance et les bornes de réservation,
             collectés depuis le 25/09. `vol` était déjà là ; le montant,
             non — le projet l'approchait par `volume × clôture`. */
          echange_dh:t.echange_dh, seuil_bas:t.seuil_bas, seuil_haut:t.seuil_haut,
          /* Calibrage technique, 03/10/2026 : nouveau pilier EN ESSAI (mode
             ombre) et motif de neutralisation de l'ancien. */
          score_tech_v2:t.score_tech_v2, technique_neutralise:t.technique_neutralise, verdict_plafonne:t.verdict_plafonne
        };});
        REGIME_TECH=d.regime_technique||null;
        mergeLive(m);
        nLive=d.tickers.filter(t=>t.chg&&t.chg!==0).length;
        /* data.json nomme la variation `change_pct`, l'en-tête lit `chg` :
           sans cette traduction la variation s'affiche « —% » dès que l'appel
           direct à la Bourse de Casablanca échoue, ce qui est le cas courant
           depuis un navigateur (CORS). */
        /* ⚠️ Le MASI 20 voyage DANS l'objet `masi` — ajouté le 25/09. Un état
           et une prop de plus à travers tout l'arbre pour deux chiffres
           affichés au même endroit ne se justifieraient pas. */
        if(d.masi) setMasi(m=>({...(m||{}),...d.masi,
                                chg:d.masi.change_pct!=null?d.masi.change_pct:(m&&m.chg),
                                masi20:d.masi20||(m&&m.masi20)||null,
                                }));
        const upd=d.updated?new Date(d.updated):null;
        const timeStr=upd?upd.toLocaleString("fr-FR",{timeZone:"Africa/Casablanca",hour:"2-digit",minute:"2-digit",second:"2-digit"}):"";
        const dateStr=upd?upd.toLocaleString("fr-FR",{timeZone:"Africa/Casablanca",day:"2-digit",month:"2-digit",year:"numeric"}):"";
        setTs(dateStr&&timeStr?`${dateStr} ${timeStr}`:"");
        if(manuel){
          const neuf=dernierUpd.current!==null&&d.updated!==dernierUpd.current;
          annonce(neuf?`✓ mis à jour · ${timeStr}`
                     :`déjà à jour · données de ${timeStr}`, neuf);
        }
        dernierUpd.current=d.updated;
        pipelineLoaded=true;
      }
    }catch{}

    const mktNow=getMarketStatus();

    // Étape 2 : overlay live — SEULEMENT pendant la session ouverte
    // Hors session (CLÔTURE/FERMÉ) : data.json est la source officielle, pas d'appels CORS
    if(mktNow.isOpen){
      try{
        const liveMap=await fetchQuotes();
        if(liveMap&&Object.keys(liveMap).length>0){
          mergeLive(liveMap);
          const nIdb=Object.keys(liveMap).length;
          const srcs=Object.values(liveMap).map(v=>v.src).filter(Boolean);
          const mainSrc=srcs[0]||"live";
          setTs(new Date().toLocaleString("fr-FR",{timeZone:"Africa/Casablanca",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"}));
          setSrc(`${mainSrc} · ${nIdb} live ●`);
          setFetchErr(false);
          setLoading(false);return;
        }
      }catch{}
    }

    if(pipelineLoaded){
      const ageMin=nLive>0?0:Infinity;
      const label=mktNow.label==="CLÔTURE"?`Clôture · ${nLive} titres`
                 :mktNow.isOpen?`Pipeline · ${nLive} live`
                 :`Pipeline · ${nLive} titres`;
      setSrc(label);
      setFetchErr(false);
      setLoading(false);return;
    }
    // Dernier recours : aucune donnée disponible
    setFetchErr(true);
    setSrc("⚠ données statiques");
    setLoading(false);
  },[mergeLive,annonce]);

  // Chargement initial + auto-refresh toutes les 60s pendant la séance, 5 min hors séance
  useEffect(()=>{
    loadData();
    const getInterval=()=>{const s=getMarketStatus();return s.isOpen?60000:300000;};
    let iv=setInterval(()=>loadData(),getInterval());
    // Recalcule l'intervalle toutes les 10 min (transition ouverture/fermeture)
    const adjuster=setInterval(()=>{clearInterval(iv);iv=setInterval(()=>loadData(),getInterval());},600000);
    return()=>{clearInterval(iv);clearInterval(adjuster);};
  },[loadData]);

  /* ── PILE DE NAVIGATION ────────────────────────────────────────────────
     « Je veux aussi un bouton de retour en arrière » (Noure, 16/09). Le
     terminal n'a qu'une page : le bouton du navigateur ne revient pas à la vue
     précédente, il QUITTE le terminal. On tient donc notre propre pile.

     Une vue, ici, c'est un couple (onglet, titre sélectionné) — passer de
     CLASSEMENT à la fiche de Sothema, puis de Sothema à Cosumar, fait deux pas
     en arrière distincts.

     ⚠️ Les doublons sont écartés à l'empilement. Ouvrir une fiche depuis le
     classement appelle `setSel` PUIS `setTab` : sans cette garde, un seul geste
     empilerait deux fois la même vue et il faudrait deux retours pour un
     aller. */
  const pile=useRef([]);
  const [peutRevenir,setPeutRevenir]=useState(false);
  const empiler=(t,sl)=>{
    /* ⚠️ Premier jet fautif : la garde comparait la vue empilée à la vue
       courante — or on empile TOUJOURS la vue courante, donc elle sortait à
       chaque fois et la pile restait vide. Le bouton naissait grisé et le
       restait. Seul le doublon avec le SOMMET de la pile doit être écarté. */
    const haut=pile.current[pile.current.length-1];
    if(haut&&haut.tab===t&&haut.sel===sl)return;
    pile.current.push({tab:t,sel:sl});
    if(pile.current.length>60)pile.current.shift();
    setPeutRevenir(true);
  };
  const changeTab=(t)=>{if(t!==tab)empiler(tab,sel);setTab(t);localStorage.setItem("bvc_tab",t);};
  const choisirTitre=(sl)=>{if(sl!==sel)empiler(tab,sel);setSel(sl);};
  const revenir=()=>{
    const v=pile.current.pop();
    if(!v)return;
    setPeutRevenir(pile.current.length>0);
    setTab(v.tab);localStorage.setItem("bvc_tab",v.tab);
    setSel(v.sel);
  };

  return(
    <div style={{minHeight:"100vh"}}>
      <Intro/>
      <TickerTape rows={rows}/>
      <Header univers={rows.length} tab={tab} setTab={changeTab} peutRevenir={peutRevenir} onRetour={revenir} ts={ts} src={src} onRefresh={()=>loadData(true)} loading={loading} fetchErr={fetchErr} mktStatus={mktStatus} favCount={fav.length} scoreMode={scoreMode} setScoreMode={setScoreMode} masi={masi} majMsg={majMsg}/>
      <div style={{padding:14,maxWidth:1600,margin:"0 auto"}}>
        {tab==="accueil"  &&<Accueil rows={rows} fav={fav} ouvrir={sym=>{choisirTitre(sym);changeTab("detail");}} setTab={changeTab}/>}
        {tab==="ranking"  &&<Ranking rows={rows} sort={sort} setSort={setSort} setSel={choisirTitre} setTab={changeTab} fav={fav} toggleFav={toggleFav} scoreMode={scoreMode}/>}
        {tab==="heatmap"  &&<Heatmap rows={rows} setSel={sym=>{choisirTitre(sym);changeTab("detail");}} setTab={changeTab}/>}
        {tab==="watchlist"&&<Ranking rows={rows.filter(r=>fav.includes(r.symbol||r.ticker))} sort={sort} setSort={setSort} setSel={sym=>{choisirTitre(sym);changeTab("detail");}} setTab={changeTab} fav={fav} toggleFav={toggleFav} isWatchlist={true} scoreMode={scoreMode}/>}
        {tab==="detail"   &&<Detail rows={rows} sel={sel} setSel={choisirTitre} fav={fav} toggleFav={toggleFav} scoreMode={scoreMode}/>}
        {tab==="weights"  &&<Weights/>}
        {tab==="guide"    &&<Guide setTab={changeTab}/>}
        {tab==="briefing" &&<Briefing/>}
        {tab==="monde" &&<MarchesMondiaux/>}
        {tab==="smart"    &&<Smart/>}
        {tab==="nlp"      &&<NlpDash/>}
        {tab==="news"     &&<NewsFeed/>}
        <MentionLegale/>
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  render(){
    if(this.state.err){
      const msg=this.state.err?.message||String(this.state.err);
      return(
        <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#080d1a",flexDirection:"column",gap:16,padding:24}}>
          <div style={{color:"#ff4f5a",fontSize:18,fontWeight:700,fontFamily:"'IBM Plex Mono',monospace"}}>⚠ Erreur de rendu</div>
          <div style={{color:"#8892a4",fontSize:12,fontFamily:"'IBM Plex Mono',monospace",maxWidth:600,textAlign:"center",wordBreak:"break-word"}}>{msg}</div>
          <button onClick={()=>window.location.reload()} style={{background:"rgba(77,184,255,.12)",border:"1px solid rgba(77,184,255,.35)",color:"#4db8ff",borderRadius:4,padding:"8px 20px",fontSize:13,cursor:"pointer",fontFamily:"'IBM Plex Mono',monospace"}}>↻ Recharger la page</button>
        </div>
      );
    }
    return this.props.children;
  }
}

const root=document.getElementById("root");
if(root){
  ReactDOM.createRoot(root).render(<ErrorBoundary><App/></ErrorBoundary>);
}else{
  document.body.innerHTML='<div style="color:#ff4f5a;padding:40px;font-family:monospace">Erreur: élément #root introuvable</div>';
}
</script>

<!-- ── Mesure d'audience — facultative, sans cookie ─────────────────────────
     Isolée du moteur par construction :
       · exécutée après le rendu React, hors du bundle applicatif
       · chargement asynchrone (ne bloque jamais l'affichage)
       · try/catch : une panne du fournisseur ne peut pas casser le terminal
       · totalement inerte tant qu'aucun identifiant n'est renseigné ci-dessous
     Aucun cookie, aucun localStorage, aucune donnée personnelle conservée par
     le terminal — choix délibéré au regard de la CNDP.

     Pour activer, renseigner UN SEUL des deux identifiants :
       · GoatCounter : compte gratuit sur goatcounter.com → coller le code choisi
       · Cloudflare  : Web Analytics → coller le token du site
-->
<script>
(function () {
  var GOATCOUNTER = "";   // ex. "bvc-analyzer"  (donne bvc-analyzer.goatcounter.com)
  var CF_TOKEN    = "";   // ex. "a1b2c3d4e5f6..."
  try {
    var s;
    if (GOATCOUNTER) {
      s = document.createElement("script");
      s.async = true;
      s.src = "https://gc.zgo.at/count.js";
      s.setAttribute("data-goatcounter",
                     "https://" + GOATCOUNTER + ".goatcounter.com/count");
      document.body.appendChild(s);
    } else if (CF_TOKEN) {
      s = document.createElement("script");
      s.defer = true;
      s.src = "https://static.cloudflareinsights.com/beacon.min.js";
      s.setAttribute("data-cf-beacon", JSON.stringify({ token: CF_TOKEN }));
      document.body.appendChild(s);
    }
  } catch (e) {
    /* La mesure d'audience ne doit jamais empêcher le terminal de fonctionner. */
  }
})();
</script>
