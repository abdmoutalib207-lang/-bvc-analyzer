        <span style={{color:"#8892a4"}}>~hist</span> = moins de 15 séances cotées : RSI et moyennes absents, jamais estimés &nbsp;|&nbsp;
        <span style={{color:"#ff4f5a"}}>⚠️</span> RSI rouge = prudence &nbsp;|&nbsp; PE = Price/Earnings · DIV = dividende &nbsp;|&nbsp; Clic → vue détaillée
      </div>
    </div>
  );
};

// ── BRIEFING — la lecture de la séance close ─────────────────────────────────
//
// ⚠️ CE COMPOSANT NE COLLECTE RIEN, ET NE LE PEUT PAS. Le terminal est servi
// par GitHub Pages : aucun serveur, aucune étape de build. Il lit
// `briefing.json`, écrit par `pipeline/briefing.py` pendant le run du soir.
// C'est la même limite qui a rendu les proxys CORS inutilisables le 25/08.
//
// ⚠️ LE BRIEFING CONSTATE, IL N'EXPLIQUE PAS. Aucune cause n'y figure : les
// constats portent leur nombre, les actualités portent leur source et leur
// lien. « Cosumar publie un résultat en baisse » est un fait sur une
// publication ; « le marché a baissé à cause de Cosumar » n'en est pas un.
// ── La lecture détaillée de la séance (30/09/2026) ──────────────────────────
// ⚠️ Tout ce qui s'affiche ici vient de `briefing*.json`, écrit par
// `pipeline/briefing.py` à partir de `pipeline/seance_marche.json` (CDG,
// TradingView), `marche_history.json` et `depots_ammc.json`. Le composant ne
// calcule rien : il range. Aucune probabilité, aucun scénario, aucun avis.
const nfr=(x,d=2)=>x==null||!isFinite(x)?"—":(+x).toLocaleString("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d}).replace(/\u202f|\u00a0/g," ");
const jm=iso=>iso?`${iso.slice(8,10)}/${iso.slice(5,7)}`:"—";
// ⚠️ 07/10/2026 — « je veux pouvoir cliquer sur la source pour vérifier ».
// Chaque cotation des marchés mondiaux renvoie à la page du contrat chez la
// source : le ticker « COMEX:GC1! » devient /symbols/COMEX-GC1!/. Le
// différé est celui que la source DÉCLARE (« delayed_streaming_600 » →
// 10 min), pas une estimation.
const lienSource=t=>t&&t.includes(":")?`https://www.tradingview.com/symbols/${t.replace(":","-")}/`:null;
const differeDeclare=m=>{const x=/^delayed\w*?_(\d+)$/.exec(m||"");return x?`différé ${Math.round(+x[1]/60)} min`:m==="streaming"?"sans différé déclaré":null;};
const SourceCotation=({l})=>{
  const u=lienSource(l.ticker), d=differeDeclare(l.mode_source), h=l.horodatage_utc;
  return <span style={{fontSize:10.5,color:"#5a6478"}}>
    {h&&<>obs. {h.slice(8,10)}/{h.slice(5,7)} {h.slice(11,16)} UTC</>}{d&&<> · {d}</>}
    {u&&<> · <a href={u} target="_blank" rel="noopener noreferrer" style={{color:"#4db8ff",textDecoration:"none"}}
      title={`Vérifier ${l.nom||l.ticker} chez la source`}>Source ↗</a></>}
  </span>;
};
// ── TABLEAU DE BORD DE LA SÉANCE — 13/10/2026 ───────────────────────────────
// Demande d'Abd Moutalib : le détail de la séance « dans le style d'un tableau
// de bord Power BI », sans Power BI ni aucune dépendance nouvelle — React,
// CSS et des <div>. Cartes de chiffres en tête, visuels reliés par un FILTRE
// CROISÉ (un secteur ou une tranche de variation filtre les visuels par titre).
//
// ⚠️ D'OÙ VIENT CHAQUE CHIFFRE. Les cartes et la fourchette du MASI lisent le
// briefing (`b.veille`, `b.trajectoire`), donc la synthèse CDG. Les visuels PAR
// TITRE lisent `data.json` — le briefing ne publie pas la liste complète — et
// ne s'affichent que si les deux décrivent le MÊME relevé : cours datés de la
// séance ET somme des montants par titre égale au volume CDG (à 0,5 % près).
// Mesuré le 13/10 à 11h56 : 56 titres, 113 895 434,97 DH des deux côtés.
// Sinon (lecture de mi-journée relue le soir, archive), ils sont retirés et
// déclarés dans « Ce que cette lecture ne dit pas ». Jamais de mélange de deux
// moments sous une seule date.
//
// ⚠️ CE QUE LE COMPOSANT CALCULE, ET RIEN D'AUTRE : des comptes, des sommes de
// montants publiés, et la MÉDIANE des variations des titres d'un secteur —
// chacune nommée comme telle à l'écran. Aucune note, aucun palier, aucun avis.
const VARC=x=>x==null||!isFinite(x)?"#8892a4":x>0?"#00e5a0":x<0?"#ff4f5a":"#8892a4";
const sgp=(x,d=2)=>x==null||!isFinite(x)?"—":`${x>0?"+":""}${nfr(x,d)} %`;
const mediane=a=>{const s=[...a].sort((x,y)=>x-y),n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):null;};
const entier=x=>x==null||!isFinite(x)?"—":Math.round(x).toLocaleString("fr-FR").replace(/\u202f|\u00a0|,/g," ");
const jma=iso=>iso?`${iso.slice(8,10)}/${iso.slice(5,7)}/${iso.slice(0,4)}`:"—";

// Les titres du relevé : cours daté de la séance, non suspendu, variation
// publiée — retenus ensemble seulement si leurs montants recoupent le volume.
const titresDuReleve=(b,rows)=>{
  const j=b&&b.veille&&b.veille.jour;
  if(!b||!b.seance||!j||!j.volume_mad||!rows)return {ok:false,l:[]};
  const l=rows.filter(r=>{const m=meta(r);return m.asof===b.seance&&!m.susp&&r.chg!=null&&isFinite(r.chg);});
  const somme=l.reduce((s,r)=>s+(r.echange_dh||0),0);
  const ecart=Math.abs(somme-j.volume_mad)/j.volume_mad;
  return {ok:l.length>0&&ecart<=0.005,l,somme,ecart};
};
// Le nombre de titres échangés n'est publié que dans `data.json` (bloc masi) :
// affiché seulement s'il porte la même séance ET le même nombre de transactions.
const titresEchanges=(b,masi)=>{
  const j=b&&b.veille&&b.veille.jour;
  return j&&masi&&masi.titres_echanges!=null&&masi.asof===b.seance&&masi.transactions!=null
    &&masi.transactions===j.transactions?masi.titres_echanges:null;
};

// Tranches de variation : bornes à 1 point, l'inchangé à part. Ouvertes vers
// zéro pour que « 0,00 % » ne tombe jamais dans une tranche de hausse.
const TRANCHES=[
  {id:"p4",lab:"+4 % et plus",t:x=>x>=4},
  {id:"p3",lab:"+3 à +4 %",t:x=>x>=3&&x<4},{id:"p2",lab:"+2 à +3 %",t:x=>x>=2&&x<3},
  {id:"p1",lab:"+1 à +2 %",t:x=>x>=1&&x<2},{id:"p0",lab:"0 à +1 %",t:x=>x>0&&x<1},
  {id:"z",lab:"inchangé",t:x=>x===0},
  {id:"m0",lab:"0 à −1 %",t:x=>x<0&&x>-1},{id:"m1",lab:"−1 à −2 %",t:x=>x<=-1&&x>-2},
  {id:"m2",lab:"−2 à −3 %",t:x=>x<=-2&&x>-3},{id:"m3",lab:"−3 à −4 %",t:x=>x<=-3&&x>-4},
  {id:"m4",lab:"−4 % et moins",t:x=>x<=-4}];
const couleurTranche=id=>id==="z"?"#8892a4":id[0]==="p"?"#00e5a0":"#ff4f5a";

// Teinte d'une tuile : opacité plafonnée à .42 pour que le texte clair garde un
// contraste ≥ 4,5:1 sur la teinte la plus vive (mesuré : ~5:1).
const teinteTuile=m=>{if(m==null)return "rgba(136,146,164,.16)";
  const a=(.12+.30*Math.min(Math.abs(m)/4,1)).toFixed(3);
  return m>0?`rgba(0,229,160,${a})`:m<0?`rgba(255,79,90,${a})`:"rgba(136,146,164,.20)";};

// Treemap « squarified » (Bruls, Huizing, van Wijk 2000) : rangées gardant les
// tuiles les plus carrées possible. Entrée triée par valeur décroissante.
const squarify=(items,X,Y,W,H)=>{
  const tot=items.reduce((s,i)=>s+i.v,0);if(!tot||W<=0||H<=0)return [];
  const k=W*H/tot;let rest=items.map(i=>({...i,a:i.v*k})),x=X,y=Y,w=W,h=H;const out=[];
  const pire=(row,len)=>{const s=row.reduce((t,i)=>t+i.a,0),mx=Math.max(...row.map(i=>i.a)),mn=Math.min(...row.map(i=>i.a));
    return Math.max(len*len*mx/(s*s),(s*s)/(len*len*mn));};
  while(rest.length){
    const len=Math.min(w,h);let row=[rest[0]],i=1;
    while(i<rest.length&&pire([...row,rest[i]],len)<=pire(row,len)){row.push(rest[i]);i++;}
    const s=row.reduce((t,r)=>t+r.a,0);
    if(w>=h){const cw=s/h;let cy=y;row.forEach(r=>{const rh=r.a/cw;out.push({...r,x,y:cy,w:cw,h:rh});cy+=rh;});x+=cw;w-=cw;}
    else{const rh=s/w;let cx=x;row.forEach(r=>{const cw=r.a/rh;out.push({...r,x:cx,y,w:cw,h:rh});cx+=cw;});y+=rh;h-=rh;}
    rest=rest.slice(i);
  }
  return out;
};
const useLargeur=()=>{
  const ref=useRef(null);const [w,setW]=useState(0);
  useEffect(()=>{const el=ref.current;if(!el||typeof ResizeObserver==="undefined")return;
    const ro=new ResizeObserver(([e])=>setW(Math.floor(e.contentRect.width)));ro.observe(el);return()=>ro.disconnect();},[]);
  return [ref,w];
};

// Repères de la séance du MASI sur une échelle. Ce n'est PAS la courbe : le
// briefing ne publie que les repères, pas la série point par point.
const FourchetteMasi=({t,enSeance})=>{
  const pts=[t.veille,t.ouverture,t.plus_haut,t.plus_bas,t.cloture].filter(x=>x!=null&&isFinite(x));
  if(pts.length<2)return null;
  const lo=Math.min(...pts),hi=Math.max(...pts),m=(hi-lo)*.08||1,a=lo-m,z=hi+m;
  const p=x=>`${((x-a)/(z-a)*100).toFixed(2)}%`;
  const cc=VARC(t.cloture!=null&&t.veille!=null?t.cloture-t.veille:null);
  const reperes=[["Veille",t.veille,null,"tiret"],["1re valeur calculée",t.ouverture,t.heure_ouverture,"rond"],
    ["Plus haut",t.plus_haut,t.heure_plus_haut,null],["Plus bas",t.plus_bas,t.heure_plus_bas,null],[enSeance?"Dernière valeur":"Clôture",t.cloture,null,"losange"]];
  const Marque=({k,c})=>k==="tiret"?<span style={{display:"inline-block",width:0,height:12,borderLeft:"2px dashed #c8d3e8"}}/>
    :k==="rond"?<span style={{display:"inline-block",width:9,height:9,borderRadius:"50%",border:"2px solid #4db8ff",background:"#0d1829"}}/>
    :k==="losange"?<span style={{display:"inline-block",width:9,height:9,background:c,transform:"rotate(45deg)"}}/>:null;
  return <div>
    <div role="img" aria-label={`MASI : plus bas ${nfr(t.plus_bas)}, plus haut ${nfr(t.plus_haut)}, veille ${nfr(t.veille)}, ${enSeance?"dernière valeur":"clôture"} ${nfr(t.cloture)}`}
      style={{position:"relative",height:34,margin:"6px 6px 4px"}}>
      <div style={{position:"absolute",left:0,right:0,top:16,height:2,background:"#1a2540"}}/>
      {t.plus_bas!=null&&t.plus_haut!=null&&<div style={{position:"absolute",left:p(t.plus_bas),width:`calc(${p(t.plus_haut)} - ${p(t.plus_bas)})`,top:11,height:12,background:`${cc}33`,border:`1px solid ${cc}88`,borderRadius:3}}/>}
      {t.veille!=null&&<div style={{position:"absolute",left:p(t.veille),top:3,height:28,borderLeft:"2px dashed #c8d3e8"}}/>}
      {t.ouverture!=null&&<div style={{position:"absolute",left:p(t.ouverture),top:12,width:10,height:10,marginLeft:-5,borderRadius:"50%",border:"2px solid #4db8ff",background:"#0d1829"}}/>}
      {t.cloture!=null&&<div style={{position:"absolute",left:p(t.cloture),top:12,width:10,height:10,marginLeft:-5,background:cc,transform:"rotate(45deg)"}}/>}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(118px,1fr))",gap:"8px 12px",marginTop:8}}>
      {reperes.map(([l,x,h,k])=>(
        <div key={l}>
          <div style={{fontSize:10,color:"#8892a4",display:"flex",alignItems:"center",gap:6}}><Marque k={k} c={cc}/>{l}</div>
          <div className="tdb-num" style={{fontSize:14,color:"#e6edf7",fontWeight:600}}>{nfr(x)}</div>
          <div style={{fontSize:10,color:"#8892a4"}}>{h?`à ${h}`:l==="Plus haut"||l==="Plus bas"?"heure hors de la série":"\u00a0"}</div>
        </div>))}
    </div>
  </div>;
};

// ⚠️ PRÉSENTATION EN TABLEAU DE BORD — 21/10/2026, demande d'Abd Moutalib :
// « Tous les constats » et « Niveaux mesurés » étaient des phrases longues.
// Même contenu, autre forme : AUCUN CHIFFRE NE DISPARAÎT. Les dates restent
// écrites (en petit — une infobulle ne s'ouvre pas au doigt), la phrase
// d'origine reste en infobulle et dans le texte intégral replié.
// Barre bas ↔ haut : fourchette de la fenêtre (gris), séance (bleu),
// clôture (trait blanc). Ni rouge ni vert : une position n'est pas un sens.
const NivBarre=({lib,bas,haut,dbas,dhaut,sb,sh,c,lc="clôture"})=>{
  const ok=x=>x!=null&&isFinite(x);
  const xs=[bas,haut,sb,sh,c].filter(ok);
  if(xs.length<2)return <span style={{color:"#8892a4",fontSize:11}}>—</span>;
  const lo=Math.min(...xs),hi=Math.max(...xs),m=(hi-lo)*.04||1,a=lo-m,z=hi+m;
  const p=x=>`${((x-a)/(z-a)*100).toFixed(2)}%`;
  const info=[ok(bas)&&`${lib} : plus bas ${nfr(bas)}${dbas?` le ${jm(dbas)}`:""}`,ok(haut)&&`plus haut ${nfr(haut)}${dhaut?` le ${jm(dhaut)}`:""}`,
    ok(sb)&&ok(sh)&&`séance ${nfr(sb)} – ${nfr(sh)}`,ok(c)&&`${lc} ${nfr(c)}`].filter(Boolean).join(" · ");
  return <div className="niv-barre" title={info} style={{minWidth:0}}>
    <div role="img" aria-label={info} style={{position:"relative",height:12,background:"#0a1220",borderRadius:3,margin:"2px 1px 0"}}>
      {ok(bas)&&ok(haut)&&<span style={{position:"absolute",left:p(bas),width:`calc(${p(haut)} - ${p(bas)})`,top:3,height:6,background:"#2a3550",borderRadius:3}}/>}
      {ok(sb)&&ok(sh)&&<span style={{position:"absolute",left:p(sb),width:`max(3px, calc(${p(sh)} - ${p(sb)}))`,top:1,height:10,background:"rgba(77,184,255,.6)",borderRadius:2}}/>}
      {ok(c)&&<span style={{position:"absolute",left:p(c),top:-2,height:16,width:2,marginLeft:-1,background:"#e6edf7",borderRadius:1}}/>}
    </div>
    <div className="tdb-num" style={{display:"flex",justifyContent:"space-between",gap:"0 8px",fontSize:10.5,color:"#c8d3e8",marginTop:3,flexWrap:"wrap",whiteSpace:"normal"}}>
      <span>{nfr(bas)}{dbas&&<span style={{color:"#8892a4"}}> {jm(dbas)}</span>}</span>
      {ok(sb)&&ok(sh)&&<span className="niv-seance" style={{color:"#4db8ff"}}>séance {nfr(sb)} – {nfr(sh)}</span>}
      <span className="niv-haut">{nfr(haut)}{dhaut&&<span style={{color:"#8892a4"}}> {jm(dhaut)}</span>}</span>
    </div>
  </div>;
};

      {ph.conc&&<CarteConstat l="Concentration" phrase={ph.conc} val={`${(k.part_top5*100).toFixed(0)} %`}
        sous={<>aux 5 titres les plus échangés, sur {M(k.total_dh)} et {k.n_titres_actifs} valeurs actives</>}
        enfant={<div aria-hidden="true" style={{height:5,borderRadius:3,background:"#0d1829",marginTop:4}}><div style={{width:`${Math.min(100,k.part_top5*100)}%`,height:"100%",background:"#4db8ff",opacity:.65,borderRadius:3}}/></div>}/>}
      {ph.vol&&<CarteConstat l={`Activité inhabituelle · ${codeDe(vol.symbol)}`} phrase={ph.vol} val={`${nfr(vol.facteur,1)}×`}
        sous={<>{entier(vol.volume)} titres échangés contre une médiane de {entier(vol.median20)} sur vingt séances</>}/>}
      {ph.ytd&&<CarteConstat l="Depuis le 1er janvier" phrase={ph.ytd} val={sgp(s.ytd_pct)} cv={VARC(s.ytd_pct)} sous="variation de l'indice"/>}
    </div>
    {ph.nivtitres&&<div style={{fontSize:11,color:"#8892a4"}} title={ph.nivtitres}>Titres les plus échangés — extrêmes des {nv.n_seances||20} dernières séances : en barres dans « Niveaux mesurés » ci-dessus ; la phrase complète est dans le texte intégral.</div>}
  </div>;
  return {pris,rendu};
};

// ⚠️ LES ABSENCES — un visuel qui n'a pas de donnée ne s'affiche pas, et il
// est DIT ici. Lu par le bloc « Ce que cette lecture ne dit pas ».
const absencesTableau=(b,rows,masi)=>{
  if(!b)return [];
  const a=["la capitalisation boursière globale du marché — aucune de nos sources ne la publie pour la séance"];
  const t=b.trajectoire;
  if(!t)a.push("la trajectoire du MASI — non relevée pour cette séance");
  else a.push(`la courbe intrajournalière du MASI — le briefing n'en publie que les repères (${t.n_points??"?"} points relevés), pas la série`);
  if(!(b.veille&&b.veille.jour))a.push("les chiffres du marché entier (volume, largeur, transactions) — synthèse de séance absente de cette lecture");
  else if(titresEchanges(b,masi)==null)a.push("le nombre de titres échangés — publié seulement avec le relevé courant de data.json, qui n'est pas celui de cette lecture");
  if(!titresDuReleve(b,rows).ok)a.push("les secteurs, la répartition des variations et les plus fortes hausses, baisses et montants par titre — les cours par titre publiés (data.json) ne sont pas ceux de ce relevé");
  if(!(b.secteurs||[]).length)a.push("les indices sectoriels — non servis pour cette séance");
  if(!(b.matieres||[]).length)a.push("les matières premières — non relevées");
  if(!(b.depots&&(b.depots.titres||[]).length))a.push("des dépôts de résultats à l'AMMC rattachés à une action cotée — aucun relevé ce jour-là");
  return a;
};

// ⚠️ 13/10/2026 : le moteur ne publie plus le nom de la société de bourse
// (pipeline/briefing.py, SOURCE_SEANCE). Les lectures déjà publiées — le
// jour même et les archives de briefings/ — le portent encore : on traduit
// à l'affichage ces formules EXACTES, sans réécrire les archives.
const FORMULES_COURTIER=[
  ["CDG Capital Bourse — INDICE-SYNTHESE et INDICE-O-GRAPH-INTRA (MASI)","Synthèse de séance d'une société de bourse agréée — indices et série intrajournalière du MASI"],
  ["CDG Capital Bourse — INDICE-SYNTHESE, via pipeline/marche_history.json","Synthèse de séance d'une société de bourse agréée"],
  [" servis par CDG)"," servis)"],["(servis par CDG)","(synthèse de séance)"],
  ["la synthèse CDG","la synthèse de séance"],["synthèse CDG","synthèse de séance"],
  ["intrajournalière de CDG ","intrajournalière "],["non relevés auprès de CDG pour cette","non relevés pour cette"]];
const sansNomCourtier=o=>typeof o==="string"?FORMULES_COURTIER.reduce((t,[a,b])=>t.split(a).join(b),o)
  :Array.isArray(o)?o.map(sansNomCourtier)
  :o&&typeof o==="object"?Object.fromEntries(Object.entries(o).map(([k,v])=>[k,sansNomCourtier(v)])):o;

const SeanceDetail=({b,rows,masi,ouvrir})=>{
  const t=b.trajectoire, v=b.veille, j=v&&v.jour, vv=v&&v.veille, sect=b.secteurs||[], mp=b.matieres||[];
  const nv=b.niveaux||{}, nt=nv.titres||[], nm=nv.masi, dep=b.depots;
  const [filtre,setFiltre]=useState(null);
  const basculer=f=>setFiltre(x=>x&&x.type===f.type&&x.v===f.v?null:f);
  useEffect(()=>{if(!filtre)return;
    const k=e=>{if(e.key==="Escape")setFiltre(null);};
    window.addEventListener("keydown",k);return()=>window.removeEventListener("keydown",k);},[filtre]);
  const rel=useMemo(()=>titresDuReleve(b,rows),[b,rows]);
  const tous=rel.ok?rel.l:[];
  const tranche=filtre&&filtre.type==="tranche"?TRANCHES.find(x=>x.id===filtre.v):null;
  const choisis=tous.filter(r=>!filtre||(filtre.type==="secteur"?r.sector===filtre.v:tranche.t(r.chg)));
  const secteurs=useMemo(()=>{
    const g={};tous.forEach(r=>{const k=r.sector||"Non classé";(g[k]=g[k]||[]).push(r);});
    return Object.entries(g).map(([nom,l])=>({nom,n:l.length,v:l.reduce((s,r)=>s+(r.echange_dh||0),0),
      med:mediane(l.map(r=>r.chg)),h:l.filter(r=>r.chg>0).length,bs:l.filter(r=>r.chg<0).length}))
      .sort((x,y)=>y.v-x.v);},[tous]);
  // Sous un filtre de tranche, les secteurs se recalculent sur les titres de la
  // tranche (filtrage) ; sous un filtre de secteur, ils restent entiers et le
  // secteur choisi est mis en évidence (sélection).
  const secteursVus=useMemo(()=>{
    if(!tranche)return secteurs;
    const g={};choisis.forEach(r=>{const k=r.sector||"Non classé";(g[k]=g[k]||[]).push(r);});
    return Object.entries(g).map(([nom,l])=>({nom,n:l.length,v:l.reduce((s,r)=>s+(r.echange_dh||0),0),
      med:mediane(l.map(r=>r.chg)),h:l.filter(r=>r.chg>0).length,bs:l.filter(r=>r.chg<0).length})).sort((x,y)=>y.v-x.v);
  },[tranche,choisis,secteurs]);
  const totalVu=secteursVus.reduce((s,x)=>s+x.v,0)||1;
  const sourceReleve=rel.ok?`data.json — ${tous.length} titres cotés le ${jm(b.seance)} ; somme de leurs montants ${montantCourt(rel.somme)}, égale au volume de la synthèse de séance (écart ${nfr(rel.ecart*100,2)} %)`:null;
  // La lecture peut être écrite le lendemain (clôture du 12/10 écrite le 13 à
  // 00:28) : la date d'écriture est donc complète, jamais l'heure seule.
  const ecrite=b.ecrit_a?`écrite le ${jm(b.ecrit_a.slice(0,10))} à ${b.ecrit_a.slice(11)}`:null;
  const dateLecture=`${jma(b.seance)}${ecrite?` · ${ecrite}`:""}`;
  // 13/10/2026 : le nom de la société de bourse n'est plus affiché (demande
  // d'Abd Moutalib) ; la provenance exacte reste dans pipeline/seance_marche.json.
  const srcCdg=`Synthèse de séance · ${jm(b.seance)}`;
  const te=titresEchanges(b,masi);
  const larg=j&&(j.hausses!=null||j.baisses!=null)?j:null;
  const nLarg=larg?(larg.hausses||0)+(larg.baisses||0)+(larg.inchanges||0):0;
  const top=(f,k)=>[...choisis].filter(f).sort(k).slice(0,5);
  const TOPS=[["Plus fortes hausses",top(r=>r.chg>0,(x,y)=>y.chg-x.chg)],
              ["Plus fortes baisses",top(r=>r.chg<0,(x,y)=>x.chg-y.chg)],
              ["Plus gros montants",top(r=>(r.echange_dh||0)>0,(x,y)=>y.echange_dh-x.echange_dh)]];
  const histo=TRANCHES.map(x=>({...x,n:tous.filter(r=>x.t(r.chg)).length,
    nf:filtre&&filtre.type==="secteur"?tous.filter(r=>r.sector===filtre.v&&x.t(r.chg)).length:null}));
  const hMax=Math.max(1,...histo.map(x=>x.n));
  const ntVus=filtre&&rel.ok?nt.filter(x=>choisis.some(r=>r.symbol===x.symbol)):nt;
  const sMax=Math.max(.01,...sect.map(x=>Math.abs(x.variation_pct||0)));
  const sectNuls=sect.length>0&&sect.every(x=>!x.variation_pct);
  const cel={padding:"5px 8px 5px 0",fontSize:12,color:"#c8d3e8",whiteSpace:"nowrap"};
  const tete={...cel,fontSize:10,color:"#8892a4",textTransform:"uppercase",letterSpacing:.6,fontWeight:400,textAlign:"left"};
  const ligneTitre=(r,mesure)=>(
    <button key={r.symbol} className="tdb-ligne" onClick={()=>ouvrir&&ouvrir(r.symbol)}
      title={`${r.name||r.symbol} — ouvrir la fiche`} style={{gridTemplateColumns:"minmax(0,1fr) auto"}}>
      <span style={{minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontSize:12}}>
        <b style={{color:"#4db8ff"}}>{codeDe(r.symbol)}</b> <span style={{color:"#8892a4",fontSize:10.5}}>{r.name}</span>
        {meta(r).reprise_recente&&<span title="Reprise de cotation récente : la référence a été fixée par l'autorité de marché, cette variation ne se compare pas aux autres." style={{color:"#ffd740",marginLeft:5,fontSize:10}}>⚠ reprise</span>}
      </span>
      <span className="tdb-num" style={{fontSize:12,textAlign:"right"}}>
        {mesure==="montant"?<>{montantCourt(r.echange_dh)} <span style={{color:VARC(r.chg),fontSize:11}}>{sgp(r.chg)}</span></>
          :<><span style={{color:VARC(r.chg)}}>{sgp(r.chg)}</span> <span style={{color:"#8892a4",fontSize:10.5}}>{r.echange_dh!=null?montantCourt(r.echange_dh):"—"}</span></>}
      </span>
    </button>);

  return <div data-zone="detail-seance" style={{display:"flex",flexDirection:"column",gap:12}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap"}}>
      <div>
        <div style={{fontSize:12,color:"#e6edf7",letterSpacing:1,textTransform:"uppercase",fontWeight:600}}>Tableau de bord de la séance du {jma(b.seance)}</div>
        <div style={{fontSize:10.5,color:"#8892a4"}}>Chaque visuel porte sa source et sa date. Les cartes décrivent le marché entier, jamais filtrées.</div>
      </div>
      {filtre?<button className="tdb-puce" onClick={()=>setFiltre(null)} aria-label={`Retirer le filtre ${filtre.lab}`}>
          filtre actif : <b>{filtre.lab}</b> <span aria-hidden="true">✕</span></button>
        :rel.ok&&<span style={{fontSize:10.5,color:"#8892a4"}}>Un secteur ou une tranche filtre les visuels par titre.</span>}
    </div>
    {filtre&&<button className="tdb-puce tdb-puce-flottante" onClick={()=>setFiltre(null)} aria-label={`Retirer le filtre ${filtre.lab}`}>
      <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>filtre : <b>{filtre.lab}</b></span> <span aria-hidden="true">✕</span></button>}

    {j&&<div className="tdb-kpi">
      <Kpi l="MASI" val={nfr(j.cours)} cv="#e6edf7" src={srcCdg}
        sous={<><span style={{color:VARC(j.variation_pct),fontWeight:600}}>{sgp(j.variation_pct)}</span>
          {vv&&vv.cours!=null&&<span style={{color:"#8892a4"}}> · veille {nfr(vv.cours)}</span>}</>}/>
      <Kpi l="Volume global" val={montantEntier(j.volume_mad)} src={srcCdg}
        sous={v.ecart_volume_pct!=null?<><span style={{color:"#c8d3e8"}}>{sgp(v.ecart_volume_pct,1)}</span><span style={{color:"#8892a4"}}> vs {jm(v.seance_veille)}{vv&&vv.volume_mad!=null?` (${montantEntier(vv.volume_mad)})`:""}</span></>:null}/>
      {te!=null&&<Kpi l="Titres échangés" val={entier(te)} src={`data.json · séance du ${jm(b.seance)}, même relevé (${entier(j.transactions)} transactions)`}
        sous={<span style={{color:"#8892a4"}}>nombre d'actions, toutes valeurs</span>}/>}
      {j.transactions!=null&&<Kpi l="Transactions" val={entier(j.transactions)} src={srcCdg}
        sous={vv&&vv.transactions!=null?<span style={{color:"#8892a4"}}>{entier(vv.transactions)} le {jm(v.seance_veille)}</span>:null}/>}
      {larg&&<Kpi l="Largeur" src={srcCdg}
        val={<><span style={{color:"#00e5a0"}}>{larg.hausses??"—"}</span><span style={{color:"#8892a4",fontSize:14}}> / </span><span style={{color:"#ff4f5a"}}>{larg.baisses??"—"}</span><span style={{color:"#8892a4",fontSize:14}}> / {larg.inchanges??"—"}</span></>}
        sous={<span style={{color:"#8892a4"}}>hausses / baisses / inchangées{larg.valeurs_traitees?` sur ${larg.valeurs_traitees}`:""}</span>}
        enfant={nLarg>0&&<div aria-hidden="true" style={{display:"flex",height:5,borderRadius:3,overflow:"hidden",marginTop:3,background:"#0a1220"}}>
          <span style={{width:`${(larg.hausses||0)/nLarg*100}%`,background:"#00e5a0"}}/>
          <span style={{width:`${(larg.inchanges||0)/nLarg*100}%`,background:"#5a6478"}}/>
          <span style={{width:`${(larg.baisses||0)/nLarg*100}%`,background:"#ff4f5a"}}/></div>}/>}
      {b.ytd_pct!=null&&<Kpi l="Depuis janvier" val={sgp(b.ytd_pct)} cv={VARC(b.ytd_pct)} src={`Briefing · séance du ${jm(b.seance)}`}
        sous={<span style={{color:"#8892a4"}}>variation de l'indice</span>}/>}
    </div>}

    <div className="tdb">
      {rel.ok&&secteurs.length>0&&<Panneau cls="c8" titre={tranche?`Secteurs — titres « ${tranche.lab} »`:"Secteurs — montants échangés"}
          source={`${sourceReleve}. Secteurs du référentiel des titres.`}>
        {secteursVus.length?<VueSecteurs secteurs={secteursVus} total={totalVu} filtre={filtre} basculer={basculer}/>
          :<div style={{fontSize:12,color:"#8892a4"}}>Aucun titre dans cette tranche.</div>}
      </Panneau>}

      {/* ⚠️ « 1re valeur » et non « ouverture » : le champ CoursOuverture de
          CDG vaut la veille ; la valeur montrée est le premier point de la
          série après 09:30 (mesuré le 30/09). Si la série s'arrête avant la
          clôture, le panneau le dit. */}
      {t&&<Panneau cls="c4" titre="Séance du MASI — repères"
          source={`${t.source} · ${jma(t.seance||b.seance)} · ${t.n_points} points de la série intrajournalière${t.serie_rejoint_cloture===false?` · série arrêtée à ${t.serie_jusqu_a} ; clôture et extrêmes tirés de la synthèse`:""}. Repères seulement, pas la courbe.`}>
        <FourchetteMasi t={t} enSeance={!!b.moment&&b.moment!=="cloture"}/>
      </Panneau>}

      {rel.ok&&<Panneau cls="c6" titre={`Titres de la séance${filtre?` — ${filtre.lab}`:""}`} source={`${sourceReleve}. Toucher un titre ouvre sa fiche.`}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(min(210px,100%),1fr))",gap:"10px 14px"}}>
          {TOPS.map(([l,liste],i)=>(
            <div key={l} style={{minWidth:0}}>
              <div style={{fontSize:10,color:"#8892a4",letterSpacing:.6,textTransform:"uppercase",margin:"0 0 3px 6px"}}>{l}</div>
              {liste.length?liste.map(r=>ligneTitre(r,i===2?"montant":"variation"))
                :<div style={{fontSize:11.5,color:"#8892a4",padding:"4px 6px"}}>aucun titre</div>}
            </div>))}
        </div>
      </Panneau>}

      {rel.ok&&<Panneau cls="c6" titre="Répartition des variations" source={`${sourceReleve}. Une barre = nombre de titres dans la tranche.`}>
        <div style={{display:"flex",flexDirection:"column",gap:1}}>
          {histo.map(x=>{const on=filtre&&filtre.type==="tranche"&&filtre.v===x.id, c=couleurTranche(x.id);
            return <button key={x.id} className="tdb-ligne" aria-pressed={!!on} disabled={!x.n}
              aria-label={`${x.lab} : ${x.n} titre${x.n>1?"s":""}${x.nf!=null?`, dont ${x.nf} du secteur ${filtre.v}`:""}`}
              onClick={()=>basculer({type:"tranche",v:x.id,lab:`variation ${x.lab}`})}
              style={{gridTemplateColumns:"92px minmax(0,1fr) 54px",minHeight:26,cursor:x.n?"pointer":"default",
                opacity:filtre&&filtre.type==="tranche"&&!on?.45:1}}>
              <span style={{fontSize:11,color:"#c8d3e8",whiteSpace:"nowrap"}}>{x.lab}</span>
              <span style={{position:"relative",height:12,background:"#0a1220",borderRadius:2}}>
                <span style={{position:"absolute",left:0,top:0,bottom:0,width:`${x.n/hMax*100}%`,background:c,opacity:x.nf!=null?.25:.85,borderRadius:2}}/>
                {x.nf!=null&&<span style={{position:"absolute",left:0,top:0,bottom:0,width:`${x.nf/hMax*100}%`,background:c,borderRadius:2}}/>}
              </span>
              <span className="tdb-num" style={{fontSize:11.5,textAlign:"right",color:x.n?"#e6edf7":"#5a6478"}}>
                {x.nf!=null?<>{x.nf}<span style={{color:"#8892a4"}}>/{x.n}</span></>:x.n}</span>
            </button>;})}
        </div>
        {filtre&&filtre.type==="secteur"&&<div style={{fontSize:10.5,color:"#8892a4",marginTop:6}}>Barre pleine : titres « {filtre.v} » ; barre pâle : tous les titres.</div>}
      </Panneau>}

      {/* Sans les visuels par titre, le panneau prend la place laissée à côté
          des repères du MASI (8 colonnes sur 12) plutôt que de laisser un trou. */}
      {sect.length>0&&<Panneau cls={rel.ok?"c6":"c8"} titre="Indices sectoriels"
          source={`Synthèse de séance — identité et date vérifiées pour chaque indice · ${dateLecture}. Classification propre aux indices (${sect.length} indices), distincte de celle des titres : non reliée au filtre.`}>
        {/* ⚠️ Tous à 0,00 % : 23 barres vides ne montreraient rien. Le fait
            est dit, la liste reste accessible repliée. */}
        {sectNuls&&<div style={{fontSize:11.5,color:"#ffd740",marginBottom:6}}>Les {sect.length} indices sont publiés à 0,00 % pour ce relevé (cours égal à la veille dans la source).</div>}
        {sectNuls?<details><summary style={{fontSize:11,color:"#4db8ff",cursor:"pointer",padding:"4px 0"}}>Voir les {sect.length} indices</summary>
          <div style={{fontSize:11,color:"#c8d3e8",lineHeight:1.7,marginTop:4}}>{sect.map(x=>x.libelle).join(" · ")}</div></details>
        :<div style={{display:"flex",flexDirection:"column"}}>
          {[...sect].sort((x,y)=>(y.variation_pct||0)-(x.variation_pct||0)).map(x=>{const vp=x.variation_pct||0,w=Math.abs(vp)/sMax*50;
            return <div key={x.code} style={{display:"grid",gridTemplateColumns:"minmax(0,1.3fr) minmax(70px,1fr) 64px",gap:8,alignItems:"center",padding:"2px 0",borderBottom:"1px solid #0a1220"}}>
              <span title={x.libelle} style={{fontSize:11,color:"#c8d3e8",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{x.libelle}</span>
              <span aria-hidden="true" style={{position:"relative",height:10}}>
                <span style={{position:"absolute",left:"50%",top:-2,bottom:-2,borderLeft:"1px solid #2a3550"}}/>
                <span style={{position:"absolute",top:1,bottom:1,background:VARC(vp),opacity:.85,borderRadius:2,
                  left:vp<0?`${50-w}%`:"50%",width:`${w}%`}}/>
              </span>
              <span className="tdb-num" style={{fontSize:11.5,color:VARC(x.variation_pct),textAlign:"right"}}>{sgp(x.variation_pct)}</span>
            </div>;})}
        </div>}
      </Panneau>}

      {(nm||nt.length>0)&&<Panneau cls="c6" titre={`Niveaux mesurés — ${nv.n_seances||20} dernières séances${filtre&&rel.ok?` — ${filtre.lab}`:""}`}
          source="Plus hauts et plus bas réellement atteints. Ce ne sont ni des supports ni des objectifs : des faits datés.">
        {/* 21/10/2026 : phrases et tableau remplacés par des barres (demande
            d'Abd Moutalib, « façon Power BI »). Mêmes chiffres, dates écrites. */}
        {(ntVus.length>0||(nm&&nm.clotures))&&<LegendeNiv n={nv.n_seances||20}/>}
        {nm&&nm.clotures&&<div className="niv-liste" style={{marginBottom:4}}>
          <div className="niv-ligne">
            <b className="niv-code" style={{color:"#e6edf7",fontSize:12}}>MASI</b>
            <div className="niv-vol" style={{fontSize:10.5,color:"#8892a4",lineHeight:1.4}}>clôtures du {jm(nm.clotures.du)} au {jm(nm.clotures.au)}
              {nm.clotures.n_seances&&nm.clotures.n<nm.clotures.n_seances&&<span style={{color:"#ff8f00"}}> · {nm.clotures.n} clôtures de l'indice enregistrées sur {nm.clotures.n_seances} séances</span>}</div>
            <div className="niv-fourchette">
              <NivBarre lib="clôtures" bas={nm.clotures.plus_basse} dbas={nm.clotures.date_plus_basse} haut={nm.clotures.plus_haute} dhaut={nm.clotures.date_plus_haute}
                sb={nm.seance_bas} sh={nm.seance_haut} c={t&&t.cloture!=null?t.cloture:j&&j.cours} lc={b.moment&&b.moment!=="cloture"?"dernière valeur":"clôture"}/></div>
          </div></div>}
        {ntVus.length>0?<NiveauxTitres l={ntVus} n={nv.n_seances||20}/>
        :nt.length>0&&<div style={{fontSize:11.5,color:"#8892a4"}}>Aucun des {nt.length} titres les plus échangés ne relève du filtre.</div>}
      </Panneau>}

      {mp.length>0&&<Panneau cls="c6" titre="Matières premières" source="TradingView — contrat à terme le plus proche. Heure de la valeur déclarée par la source, en UTC.">
        {mp.map(x=>(
          <div key={x.ticker} style={{display:"flex",justifyContent:"space-between",gap:10,fontSize:12.5,padding:"4px 0",borderBottom:"1px solid #0a1220",flexWrap:"wrap"}}>
            <span style={{color:"#c8d3e8"}}>{x.nom} <span style={{color:"#8892a4",fontSize:10.5}}>{x.ticker}</span></span>
            <span className="tdb-num" style={{color:"#c8d3e8"}}>{nfr(x.valeur)} {x.devise}
              {x.variation_pct!=null&&<span style={{color:VARC(x.variation_pct),marginLeft:8}}>{sgp(x.variation_pct)}</span>}
            </span>
            <span style={{flexBasis:"100%",textAlign:"right"}}><SourceCotation l={x}/></span>
          </div>))}
      </Panneau>}

      {dep&&(dep.titres||[]).length>0&&<Panneau cls="c6" titre={`Dépôts de résultats à l'AMMC — ${jm(dep.seance)}`}
          source="Liste des communiqués des émetteurs (AMMC). La liste ne donne pas l'heure : publié ce jour-là, pas forcément avant la clôture.">
        {dep.titres.map((x,i)=>(
          <a key={i} href={x.url} target="_blank" rel="noopener noreferrer"
            style={{display:"block",padding:"6px 0 6px 10px",borderLeft:"2px solid #4db8ff",marginBottom:4,textDecoration:"none"}}>
            <span style={{color:"#4db8ff",fontWeight:600,fontSize:12,marginRight:8}}>{x.ticker}</span>
            <span style={{color:"#c8d3e8",fontSize:12.5}}>{x.titre}</span>
          </a>))}
        {(dep.autres_emetteurs||[]).length>0&&<div style={{fontSize:10.5,color:"#8892a4",marginTop:6}}>
          Autres émetteurs le même jour, sans action cotée rattachée : {dep.autres_emetteurs.map(x=>x.emetteur).join(", ")}.</div>}
      </Panneau>}
    </div>
  </div>;
};

// ⚠️ « À SURVEILLER AUJOURD'HUI » — 30/09/2026. En tête du briefing, une
// ligne par titre : les critères qu'il remplit, le chiffre, le lien. Aucune
// note : le lecteur voit POURQUOI le titre est là (pipeline/briefing.py::
// a_surveiller). Absent des lectures antérieures au 30/09 : rien n'est affiché.
// ⚠️ LA LECTURE RÉDIGÉE — 01/10/2026. Écrite par la routine Claude (sans
// API) ou, à défaut, générée sans modèle à partir des faits. Dans les deux
// cas, chaque nombre a passé le contrôle `pipeline/redaction.py` : il existe
// dans les faits du briefing. L'auteur est toujours affiché.
const gras=t=>t.split(/(\*\*[^*]+\*\*)/g).map((x,i)=>x.startsWith("**")&&x.endsWith("**")
  ?<strong key={i} style={{color:"#e6edf7"}}>{x.slice(2,-2)}</strong>:x);
// ⚠️ SQUELETTE — 01/10/2026. Montre la forme du bloc attendu pendant le
// chargement. Le texte reste lisible par les lecteurs d'écran (aria-label).
const Squelette=({blocs=[3],titre="Chargement"})=>(
  <div aria-busy="true" aria-label={titre} style={{display:"flex",flexDirection:"column",gap:14}}>
    {blocs.map((n,i)=>(
      <div key={i} className="sq" style={{padding:16}}>
        <div className="sq-l" style={{width:"28%",height:8}}/>
        {Array.from({length:n}).map((_,j)=><div key={j} className="sq-l" style={{width:`${92-((j*17)%35)}%`}}/>)}
      </div>))}
  </div>);

const Lecture=({r})=>{
  if(!r||!r.texte)return null;
  const blocs=r.texte.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  return(
    <div className="carte" style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:16}}>
      <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,textTransform:"uppercase",marginBottom:2}}>Lecture de la séance</div>
      <div style={{fontSize:11,color:"#5a6478",marginBottom:10}}>
        {r.auteur==="claude"
          ?"Rédigée par Claude à partir des faits publiés ci-dessous — chaque chiffre a été contrôlé."
          :"Générée automatiquement à partir des faits publiés ci-dessous."}
      </div>
      {blocs.map((b,i)=>{
        if(b.startsWith("#"))return <div key={i} style={{fontSize:12,color:"#4db8ff",letterSpacing:.6,margin:"10px 0 4px",textTransform:"uppercase"}}>{b.replace(/^#+\s*/,"")}</div>;
        if(/^[-•] /m.test(b))return <ul key={i} style={{margin:"0 0 8px",paddingLeft:18,fontSize:13.5,lineHeight:1.65,color:"#c8d3e8"}}>
          {b.split(/\n/).map((l,j)=><li key={j}>{gras(l.replace(/^[-•]\s*/,""))}</li>)}</ul>;
        return <p key={i} style={{margin:"0 0 10px",fontSize:13.5,lineHeight:1.7,color:"#c8d3e8"}}>{gras(b)}</p>;})}
    </div>);
};

// ⚠️ LES CHIFFRES-CLÉS — 02/10/2026. Abd Moutalib : « trop de répétition,
// trop de chiffres en texte ». Mesuré sur la clôture du 01/10 : 128 nombres
// en 386 mots de constats, la clôture du MASI écrite quatre fois. Chaque
// chiffre de la séance s'affiche désormais UNE fois, ici ; le texte ne garde
// que la lecture. Le volume est celui de la synthèse CDG (`veille.jour`),
// recoupé au bulletin du 01/10 (152,47 M DH), pas la somme de nos lignes.
const ChiffresCles=({b})=>{
  const t=b.trajectoire, v=b.veille&&b.veille.jour, vv=b.veille;
  if(!t&&!v)return null;
  const VCc=x=>x>0?"#00e5a0":x<0?"#ff4f5a":"#8892a4";
  const sg=x=>x==null?"—":`${x>0?"+":""}${nfr(x)} %`;
  const items=[
    ["MASI",nfr(t?t.cloture:v.cours),v&&v.variation_pct!=null?sg(v.variation_pct):null,v&&VCc(v.variation_pct)],
    ["Échangé",v&&v.volume_mad!=null?montantEntier(v.volume_mad):"—",
      vv&&vv.ecart_volume_pct!=null?`${sg(vv.ecart_volume_pct)} vs veille`:null,"#8892a4"],
    ["Hausses · baisses",v?`${v.hausses??"—"} · ${v.baisses??"—"}`:"—",
      v&&v.valeurs_traitees?`${v.inchanges??0} inchangées sur ${v.valeurs_traitees}`:null,"#8892a4"],
    ["Plus haut · bas",t?nfr(t.plus_haut):"—",t?`plus bas ${nfr(t.plus_bas)}`:null,"#8892a4"],
    ["Depuis janvier",sg(b.ytd_pct),null,null,VCc(b.ytd_pct)]];
  return(
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(min(140px,45%),1fr))",gap:10}}>
      {items.map(([l,val,sous,cs,cv])=>(
        <div key={l} className="carte" style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:"10px 12px"}}>
          <div style={{fontSize:10,color:"#8892a4",letterSpacing:.8,textTransform:"uppercase"}}>{l}</div>
          <div style={{fontSize:18,fontWeight:700,fontFamily:"monospace",color:cv||"#e6edf7",margin:"3px 0 1px",whiteSpace:"nowrap"}}>{val}</div>
          {sous&&<div style={{fontSize:11,color:cs||"#8892a4"}}>{sous}</div>}
        </div>))}
    </div>);
};

const ASurveiller=({a})=>{
  if(!a)return null;
  const groupes=[["A PUBLIÉ",a.a_publie||[]],["A BOUGÉ",a.a_bouge||[]]].filter(([,l])=>l.length);
  if(!groupes.length)return null;
  return(
    <div style={{background:"#0d1829",border:"1px solid rgba(0,229,160,.35)",borderRadius:8,padding:16}}>
      <div style={{fontSize:10,color:"#00e5a0",letterSpacing:1,textTransform:"uppercase",marginBottom:2}}>Critères remplis aujourd'hui</div>
      <div style={{fontSize:11,color:"#5a6478",marginBottom:10}}>
        Chaque titre remplit au moins un critère mesuré ; classés par nombre de critères, puis par montant échangé.
        {a.n_candidats>(a.a_publie||[]).length+(a.a_bouge||[]).length&&<> {a.n_candidats} titres en remplissaient un.</>}
      </div>
      {groupes.map(([titre,l])=>(
        <div key={titre} style={{marginBottom:8}}>
          <div style={{fontSize:10,color:"#8892a4",letterSpacing:.8,margin:"6px 0 4px"}}>{titre}</div>
          {/* ⚠️ En tableau depuis le 02/10 : le chiffre dans sa colonne, le
              critère en étiquette courte. Le volume relatif n'est plus répété
              dans le texte du critère. */}
          <div style={{overflowX:"auto"}}><table style={{borderCollapse:"collapse",width:"100%"}}>
            <thead><tr>{["Titre","Variation","Volume","Pourquoi"].map(x=>
              <th key={x} style={{textAlign:"left",fontSize:10,color:"#5a6478",fontWeight:400,letterSpacing:.6,textTransform:"uppercase",padding:"3px 8px 3px 0"}}>{x}</th>)}</tr></thead>
            <tbody>{l.map(z=>(
              <tr key={z.symbol} style={{borderTop:"1px solid #0a1220"}}>
                <td style={{padding:"6px 8px 6px 0",color:"#e6edf7",fontWeight:600,whiteSpace:"nowrap"}}>{codeDe(z.symbol)}</td>
                <td style={{padding:"6px 8px 6px 0",fontFamily:"monospace",whiteSpace:"nowrap",color:z.chg==null?"#5a6478":z.chg>0?"#00e5a0":z.chg<0?"#ff4f5a":"#8892a4"}}>
                  {z.chg==null?"non coté":`${z.chg>0?"+":""}${fmt(z.chg).replace(".",",")} %`}</td>
                <td style={{padding:"6px 8px 6px 0",fontFamily:"monospace",whiteSpace:"nowrap",color:z.volume_rapport>=3?"#ffd740":"#8892a4"}}
                  title="Titres échangés rapportés à la médiane des 20 dernières séances">
                  {z.volume_rapport!=null?`×${nfr(z.volume_rapport,1)}`:"—"}</td>
                <td style={{padding:"6px 0",display:"flex",gap:4,flexWrap:"wrap"}}>
                  {z.criteres.filter(c=>c.code!=="volume").map((c,i)=>{
                    const st={fontSize:11,padding:"1px 7px",borderRadius:10,background:"#0a1220",border:"1px solid #1a2540",color:"#c8d3e8",textDecoration:"none",whiteSpace:"nowrap"};
                    return c.url?<a key={i} href={c.url} target="_blank" rel="noopener noreferrer" style={{...st,color:"#4db8ff"}}>{c.texte}</a>
                      :<span key={i} style={st}>{c.texte}</span>;})}
                  {z.criteres.every(c=>c.code==="volume")&&<span style={{fontSize:11,color:"#5a6478"}}>volume inhabituel</span>}
                </td>
              </tr>))}</tbody></table></div>
        </div>))}
    </div>);
};

const Briefing=({rows,masi,ouvrir})=>{
  const [b,setB]=useState(null);
  const [h,setH]=useState(null);
  // ⚠️ Mi-journée et clôture — ajoutés le 29/09/2026. Deux fichiers de plus,
  // parce que `briefing.json` est réécrit à chaque passage et ne garde la
  // trace d'aucun moment. Écrits par `pipeline/briefing.py::ecrire_moment`.
  const [mj,setMj]=useState(null);
  const [cl,setCl]=useState(null);
  // ⚠️ « jour » ou « semaine ». Deux fichiers distincts, parce qu'un bilan de
  // semaine ne remplace pas la lecture de la dernière séance : le premier dit
  // où en est le marché, le second ce qui vient de se passer.
  const [vue,setVue]=useState("jour");
  const [etat,setEtat]=useState("chargement");
  // ⚠️ L'ARCHIVE — 30/09/2026. Une séance passée se relit telle qu'elle a été
  // écrite : `briefings/<séance>.json` est figé après la séance. null = la
  // publication du jour (fichiers courants).
  const [seances,setSeances]=useState([]);
  const [choix,setChoix]=useState(null);
  const [arch,setArch]=useState(null);
  const [detail,setDetail]=useState(false);
  useEffect(()=>{
    const t=Math.floor(Date.now()/3600000);
    const sn=r=>r.ok?r.json().then(sansNomCourtier):null;
    Promise.all([
      fetch("briefing.json?t="+t).then(sn).catch(()=>null),
      fetch("briefing_hebdo.json?t="+t).then(sn).catch(()=>null),
      fetch("briefing_mijournee.json?t="+t).then(sn).catch(()=>null),
      fetch("briefing_cloture.json?t="+t).then(sn).catch(()=>null),
    ]).then(([j,s,m,c])=>{setB(j);setH(s);setMj(m);setCl(c);setEtat(j?"ok":"absent");});
    fetch("briefings/index.json?t="+t).then(r=>r.ok?r.json():null).catch(()=>null)
      .then(x=>setSeances((x&&x.seances)||[]));
  },[]);
  const choisir=d=>{
    if(!d){setChoix(null);setArch(null);setVue("jour");return;}
    setChoix(d);setArch(null);
    fetch(`briefings/${d}.json?t=${Math.floor(Date.now()/3600000)}`)
      .then(r=>r.ok?r.json().then(sansNomCourtier):null).catch(()=>null)
      .then(x=>{setArch(x||{});setVue(x&&x.cloture?"cloture":"mijournee");});
  };

  if(etat==="chargement")return <Squelette blocs={[4,3,5]} titre="Chargement du briefing"/>;
  // ⚠️ On DIT que le briefing manque plutôt que d'afficher un panneau vide.
  // Un écran vide se lit comme « rien à signaler », ce qui est faux.
  if(etat==="absent")return(
    <div className="carte" style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:20,color:"#8892a4"}}>
      Le briefing de la dernière séance n'a pas été publié. Il est écrit par le
      run du soir ; son absence signale que ce run n'a pas abouti.
    </div>);

  const passe=!!choix;
  const semaine=!passe&&vue==="semaine"&&h;
  const mjV=passe?(arch&&arch.mi_journee):mj, clV=passe?(arch&&arch.cloture):cl;
  const PAR_VUE={jour:b,mijournee:mjV,cloture:clV};
  const src=semaine?h:(PAR_VUE[vue]||(passe?(clV||mjV):b));
  if(passe&&!src)return(
    <div style={{color:"#8892a4",padding:20}}>
      {arch?"Aucune lecture archivée pour cette séance.":<Squelette blocs={[4,3]} titre="Chargement de l'archive"/>}
      <button onClick={()=>choisir(null)} style={{marginLeft:10,background:"none",border:"1px solid #1a2540",color:"#4db8ff",borderRadius:5,padding:"3px 10px",cursor:"pointer"}}>Revenir au jour</button>
    </div>);
  const a=src.actualites||{};
  const liens=[...(a.titres||[]),...(a.autres||[])];
  // ⚠️ Un onglet dont le fichier n'est pas encore publié reste visible mais
  // inactif, avec la raison — plutôt que de disparaître sans explication.
  const ONG=[
    {id:"jour",label:"DERNIÈRE LECTURE",dispo:!passe,pourquoi:"Lecture du jour seulement — revenez au jour pour la voir."},
    {id:"mijournee",label:"MI-JOURNÉE",dispo:!!mjV,pourquoi:passe?"Aucune lecture de mi-journée archivée pour cette séance.":"Écrite par le passage de 12h45, puis de 13h45 — pas encore publiée."},
    {id:"cloture",label:"CLÔTURE",dispo:!!clV,pourquoi:passe?"Aucune lecture de clôture archivée pour cette séance.":"Écrite par le passage de 15h45 — pas encore publiée."},
    {id:"semaine",label:"LA SEMAINE",dispo:!passe&&!!h,pourquoi:passe?"Bilan de la semaine en cours seulement.":"Le bilan de semaine n'a pas été publié par le dernier run."}];
  const LIB_MOMENT={mi_journee:"Lecture de mi-journée",cloture:"Lecture de clôture",en_seance:"Lecture en séance"};
  const nonDit=[...(src.non_mesurable||[]),...(semaine?[]:absencesTableau(src,rows,masi))];
  const cVis=semaine?null:constatsVisuels(src);
  const blocConstats=<div className="carte" style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:16}}>
        <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,textTransform:"uppercase",marginBottom:4}}>
          {semaine?"Bilan de la semaine":`Tous les constats mesurés — ${(LIB_MOMENT[src.moment]||"lecture de la séance").toLowerCase()}`}</div>
        <div style={{fontSize:13,color:"#4db8ff",marginBottom:12}}>
          {semaine
            ?`${h.semaine?.n||0} séance${(h.semaine?.n||0)>1?"s":""} cotée${(h.semaine?.n||0)>1?"s":""}${h.semaine?.seances?.length?` · ${h.semaine.seances[0]} → ${h.semaine.seances[h.semaine.seances.length-1]}`:""}`
            :<>{src.seance||"—"}{src.ecrit_a&&<span style={{color:"#5a6478",fontSize:11,marginLeft:8}}>· écrite le {src.ecrit_a.slice(8,10)}/{src.ecrit_a.slice(5,7)} à {src.ecrit_a.slice(11)}</span>}</>}</div>
        {cVis&&cVis.rendu}
        <ul style={{margin:0,paddingLeft:18,fontSize:13.5,lineHeight:1.65,color:"#c8d3e8"}}>
          {(src.constats||[]).map((c,i)=>cVis&&cVis.pris.has(i)?null:<li key={i} style={{marginBottom:6}}>{c}</li>)}
          {(src.constats||[]).length===0&&<li style={{color:"#8892a4"}}>Rien de mesurable à signaler.</li>}
        </ul>
        {/* Le texte intégral, dans l'ordre du moteur : rien n'est perdu à la
            mise en visuels (21/10/2026). */}
        {cVis&&<details style={{marginTop:10}}>
          <summary style={{fontSize:11,color:"#4db8ff",cursor:"pointer",minHeight:28,display:"flex",alignItems:"center"}}>Texte intégral des constats ({(src.constats||[]).length} phrases)</summary>
          <ul style={{margin:"4px 0 0",paddingLeft:18,fontSize:12,lineHeight:1.6,color:"#c8d3e8"}}>
            {(src.constats||[]).map((c,i)=><li key={i} style={{marginBottom:4}}>{c}</li>)}</ul>
        </details>}
        {/* ⚠️ Les absences du tableau de bord s'ajoutent à celles du
            moteur (13/10/2026) : un visuel retiré faute de donnée est DIT. */}
        {nonDit.length>0&&
          <div style={{marginTop:12,paddingTop:10,borderTop:"1px solid #1a2540"}}>
            <div style={{fontSize:11,color:"#c8d3e8",marginBottom:4}}>Ce que cette lecture ne dit pas :</div>
            <ul style={{margin:0,paddingLeft:18,fontSize:11.5,color:"#8892a4",lineHeight:1.6}}>
              {nonDit.map((x,i)=><li key={i}>{x}.</li>)}
            </ul>
          </div>}
      </div>;
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"flex",gap:4,flexWrap:"wrap",alignItems:"center"}}>
        {/* ⚠️ Le sélecteur n'apparaît que s'il y a une archive à relire. */}
        {seances.length>0&&
          <select value={choix||""} onChange={e=>choisir(e.target.value||null)}
            title="Relire la lecture d'une séance passée, telle qu'elle a été publiée"
            style={{background:"#0a1220",border:"1px solid #1a2540",color:passe?"#ffd740":"#8892a4",
              borderRadius:5,padding:"5px 8px",fontSize:11}}>
            <option value="">Aujourd'hui</option>
            {seances.map(d=><option key={d} value={d}>{d.slice(8,10)}/{d.slice(5,7)}/{d.slice(0,4)}</option>)}
          </select>}
        {ONG.map(o=>{
          const actif=vue===o.id, dispo=o.dispo;
          return <button key={o.id} onClick={()=>dispo&&setVue(o.id)}
            title={dispo?"":o.pourquoi}
            style={{background:actif?"rgba(0,229,160,.12)":"#0a1220",
              border:`1px solid ${actif?"rgba(0,229,160,.4)":"#1a2540"}`,
              color:!dispo?"#3a4358":actif?"#00e5a0":"#8892a4",
              borderRadius:5,padding:"5px 14px",fontSize:11,letterSpacing:.8,
              cursor:dispo?"pointer":"not-allowed"}}>{o.label}</button>;})}
      </div>

      {/* ⚠️ L'en-tête du terminal affiche déjà les chiffres de la dernière
          clôture : la bande ne s'affiche que là où ils diffèrent — séance
          relue dans l'archive, ou lecture de mi-journée. */}
      {!semaine&&(passe||vue==="mijournee")&&<ChiffresCles b={src}/>}
      {!semaine&&<Lecture r={src.redaction}/>}
      {!semaine&&<ASurveiller a={src.a_surveiller}/>}

      {/* ⚠️ Les constats répètent les chiffres-clés : sur une séance, ils
          passent dans le détail replié (02/10/2026). La semaine, sans
          chiffres-clés, les garde en vue. */}
      {semaine&&blocConstats}

      {/* ⚠️ LA LECTURE DÉTAILLÉE DE LA SÉANCE — ajoutée le 30/09/2026.
          Trajectoire, secteurs, matières premières, niveaux, dépôts : chaque
          bloc porte sa source et sa date, et n'apparaît que s'il a été
          mesuré. Un bloc absent est déclaré dans « Ce que cette lecture ne
          dit pas », jamais rempli par défaut. */}
      {/* Replié par défaut : la liste courte d'abord, le détail à la demande. */}
      {/* 13/10/2026 : « trop discret » (Abd Moutalib) — bouton gris sur gris,
          11 px, 26 px de haut. Passé à l'accent bleu, pleine largeur, 46 px :
          c'est l'entrée du tableau de bord, il doit se voir. */}
      {!semaine&&<button className="bouton-detail" onClick={()=>setDetail(!detail)} aria-expanded={detail}
        style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,width:"100%",minHeight:46,
          background:detail?"rgba(77,184,255,.08)":"linear-gradient(90deg,rgba(0,229,160,.14),rgba(77,184,255,.14))",
          border:"1px solid rgba(77,184,255,.55)",color:"#e6edf7",borderRadius:8,padding:"10px 16px",
          fontSize:13,fontWeight:700,letterSpacing:1,cursor:"pointer",fontFamily:"var(--font)",textAlign:"left"}}>
        <span>{detail?"MASQUER LE DÉTAIL DE LA SÉANCE":"VOIR LE DÉTAIL DE LA SÉANCE"}
          <span style={{display:"block",fontSize:10,fontWeight:400,letterSpacing:.3,color:"#8892a4",marginTop:3}}>
            {detail?"revenir à la lecture courte":"tableau de bord : MASI, secteurs, volumes, hausses et baisses"}</span></span>
        <span aria-hidden="true" style={{flex:"0 0 auto",width:28,height:28,borderRadius:"50%",display:"inline-flex",alignItems:"center",justifyContent:"center",
          background:"rgba(77,184,255,.18)",color:"#4db8ff",fontSize:14,transition:"transform .2s",transform:detail?"rotate(180deg)":"none"}}>▾</span></button>}
      {/* Tableau de bord d'abord, constats et absences ensuite (13/10/2026). */}

              <div style={{fontSize:10.5,color:"#5a6478",display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>

            {g.lignes.map(l=>(
              <div key={l.ticker} title={`${l.description_source} — ${heure(l.horodatage_utc)} — ${l.mode_source}`}
                style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:"2px 10px",padding:"8px 0",borderBottom:"1px solid #0a1220",flexWrap:"wrap"}}>

// ── RISQUE MESURÉ (1 an) — 14/10/2026 ────────────────────────────────────────
// Bloc `risque` de data.json (pipeline/risque.py). DESCRIPTIF, hors note :
// chaque valeur porte son effectif et sa période ; une valeur null s'affiche
// en gris avec sa raison, jamais remplacée par un chiffre supposé.
const RisqueMesure=({q})=>{
  if(!q) return null;
  const jj=d=>d?d.split("-").reverse().join("/"):"—";
  const per=m=>m&&m.du?`${jj(m.du)} → ${jj(m.au)}`:"";
  const lignes=[
    ["Volatilité annualisée",q.volatilite,m=>`${fmt(m.valeur,1)} %`,m=>`${m.n} rendements quotidiens`],
    ["Bêta contre le MASI",q.beta,m=>fmt(m.valeur,2),m=>`corrélation ${fmt(m.correlation,2)} · ${m.n} séances communes`],
    ["Perte maximale",q.perte_max,m=>m.valeur>0?`−${fmt(m.valeur,1)} %`:"aucune baisse",
      m=>m.sommet&&m.creux?`sommet ${fmt(m.sommet.c,2)} le ${jj(m.sommet.d)}, creux ${fmt(m.creux.c,2)} le ${jj(m.creux.d)} · ${m.n} clôtures`:`${m.n} clôtures`],
    ["VaR 95 % à 1 jour",q.var95,m=>`${fmt(m.valeur,2)} %`,m=>`CVaR ${fmt(m.cvar,2)} % · ${m.n} rendements, queue de ${m.n_queue}`],
    ["Quantité médiane par séance (6 mois)",q.liquidite,m=>`${Math.round(m.quantite_mediane).toLocaleString("fr-FR")} titres`,
      m=>`${m.sans_echange} séance${m.sans_echange>1?"s":""} sans échange sur ${m.seances}${m.dont_sans_bougie?` (dont ${m.dont_sans_bougie} sans bougie)`:""}`],
  ];
  // Un même motif sur les quatre mesures annuelles (reprise, titre peu
  // échangé) se dit une fois, pas quatre.
  const annuelles=[q.volatilite,q.beta,q.perte_max,q.var95];
  const motifAn=annuelles.every(m=>!m||m.valeur==null)&&q.volatilite&&q.volatilite.motif;
  const visibles=motifAn?lignes.slice(4):lignes;
  const rd=q.rendements;
  const ecartes=rd?[rd.exclus_volume_nul?`${rd.exclus_volume_nul} bougie${rd.exclus_volume_nul>1?"s":""} à volume nul`:null,
    rd.exclus_saut?`${rd.exclus_saut} saut${rd.exclus_saut>1?"s":""} de plus de 10 %`:null].filter(Boolean):[];
  return(
    <div className="carte risque-mesure" style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12,marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:10,gap:8,flexWrap:"wrap"}}>
        <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,textTransform:"uppercase"}}>Risque mesuré <span style={{color:"#4db8ff"}}>(1 an)</span></div>
        <div style={{fontSize:9,color:"#8892a4"}}>nos chandelles · dernière séance {jj(q.asof)}</div>
      </div>
      {q.motif&&q.motif.code==="suspendu"
        ?<div style={{fontSize:11,color:"#8892a4",lineHeight:1.5}}>{q.motif.texte}.</div>
        :<>{motifAn&&<div style={{fontSize:10,color:"#5a6478",lineHeight:1.5,marginBottom:7}}>
            Volatilité, bêta, perte maximale, VaR : <b>non calculés</b> — {motifAn}.</div>}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:7}}>
          {visibles.map(([k,m,val,detail])=>{const ok=m&&m.valeur!=null;
            return(
            <div key={k} style={{background:"#0a1220",borderRadius:4,padding:"6px 8px"}}>
              <div style={{fontSize:8,color:"#8892a4",marginBottom:2,textTransform:"uppercase"}}>{k}</div>
              <div style={{fontSize:13,color:ok?"#c8d3e8":"#5a6478",fontWeight:700}}>{ok?val(m):"—"}</div>
              <div style={{fontSize:9,color:ok?"#8892a4":"#5a6478",marginTop:1,lineHeight:1.4}}>
                {ok?<>{detail(m)}<br/>{per(m)}</>:(m&&m.motif)||"non calculé"}
              </div>
            </div>);})}
        </div></>}
      <div style={{fontSize:9,color:"#8892a4",marginTop:9,lineHeight:1.5}}>
        Ce que le titre a fait sur l'année écoulée — une description, pas une prévision, et hors de la note.
        {ecartes.length>0&&` Écartés des rendements : ${ecartes.join(" et ")}.`}
        {q.liquidite&&q.liquidite.motif_amihud&&<span title={q.liquidite.motif_amihud}>{" Montant échangé et ratio d'Amihud non calculés : nos chandelles ne portent que la quantité de titres."}</span>}
      </div>
    </div>);
};

// ── DETAIL ────────────────────────────────────────────────────────────────────
const Detail=({rows,sel,setSel,fav=[],toggleFav=()=>{},scoreMode})=>{
  const [detSearch,setDetSearch]=useState("");
  const r=rows.find(x=>(x.symbol||x.ticker)===sel)||rows[0];
  // ⚠️ La fiche doit suivre la pondération choisie, exactement comme le
  // classement. Sans cela elle affiche le v5.3 du moteur quelle que soit la
  // vue, et donne pour le même titre un score qui contredit le tableau.
  // Oublié le 08/09 ; signalé par Abd Moutalib : « le score ne bouge pas ».
  const simu=!!(scoreMode&&!scoreMode.officiel);
  // Teinte de la carte : couleur du palier de note, neutre en simulation ou
  // à confiance ≤ 1. Plus aucun mot d'action (07/10/2026).
  const cn=couleurNote(r);
  const s=simu||!cn||meta(r).conf<=1?NEUTRE:teinte(cn.c);
  const scoreAffiche=computeDisplayScore(r,scoreMode);
  const manqueAff=composantesManquantes(r,scoreMode);
  // La répartition qui a réellement produit `scoreAffiche`.
  // ⚠️ SCORE CANONIQUE — 29/09/2026. La fiche affichait ici un écart à la « note BVC »
  // à une note de référence qui n'était pas calculée : une table saisie le
  // 03/06, jamais rafraîchie, 21 titres sur 80 à 5,00 par défaut. Un seul
  // verdict est affiché désormais, avec la version de la formule qui l'a
  // produit.
  const pdsAff=poidsAffiches(r,scoreMode);
  const price=r.price||r.prix;
  const h90=r.h90||r.high90;const l90=r.l90||r.low90;
  /* Les objectifs sont nullifiés côté pipeline quand ils ne sont plus à
     l'échelle du cours (opération sur titres, cible périmée). Sans garde,
     `null - price` valait 0 et l'écart s'affichait -100%. */
  const objectifs=r.bear!=null&&r.base!=null&&r.bull!=null;
  const ecart=v=>v==null||!price?"—":`${((v-price)/price*100).toFixed(1)}%`;
  const upside=objectifs?((r.bull-price)/price*100).toFixed(1):null;
  const pos=objectifs&&r.bull!==r.bear
    ?Math.min(98,Math.max(2,(price-r.bear)/(r.bull-r.bear)*100)):50;
  const sym=r.symbol||r.ticker;
  const rsiVal=r.rsi??r.rsi14??null;

  /* Les pastilles du filtre suivaient l'ordre du CLASSEMENT — donc un ordre qui
     change à chaque run. On cherche un titre par son nom, pas par son rang :
     l'ordre alphabétique est le seul stable. `[...rows]` : `rows` est la liste
     du classement, la trier en place la réordonnerait aussi dans l'onglet
     CLASSEMENT. Le tri porte sur le code AFFICHÉ (`tk`), pas sur le symbole
     interne, sinon l'œil ne suit pas. */
  const visRows=(detSearch.trim()
    ? rows.filter(d=>{const q=detSearch.trim().toUpperCase();return (d.symbol||d.ticker||"").includes(q)||tk(d).includes(q)||(d.name||"").toUpperCase().includes(q);})
    : [...rows]).sort((a,b)=>tk(a).localeCompare(tk(b)));

  /* Téléphone (07/10/2026) : la fiche s'ouvrait là où était le classement,
     son haut hors de l'écran (y = −192 mesuré à 390 px). On l'amène en haut
     à l'ouverture et à chaque changement de titre. */
  const refFiche=useRef(null);
  /* La liste latérale (≥ 1200 px) se colle sous l'en-tête, dont la hauteur
     varie (bandeau, cartes d'indices) : on la mesure plutôt que de la
     supposer. En-tête non collé (paysage, téléphone) : 0. */
  useEffect(()=>{
    const e=document.querySelector(".entete");
    if(!e||!window.ResizeObserver)return;
    const f=()=>{try{const colle=getComputedStyle(e).position==="sticky";
      document.documentElement.style.setProperty("--h-entete",(colle?Math.max(0,Math.round(e.getBoundingClientRect().bottom)):0)+"px");}catch(x){}};
    const ro=new ResizeObserver(f);ro.observe(e);f();
    return ()=>ro.disconnect();
  },[]);
  useEffect(()=>{
    try{
      if(refFiche.current&&window.matchMedia&&window.matchMedia("(max-width:640px)").matches)
        refFiche.current.scrollIntoView({block:"start"});
    }catch(e){}
  },[sel]);

  return(
    <div ref={refFiche} className="fiche-gabarit">
      <div className="fiche-liste">
      <div className="selecteur-titres" style={{display:"flex",gap:8,marginBottom:8,alignItems:"center",flexWrap:"wrap"}}>
        <input value={detSearch} onChange={e=>setDetSearch(e.target.value)}
          placeholder="Filtrer ticker…"
          style={{background:"#0d1829",border:"1px solid #1a2540",color:"#c8d3e8",borderRadius:4,padding:"4px 8px",fontSize:11,fontFamily:"var(--font)",width:160,outline:"none"}}/>
        {detSearch&&<button onClick={()=>setDetSearch("")} style={{fontSize:10,color:"#8892a4",border:"none",background:"transparent"}}>✕</button>}
      </div>
      <div className="selecteur-titres" data-liste="titres" style={{display:"flex",gap:4,marginBottom:14,flexWrap:"wrap",maxHeight:96,overflowY:"auto",padding:"4px 0"}}>
        {visRows.map(d=>{const sym2=d.symbol||d.ticker;const cd=couleurNote(d);const ds=simu||!cd||meta(d).conf<=1?NEUTRE:teinte(cd.c);const a=sel===sym2;return(
          <button key={sym2} onClick={()=>setSel(sym2)} aria-pressed={a} style={{background:a?ds.bg:"transparent",border:a?`1px solid ${ds.bd}`:"1px solid #1a2540",color:a?ds.fg:"#8892a4",padding:"2px 7px",borderRadius:3,fontSize:10,fontWeight:a?700:400,transition:"all .15s"}}>{tk(d)}<span className="liste-nom">{d.name}</span>{d.chg!=null&&isFinite(d.chg)&&<span className="liste-var" style={{color:VC(d.chg)}}>{d.chg>0?"+":""}{(+d.chg).toFixed(2)}%</span>}</button>
        );})}
      </div>
      </div>
      <div className="fiche-corps">
      {r.warn&&<div style={{background:"rgba(255,215,64,.08)",border:"1px solid rgba(255,215,64,.3)",borderRadius:6,padding:"10px 14px",marginBottom:12,fontSize:13,color:"#ffd740"}}>⚠️ {r.warnMsg}</div>}

      <div className="detail-grid">
        {/* NOTE — la note et les chiffres clés ; panneau de droite au-delà de 1200 px */}
        <div className="fiche-note" style={{display:"flex",flexDirection:"column",gap:10}}>
          {/* Score card */}
          <div style={{background:`linear-gradient(135deg,${s.bg},#0d1829)`,border:`1px solid ${s.bd}`,borderRadius:8,padding:16,textAlign:"center"}}>
            <div style={{display:"flex",justifyContent:"center",marginBottom:10}}>
              <CompanyLogo sym={tk(r)} logo={r.symbol} sector={r.sector} size={56}/>
            </div>
            <div style={{fontSize:12,color:"#8892a4",letterSpacing:2,marginBottom:4,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              <span>{tk(r)} · {px(price)} DH<Perime r={r}/> <span style={{color:VC(r.chg),fontWeight:600}}>{varSeance(r)==null?"—":<>{r.chg>0?"▲":"▼"} {Math.abs(r.chg).toFixed(2)}%</>}{r.chg_alert&&<span title="Variation ≥ ±8% — approche limite BVC" style={{marginLeft:3}}>⚡</span>}</span></span>
              <button onClick={()=>toggleFav(sym)} title={fav.includes(sym)?"Retirer des favoris":"Ajouter aux favoris"}
                className="etoile" aria-pressed={fav.includes(sym)}
                style={{fontSize:18,color:fav.includes(sym)?"#ffd740":"#8892a4",border:"none",background:"none",cursor:"pointer",padding:"0 2px",lineHeight:1,transition:"color .2s"}}>
                {fav.includes(sym)?"★":"☆"}
              </button>
            </div>
            {/* Le score reste affiché même à faible confiance — mais en gris,
                pour qu'il ne se lise pas comme une conclusion (CLAUDE.md). */}
            <div style={{fontSize:52,fontWeight:700,
                 color:couleurChiffre(r,simu),
                 textShadow:meta(r).conf<=1||simu?"none":`0 0 30px ${s.fg}40`,
                 lineHeight:1}}>{fmt(scoreAffiche)}</div>
            <div style={{fontSize:11,color:"#8892a4",margin:"4px 0 6px"}}>
              Score composite / 10{simu&&<span style={{color:"#ffd740"}}> · {scoreModeLabel(scoreMode)}</span>}
            </div>
            <div className="heure-cours" style={{fontSize:10.5,color:"#8892a4",marginBottom:4}}>{heureCours(r)}</div>

            {!simu&&<PourquoiNote r={r}/>}
            <DetailConfiance r={r}/>
            {/* ⚠️ Une note absente doit DIRE ce qui manque. Un « — » muet se

            {manqueAff.length>0&&(

            )}
            <div style={{marginBottom:10}}><Confiance r={r} sz={13}/></div>
            {/* Une couleur calculée sur des données de repli induit en

                colorer une note que rien ne soutient (règle CLAUDE.md). */}
            {/* ⚠️ Même règle qu'au classement : le signal n'existe que pour

            {simu

              ? <Chip label={meta(r).statut_juridique?`${meta(r).statut_juridique.toUpperCase()} · suspendu depuis le ${jjmm(meta(r).suspDepuis)}`:`SUSPENDU depuis le ${jjmm(meta(r).suspDepuis)}`} bg="rgba(255,107,107,.12)" fg="#ff6b6b" bd="#ff6b6b40" sz={12}/>
              : meta(r).conf<=1
              ? (meta(r).reprise_recente
                 ? <Chip label={`REPRISE — ${meta(r).seances_depuis_reprise} séance(s)`} bg="rgba(255,215,64,.12)" fg="#ffd740" bd="#ffd74040" sz={12}/>
                 : <Chip label="Données insuffisantes" bg="rgba(136,146,164,.12)" fg="#8892a4" bd="#2a3550" sz={12}/>)
              : nonComparable(r)
              ? <Chip label="Non comparable — titre peu liquide" bg="rgba(136,146,164,.12)" fg="#8892a4" bd="#2a3550" sz={12}/>
              : couvPartielle(r)
              ? <Chip label="Couverture partielle — verdict global limité" bg="rgba(255,215,64,.10)" fg="#ffd740" bd="#ffd74040" sz={12}/>
              : <PastilleNote r={r} sz={12}/>}
            {/* Règle A (27/10/2026) : pourquoi cette note ne se compare pas. */}
            {!simu&&nonComparable(r)&&(nc=>
              <div className="bandeau-non-comparable" style={{marginTop:6,fontSize:10.5,color:"#8892a4",lineHeight:1.45,maxWidth:260}}>
                Note {texteNonComparable(nc)}, sous le seuil de {dhSeance(nc.seuil)} (20 dernières séances échangées).
                Avec si peu d'échanges, elle ne se compare pas à celle d'un titre liquide : aucune couleur de palier,
                rang après les titres comparables. Médiane sur les séances échangées uniquement ; le cadre
                « Échangé par séance » compte aussi les séances sans échange.</div>)(nonComparable(r))}
            {/* Le motif, pour que la suspension ne soit pas une énigme : une
                OPA n'est pas une sanction, et la nuance change tout pour le
                lecteur. */}
            {meta(r).susp&&meta(r).suspMotif&&!simu&&
              <div style={{marginTop:6,fontSize:10,color:"#8892a4"}}>{meta(r).suspMotif}</div>}
            {!simu&&r.score_version&&<div style={{marginTop:8,fontSize:10,color:"#5a6478"}}>formule {r.score_version}</div>}
          </div>

          {/* Fundamentaux */}
          <div className="carte" style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12}}>
            {/* ⚠️ LA LIQUIDITÉ, AFFICHÉE PARCE QU'ELLE PLAFONNE LA CONFIANCE.
                Ajouté le 25/09. Le moteur rabaisse la confiance à 2 sous
                100 000 DH échangés par séance — 27 titres sur 80 — sans que
                rien ne le dise à l'écran. Un plafond qu'on ne peut pas
                vérifier ne se discute pas.
                ⚠️ En DIRHAMS et non en titres : dix titres de CMT valent
                35 670 DH, dix d'Addoha en valent 370. */}
            {(()=>{const dh=meta(r).echange_median_dh;
              if(dh==null) return null;
              const bas=dh<100000;
              return <div style={{marginBottom:10,padding:"6px 8px",borderRadius:4,
                  background:bas?"rgba(255,143,0,.08)":"#0a1220",

                <div style={{fontSize:8,color:"#8892a4",textTransform:"uppercase",marginBottom:2}}>Échangé par séance (médiane 20 j)</div>
                <div style={{fontSize:13,fontWeight:700,color:bas?"#ff8f00":"#c8d3e8"}}>
                  {montantEntier(dh)}
                  {bas&&<span style={{fontSize:10,fontWeight:400,marginLeft:6}}>· confiance plafonnée — un ordre courant déplacerait le cours</span>}
                </div>
              </div>;})()}

            {/* ⚠️ LES NIVEAUX — ajouté le 25/09/2026, et le point n'est pas
                d'en afficher : c'est de DIRE LESQUELS SONT DES FAITS.
                Un briefing extérieur écrit « 620 = pivot ; 635-645 = pullback
                digéré » sans dire d'où viennent ces nombres — le lecteur ne
                peut ni les reproduire ni les contester.
                ⚠️ La borne réglementaire est le niveau le plus sûr de tous, et
                personne ne le publie comme tel : le cours de demain est borné
                PAR LA LOI (R10), pas par une opinion.
                ⚠️ Aucun n'entre dans le score (R8) et aucun ne dit quoi faire. */}
            {(()=>{const nv=r.niveaux; if(!nv) return null;
              const f=nv.faits||{}, cv=nv.conventions||{}, bs=f.bornes_seance;
              const L=(lbl,val,extra,coul)=>(
                <div key={lbl} style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",fontSize:11.5,padding:"2px 0"}}>
                  <span style={{color:"#8892a4"}}>{lbl}</span>
                  <span><span style={{color:coul||"#c8d3e8",fontFamily:"monospace",fontWeight:600}}>{val}</span>
                    {extra&&<span style={{color:"#5a6478",fontSize:10}}> {extra}</span>}</span>
                </div>);
              return <div style={{marginBottom:12}}>
                <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,marginBottom:8,textTransform:"uppercase"}}>Niveaux</div>

                  {Object.entries(f.moyennes||{}).filter(([k])=>!k.startsWith("_")).map(([k,v])=>
                    L(k.toUpperCase(),fr(v.niveau),`cours ${v.position} · ${v.distance_pct>0?"+":""}${fr(v.distance_pct,1)} %`))}
                  {Object.entries(f.extremes||{}).filter(([k])=>!k.startsWith("_")).map(([k,v])=>
                    L(k.replace(/_/g," "),fr(v.niveau),`${v.distance_pct>0?"+":""}${fr(v.distance_pct,1)} %`))}
                </div>

                {cv.pivots&&
                  <div style={{background:"#0a1220",border:"1px dashed #2a3550",borderRadius:4,padding:"8px 10px"}}>
                    <div style={{fontSize:8.5,color:"#ffd740",textTransform:"uppercase",letterSpacing:.6,marginBottom:2}}>
                      Conventionnels · arithmétique sur une séance</div>
                    <div style={{fontSize:9.5,color:"#5a6478",marginBottom:5}}>
                      Largement employés, mais ils ne mesurent rien par eux-mêmes.</div>
                    {L("R2 · R1",`${fr(cv.pivots.r2)} · ${fr(cv.pivots.r1)}`)}
                    {L("Pivot",fr(cv.pivots.pivot),`séance du ${cv.pivots._seance||"—"}`,"#ffd740")}
                    {L("S1 · S2",`${fr(cv.pivots.s1)} · ${fr(cv.pivots.s2)}`)}
                  </div>}
                {!cv.pivots&&
                  <div style={{fontSize:10,color:"#5a6478",fontStyle:"italic"}}>
                    Pivots non publiés : la dernière séance a une amplitude nulle —
                    le titre a coté à un prix unique, ou n'a pas coté.
                  </div>}
              </div>;})()}

            <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,marginBottom:10,textTransform:"uppercase"}}>Fondamentaux
              {/* ⚠️ LA FRAÎCHEUR DU BLOC QUI PÈSE LE PLUS — ajouté le 24/09/2026.
                  Le cours est daté depuis le 10/08 ; ces chiffres-là ne
                  l'étaient nulle part, alors qu'ils pèsent 47 à 52 % de la
                  note. Relevé au 24/09 : la date la plus RÉCENTE a 92 jours.
                  Un terminal qui affiche l'heure du jour en tête de page doit
                  dire, ici, que cette moitié-ci vient de juin. */}
              {(()=>{const m=meta(r),a=m.fond_age_jours;
                if(a==null) return <span title="Ce titre est absent de fondamentaux.json : ses ratios viennent de la table figée, qui ne porte aucune date." style={{color:"#ff8f00",fontSize:9,marginLeft:8,textTransform:"none",letterSpacing:0}}>· date inconnue</span>;
                const c=a>180?"#ff4f5a":a>90?"#ff8f00":a>30?"#ffd740":"#8892a4";
                return <span title={`Dernière mise à jour des fondamentaux : ${m.fond_asof}`} style={{color:c,fontSize:9,marginLeft:8,textTransform:"none",letterSpacing:0}}>· {m.fond_asof} <b>({a} j)</b></span>;})()}

                entre le 7 et le 24 septembre, et ces dépôts étaient déjà dans

            {/* Société qui cote sans publier de comptes (registre SANS_COMPTES,

            {(r._meta||{}).comptes_absents&&(
              <div title={r._meta.comptes_absents.source}
                style={{margin:"0 0 10px",padding:"6px 8px",borderRadius:4,background:"rgba(255,79,90,.08)",border:"1px solid rgba(255,79,90,.35)",fontSize:10,color:"#ff8a80",lineHeight:1.4,cursor:"help"}}>
                <b>⚠ Aucun compte récent</b> — dernier dépôt le {r._meta.comptes_absents.dernier_depot.split("-").reverse().join("/")} : {r._meta.comptes_absents.motif}. La note est affichée pour mémoire, sans conclusion.
              </div>)}
            {(()=>{const c=meta(r).comptes_plus_recents; if(!c) return null;

                title={c._lecture||""}
                style={{display:"block",margin:"0 0 10px",padding:"6px 8px",borderRadius:4,

                <div style={{fontSize:10,color:"#ff8f00",fontWeight:600,marginBottom:2}}>
                  ⚠ Comptes plus récents publiés le {c.date}

                </div>
                <div style={{fontSize:10,color:"#8892a4",lineHeight:1.4}}>
                  {c.titre}<br/>
                  <span style={{color:"#5a6478"}}>{c.source} · le moteur signale le dépôt, il n'en lit pas les chiffres</span>
                </div>
              </a>;})()}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
              {[[r.pe_base&&r.pe_base.startsWith("12")?"PER 12 mois":"PE Ratio",r.pe?.toFixed(1)||"—",r.pe>25?"#ff8f00":"#c8d3e8","pe"],["P/Book",r.pb?.toFixed(2)||"—","#c8d3e8","pb"],["Dividende",r.div?`${r.div.toFixed(1)}%`:"—",r.div>4?"#00e5a0":"#c8d3e8","div"],["Cap. Boursière",r.cap?fmtM(r.cap):"—","#4db8ff","cap"],["Upside Base",ecart(r.base),r.base!=null&&((r.base-price)/price)>0?"#00e5a0":"#ff4f5a"]].map(([k,v,c,ratio])=>(
                <div key={k} style={{background:"#0a1220",borderRadius:4,padding:"6px 8px"}}>
                  <div style={{fontSize:8,color:"#8892a4",marginBottom:2,textTransform:"uppercase"}}>{k}<InfoCellule texte={explRatio(ratio,r,price)}/></div>
                  <div style={{fontSize:13,color:c,fontWeight:700}}>{v}</div>

                      l'écart entre les deux EST l'information (Managem 63 → 30). */}
                  {ratio==="pe"&&r.pe_base?.startsWith("12")&&r.pe_annuel!=null&&
                    <div title={`PER sur ${r.pe_base} ; exercice 2025 seul : ${r.pe_annuel}`} style={{fontSize:9,color:"#5a6478",marginTop:1}}>exercice 2025 : {fmt(r.pe_annuel,1)}</div>}
                  {/* ⚠️ LE RANG DANS SON SECTEUR — ajouté le 25/09.
                      « Un P/B de 2,16 n'a pas le même sens dans l'immobilier
                      que dans les télécoms. » Le chiffre nu laissait le
                      lecteur faire une comparaison que personne ne fait de
                      tête sur quatre-vingts titres.
                      ⚠️ Rien n'est affiché sous quatre comparables : un
                      « rang 1 sur 1 » n'informe de rien, et Télécom ne compte
                      qu'un titre. */}
                  {(()=>{const e=(r.rang_secteur||{})[ratio];
                    if(!e) return null;
                    const cher=(ratio==="div")?e.ecart_pct<0:e.ecart_pct>0;
                    return <div title={`Médiane ${e.secteur} : ${e.mediane_secteur}`}
                        style={{fontSize:9,marginTop:2,color:cher?"#ff8f00":"#00e5a0"}}>
                      {e.rang}<span style={{color:"#8892a4"}}>/{e.pairs} · {e.ecart_pct>0?"+":""}{e.ecart_pct}% vs secteur</span>
                    </div>;})()}
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* CENTRE — graphique (remonté en tête au-delà de 768 px) puis la fiche */}
        <div className="fiche-centre" style={{display:"flex",flexDirection:"column",gap:10}}>
          {/* Risque mesuré (1 an) — descriptif, hors note (14/10/2026). */}
          <RisqueMesure q={r.risque}/>

          {/* ⚠️ RENTABILITÉ SUR COMPTES PUBLIÉS — 30/09/2026. Calculée par
              pipeline/ratios_financiers.py à partir de deux termes sourcés
              (dépôts AMMC) ; chaque valeur porte sa date, et sa formule et ses
              sources au survol. Un terme manquant : « — », rien de supposé.
              Recoupé avec yuna.ma : 11 titres sur 13 au dixième près. */}
          {r.ratios_publies&&(
          <div className="carte" style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12,marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:10,gap:8,flexWrap:"wrap"}}>
              <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,textTransform:"uppercase"}}>Rentabilité <span style={{color:"#00e5a0"}}>comptes publiés</span></div>
              <div style={{fontSize:9,color:"#8892a4"}}>dépôts AMMC · calculé le {(r.ratios_publies.calcule_le||"").split("-").reverse().join("/")}</div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:7}}>
              {[["ROE 2025","roe_2025"],["ROE 12 mois","roe_12m"],["Marge nette S1 2026","marge_nette_s1_2026"]].map(([k,cle])=>{
