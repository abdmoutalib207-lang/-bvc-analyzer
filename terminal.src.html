const Ranking=({rows,sort,setSort,setSel,setTab,fav=[],toggleFav=()=>{},isWatchlist=false,scoreMode})=>{
  const [search,setSearch]=useState("");
  const [sector,setSector]=useState("ALL");
  const [group,setGroup]=useState("ALL"); // ALL = 77 titres / MASI1 = 19 tickers NLP
  const [palierFiltre,setPalierFiltre]=useState(null);
  const [rsiZone,setRsiZone]=useState(null);
  const customMode=!!(scoreMode&&!scoreMode.officiel);
  const NLP_TICKERS=new Set(["CMT","SMI","CASH","MNG","AKD","SOT","SGTM","MSA","CFGB","RIS","ADI","VCNE","CMGP","CSR","TGCC","ADH","SRM","SNA","RDS"]);
  const sectors=useMemo(()=>["ALL",...new Set(rows.map(r=>r.sector).filter(Boolean).sort())],[rows]);

  const filtered=useMemo(()=>{
    let r=rows;
    if(group==="MASI1") r=r.filter(x=>NLP_TICKERS.has(x.symbol||x.ticker||""));
    if(sector!=="ALL") r=r.filter(x=>x.sector===sector);
    if(search.trim()){
      const q=search.trim().toUpperCase();
      r=r.filter(x=>(x.symbol||x.ticker||"").includes(q)||tk(x).includes(q)||(x.name||"").toUpperCase().includes(q));
    }
    /* Filtre par palier de NOTE (07/10/2026) : il remplace le filtre par
       signal. Il porte sur la note affichée, celle de la vue choisie. */
    if(palierFiltre!=null) r=r.filter(x=>palierDe(computeDisplayScore(x,scoreMode))===palierFiltre);
    if(rsiZone==="survendu") r=r.filter(x=>(x.rsi??x.rsi14)!=null&&(x.rsi??x.rsi14)<30);
    if(rsiZone==="surachete") r=r.filter(x=>(x.rsi??x.rsi14)!=null&&(x.rsi??x.rsi14)>70);
    return r;
  },[rows,sector,search,group,palierFiltre,rsiZone,scoreMode]);

  const sorted=useMemo(()=>[...filtered].sort((a,b)=>{
    if(sort==="az")  return (a.name||a.symbol||"").localeCompare(b.name||b.symbol||"","fr");
    if(sort==="v53"){
      /* ⚠️ Une note INDISPONIBLE n'est pas une note basse. Comparée comme 0,
         elle se rangerait parmi les pires titres — un classement faux. Elle
         sort donc du classement par le bas, explicitement. */
      const sa=computeDisplayScore(a,scoreMode), sb=computeDisplayScore(b,scoreMode);
      if(sa==null&&sb==null) return 0;
      if(sa==null) return 1;
      if(sb==null) return -1;
      return sb-sa;
    }
    if(sort==="nlp") return b.nlp-a.nlp;
    if(sort==="var") return b.chg-a.chg;
    if(sort==="alpha") return b.alpha-a.alpha;
    if(sort==="rsi"){
      /* Un RSI absent n'est ni bas ni haut : en fin de liste. */
      const ra=a.rsi??a.rsi14,rb=b.rsi??b.rsi14;
      if(ra==null) return rb==null?0:1;
      if(rb==null) return -1;
      return ra-rb;
    }
    return 0;
  }),[filtered,sort,scoreMode]);
  const SORTS=[["az","A → Z"],["v53",customMode?"SCORE PERSO":("SCORE v5.3")],["nlp","NLP"],["var","VAR%"],["alpha","ALPHA"],["rsi","RSI"]];
  const scoreColLabel=customMode?scoreModeLabel(scoreMode):"SCORE";
  const HEADS=["#","TICKER","OUVERT","CLÔT.","VAR%","VOLUME","PE","DIV%",scoreColLabel,"NLP%","SM~","ALPHA","RSI","COULEUR","POIDS"];
  if(isWatchlist&&rows.length===0) return(
    <div style={{textAlign:"center",padding:"60px 20px",color:"#8892a4"}}>
      <div style={{fontSize:52,marginBottom:16,color:"#2a3550"}}>★</div>
      <div style={{fontSize:16,marginBottom:8,color:"#c8d3e8"}}>Aucun favori</div>
      <div style={{fontSize:12}}>Cliquez sur ☆ dans le classement pour suivre un titre</div>
    </div>
  );
  return(
    <div>
      {/* ── Barre de recherche + filtre secteur ─────────────── */}
      <div style={{display:"flex",gap:8,marginBottom:10,alignItems:"center",flexWrap:"wrap"}}>
        <input
          value={search} onChange={e=>setSearch(e.target.value)}
          placeholder="Rechercher ticker ou nom…"
          style={{background:"#0d1829",border:"1px solid #1a2540",color:"#c8d3e8",borderRadius:4,padding:"5px 10px",fontSize:12,fontFamily:"var(--font)",width:220,outline:"none"}}
        />
        <select value={sector} onChange={e=>setSector(e.target.value)}
          style={{background:"#0d1829",border:"1px solid #1a2540",color:"#8892a4",borderRadius:4,padding:"5px 8px",fontSize:11,fontFamily:"var(--font)",cursor:"pointer"}}>
          {sectors.map(s=><option key={s} value={s}>{s==="ALL"?`Tous (${rows.length})`:s}</option>)}
        </select>
        {/* Filtre NLP group */}
        <div style={{display:"flex",gap:4,background:"#0a1220",borderRadius:4,padding:2,border:"1px solid #1a2540"}}>
          {[["MASI1","MASI 1 · NLP","#00e5a0"],["ALL","ÉLARGI","#4db8ff"]].map(([g,lbl,c])=>(
            <button key={g} onClick={()=>setGroup(g)} style={{fontSize:10,fontWeight:600,padding:"3px 10px",borderRadius:3,border:"none",cursor:"pointer",background:group===g?`${c}18`:"transparent",color:group===g?c:"#8892a4",transition:"all .2s"}}>{lbl}</button>
          ))}
        </div>
        {(search||sector!=="ALL"||palierFiltre!=null||rsiZone)&&<button onClick={()=>{setSearch("");setSector("ALL");setPalierFiltre(null);setRsiZone(null);}} style={{fontSize:10,color:"#ff4f5a",border:"1px solid #ff4f5a30",borderRadius:3,padding:"3px 8px",background:"transparent"}}>✕ Réinitialiser</button>}
        <span style={{marginLeft:"auto",fontSize:11,color:"#8892a4"}}>{sorted.length}/{group==="MASI1"?19:rows.length} titres{group==="MASI1"&&<span style={{color:"#00e5a0",marginLeft:4}}>NLP ✓</span>}</span>
        <button onClick={()=>{
          // ⚠️ La pondération part avec le fichier : un CSV survit à l'écran
          // qui l'a produit, et une note sans sa formule est ininterprétable.
          const cols=["TICKER BVC","CODE INTERNE","NOM","SECTEUR","PRIX","VAR%","PE","DIV%","RSI","SCORE","PONDERATION","COULEUR_NOTE","ALPHA","SM_HEUR_NON_CALIBRE","VERSION_SCORE"];
          const rows_csv=sorted.map(r=>[tk(r),r.symbol,r.name||"",r.sector||"",r.price||"",r.chg||"",r.pe?.toFixed(1)||"",r.div?.toFixed(2)||"",r.rsi?.toFixed(1)||"",(sc=>sc==null?"indisponible":sc.toFixed(2))(computeDisplayScore(r,scoreMode)),scoreModeLabel(scoreMode),customMode?"":palierTexte(r),r.alpha||"",r.win||"",customMode?"":(r.score_version||"")]);
          const csv="﻿"+[cols,...rows_csv].map(r=>r.join(";")).join("\n");
          const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
          const url=URL.createObjectURL(blob);
          const a=document.createElement("a");
          a.href=url;
          // Le nom du fichier porte la pondération : deux exports du même jour
          // sous deux vues ne doivent pas se ressembler.
          a.download=`bvc_${new Date().toISOString().slice(0,10)}_${scoreModeLabel(scoreMode).replace("/","-")}.csv`;
          document.body.appendChild(a); a.click();
          document.body.removeChild(a); URL.revokeObjectURL(url);
        }} style={{fontSize:10,padding:"3px 10px",borderRadius:3,border:"1px solid #4db8ff40",color:"#4db8ff",background:"transparent",cursor:"pointer",letterSpacing:.5}}>
          ↓ CSV
        </button>
      </div>
      {/* ── Screener : filtres par palier de note + RSI ──────── */}
      <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:10,alignItems:"center"}}>
        <span style={{fontSize:10,color:"#8892a4",letterSpacing:.5,marginRight:2}}>NOTE</span>
        {PALIERS.map((p,k)=>{const on=palierFiltre===k;return(
          <button key={k} onClick={()=>setPalierFiltre(on?null:k)} title={`Notes ${p.plage} (${p.nom})`}
            style={{fontSize:10,padding:"3px 10px",borderRadius:12,border:`1px solid ${on?p.c:p.c+"35"}`,color:on?"#080d1a":p.c,background:on?p.c:"transparent",cursor:"pointer",fontFamily:"var(--font)",transition:"all .15s",fontWeight:on?700:400,display:"inline-flex",alignItems:"center",gap:5}}>
            <span aria-hidden="true" style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:on?"#080d1a":p.c}}/>{p.plage}
          </button>);})}
        <span style={{marginLeft:8,fontSize:10,color:"#8892a4",letterSpacing:.5}}>RSI</span>
        {[["survendu","<30 survendu","#00e5a0"],["surachete",">70 suracheté","#ff4f5a"]].map(([z,lbl,c])=>(
          <button key={z} onClick={()=>setRsiZone(rsiZone===z?null:z)}
            style={{fontSize:10,padding:"3px 10px",borderRadius:12,border:`1px solid ${rsiZone===z?c:c+"35"}`,color:rsiZone===z?"#080d1a":c,background:rsiZone===z?c:"transparent",cursor:"pointer",fontFamily:"var(--font)",transition:"all .15s",fontWeight:rsiZone===z?700:400}}>
            {lbl}
          </button>
        ))}
      </div>
      {/* ── Tri ────────────────────────────────────────────────── */}
      <div style={{display:"flex",gap:8,marginBottom:14,alignItems:"center",flexWrap:"wrap"}}>
        <span style={{fontSize:12,color:"#8892a4",letterSpacing:1}}>TRIER PAR</span>
        {SORTS.map(([id,lbl])=>(
          <button key={id} onClick={()=>setSort(id)} style={{background:sort===id?"rgba(0,229,160,.12)":"transparent",border:sort===id?"1px solid rgba(0,229,160,.4)":"1px solid #1a2540",color:sort===id?"#00e5a0":"#8892a4",padding:"3px 10px",borderRadius:4,fontSize:11}}>{lbl}{sort===id?" ▼":""}</button>
        ))}
      </div>
      {customMode&&<div style={{marginBottom:10,padding:"6px 12px",background:"rgba(255,215,64,.07)",border:"1px solid rgba(255,215,64,.25)",borderRadius:5,display:"flex",alignItems:"center",gap:8,fontSize:11}}>
        <span style={{color:"#ffd740",fontWeight:700}}>✱ MODE PERSONNALISÉ</span>
        <span style={{color:"#8892a4"}}>Score affiché :</span>
        <span style={{color:"#ffd740"}}>{scoreModeLabel(scoreMode)}</span>
        <span style={{color:"#8892a4",fontSize:10}}>— Le score composite officiel reste inchangé ; les couleurs, propres à la note officielle, sont masquées</span>
      </div>}
      <div style={{overflowX:"auto"}}>
        <table className="classement" style={{width:"100%",borderCollapse:"collapse",minWidth:1220}}>
          <thead>
            <tr style={{borderBottom:"2px solid #1a2540"}}>
              {HEADS.map(h=><th key={h} style={{padding:"8px 8px",fontSize:10,color:"#8892a4",textAlign:"left",letterSpacing:.4,whiteSpace:"nowrap",fontWeight:500}}>{h}</th>)}
            </tr>
          </thead>
          <tbody>
            {sorted.map((r,i)=>{
              const sym=r.symbol||r.ticker;
              const displayScore=computeDisplayScore(r,scoreMode);
              const manque=composantesManquantes(r,scoreMode);
              const rsiVal=r.rsi??r.rsi14??null;
              const rsiColor=rsiVal>70?"#ff4f5a":rsiVal<30?"#00e5a0":"#ffd740";
              /* ⚠️ Indicateurs absents : moins de 15 séances cotées. Le test
                 « MA20 = MA50 » repérait les valeurs inventées par le moteur ;
                 il n'en invente plus (29/09/2026), il les laisse vides. */
              const isStat=rsiVal==null;
              return(
                <tr key={sym} onClick={()=>{setSel(sym);setTab("detail");}}
                  style={{borderBottom:"1px solid #0d1829",cursor:"pointer",transition:"background .12s"}}
                  onMouseEnter={e=>e.currentTarget.style.background="rgba(255,255,255,.025)"}
                  onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  <td style={{padding:"8px 8px",fontSize:12,color:"#8892a4"}}>{i+1}</td>
                  <td style={{padding:"10px 8px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <CompanyLogo sym={tk(r)} logo={r.symbol} sector={r.sector} size={34}/>
                      <div style={{minWidth:0}}>
                        <div className="ligne-ticker" style={{display:"flex",alignItems:"center",gap:5}}>
                          <span style={{fontSize:16,color:"#fff",fontWeight:800,letterSpacing:.3}}>{tk(r)}</span>
                          {r.warn&&<span title={r.warnMsg} style={{fontSize:10,cursor:"help"}}>⚠️</span>}
                          {isStat&&<span title="Historique insuffisant : indicateurs techniques absents, la note technique s'abstient (5,0)" style={{fontSize:9,color:"#8892a4",border:"1px solid #1a2540",borderRadius:2,padding:"1px 3px",cursor:"default"}}>~hist</span>}
                          <button onClick={e=>{e.stopPropagation();toggleFav(sym);}} title={fav.includes(sym)?"Retirer des favoris":"Ajouter aux favoris"}
                            className="etoile" aria-pressed={fav.includes(sym)}
                            style={{fontSize:14,color:fav.includes(sym)?"#ffd740":"#8892a4",border:"none",background:"none",cursor:"pointer",padding:"0 1px",lineHeight:1,transition:"color .15s"}}>
                            {fav.includes(sym)?"★":"☆"}
                          </button>
                        </div>
                        {r.name&&<div className="nom-societe" style={{fontSize:12,color:"#c8d3e8",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:160,marginTop:1}}>{r.name}</div>}
                        <div className="secteur-societe" style={{fontSize:10,color:"#6b7a99",marginTop:1}}>{r.sector}</div>
                      </div>
                    </div>
                  </td>
                  <td style={{padding:"8px 8px",fontSize:12,color:"#8892a4"}}>{/* ⚠️ Ouverture ABSENTE = « — ». Le repli `cours ÷ (1 + var.)` affichait la
                      clôture de la VEILLE sous l'étiquette « ouvert » (30/09/2026). */}{r.open?px(r.open):"—"}</td>
                  <td style={{padding:"8px 8px",fontSize:13,color:"#c8d3e8",fontWeight:600}}>
                    {px(r.price||r.prix||r.close)}<Perime r={r}/>
                    {r.live&&<span style={{fontSize:8,color:"#00e5a0",marginLeft:3,verticalAlign:"super"}}>●</span>}
                    {/* Téléphone seulement : les colonnes OUVERT et VOLUME y
                        sont masquées faute de largeur, leurs valeurs passent
                        sous la clôture et la variation (demande du 30/09). */}
                    <div className="mobile-seul" style={{fontSize:9.5,color:"#8892a4",fontWeight:400}}>ouv. {r.open?px(r.open):"—"}</div>
                  </td>
                  <td style={{padding:"8px 8px",fontSize:13,color:VC(r.chg),fontWeight:600}}><span style={{whiteSpace:"nowrap"}}>{r.chg>0?"▲":r.chg<0?"▼":"—"} {Math.abs(r.chg||0).toFixed(2)}%</span>{r.chg_alert&&<span title="Variation ≥ ±8% — approche limite BVC" style={{marginLeft:3}}>⚡</span>}
                    {/* ⚠️ LA RÉFÉRENCE DE LA VARIATION — 30/09/2026. Relevé d'Abd
                        Moutalib : « variation pas adéquate avec l'ouverture et la
                        clôture ». Elle l'était (66/66 contre CDG) : elle se lit contre
                        la clôture de la VEILLE, que l'écran ne montrait pas. MNG :
                        veille 1 580, ouverture 1 600, clôture 1 600, +1,27 %.
                        Servie par CDG — jamais déduite du % arrondi (1 579,93 au lieu de 1 580). */}
                    {r.reference!=null&&<div style={{fontSize:9.5,color:"#8892a4",fontWeight:400,whiteSpace:"nowrap"}}
                      title="Cours de référence : clôture de la séance précédente, base de la variation (servi par CDG)">
                      réf. {px(r.reference)}</div>}
                    <div className="mobile-seul" style={{fontSize:9.5,color:"#8892a4",fontWeight:400}}>{volumeCourt(r)}</div></td>
                  {/* ⚠️ LE VOLUME DE LA SÉANCE — ajouté le 25/09/2026, il manquait.
                      Le classement montrait la variation sans jamais dire sur
                      combien d'échanges elle s'était faite. Un titre à +3 %
                      sur 40 titres échangés et un titre à +3 % sur 40 000 ne
                      décrivent pas la même chose.
                      ⚠️ DEUX UNITÉS, et l'une n'est pas l'autre : le nombre de
                      TITRES en gros, le MONTANT en dirhams dessous quand la
                      source le donne. Dix titres de CMT valent 39 230 DH, dix
                      d'Addoha en valent 336. */}
                  <td style={{padding:"8px 8px",fontSize:12,color:"#c8d3e8",whiteSpace:"nowrap"}}>
                    {(()=>{const v=r.vol,dh=r.echange_dh;
                      if(!v&&!dh) return <span style={{color:"#5a6478"}}>—</span>;
                      const bas=(dh!=null?dh:v*(r.price||0))<100000;
                      return <>
                        <div style={{color:bas?"#ff8f00":"#c8d3e8",fontWeight:600}}
                          title={bas?"Moins de 100 000 DH échangés : la confiance est plafonnée à 2 sur 5.":""}>
                          {dh!=null?montantCourt(dh):v?`${v.toLocaleString("fr-FR").replace(/\u202f|,/g," ")} titres`:"—"}</div>
                        {dh!=null&&v?<div style={{fontSize:9.5,color:"#5a6478"}}>
                          {v.toLocaleString("fr-FR").replace(/\u202f|,/g," ")} titres</div>:null}
                      </>;})()}
                  </td>
                  <td style={{padding:"8px 8px",fontSize:12,color:r.pe>25?"#ff8f00":"#c8d3e8"}}>{r.pe?.toFixed(1)||"—"}</td>
                  <td style={{padding:"8px 8px",fontSize:12,color:r.div>4?"#00e5a0":"#c8d3e8"}}>{r.div?.toFixed(1)||"—"}%</td>
                  <td style={{padding:"8px 8px"}}>
                    <div title={manque.length?`Score indisponible — composante absente : ${manque.join(", ")}`:undefined}
                      style={{fontSize:15,color:displayScore==null?"#8892a4":couleurChiffre(r,customMode),fontWeight:700,marginBottom:2}}>
                      {fmt(displayScore)}{customMode&&displayScore!=null&&<span style={{fontSize:8,color:"#ffd740",marginLeft:3,verticalAlign:"super"}}>✱</span>}
                    </div>
                    {/* ⚠️ Pas de barre sur une note absente : une barre de
                        longueur nulle se lit comme un score de zéro. */}
                    {displayScore!=null&&<Bar v={displayScore} c={couleurChiffre(r,customMode)} h={4}/>}
                  </td>
                  <td style={{padding:"8px 8px",fontSize:13,color:NC(r.nlp),fontWeight:600}}>{r.nlp>0?"+":""}{(r.nlp*100).toFixed(0)}%</td>
                  <td style={{padding:"8px 8px",fontSize:12,color:r.win>=80?"#00e5a0":r.win>=70?"#ffd740":"#ff8f00",fontWeight:600}}>{r.win!=null?`${r.win}`:"—"}</td>
                  <td style={{padding:"8px 8px",fontSize:12,color:r.alpha>=0?"#00e5a0":"#ff4f5a",fontWeight:600}}>{r.alpha!=null?<>{r.alpha>0?"+":""}{r.alpha}%{r.alpha<0&&<span style={{fontSize:10}}>⚠️</span>}</>:"—"}</td>
                  <td style={{padding:"8px 8px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:5}}>
                      <span style={{fontSize:12,color:isStat?"#8892a4":rsiColor,fontWeight:700}}>{isStat?"—":rsiVal}</span>
                      {!isStat&&<div style={{width:30,background:"#0a1220",borderRadius:2,height:4}}>
                        <div style={{width:`${rsiVal}%`,height:"100%",background:rsiColor,borderRadius:2}}/>
                      </div>}
                    </div>
                  </td>
                  {/* ⚠️ Hors pondération officielle, la COULEUR disparaît. Elle
                      est celle de la note publiée par le moteur ; l'afficher à
                      côté d'une note recalculée autrement mettrait deux
                      formules côte à côte sans le dire.
                      07/10/2026 : plus aucun mot d'action dans cette colonne,
                      seulement la couleur du palier de note (PastilleNote). */}
                  <td style={{padding:"8px 8px"}}>{customMode
                    ? <span title="La couleur n'existe que pour la pondération officielle"
                        style={{fontSize:11,color:"#8892a4",letterSpacing:1}}>—</span>
                    /* Un titre suspendu passe AVANT le test de confiance : sa
                       confiance est nulle, mais « Données insuffisantes » serait
                       un contresens. Les données ne manquent pas — le titre ne
                       cote plus. */
                    : meta(r).susp
                    ? <Chip label="SUSPENDU" bg="rgba(255,107,107,.12)" fg="#ff6b6b" bd="#ff6b6b40"/>
                    /* ⚠️ Même raisonnement, deuxième cas — ajouté le 24/09.
                       Un titre qui vient de reprendre sa cotation sortait à
                       « Données insuffisantes », alors que ses données sont
                       complètes : ce sont ses indicateurs TECHNIQUES qui sont
                       sans objet, parce qu'ils décrivent le régime de prix
                       d'avant la suspension. Le signal reste suspendu — on
                       corrige ce qui est dit, pas ce qui est calculé. */
                    : meta(r).reprise_recente
                    ? <Chip label="REPRISE DE COTATION" bg="rgba(255,215,64,.12)" fg="#ffd740" bd="#ffd74040"/>
                    : meta(r).conf<=1
                    ? <Chip label="Données insuffisantes" bg="rgba(136,146,164,.12)" fg="#8892a4" bd="#2a3550"/>
                    : <PastilleNote r={r}/>}</td>
                  <td style={{padding:"8px 8px",minWidth:85}}>
                    {(()=>{const pw=poidsAffiches(r,scoreMode);return pw&&<>
                      <WBar f={pw.f} n={pw.n} t={pw.t}/>
                      <div style={{fontSize:9,color:customMode?"#ffd740":"#8892a4",marginTop:2}}>F{pw.f}·N{pw.n}·T{pw.t}</div>
                    </>;})()}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div style={{marginTop:12,padding:"10px 14px",background:"#0d1829",border:"1px solid #1a2540",borderRadius:6,fontSize:11,color:"#8892a4",lineHeight:1.9}}>
        <span style={{color:"#00e5a0"}}>●</span> SCORE = base Fond×65% + Tech×35% (NLP gelé à 0 depuis le 25/09), <span style={{color:"#ffd740"}}>modulée par le contexte de marché</span> — ouverture de la séance et tendance du MASI depuis janvier ; le poids appliqué est sur chaque fiche &nbsp;|&nbsp;
        <span style={{color:"#ffd740"}}>●</span> SM~ = score Smart Money <b>heuristique, NON calibré</b> — dérivé du score composite, ce n'est pas une probabilité mesurée &nbsp;|&nbsp;
        <span style={{color:"#8892a4"}}>~hist</span> = moins de 15 séances cotées : RSI et moyennes absents, jamais estimés &nbsp;|&nbsp;
        <span style={{color:"#ff4f5a"}}>⚠️</span> Alpha/RSI rouge = prudence &nbsp;|&nbsp; PE = Price/Earnings · DIV = dividende &nbsp;|&nbsp; Clic → vue détaillée
      </div>
    </div>
  );
};

// ── BRIEFING — la lecture de la séance close ─────────────────────────────────
//
// ⚠️ CE COMPOSANT NE COLLECTE RIEN, ET NE LE PEUT PAS. Le terminal est servi
// par GitHub Pages : aucun serveur, aucune étape de build. Il lit
// `briefing.json`, écrit par `pipeline/briefing.py` pendant le run du soir.
// C'est la même limite qui a rendu les proxys CORS inutilisables le 25/08.
//
// ⚠️ LE BRIEFING CONSTATE, IL N'EXPLIQUE PAS. Aucune cause n'y figure : les
// constats portent leur nombre, les actualités portent leur source et leur
// lien. « Cosumar publie un résultat en baisse » est un fait sur une
// publication ; « le marché a baissé à cause de Cosumar » n'en est pas un.
// ── La lecture détaillée de la séance (30/09/2026) ──────────────────────────
// ⚠️ Tout ce qui s'affiche ici vient de `briefing*.json`, écrit par
// `pipeline/briefing.py` à partir de `pipeline/seance_marche.json` (CDG,
// TradingView), `marche_history.json` et `depots_ammc.json`. Le composant ne
// calcule rien : il range. Aucune probabilité, aucun scénario, aucun avis.
const nfr=(x,d=2)=>x==null||!isFinite(x)?"—":(+x).toLocaleString("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d}).replace(/\u202f|\u00a0/g," ");
const jm=iso=>iso?`${iso.slice(8,10)}/${iso.slice(5,7)}`:"—";
const Carte=({titre,source,children})=>(
  <div className="carte" style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:16}}>
    <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,textTransform:"uppercase",marginBottom:4}}>{titre}</div>
    {source&&<div style={{fontSize:10.5,color:"#5a6478",marginBottom:10}}>{source}</div>}
    {children}
  </div>);
const SeanceDetail=({b})=>{
  const t=b.trajectoire, v=b.veille, sect=b.secteurs||[], mp=b.matieres||[];
  const nv=b.niveaux||{}, nt=nv.titres||[], nm=nv.masi, dep=b.depots;
  const cel={padding:"4px 8px",fontSize:12.5,color:"#c8d3e8",whiteSpace:"nowrap"};
  const tete={...cel,fontSize:10,color:"#5a6478",textTransform:"uppercase",letterSpacing:.6};
  const VC2=x=>x>0?"#00e5a0":x<0?"#ff4f5a":"#8892a4";
  return <>
    {/* ⚠️ « 1re valeur » et non « ouverture » : le champ CoursOuverture de
        CDG vaut la veille ; la valeur montrée est le premier point de la
        série après 09:30 (mesuré le 30/09). Si la série s'arrête avant la
        clôture, la carte le dit. */}
    {t&&<Carte titre="Séance du MASI" source={`${t.source} · ${t.n_points} points de la série intrajournalière${t.serie_rejoint_cloture===false?` · série arrêtée à ${t.serie_jusqu_a} ; clôture et extrêmes tirés de la synthèse`:""}`}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(110px,1fr))",gap:10}}>
        {[["Veille",t.veille,null],["1re valeur calculée",t.ouverture,t.heure_ouverture],
          ["Plus haut",t.plus_haut,t.heure_plus_haut],["Plus bas",t.plus_bas,t.heure_plus_bas],
          ["Clôture",t.cloture,null]].map(([l,x,h])=>(
          <div key={l}>
            <div style={{fontSize:10,color:"#5a6478"}}>{l}</div>
            <div style={{fontSize:15,color:"#c8d3e8",fontWeight:600,fontFamily:"monospace"}}>{nfr(x)}</div>
            <div style={{fontSize:10,color:"#5a6478"}}>{h?`à ${h}`:l==="Plus haut"||l==="Plus bas"?"heure hors de la série":"\u00a0"}</div>
          </div>))}
      </div>
    </Carte>}

    {v&&<Carte titre={`Comparée à la séance du ${jm(v.seance_veille)}`} source={v.source}>
      <div style={{overflowX:"auto"}}><table style={{borderCollapse:"collapse"}}><thead><tr>
        {["","Indice","Volume","Hausses","Baisses","Inchangées"].map(x=><th key={x} style={tete}>{x}</th>)}
      </tr></thead><tbody>
        {[[jm(v.seance),v.jour],[jm(v.seance_veille),v.veille]].map(([d,e])=>(
          <tr key={d}><td style={{...cel,color:"#8892a4"}}>{d}</td>
            <td style={{...cel,color:VC2(e.variation_pct)}}>{e.variation_pct>0?"+":""}{nfr(e.variation_pct)} %</td>
            <td style={cel}>{e.volume_mad!=null?`${nfr(e.volume_mad/1e6,1)} M DH`:"—"}</td>
            <td style={cel}>{e.hausses??"—"}</td><td style={cel}>{e.baisses??"—"}</td><td style={cel}>{e.inchanges??"—"}</td></tr>))}
      </tbody></table></div>
    </Carte>}

    {sect.length>0&&<Carte titre="Indices sectoriels" source="CDG Capital Bourse — INDICE-SYNTHESE, identité et date vérifiées pour chaque indice">
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))",gap:"2px 18px"}}>
        {sect.map(x=>(
          <div key={x.code} style={{display:"flex",justifyContent:"space-between",gap:8,fontSize:12,padding:"2px 0",borderBottom:"1px solid #0a1220"}}>
            <span style={{color:"#c8d3e8",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={x.libelle}>{x.libelle}</span>
            <span style={{color:VC2(x.variation_pct),fontFamily:"monospace",whiteSpace:"nowrap",flexShrink:0}}>{x.variation_pct>0?"+":""}{nfr(x.variation_pct)} %</span>
          </div>))}
      </div>
    </Carte>}

    {(nm||nt.length>0)&&<Carte titre={`Niveaux mesurés — ${nv.n_seances||20} dernières séances`}
        source="Plus hauts et plus bas réellement atteints. Ce ne sont ni des supports ni des objectifs : des faits datés.">
      {nm&&nm.clotures&&<div style={{fontSize:12,color:"#8892a4",marginBottom:8}}>
        MASI — séance {nfr(nm.seance_bas)} – {nfr(nm.seance_haut)} ·
        clôtures du {jm(nm.clotures.du)} au {jm(nm.clotures.au)} : plus basse {nfr(nm.clotures.plus_basse)} ({jm(nm.clotures.date_plus_basse)}),
        plus haute {nfr(nm.clotures.plus_haute)} ({jm(nm.clotures.date_plus_haute)})
        {nm.clotures.n_seances&&nm.clotures.n<nm.clotures.n_seances&&<span style={{color:"#ff8f00"}}> · {nm.clotures.n} clôtures de l'indice enregistrées sur {nm.clotures.n_seances} séances</span>}
      </div>}
      {nt.length>0&&<div style={{overflowX:"auto"}}><table style={{borderCollapse:"collapse",width:"100%"}}><thead><tr>
        {["Titre","Échangé","Séance","Plus bas","Plus haut"].map(x=><th key={x} style={{...tete,textAlign:"left"}}>{x}</th>)}
      </tr></thead><tbody>
        {nt.map(x=>(
          <tr key={x.symbol}><td style={{...cel,color:"#4db8ff",fontWeight:600}}>{x.symbol}</td>
            <td style={cel}>{nfr(x.montant_dh/1e6,1)} M DH</td>
            <td style={cel}>{x.seance_bas!=null?`${nfr(x.seance_bas)} – ${nfr(x.seance_haut)}`:"—"}</td>
            <td style={cel}>{x.fenetre?<>{nfr(x.fenetre.plus_bas)} <span style={{color:"#5a6478"}}>{jm(x.fenetre.date_plus_bas)}</span></>:"—"}</td>
            <td style={cel}>{x.fenetre?<>{nfr(x.fenetre.plus_haut)} <span style={{color:"#5a6478"}}>{jm(x.fenetre.date_plus_haut)}</span></>:"—"}</td></tr>))}
      </tbody></table></div>}
    </Carte>}

    {mp.length>0&&<Carte titre="Matières premières" source="TradingView — contrat à terme le plus proche. Heure de la valeur déclarée par la source, en UTC.">
      {mp.map(x=>(
        <div key={x.ticker} style={{display:"flex",justifyContent:"space-between",gap:10,fontSize:12.5,padding:"4px 0",borderBottom:"1px solid #0a1220",flexWrap:"wrap"}}>
          <span style={{color:"#c8d3e8"}}>{x.nom} <span style={{color:"#5a6478",fontSize:10.5}}>{x.ticker}</span></span>
          <span style={{fontFamily:"monospace",color:"#c8d3e8"}}>{nfr(x.valeur)} {x.devise}
            {x.variation_pct!=null&&<span style={{color:VC2(x.variation_pct),marginLeft:8}}>{x.variation_pct>0?"+":""}{nfr(x.variation_pct)} %</span>}
            <span style={{color:"#5a6478",fontSize:10.5,marginLeft:8}}
              title={`Mode déclaré par la source : ${x.mode_source||"—"}`}>{jm(x.horodatage_utc)} {x.horodatage_utc?.slice(11,16)} UTC</span></span>
        </div>))}
    </Carte>}

    {dep&&(dep.titres||[]).length>0&&<Carte titre={`Dépôts de résultats à l'AMMC — ${jm(dep.seance)}`}
        source="Liste des communiqués des émetteurs (AMMC). La liste ne donne pas l'heure : publié ce jour-là, pas forcément avant la clôture.">
      {dep.titres.map((x,i)=>(
        <a key={i} href={x.url} target="_blank" rel="noopener noreferrer"
          style={{display:"block",padding:"6px 0 6px 10px",borderLeft:"2px solid #00e5a0",marginBottom:4,textDecoration:"none"}}>
          <span style={{color:"#4db8ff",fontWeight:600,fontSize:12,marginRight:8}}>{x.ticker}</span>
          <span style={{color:"#c8d3e8",fontSize:12.5}}>{x.titre}</span>
        </a>))}
      {(dep.autres_emetteurs||[]).length>0&&<div style={{fontSize:10.5,color:"#5a6478",marginTop:6}}>
        Autres émetteurs le même jour, sans action cotée rattachée : {dep.autres_emetteurs.map(x=>x.emetteur).join(", ")}.</div>}
    </Carte>}
  </>;
};

// ⚠️ « À SURVEILLER AUJOURD'HUI » — 30/09/2026. En tête du briefing, une
// ligne par titre : les critères qu'il remplit, le chiffre, le lien. Aucune
// note : le lecteur voit POURQUOI le titre est là (pipeline/briefing.py::
// a_surveiller). Absent des lectures antérieures au 30/09 : rien n'est affiché.
// ⚠️ LA LECTURE RÉDIGÉE — 01/10/2026. Écrite par la routine Claude (sans
// API) ou, à défaut, générée sans modèle à partir des faits. Dans les deux
// cas, chaque nombre a passé le contrôle `pipeline/redaction.py` : il existe
// dans les faits du briefing. L'auteur est toujours affiché.
const gras=t=>t.split(/(\*\*[^*]+\*\*)/g).map((x,i)=>x.startsWith("**")&&x.endsWith("**")
  ?<strong key={i} style={{color:"#e6edf7"}}>{x.slice(2,-2)}</strong>:x);
// ⚠️ SQUELETTE — 01/10/2026. Montre la forme du bloc attendu pendant le
// chargement. Le texte reste lisible par les lecteurs d'écran (aria-label).
const Squelette=({blocs=[3],titre="Chargement"})=>(
  <div aria-busy="true" aria-label={titre} style={{display:"flex",flexDirection:"column",gap:14}}>
    {blocs.map((n,i)=>(
      <div key={i} className="sq" style={{padding:16}}>
        <div className="sq-l" style={{width:"28%",height:8}}/>
        {Array.from({length:n}).map((_,j)=><div key={j} className="sq-l" style={{width:`${92-((j*17)%35)}%`}}/>)}
      </div>))}
  </div>);

const Lecture=({r})=>{
  if(!r||!r.texte)return null;
  const blocs=r.texte.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  return(
    <div className="carte" style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:16}}>
      <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,textTransform:"uppercase",marginBottom:2}}>Lecture de la séance</div>
      <div style={{fontSize:11,color:"#5a6478",marginBottom:10}}>
        {r.auteur==="claude"
          ?"Rédigée par Claude à partir des faits publiés ci-dessous — chaque chiffre a été contrôlé."
          :"Générée automatiquement à partir des faits publiés ci-dessous."}
      </div>
      {blocs.map((b,i)=>{
        if(b.startsWith("#"))return <div key={i} style={{fontSize:12,color:"#4db8ff",letterSpacing:.6,margin:"10px 0 4px",textTransform:"uppercase"}}>{b.replace(/^#+\s*/,"")}</div>;
        if(/^[-•] /m.test(b))return <ul key={i} style={{margin:"0 0 8px",paddingLeft:18,fontSize:13.5,lineHeight:1.65,color:"#c8d3e8"}}>
          {b.split(/\n/).map((l,j)=><li key={j}>{gras(l.replace(/^[-•]\s*/,""))}</li>)}</ul>;
        return <p key={i} style={{margin:"0 0 10px",fontSize:13.5,lineHeight:1.7,color:"#c8d3e8"}}>{gras(b)}</p>;})}
    </div>);
};

// ⚠️ LES CHIFFRES-CLÉS — 02/10/2026. Abd Moutalib : « trop de répétition,
// trop de chiffres en texte ». Mesuré sur la clôture du 01/10 : 128 nombres
// en 386 mots de constats, la clôture du MASI écrite quatre fois. Chaque
// chiffre de la séance s'affiche désormais UNE fois, ici ; le texte ne garde
// que la lecture. Le volume est celui de la synthèse CDG (`veille.jour`),
// recoupé au bulletin du 01/10 (152,47 M DH), pas la somme de nos lignes.
const ChiffresCles=({b})=>{
  const t=b.trajectoire, v=b.veille&&b.veille.jour, vv=b.veille;
  if(!t&&!v)return null;
  const VCc=x=>x>0?"#00e5a0":x<0?"#ff4f5a":"#8892a4";
  const sg=x=>x==null?"—":`${x>0?"+":""}${nfr(x)} %`;
  const items=[
    ["MASI",nfr(t?t.cloture:v.cours),v&&v.variation_pct!=null?sg(v.variation_pct):null,v&&VCc(v.variation_pct)],
    ["Échangé",v&&v.volume_mad!=null?`${nfr(v.volume_mad/1e6,1)} M DH`:"—",
      vv&&vv.ecart_volume_pct!=null?`${sg(vv.ecart_volume_pct)} vs veille`:null,"#8892a4"],
    ["Hausses · baisses",v?`${v.hausses??"—"} · ${v.baisses??"—"}`:"—",
      v&&v.valeurs_traitees?`${v.inchanges??0} inchangées sur ${v.valeurs_traitees}`:null,"#8892a4"],
    ["Plus haut · bas",t?nfr(t.plus_haut):"—",t?`plus bas ${nfr(t.plus_bas)}`:null,"#8892a4"],
    ["Depuis janvier",sg(b.ytd_pct),null,null,VCc(b.ytd_pct)]];
  return(
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(min(140px,45%),1fr))",gap:10}}>
      {items.map(([l,val,sous,cs,cv])=>(
        <div key={l} className="carte" style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:"10px 12px"}}>
          <div style={{fontSize:10,color:"#8892a4",letterSpacing:.8,textTransform:"uppercase"}}>{l}</div>
          <div style={{fontSize:18,fontWeight:700,fontFamily:"monospace",color:cv||"#e6edf7",margin:"3px 0 1px",whiteSpace:"nowrap"}}>{val}</div>
          {sous&&<div style={{fontSize:11,color:cs||"#8892a4"}}>{sous}</div>}
        </div>))}
    </div>);
};

const ASurveiller=({a})=>{
  if(!a)return null;
  const groupes=[["A PUBLIÉ",a.a_publie||[]],["A BOUGÉ",a.a_bouge||[]]].filter(([,l])=>l.length);
  if(!groupes.length)return null;
  return(
    <div style={{background:"#0d1829",border:"1px solid rgba(0,229,160,.35)",borderRadius:8,padding:16}}>
      <div style={{fontSize:10,color:"#00e5a0",letterSpacing:1,textTransform:"uppercase",marginBottom:2}}>Critères remplis aujourd'hui</div>
      <div style={{fontSize:11,color:"#5a6478",marginBottom:10}}>
        Chaque titre remplit au moins un critère mesuré ; classés par nombre de critères, puis par montant échangé.
        {a.n_candidats>(a.a_publie||[]).length+(a.a_bouge||[]).length&&<> {a.n_candidats} titres en remplissaient un.</>}
      </div>
      {groupes.map(([titre,l])=>(
        <div key={titre} style={{marginBottom:8}}>
          <div style={{fontSize:10,color:"#8892a4",letterSpacing:.8,margin:"6px 0 4px"}}>{titre}</div>
          {/* ⚠️ En tableau depuis le 02/10 : le chiffre dans sa colonne, le
              critère en étiquette courte. Le volume relatif n'est plus répété
              dans le texte du critère. */}
          <div style={{overflowX:"auto"}}><table style={{borderCollapse:"collapse",width:"100%"}}>
            <thead><tr>{["Titre","Variation","Volume","Pourquoi"].map(x=>
              <th key={x} style={{textAlign:"left",fontSize:10,color:"#5a6478",fontWeight:400,letterSpacing:.6,textTransform:"uppercase",padding:"3px 8px 3px 0"}}>{x}</th>)}</tr></thead>
            <tbody>{l.map(z=>(
              <tr key={z.symbol} style={{borderTop:"1px solid #0a1220"}}>
                <td style={{padding:"6px 8px 6px 0",color:"#e6edf7",fontWeight:600,whiteSpace:"nowrap"}}>{z.symbol}</td>
                <td style={{padding:"6px 8px 6px 0",fontFamily:"monospace",whiteSpace:"nowrap",color:z.chg==null?"#5a6478":z.chg>0?"#00e5a0":z.chg<0?"#ff4f5a":"#8892a4"}}>
                  {z.chg==null?"non coté":`${z.chg>0?"+":""}${fmt(z.chg).replace(".",",")} %`}</td>
                <td style={{padding:"6px 8px 6px 0",fontFamily:"monospace",whiteSpace:"nowrap",color:z.volume_rapport>=3?"#ffd740":"#8892a4"}}
                  title="Titres échangés rapportés à la médiane des 20 dernières séances">
                  {z.volume_rapport!=null?`×${nfr(z.volume_rapport,1)}`:"—"}</td>
                <td style={{padding:"6px 0",display:"flex",gap:4,flexWrap:"wrap"}}>
                  {z.criteres.filter(c=>c.code!=="volume").map((c,i)=>{
                    const st={fontSize:11,padding:"1px 7px",borderRadius:10,background:"#0a1220",border:"1px solid #1a2540",color:"#c8d3e8",textDecoration:"none",whiteSpace:"nowrap"};
                    return c.url?<a key={i} href={c.url} target="_blank" rel="noopener noreferrer" style={{...st,color:"#4db8ff"}}>{c.texte}</a>
                      :<span key={i} style={st}>{c.texte}</span>;})}
                  {z.criteres.every(c=>c.code==="volume")&&<span style={{fontSize:11,color:"#5a6478"}}>volume inhabituel</span>}
                </td>
              </tr>))}</tbody></table></div>
        </div>))}
    </div>);
};

const Briefing=()=>{
  const [b,setB]=useState(null);
  const [h,setH]=useState(null);
  // ⚠️ Mi-journée et clôture — ajoutés le 29/09/2026. Deux fichiers de plus,
  // parce que `briefing.json` est réécrit à chaque passage et ne garde la
  // trace d'aucun moment. Écrits par `pipeline/briefing.py::ecrire_moment`.
  const [mj,setMj]=useState(null);
  const [cl,setCl]=useState(null);
  // ⚠️ « jour » ou « semaine ». Deux fichiers distincts, parce qu'un bilan de
  // semaine ne remplace pas la lecture de la dernière séance : le premier dit
  // où en est le marché, le second ce qui vient de se passer.
  const [vue,setVue]=useState("jour");
  const [etat,setEtat]=useState("chargement");
  // ⚠️ L'ARCHIVE — 30/09/2026. Une séance passée se relit telle qu'elle a été
  // écrite : `briefings/<séance>.json` est figé après la séance. null = la
  // publication du jour (fichiers courants).
  const [seances,setSeances]=useState([]);
  const [choix,setChoix]=useState(null);
  const [arch,setArch]=useState(null);
  const [detail,setDetail]=useState(false);
  useEffect(()=>{
    const t=Math.floor(Date.now()/3600000);
    Promise.all([
      fetch("briefing.json?t="+t).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch("briefing_hebdo.json?t="+t).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch("briefing_mijournee.json?t="+t).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch("briefing_cloture.json?t="+t).then(r=>r.ok?r.json():null).catch(()=>null),
    ]).then(([j,s,m,c])=>{setB(j);setH(s);setMj(m);setCl(c);setEtat(j?"ok":"absent");});
    fetch("briefings/index.json?t="+t).then(r=>r.ok?r.json():null).catch(()=>null)
      .then(x=>setSeances((x&&x.seances)||[]));
  },[]);
  const choisir=d=>{
    if(!d){setChoix(null);setArch(null);setVue("jour");return;}
    setChoix(d);setArch(null);
    fetch(`briefings/${d}.json?t=${Math.floor(Date.now()/3600000)}`)
      .then(r=>r.ok?r.json():null).catch(()=>null)
      .then(x=>{setArch(x||{});setVue(x&&x.cloture?"cloture":"mijournee");});
  };

  if(etat==="chargement")return <Squelette blocs={[4,3,5]} titre="Chargement du briefing"/>;
  // ⚠️ On DIT que le briefing manque plutôt que d'afficher un panneau vide.
  // Un écran vide se lit comme « rien à signaler », ce qui est faux.
  if(etat==="absent")return(
    <div className="carte" style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:20,color:"#8892a4"}}>
      Le briefing de la dernière séance n'a pas été publié. Il est écrit par le
      run du soir ; son absence signale que ce run n'a pas abouti.
    </div>);

  const passe=!!choix;
  const semaine=!passe&&vue==="semaine"&&h;
  const mjV=passe?(arch&&arch.mi_journee):mj, clV=passe?(arch&&arch.cloture):cl;
  const PAR_VUE={jour:b,mijournee:mjV,cloture:clV};
  const src=semaine?h:(PAR_VUE[vue]||(passe?(clV||mjV):b));
  if(passe&&!src)return(
    <div style={{color:"#8892a4",padding:20}}>
      {arch?"Aucune lecture archivée pour cette séance.":<Squelette blocs={[4,3]} titre="Chargement de l'archive"/>}
      <button onClick={()=>choisir(null)} style={{marginLeft:10,background:"none",border:"1px solid #1a2540",color:"#4db8ff",borderRadius:5,padding:"3px 10px",cursor:"pointer"}}>Revenir au jour</button>
    </div>);
  const a=src.actualites||{};
  const liens=[...(a.titres||[]),...(a.autres||[])];
  // ⚠️ Un onglet dont le fichier n'est pas encore publié reste visible mais
  // inactif, avec la raison — plutôt que de disparaître sans explication.
  const ONG=[
    {id:"jour",label:"DERNIÈRE LECTURE",dispo:!passe,pourquoi:"Lecture du jour seulement — revenez au jour pour la voir."},
    {id:"mijournee",label:"MI-JOURNÉE",dispo:!!mjV,pourquoi:passe?"Aucune lecture de mi-journée archivée pour cette séance.":"Écrite par le passage de 12h45, puis de 13h45 — pas encore publiée."},
    {id:"cloture",label:"CLÔTURE",dispo:!!clV,pourquoi:passe?"Aucune lecture de clôture archivée pour cette séance.":"Écrite par le passage de 15h45 — pas encore publiée."},
    {id:"semaine",label:"LA SEMAINE",dispo:!passe&&!!h,pourquoi:passe?"Bilan de la semaine en cours seulement.":"Le bilan de semaine n'a pas été publié par le dernier run."}];
  const LIB_MOMENT={mi_journee:"Lecture de mi-journée",cloture:"Lecture de clôture",en_seance:"Lecture en séance"};
  const blocConstats=<div className="carte" style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:16}}>
        <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,textTransform:"uppercase",marginBottom:4}}>
          {semaine?"Bilan de la semaine":`Tous les constats mesurés — ${(LIB_MOMENT[src.moment]||"lecture de la séance").toLowerCase()}`}</div>
        <div style={{fontSize:13,color:"#4db8ff",marginBottom:12}}>
          {semaine
            ?`${h.semaine?.n||0} séance${(h.semaine?.n||0)>1?"s":""} cotée${(h.semaine?.n||0)>1?"s":""}${h.semaine?.seances?.length?` · ${h.semaine.seances[0]} → ${h.semaine.seances[h.semaine.seances.length-1]}`:""}`
            :<>{src.seance||"—"}{src.ecrit_a&&<span style={{color:"#5a6478",fontSize:11,marginLeft:8}}>· écrite le {src.ecrit_a.slice(8,10)}/{src.ecrit_a.slice(5,7)} à {src.ecrit_a.slice(11)}</span>}</>}</div>
        <ul style={{margin:0,paddingLeft:18,fontSize:13.5,lineHeight:1.65,color:"#c8d3e8"}}>
          {(src.constats||[]).map((c,i)=><li key={i} style={{marginBottom:6}}>{c}</li>)}
          {(src.constats||[]).length===0&&<li style={{color:"#8892a4"}}>Rien de mesurable à signaler.</li>}
        </ul>
        {(src.non_mesurable||[]).length>0&&
          <div style={{marginTop:12,paddingTop:10,borderTop:"1px solid #1a2540"}}>
            <div style={{fontSize:11,color:"#8892a4",marginBottom:4}}>Ce que cette lecture ne dit pas :</div>
            <ul style={{margin:0,paddingLeft:18,fontSize:11.5,color:"#5a6478",lineHeight:1.6}}>
              {(src.non_mesurable||[]).map((x,i)=><li key={i}>{x}.</li>)}
            </ul>
          </div>}
      </div>;
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"flex",gap:4,flexWrap:"wrap",alignItems:"center"}}>
        {/* ⚠️ Le sélecteur n'apparaît que s'il y a une archive à relire. */}
        {seances.length>0&&
          <select value={choix||""} onChange={e=>choisir(e.target.value||null)}
            title="Relire la lecture d'une séance passée, telle qu'elle a été publiée"
            style={{background:"#0a1220",border:"1px solid #1a2540",color:passe?"#ffd740":"#8892a4",
              borderRadius:5,padding:"5px 8px",fontSize:11}}>
            <option value="">Aujourd'hui</option>
            {seances.map(d=><option key={d} value={d}>{d.slice(8,10)}/{d.slice(5,7)}/{d.slice(0,4)}</option>)}
          </select>}
        {ONG.map(o=>{
          const actif=vue===o.id, dispo=o.dispo;
          return <button key={o.id} onClick={()=>dispo&&setVue(o.id)}
            title={dispo?"":o.pourquoi}
            style={{background:actif?"rgba(0,229,160,.12)":"#0a1220",
              border:`1px solid ${actif?"rgba(0,229,160,.4)":"#1a2540"}`,
              color:!dispo?"#3a4358":actif?"#00e5a0":"#8892a4",
              borderRadius:5,padding:"5px 14px",fontSize:11,letterSpacing:.8,
              cursor:dispo?"pointer":"not-allowed"}}>{o.label}</button>;})}
      </div>

      {/* ⚠️ L'en-tête du terminal affiche déjà les chiffres de la dernière
          clôture : la bande ne s'affiche que là où ils diffèrent — séance
          relue dans l'archive, ou lecture de mi-journée. */}
      {!semaine&&(passe||vue==="mijournee")&&<ChiffresCles b={src}/>}
      {!semaine&&<Lecture r={src.redaction}/>}
      {!semaine&&<ASurveiller a={src.a_surveiller}/>}

      {/* ⚠️ Les constats répètent les chiffres-clés : sur une séance, ils
          passent dans le détail replié (02/10/2026). La semaine, sans
          chiffres-clés, les garde en vue. */}
      {semaine&&blocConstats}

      {/* ⚠️ LA LECTURE DÉTAILLÉE DE LA SÉANCE — ajoutée le 30/09/2026.
          Trajectoire, secteurs, matières premières, niveaux, dépôts : chaque
          bloc porte sa source et sa date, et n'apparaît que s'il a été
          mesuré. Un bloc absent est déclaré dans « Ce que cette lecture ne
          dit pas », jamais rempli par défaut. */}
      {/* Replié par défaut : la liste courte d'abord, le détail à la demande. */}
      {!semaine&&<button onClick={()=>setDetail(!detail)}
        style={{alignSelf:"flex-start",background:"#0a1220",border:"1px solid #1a2540",color:"#8892a4",
          borderRadius:5,padding:"5px 14px",fontSize:11,letterSpacing:.8,cursor:"pointer"}}>
        {detail?"MASQUER LE DÉTAIL DE LA SÉANCE ▴":"DÉTAIL DE LA SÉANCE ▾"}</button>}
      {!semaine&&detail&&blocConstats}
      {!semaine&&detail&&<SeanceDetail b={src}/>}

      {/* ⚠️ Le palmarès n'existe que sur la semaine : sur une séance, il
          doublonnerait les plus fortes hausses déjà présentes ailleurs. */}
      {semaine&&(h.hausses||[]).length>0&&
        <div className="carte" style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:16}}>
          <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,textTransform:"uppercase",marginBottom:10}}>Palmarès de la semaine</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
            {[["Hausses",h.hausses||[],"#00e5a0"],["Baisses",h.baisses||[],"#ff4f5a"]].map(([t,l,c])=>(
              <div key={t}>
                <div style={{fontSize:10,color:"#5a6478",marginBottom:6}}>{t}</div>
                {l.map(x=>(
                  <div key={x.symbol} style={{display:"flex",justifyContent:"space-between",fontSize:12.5,padding:"3px 0"}}>
                    <span style={{color:"#c8d3e8"}}>{x.symbol}
                      {/* ⚠️ R11 — une reprise après OPA change la RÉFÉRENCE.
                          La performance est réelle mais ne se compare pas. */}
                      {x.reprise_recente&&<span title="Reprise de cotation récente : la référence a été fixée par l'autorité de marché, cette performance ne se compare pas aux autres." style={{color:"#ffd740",marginLeft:5,fontSize:10}}>⚠ reprise</span>}
                    </span>
                    {/* ⚠️ DEUX CONVENTIONS DANS LE MÊME PANNEAU — corrigé le
                        25/09. Le palmarès affichait « +6.9 % » à côté de
                        « +46.33 % », et un point décimal alors que le constat
                        juste au-dessus écrit « 1,57 % » avec une virgule. Un
                        chiffre qui dénote est le premier dont on se méfie. */}
                    <span style={{color:c,fontFamily:"monospace"}}>{x.perf_pct>0?"+":""}{fmt(x.perf_pct).replace(".",",")} %</span>
                  </div>))}
              </div>))}
          </div>
        </div>}

      <div className="carte" style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:16}}>
        <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,textTransform:"uppercase",marginBottom:4}}>Publications retenues</div>
        <div style={{fontSize:11,color:"#5a6478",marginBottom:12}}>
          Sélection du collecteur — les publications susceptibles de déplacer un cours.
          {a.fenetre&&<> Fenêtre du {a.fenetre.du} au {a.fenetre.au}.</>}
          {" "}Titre et lien seulement : le texte appartient à sa source.
        </div>
        {liens.length===0
          ?<div style={{color:"#8892a4",fontSize:13}}>Aucune publication retenue sur cette fenêtre.</div>
          :liens.map((x,i)=>(
            <a key={i} href={x.url} target="_blank" rel="noopener noreferrer"
              style={{display:"block",padding:"8px 0 8px 10px",marginBottom:6,
                borderBottom:i<liens.length-1?"1px solid #0a1220":"none",
                borderLeft:`2px solid ${x.officielle?"#00e5a0":"#1a2540"}`,textDecoration:"none"}}>
              <div style={{fontSize:13,color:"#c8d3e8",marginBottom:3}}>{x.titre}</div>
              <div style={{fontSize:10.5,color:"#5a6478",display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                {(x.tickers||[]).map(t=><span key={t} style={{color:"#4db8ff",fontWeight:600}}>{t}</span>)}
                <span>{x.source}</span><span>·</span><span>{x.date}</span>
                {x.type&&<><span>·</span><span>{x.type}</span></>}
                {/* ⚠️ Un communiqué déposé au régulateur et un article de presse
                    n'engagent pas la même chose — la distinction doit se voir. */}
                {x.officielle&&<span style={{color:"#00e5a0"}}>· source officielle</span>}
              </div>
            </a>))}
      </div>
    </div>);
};

// ── MARCHÉS MONDIAUX (02/10/2026) ───────────────────────────────────────────
// Indices, risque et devises, matières premières — `marches_mondiaux.json`,
// relevé par le moteur à chaque passage (pipeline/marches_mondiaux.py). Chaque
// valeur garde l'heure que la source déclare : un différé se voit. Contexte
// seulement : rien de ceci n'entre dans la note.
const MarchesMondiaux=()=>{
  const [d,setD]=useState(null);const [etat,setEtat]=useState("chargement");
  useEffect(()=>{fetch("marches_mondiaux.json?t="+Math.floor(Date.now()/600000))
    .then(r=>r.ok?r.json():null).catch(()=>null).then(x=>{setD(x);setEtat(x?"ok":"absent");});},[]);
  if(etat==="chargement")return <Squelette blocs={[4,4,4]} titre="Chargement des marchés mondiaux"/>;
  if(etat==="absent")return <div className="carte" style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:20,color:"#8892a4"}}>Les marchés mondiaux n'ont pas encore été relevés par le moteur.</div>;
  const VC=x=>x>0?"#00e5a0":x<0?"#ff4f5a":"#8892a4";
  const unite=l=>l.devise==="MAD"?" MAD":l.devise==="USD"&&l.nom!=="VIX"&&l.nom!=="Indice dollar"?(l.nom.startsWith("Charbon")?" USD/t":" USD"):"";
  const heure=iso=>iso?`${iso.slice(8,10)}/${iso.slice(5,7)} ${iso.slice(11,16)} UTC`:"—";
  return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(min(300px,100%),1fr))",gap:12}}>
        {(d.groupes||[]).map(g=>(
          <div key={g.titre} className="carte" style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:16}}>
            <div style={{fontSize:12,color:"#e6edf7",fontWeight:600,marginBottom:10}}>{g.titre}</div>
            {g.lignes.length===0&&<div style={{fontSize:12,color:"#5a6478"}}>Non servi par la source à ce passage.</div>}
            {g.lignes.map(l=>(
              <div key={l.ticker} title={`${l.description_source} — ${heure(l.horodatage_utc)} — ${l.mode_source}`}
                style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:10,padding:"8px 0",borderBottom:"1px solid #0a1220"}}>
                <span style={{color:"#c8d3e8",fontSize:13.5}}>{l.nom}</span>
                <span style={{fontFamily:"monospace",whiteSpace:"nowrap"}}>
                  <span style={{color:"#e6edf7",fontSize:13.5}}>{nfr(l.valeur,l.valeur>=1000?1:2)}{unite(l)}</span>
                  <span style={{color:VC(l.variation_pct),fontSize:12,marginLeft:10}}>{l.variation_pct==null?"—":`${l.variation_pct>0?"+":""}${nfr(l.variation_pct)} %`}</span>
                </span>
              </div>))}
          </div>))}
      </div>
      <div style={{fontSize:10.5,color:"#5a6478"}}>Source : TradingView (scanner public), relevé le {heure(d.releve_utc)}. Les valeurs peuvent être différées de 10 à 15 minutes, comme la source le déclare (survol d'une ligne pour son heure exacte). Contexte seulement : n'entre pas dans la note.</div>
    </div>);
};

// ── TICKER NEWS (inline dans Detail) ─────────────────────────────────────────
const TickerNews=({sym})=>{
  const [articles,setArticles]=useState([]);
  const [ok,setOk]=useState(false);
  useEffect(()=>{
    fetch("news.json?t="+Math.floor(Date.now()/3600000))
      .then(r=>r.ok?r.json():null)
      .then(d=>{if(d?.articles)setArticles((d.articles||[]).filter(a=>(a.tickers||[]).includes(sym)).slice(0,6));setOk(true);})
      .catch(()=>setOk(true));
  },[sym]);
  const SC=s=>s==="POSITIF"?"#00e5a0":s==="NEGATIF"?"#ff4f5a":"#8892a4";
  const fmtD=iso=>{try{return new Date(iso).toLocaleString("fr-FR",{timeZone:"Africa/Casablanca",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}catch{return "";}};
  if(!ok||articles.length===0)return null;
  return(
    <div className="carte" style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12}}>
      <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,marginBottom:10,textTransform:"uppercase"}}>Actualités — {sym}</div>
      {articles.map(a=>(
        <a key={a.id} href={a.url} target="_blank" rel="noopener noreferrer"
          style={{display:"block",paddingLeft:8,paddingBottom:8,marginBottom:8,borderBottom:"1px solid #0a1220",borderLeft:`2px solid ${SC(a.sentiment)}`,textDecoration:"none"}}>
          <div style={{fontSize:11,color:"#c8d3e8",lineHeight:1.4,marginBottom:3}}>{a.title}</div>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <span style={{fontSize:9,color:SC(a.sentiment),fontWeight:700}}>{a.sentiment||"NEUTRE"}</span>
            <span style={{fontSize:9,color:"#8892a4"}}>{a.source}</span>
            <span style={{fontSize:9,color:"#8892a4",marginLeft:"auto"}}>{fmtD(a.date)}</span>
          </div>
        </a>
      ))}
    </div>
  );
};

// ── DETAIL ────────────────────────────────────────────────────────────────────
const Detail=({rows,sel,setSel,fav=[],toggleFav=()=>{},scoreMode})=>{
  const [detSearch,setDetSearch]=useState("");
  const r=rows.find(x=>(x.symbol||x.ticker)===sel)||rows[0];
  // ⚠️ La fiche doit suivre la pondération choisie, exactement comme le
  // classement. Sans cela elle affiche le v5.3 du moteur quelle que soit la
  // vue, et donne pour le même titre un score qui contredit le tableau.
  // Oublié le 08/09 ; signalé par Abd Moutalib : « le score ne bouge pas ».
  const simu=!!(scoreMode&&!scoreMode.officiel);
  // Teinte de la carte : couleur du palier de note, neutre en simulation ou
  // à confiance ≤ 1. Plus aucun mot d'action (07/10/2026).
  const cn=couleurNote(r);
  const s=simu||!cn||meta(r).conf<=1?NEUTRE:teinte(cn.c);
  const scoreAffiche=computeDisplayScore(r,scoreMode);
  const manqueAff=composantesManquantes(r,scoreMode);
  // La répartition qui a réellement produit `scoreAffiche`.
  // ⚠️ SCORE CANONIQUE — 29/09/2026. La fiche affichait ici un écart à la « note BVC »
  // à une note de référence qui n'était pas calculée : une table saisie le
  // 03/06, jamais rafraîchie, 21 titres sur 80 à 5,00 par défaut. Un seul
  // verdict est affiché désormais, avec la version de la formule qui l'a
  // produit.
  const pdsAff=poidsAffiches(r,scoreMode);
  const price=r.price||r.prix;
  const h90=r.h90||r.high90;const l90=r.l90||r.low90;
  /* Les objectifs sont nullifiés côté pipeline quand ils ne sont plus à
     l'échelle du cours (opération sur titres, cible périmée). Sans garde,
     `null - price` valait 0 et l'écart s'affichait -100%. */
  const objectifs=r.bear!=null&&r.base!=null&&r.bull!=null;
  const ecart=v=>v==null||!price?"—":`${((v-price)/price*100).toFixed(1)}%`;
  const upside=objectifs?((r.bull-price)/price*100).toFixed(1):null;
  const pos=objectifs&&r.bull!==r.bear
    ?Math.min(98,Math.max(2,(price-r.bear)/(r.bull-r.bear)*100)):50;
  const sym=r.symbol||r.ticker;
  const rsiVal=r.rsi??r.rsi14??null;

  /* Les pastilles du filtre suivaient l'ordre du CLASSEMENT — donc un ordre qui
     change à chaque run. On cherche un titre par son nom, pas par son rang :
     l'ordre alphabétique est le seul stable. `[...rows]` : `rows` est la liste
     du classement, la trier en place la réordonnerait aussi dans l'onglet
     CLASSEMENT. Le tri porte sur le code AFFICHÉ (`tk`), pas sur le symbole
     interne, sinon l'œil ne suit pas. */
  const visRows=(detSearch.trim()
    ? rows.filter(d=>{const q=detSearch.trim().toUpperCase();return (d.symbol||d.ticker||"").includes(q)||tk(d).includes(q)||(d.name||"").toUpperCase().includes(q);})
    : [...rows]).sort((a,b)=>tk(a).localeCompare(tk(b)));

  /* Téléphone (07/10/2026) : la fiche s'ouvrait là où était le classement,
     son haut hors de l'écran (y = −192 mesuré à 390 px). On l'amène en haut
     à l'ouverture et à chaque changement de titre. */
  const refFiche=useRef(null);
  useEffect(()=>{
    try{
      if(refFiche.current&&window.matchMedia&&window.matchMedia("(max-width:640px)").matches)
        refFiche.current.scrollIntoView({block:"start"});
    }catch(e){}
  },[sel]);

  return(
    <div ref={refFiche}>
      <div className="selecteur-titres" style={{display:"flex",gap:8,marginBottom:8,alignItems:"center",flexWrap:"wrap"}}>
        <input value={detSearch} onChange={e=>setDetSearch(e.target.value)}
          placeholder="Filtrer ticker…"
          style={{background:"#0d1829",border:"1px solid #1a2540",color:"#c8d3e8",borderRadius:4,padding:"4px 8px",fontSize:11,fontFamily:"var(--font)",width:160,outline:"none"}}/>
        {detSearch&&<button onClick={()=>setDetSearch("")} style={{fontSize:10,color:"#8892a4",border:"none",background:"transparent"}}>✕</button>}
      </div>
      <div className="selecteur-titres" style={{display:"flex",gap:4,marginBottom:14,flexWrap:"wrap",maxHeight:96,overflowY:"auto",padding:"4px 0"}}>
        {visRows.map(d=>{const sym2=d.symbol||d.ticker;const cd=couleurNote(d);const ds=simu||!cd||meta(d).conf<=1?NEUTRE:teinte(cd.c);const a=sel===sym2;return(
          <button key={sym2} onClick={()=>setSel(sym2)} style={{background:a?ds.bg:"transparent",border:a?`1px solid ${ds.bd}`:"1px solid #1a2540",color:a?ds.fg:"#8892a4",padding:"2px 7px",borderRadius:3,fontSize:10,fontWeight:a?700:400,transition:"all .15s"}}>{tk(d)}</button>
        );})}
      </div>
      {r.warn&&<div style={{background:"rgba(255,215,64,.08)",border:"1px solid rgba(255,215,64,.3)",borderRadius:6,padding:"10px 14px",marginBottom:12,fontSize:13,color:"#ffd740"}}>⚠️ {r.warnMsg}</div>}

      <div className="detail-grid">
        {/* LEFT */}
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {/* Score card */}
          <div style={{background:`linear-gradient(135deg,${s.bg},#0d1829)`,border:`1px solid ${s.bd}`,borderRadius:8,padding:16,textAlign:"center"}}>
            <div style={{display:"flex",justifyContent:"center",marginBottom:10}}>
              <CompanyLogo sym={tk(r)} logo={r.symbol} sector={r.sector} size={56}/>
            </div>
            <div style={{fontSize:12,color:"#8892a4",letterSpacing:2,marginBottom:4,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              <span>{tk(r)} · {px(price)} DH<Perime r={r}/> <span style={{color:VC(r.chg),fontWeight:600}}>{r.chg>0?"▲":"▼"} {Math.abs(r.chg).toFixed(2)}%{r.chg_alert&&<span title="Variation ≥ ±8% — approche limite BVC" style={{marginLeft:3}}>⚡</span>}</span></span>
              <button onClick={()=>toggleFav(sym)} title={fav.includes(sym)?"Retirer des favoris":"Ajouter aux favoris"}
                className="etoile" aria-pressed={fav.includes(sym)}
                style={{fontSize:18,color:fav.includes(sym)?"#ffd740":"#8892a4",border:"none",background:"none",cursor:"pointer",padding:"0 2px",lineHeight:1,transition:"color .2s"}}>
                {fav.includes(sym)?"★":"☆"}
              </button>
            </div>
            {/* Le score reste affiché même à faible confiance — mais en gris,
                pour qu'il ne se lise pas comme une conclusion (CLAUDE.md). */}
            <div style={{fontSize:52,fontWeight:700,
                 color:couleurChiffre(r,simu),
                 textShadow:meta(r).conf<=1||simu?"none":`0 0 30px ${s.fg}40`,
                 lineHeight:1}}>{fmt(scoreAffiche)}</div>
            <div style={{fontSize:11,color:"#8892a4",margin:"4px 0 6px"}}>
              Score composite / 10{simu&&<span style={{color:"#ffd740"}}> · {scoreModeLabel(scoreMode)}</span>}
            </div>
            {/* ⚠️ Une note absente doit DIRE ce qui manque. Un « — » muet se
                lit comme une panne d'affichage ; nommé, il se lit comme un
                refus de calculer sur une donnée qu'on n'a pas. */}
            {manqueAff.length>0&&(
              <div style={{fontSize:10,color:"#ff8f00",lineHeight:1.4,
                   margin:"0 0 8px",maxWidth:250}}>
                Score indisponible pour cette pondération —{" "}
                {manqueAff.length>1?"composantes absentes":"composante absente"} :{" "}
                <b>{manqueAff.join(", ")}</b>.<br/>
                Aucune valeur approchée n'est affichée à la place.
              </div>
            )}
            <div style={{marginBottom:10}}><Confiance r={r} sz={13}/></div>
            {/* Une couleur calculée sur des données de repli induit en
                erreur : à confiance ≤ 1 on l'annonce comme tel plutôt que de
                colorer une note que rien ne soutient (règle CLAUDE.md). */}
            {/* ⚠️ Même règle qu'au classement : le signal n'existe que pour
                la pondération officielle. Oublié ici le 08/09 — la fiche
                affichait le v5.3 du moteur quelle que soit la vue choisie,
                donc un score qui contredisait le classement pour le même
                titre. Signalé par Abd Moutalib : « le score ne bouge pas ». */}
            {simu
              ? <Chip label="SIMULATION — couleur masquée" bg="rgba(255,215,64,.10)" fg="#ffd740" bd="#ffd74040" sz={12}/>
              : meta(r).susp
              ? <Chip label={`SUSPENDU depuis le ${jjmm(meta(r).suspDepuis)}`} bg="rgba(255,107,107,.12)" fg="#ff6b6b" bd="#ff6b6b40" sz={12}/>
              : meta(r).conf<=1
              ? (meta(r).reprise_recente
                 ? <Chip label={`REPRISE — ${meta(r).seances_depuis_reprise} séance(s)`} bg="rgba(255,215,64,.12)" fg="#ffd740" bd="#ffd74040" sz={12}/>
                 : <Chip label="Données insuffisantes" bg="rgba(136,146,164,.12)" fg="#8892a4" bd="#2a3550" sz={12}/>)
              : <PastilleNote r={r} sz={12}/>}
            {/* Le motif, pour que la suspension ne soit pas une énigme : une
                OPA n'est pas une sanction, et la nuance change tout pour le
                lecteur. */}
            {meta(r).susp&&meta(r).suspMotif&&!simu&&
              <div style={{marginTop:6,fontSize:10,color:"#8892a4"}}>{meta(r).suspMotif}</div>}
            {!simu&&r.score_version&&<div style={{marginTop:8,fontSize:10,color:"#5a6478"}}>formule {r.score_version}</div>}
          </div>

          {/* Fundamentaux */}
          <div className="carte" style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12}}>
            {/* ⚠️ LA LIQUIDITÉ, AFFICHÉE PARCE QU'ELLE PLAFONNE LA CONFIANCE.
                Ajouté le 25/09. Le moteur rabaisse la confiance à 2 sous
                100 000 DH échangés par séance — 27 titres sur 80 — sans que
                rien ne le dise à l'écran. Un plafond qu'on ne peut pas
                vérifier ne se discute pas.
                ⚠️ En DIRHAMS et non en titres : dix titres de CMT valent
                35 670 DH, dix d'Addoha en valent 370. */}
            {(()=>{const dh=meta(r).echange_median_dh;
              if(dh==null) return null;
              const bas=dh<100000;
              return <div style={{marginBottom:10,padding:"6px 8px",borderRadius:4,
                  background:bas?"rgba(255,143,0,.08)":"#0a1220",
                  border:`1px solid ${bas?"rgba(255,143,0,.3)":"#1a2540"}`}}>
                <div style={{fontSize:8,color:"#8892a4",textTransform:"uppercase",marginBottom:2}}>Échangé par séance (médiane 20 j)</div>
                <div style={{fontSize:13,fontWeight:700,color:bas?"#ff8f00":"#c8d3e8"}}>
                  {dh>=1e6?`${(dh/1e6).toFixed(1)} M DH`:dh>=1e3?`${(dh/1e3).toFixed(0)} k DH`:`${dh} DH`}
                  {bas&&<span style={{fontSize:10,fontWeight:400,marginLeft:6}}>· confiance plafonnée — un ordre courant déplacerait le cours</span>}
                </div>
              </div>;})()}

            {/* ⚠️ LES NIVEAUX — ajouté le 25/09/2026, et le point n'est pas
                d'en afficher : c'est de DIRE LESQUELS SONT DES FAITS.
                Un briefing extérieur écrit « 620 = pivot ; 635-645 = pullback
                digéré » sans dire d'où viennent ces nombres — le lecteur ne
                peut ni les reproduire ni les contester.
                ⚠️ La borne réglementaire est le niveau le plus sûr de tous, et
                personne ne le publie comme tel : le cours de demain est borné
                PAR LA LOI (R10), pas par une opinion.
                ⚠️ Aucun n'entre dans le score (R8) et aucun ne dit quoi faire. */}
            {(()=>{const nv=r.niveaux; if(!nv) return null;
              const f=nv.faits||{}, cv=nv.conventions||{}, bs=f.bornes_seance;
              const L=(lbl,val,extra,coul)=>(
                <div key={lbl} style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",fontSize:11.5,padding:"2px 0"}}>
                  <span style={{color:"#8892a4"}}>{lbl}</span>
                  <span><span style={{color:coul||"#c8d3e8",fontFamily:"monospace",fontWeight:600}}>{val}</span>
                    {extra&&<span style={{color:"#5a6478",fontSize:10}}> {extra}</span>}</span>
                </div>);
              return <div style={{marginBottom:12}}>
                <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,marginBottom:8,textTransform:"uppercase"}}>Niveaux</div>

                <div style={{background:"#0a1220",border:"1px solid #1a2540",borderRadius:4,padding:"8px 10px",marginBottom:6}}>
                  <div style={{fontSize:8.5,color:"#00e5a0",textTransform:"uppercase",letterSpacing:.6,marginBottom:5}}>
                    Établis · ce que le marché a fait, ou ce que la règle interdit</div>
                  {bs&&L("Prochaine séance, bornes ±10 %",`${fr(bs.plancher)} — ${fr(bs.plafond)}`,"règle BVC","#00e5a0")}
                  {Object.entries(f.moyennes||{}).filter(([k])=>!k.startsWith("_")).map(([k,v])=>
                    L(k.toUpperCase(),fr(v.niveau),`cours ${v.position} · ${v.distance_pct>0?"+":""}${fr(v.distance_pct,1)} %`))}

     plus haut », relayé par BourseNews en catégorie « bvc », comptait comme
     marocain. Le radar a été corrigé le 19/08 mais pas cet onglet, d'où deux
