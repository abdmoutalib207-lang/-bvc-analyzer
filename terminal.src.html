                /* ROE que la note écarte : « sans objet », la raison au survol
                   et au toucher, jamais le chiffre brut (AFM 103,2 %). */
                const so=cle.startsWith("roe_")?roeSansObjet(r):null;
                const titre=so?`ROE sans objet : ${so}`:x?`${x.formule}${x.denominateur?` — dénominateur : ${x.denominateur}`:""}\nComptes au ${x.date.split("-").reverse().join("/")}\n${Object.values(x.sources||{}).filter(Boolean).join("\n")}`:"Terme manquant dans les comptes relevés : non calculé";
                return(
                <div key={k} title={titre} style={{background:"#0a1220",borderRadius:4,padding:"6px 8px"}}>
                  <div style={{fontSize:8,color:"#8892a4",marginBottom:2,textTransform:"uppercase"}}>{k}<InfoCellule texte={titre}/></div>
                  {so?<><div style={{fontSize:13,color:"#8892a4",fontWeight:700}}>sans objet</div>
                    <div style={{fontSize:8,color:"#5a6478"}}>écarté de la note</div></>:<>
                  <div style={{fontSize:13,color:x?(x.valeur>=0?"#c8d3e8":"#ff4f5a"):"#5a6478",fontWeight:700}}>{x?`${fmt(x.valeur,1)}%`:"—"}</div>
                  {x&&<div style={{fontSize:8,color:"#5a6478"}}>au {x.date.split("-").reverse().join("/")}</div>}</>}
                </div>);})}
            </div>
            {r.ratios_publies.reserve_cac&&(
              <div title={r.ratios_publies.reserve_cac.source} style={{marginTop:7,padding:"6px 8px",borderRadius:4,background:"rgba(255,143,0,.08)",border:"1px solid rgba(255,143,0,.3)",fontSize:10,color:"#ffb74d",lineHeight:1.4,cursor:"help"}}>
                <b>⚠ Réserve des commissaires aux comptes</b> — {r.ratios_publies.reserve_cac.texte}
              </div>)}
          </div>)}

          {/* Fondamentaux prévisionnels — IDBourse DATA+.
              Bloc distinct, jamais fondu dans celui du dessus : ces ratios
              portent sur le bénéfice ATTENDU, ceux du dessus sur le réalisé.
              Un PER de 7 réalisé et 29 attendu ne se contredisent pas, ils
              disent que le bénéfice est prévu en baisse. Le libellé et la date
              d'export sont affichés pour que la distinction se lise. */}
          {r.fwd&&(
          <div className="carte" style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:10,gap:8,flexWrap:"wrap"}}>
              <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,textTransform:"uppercase"}}>Prévisionnel <span style={{color:"#4db8ff"}}>IDBourse DATA+</span> <span style={{color:"#ff8f00"}}>non vérifié</span></div>
              {/* Date d'export en entier, année comprise : l'export est
                  rafraîchi à la main et vieillit. « 01/07 » seul ne dit pas
                  qu'il a sept semaines, « 01/07/2026 » le laisse voir. */}
              <div style={{fontSize:9,color:"#ff8f00"}}>export IDBourse DATA+ du {r.fwd.asof?r.fwd.asof.split("-").reverse().join("/"):"—"}, non vérifié</div>
            </div>
            {/* ⚠️ DOUBLON CONTRADICTOIRE RETIRÉ — 06/10/2026 (audit
                verificateur-finance). WAF montrait deux ROE 2025 : 6,9 calculé
                sur les comptes, 11,2 DATA+. Quand le ROE 2025 est calculé sur
                comptes publiés, seul celui-là s'affiche (bloc du dessus). */}
            {(()=>{const roeCalc=r.ratios_publies&&r.ratios_publies.roe_2025&&r.ratios_publies.roe_2025.valeur!=null;
              const dateExport=r.fwd.asof?r.fwd.asof.split("-").reverse().join("/"):"date inconnue";
              const cases=[["PER 2026e",fmt(r.fwd.per_26e,1),r.fwd.per_26e>25?"#ff8f00":"#c8d3e8"],
                ["PER 2027e",fmt(r.fwd.per_27e,1),r.fwd.per_27e>25?"#ff8f00":"#c8d3e8"],
                ["Rendement 2026e",r.fwd.dy_26e!=null?`${fmt(r.fwd.dy_26e,1)}%`:"—",r.fwd.dy_26e>4?"#00e5a0":"#c8d3e8"],
                ["Rendement 2027e",r.fwd.dy_27e!=null?`${fmt(r.fwd.dy_27e,1)}%`:"—",r.fwd.dy_27e>4?"#00e5a0":"#c8d3e8"],
                ...(roeCalc?[]:[["ROE 2025",roeSansObjet(r)?"sans objet":r.fwd.roe_25!=null?`${fmt(r.fwd.roe_25,1)}%`:"—",
                  roeSansObjet(r)?"#8892a4":r.fwd.roe_25>=0?"#c8d3e8":"#ff4f5a",
                  roeSansObjet(r)?`ROE sans objet : ${roeSansObjet(r)}`:null]]),
                ["Marge nette 2025",r.fwd.marge_nette_25!=null?`${fmt(r.fwd.marge_nette_25,1)}%`:"—",r.fwd.marge_nette_25>=0?"#c8d3e8":"#ff4f5a"]];
              return(<>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
              {cases.map(([k,v,c,so])=>{

                const statut=so||(/20(2[6-9])e$/.test(k)?`estimation DATA+ du ${dateExport}, non vérifiée`:`export DATA+ du ${dateExport}, non vérifié`);

                  <div style={{fontSize:13,color:c,fontWeight:700,fontVariantNumeric:"tabular-nums"}}>{v}</div>
                  <div style={{fontSize:8,color:so?"#5a6478":"#ff8f00",lineHeight:1.35,marginTop:1,textWrap:"pretty"}}>{so?"écarté de la note":statut}</div>

/* 07/10/2026 — pour un testeur non expert, tenue sur un écran de téléphone.
   Chaque phrase a été vérifiée contre le code (R12) : seuils de signal dans
   `compute_v53`, critères de confiance dans `_meta_ticker`, plafond de

   `SignauxTechniques`. Aucun chiffre de marché en dur : ils vieilliraient. */
const Guide=({setTab})=>{
  // Sur téléphone l'en-tête n'est pas collant et occupe ~600 px : sans ce
  // défilement, le guide s'ouvrirait sous la ligne de flottaison.
  const ref=useRef(null);
  useEffect(()=>{try{ref.current&&ref.current.scrollIntoView({block:"start"});}catch(e){}},[]);
  const T=({c,children})=><b style={{color:c||"#e8eef8"}}>{children}</b>;
  const L=({titre,children})=>(
    <div style={{padding:"5px 0",borderTop:"1px solid #1a2540"}}>
      <div style={{fontSize:12,color:"#4db8ff",fontWeight:700,marginBottom:1}}>{titre}</div>
      <div style={{fontSize:12,color:"#c8d3e8",lineHeight:1.45}}>{children}</div>
    </div>);
  return(
    <div ref={ref} className="carte guide" style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:"10px 12px",maxWidth:720,margin:"0 auto",scrollMarginTop:8}}>
      <div style={{fontSize:15,fontWeight:700,color:"#e8eef8",marginBottom:5}}>Comment lire l'écran</div>
      <div style={{fontSize:12,color:"#ffd740",lineHeight:1.45,background:"rgba(255,215,64,.07)",border:"1px solid rgba(255,215,64,.3)",borderRadius:6,padding:"6px 9px",marginBottom:3}}>
        <b>L'outil ne prédit pas. Ce n'est pas un conseil en investissement. Données J+1, pas de temps réel.</b> Après 15h30, les cours sont ceux de la dernière clôture. Pendant la séance, des relevés intermédiaires (vers 10h et 12h) donnent la dernière valeur relevée, pas un cours définitif : une lecture « à ce stade » peut encore changer jusqu'à la clôture. Il montre des notes et des fréquences passées.
      </div>
      <L titre="Note /10">Moyenne de deux piliers sur 10 : <T>fondamental</T> (rentabilité, croissance, valorisation, bilan — ≈ 2/3) et <T>technique</T> (tendance, RSI — ≈ 1/3, 0 sur un titre peu liquide). <a onClick={()=>setTab&&setTab("weights")} style={{color:"#4db8ff",cursor:"pointer",textDecoration:"underline"}}>Détail des poids</a></L>
      <L titre="Couleur de la note">La note est colorée selon son palier, sans mot d'action : <T c="#00e5a0">● vert</T> dès 6,5 · <T c="#b5e655">● vert-jaune</T> dès 5,5 · <T c="#ffd740">● jaune</T> dès 4,5 · <T c="#ff8f00">● orange</T> dès 3,5 · <T c="#ff4f5a">● rouge</T> dessous. La couleur situe la note ; elle ne dit pas quoi faire. Titre trop peu échangé : une note dès 6,5 reste en vert-jaune, avec la mention « titre peu échangé ». <T c="#8892a4">Données insuffisantes</T> : confiance 0 ou 1, note grise. <T c="#ff6b6b">SUSPENDU</T> : le titre ne cote pas.</L>
      <L titre="Note non comparable">Un titre très peu échangé — pilier technique neutralisé, et moins de 100 000 DH échangés par séance en médiane sur ses 20 dernières séances échangées — garde sa note, affichée en gris avec la mention « non comparable » et la médiane réelle. Avec si peu d'échanges, le cours peut sauter d'un côté à l'autre du carnet : la note ne se compare pas à celle d'un titre liquide. Aucune couleur de palier ; le titre est classé après tous les titres comparables et sort des « mieux notés » de l'accueil.</L>
      <L titre="Fiabilité des données ●●●○○">Un point par garantie : prix de la dernière séance · fondamentaux réels · historique ≥ 15 séances échangées · comptes déposés à l'AMMC · liquidité ≥ 100 000 DH par séance. Titre peu liquide : 2/5 au plus.</L>
      <L titre="« X % gagnants (IC) · n cas » — fiche, Signaux techniques">Sur n cas passés à la BVC où le même signal est apparu, X % ont battu le MASI 60 séances après ; IC = fourchette plausible. Plus n est grand, plus c'est solide. Une fréquence passée, pas une promesse.</L>
      <L titre="S/R — supports et résistances du graphique">Tirés de la fenêtre affichée : un creux est un plus-bas sous lequel aucune des 3 séances échangées voisines, de chaque côté, ne descend — un sommet, l'inverse ; creux et sommets à moins de 1,2 % l'un de l'autre font un seul niveau, car un même prix peut avoir été l'un puis l'autre. Il faut au moins 10 séances échangées dans la fenêtre. <T>Contact</T> : un épisode — une ou plusieurs séances échangées consécutives dont la fourchette plus-bas–plus-haut passe à moins de 1,2 % du niveau ; une séance sans échange au milieu ne le coupe pas. La même tolérance de 1,2 % sert à regrouper les points et à compter les contacts, pour tous les titres. <T>Niveaux retenus</T> : les plus touchés de toute la fenêtre, et non les plus proches du cours — au plus 3 au-dessus du dernier cours et 3 au niveau ou en dessous, à partir de 2 contacts ; à égalité, le contact le plus récent, puis le plus proche du cours. <T>Proche du cours</T> : de chaque côté, s'y ajoute au plus un niveau non retenu — le plus proche du cours parmi ceux qui ont au moins 2 contacts, respectent l'écart minimal avec les niveaux affichés et se trouvent à moins de 2 ATR(14) de la dernière clôture. Il est tracé comme les autres et marqué « proche » dans la légende : un niveau moins touché réapparaît quand le cours s'en approche. Au plus 4 niveaux de chaque côté. <T>Écart minimal</T> : deux niveaux tracés sont distants d'au moins 1 ATR(14) relatif du titre — la moyenne des 14 dernières étendues séance (plus-haut − plus-bas, élargi à la clôture précédente) rapportée à la dernière clôture — et jamais de moins de 2,4 % (deux fois la tolérance : en deçà, deux niveaux se partageraient leurs contacts). Un niveau trop proche d'un niveau mieux classé est écarté, pas fusionné. La valeur du titre est écrite sous la légende. <T>Le mot suit la position</T> : au-dessus de la dernière clôture, Résistance ; au niveau ou en dessous, Support. <T>Par-dessus, par-dessous</T> : la clôture de la séance échangée qui précède le contact dit d'où le cours arrive — par-dessus, il joue le rôle de support ; par-dessous, de résistance. <T>Tenu</T> : un support abordé par-dessus dont la clôture de fin d'épisode reste au niveau ou au-dessus (une résistance : abordée par-dessous, clôture au niveau ou en dessous). Un contact venu de l'autre côté n'est ni tenu ni cassé : il est compté à part. <T>Inversion</T> : quand les contacts passent d'un rôle à l'autre une seule fois, la légende l'écrit — « résistance jusqu'au 12/06 (2), support depuis (3, tenu 2) » : le dernier contact dans l'ancien rôle est daté, et chaque rôle porte son nombre de contacts. Quand les rôles ont alterné plusieurs fois, elle ne nomme aucun rôle : elle donne la période des contacts et les comptes par-dessus et par-dessous — « 20 contacts du 12/11/25 au 12/10/26 : 12 par-dessus (tenu 8) · 8 par-dessous ». « Sens inconnu » : contact au début de la fenêtre, ou clôture précédente pile au niveau. <T>Séances écartées</T> : volume nul — le titre n'a pas échangé, ou la bougie a été refaite depuis la seule clôture — et bougie du jour reconstituée depuis le dernier cours. Aucun plus-haut ni plus-bas n'y a été atteint ou mesuré : elles fabriqueraient des creux. Elles restent dessinées. Des séances passées, comptées et datées ; pas un niveau annoncé.</L>
      <L titre="FIG — figures chartistes du graphique">Motifs relevés sur les clôtures des 60 dernières séances échangées, règles fixées avant toute mesure. Un sommet ou un creux est un retournement d'au moins 6 %, et n'existe qu'à sa date de <T>confirmation</T>. <T>Double creux (2C) / double sommet (2S)</T> : deux creux (sommets) à moins de 3 % l'un de l'autre, 15 à 120 séances d'écart, séparés d'au moins 8 %. <T>ETE / ETE inversée</T> : cinq pivots, épaules à moins de 5 %, tête au-delà d'au moins 3 %. <T>Triangles</T> : quatre pivots alternés, côté plat à 2 %, côté incliné d'au moins 3 %. <T>Tasse avec anse</T> : creux de 12 à 40 %. <T>Fibonacci</T> : rebond entre 38,2 et 61,8 % d'une hausse d'au moins 20 %. La silhouette relie les pivots — pour un triangle, ses deux bornes ; la ligne de cou est en pointillés, sur l'étendue de sa figure, et une croix marque la cassure. Une figure ou une droite s'arrête à sa cassure, son invalidation ou son expiration ; seule une figure armée se prolonge jusqu'à la dernière séance. Les figures invalidées ou expirées sont tracées en pâle (« Masquer les figures passées » dans la légende) ; ETE, ETE inversée et doubles creux ou sommets portent une ligne de cou en trait plein et une aire translucide, sans aucune projection de cours ; un clic sur une ligne de la légende met sa figure en évidence. <T>Armée</T> : formée, pas encore cassée ; <T>cassure</T> : clôture au-delà de la ligne de cou ; <T>invalidée</T> : clôture au-delà du niveau d'invalidation avant ; <T>expirée</T> : 40 séances sans cassure (60 pour la tasse). Vert, rouge, violet : sens que le manuel prête au motif — un nom, pas une annonce. <T>La fréquence</T> : sur N cas passés (2023-2026), la part qui a fait mieux (motif haussier) ou moins bien (baissier) que le MASI 20 séances après la cassure, frais de 2 % d'aller-retour <T>non déduits</T>. Une figure armée n'a pas de fréquence propre : le chiffre décrit les cas où la cassure a eu lieu. Sous 30 cas : « échantillon insuffisant », aucun pourcentage.</L>
      <L titre="TEND — obliques et canaux">Mêmes sommets et creux que FIG. <T>Oblique descendante</T> : la droite qui joint deux sommets descendants écartés de 20 à 250 séances, prolongée jusqu'à la dernière séance ; cassée à la première clôture au-dessus. <T>Oblique ascendante</T> : deux creux montants, cassée à la première clôture en dessous. <T>Canal ascendant</T> : support par deux creux montants, parallèle par le sommet qui les sépare (pointillés) ; rebond = retour à moins de 2 % du support puis clôture 3 % au-dessus ; sortie par le bas = clôture 2 % sous le support. Fréquence : même lecture que FIG — après une cassure ou un rebond passé, frais non déduits, rien sous 30 cas.</L>
      <L titre="GAP — trous de cotation">Une séance dont le plus bas dépasse d'au moins 1 % le plus haut de la veille (gap haussier), ou l'inverse (baissier) ; seules les séances à extrêmes réels comptent, et jamais un écart de plus de 10 % de la clôture de la veille. La zone hachurée s'étend du plus haut de la veille au plus bas du jour du gap et s'arrête à son <T>comblement</T> : la zone entièrement traversée. <T>Partiellement comblé</T> : le cours est revenu dans la zone sans la traverser. Fréquence : la part des gaps passés comblés en 20 séances au plus ; pour un gap ouvert depuis 20 séances ou davantage, la part comblée dans les 60 séances suivant l'ouverture ; à 60 séances et au-delà, aucun taux : c'est hors de l'horizon mesuré. Un fait de marché, aucun achat supposé ; rien sous 30 cas.</L>
      <L titre="« non vérifié » · ⚠ jj/mm"><T c="#ff8f00">non vérifié</T> : source non recoupée, prudence. <T c="#ffd740">⚠ 05/08</T> près d'un cours : il date de ce jour-là, pas de la dernière séance.</L>
    </div>
  );
};

// ── NEWS FEED ─────────────────────────────────────────────────────────────────
const NewsFeed=()=>{
  const [allNews,setAllNews]=useState([]);
  const [loading,setLoading]=useState(true);
  const [scope,setScope]=useState("ALL");   // ALL | MAROC | INTERNATIONAL
  const [ticker,setTicker]=useState("ALL");
  const [updated,setUpdated]=useState(null);
  const [total,setTotal]=useState(0);

  useEffect(()=>{
    fetch("news.json?t="+Math.floor(Date.now()/3600000))
      .then(r=>r.ok?r.json():null)
      .then(d=>{if(d?.articles){setAllNews(d.articles);setUpdated(d.updated||null);setTotal(d.count||d.articles.length);}setLoading(false);})
      .catch(()=>setLoading(false));
  },[]);

  const fmtD=iso=>{try{return maroc(iso).toLocaleString("fr-FR",{timeZone:"UTC",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}catch{return iso||"";}};
  const fmtFull=iso=>{try{return maroc(iso).toLocaleString("fr-FR",{timeZone:"UTC",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}catch{return iso||"";}};

  /* La portée géographique est posée par article dans news.json, comme sur le
     radar. Elle était auparavant déduite de la catégorie — « geopolitique » et
     « commodites » réputées internationales, tout le reste marocain — ce qui
     confondait le SUJET et le PAYS : « le taux d'emprunt des États-Unis au
     plus haut », relayé par BourseNews en catégorie « bvc », comptait comme
     marocain. Le radar a été corrigé le 19/08 mais pas cet onglet, d'où deux
     décomptes contradictoires : le radar affichait 90 articles internationaux
     sur une fenêtre de trois jours quand le moteur n'en comptait que 88 sur
     la totalité. Un sous-ensemble ne peut pas être plus grand que le tout.
     Un article d'archive sans `scope` retombe sur l'ancienne règle, le temps
     qu'il expire. */
  const INTL_CATS=new Set(["geopolitique","commodites"]);
  const estIntl=a=>a.scope?a.scope==="INTL":INTL_CATS.has(a.category||"economie");
  const CAT_LABEL={"bvc":"BVC","economie":"Éco","macro":"Macro","geopolitique":"Géopolitique","commodites":"Matières 1ères"};
  const CAT_COLOR={"bvc":"#4db8ff","economie":"#8892a4","macro":"#ffd740","geopolitique":"#a78bfa","commodites":"#fb923c"};

  const scopeFiltered=useMemo(()=>{
    if(scope==="MAROC")         return allNews.filter(a=>!estIntl(a));
    if(scope==="INTERNATIONAL") return allNews.filter(a=> estIntl(a));
    return allNews;
  },[allNews,scope]);

  const tickersList=useMemo(()=>{
    const s=new Set();
    scopeFiltered.forEach(a=>(a.tickers||[]).forEach(t=>s.add(t)));
    return["ALL",...[...s].sort()];
  },[scopeFiltered]);

  const filtered=useMemo(()=>
    ticker==="ALL"?scopeFiltered:scopeFiltered.filter(a=>(a.tickers||[]).includes(ticker))
  ,[scopeFiltered,ticker]);


  const changeScope=s=>{setScope(s);setTicker("ALL");};

  if(loading)return<Squelette blocs={[2,2,2,2]} titre="Chargement des actualités"/>;

  if(allNews.length===0)return(
    <div style={{textAlign:"center",padding:"80px 20px",color:"#8892a4"}}>
      <div style={{fontSize:44,marginBottom:16,color:"#2a3550",letterSpacing:4}}>FIL VIDE</div>
      <div style={{fontSize:15,color:"#c8d3e8",marginBottom:10}}>Aucune actualité disponible</div>
      <div style={{fontSize:12,maxWidth:440,margin:"0 auto",lineHeight:1.8}}>
        Le workflow <code style={{background:"#0d1829",padding:"1px 6px",borderRadius:3,color:"#4db8ff"}}>fetch_news.yml</code> doit s'exécuter pour générer <code style={{background:"#0d1829",padding:"1px 6px",borderRadius:3,color:"#4db8ff"}}>news.json</code>.<br/>
        Déclenchement : automatique lun–ven toutes les 2h, ou manuel via GitHub Actions.
      </div>
    </div>
  );

  const nMaroc=allNews.filter(a=>!estIntl(a)).length;
  const nIntl =allNews.filter(a=> estIntl(a)).length;

  return(
    <div>
      {/* Sélecteur national / international */}
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {[
          {id:"ALL",         label:"TOUTES",         count:allNews.length,  color:"#c8d3e8"},
          {id:"MAROC",       label:"🇲🇦 MAROC",        count:nMaroc,          color:"#00e5a0"},
          {id:"INTERNATIONAL",label:"🌍 INTERNATIONAL",count:nIntl,           color:"#a78bfa"},
        ].map(({id,label,count,color})=>(
          <button key={id} onClick={()=>changeScope(id)}
            style={{
              flex:1,padding:"9px 10px",borderRadius:6,cursor:"pointer",
              background:scope===id?`rgba(${id==="MAROC"?"0,229,160":id==="INTERNATIONAL"?"167,139,250":"200,211,232"},.1)`:"#0d1829",
              border:scope===id?`1px solid ${color}60`:"1px solid #1a2540",
              color:scope===id?color:"#8892a4",
              fontWeight:scope===id?700:400,fontSize:12,letterSpacing:.5,
              transition:"all .15s",
            }}>
            {label}
            <span style={{marginLeft:6,fontSize:10,opacity:.7}}>{count}</span>
          </button>
        ))}
      </div>

      {/* Stats bar */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10,marginBottom:14}}>
        {[["Articles","#4db8ff",scopeFiltered.length],["Dernière MAJ","#ffd740",updated?fmtFull(updated):"—"]].map(([lbl,c,val])=>(
          <div key={lbl} style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:6,padding:"10px 12px"}}>
            <div style={{fontSize:9,color:"#8892a4",marginBottom:3,textTransform:"uppercase",letterSpacing:.5}}>{lbl}</div>
            <div style={{fontSize:lbl==="Dernière MAJ"?11:20,fontWeight:700,color:c,lineHeight:1.3}}>{val}</div>
          </div>
        ))}
      </div>

      {/* Filtre ticker (visible seulement si des tickers existent dans la vue courante) */}
      {tickersList.length>1&&(
        <div style={{display:"flex",gap:5,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
          <span style={{fontSize:10,color:"#8892a4",letterSpacing:1,marginRight:2}}>TICKER</span>
          {tickersList.map(t=>(
            <button key={t} onClick={()=>setTicker(t)}
              style={{background:ticker===t?"rgba(0,229,160,.12)":"transparent",border:ticker===t?"1px solid rgba(0,229,160,.4)":"1px solid #1a2540",color:ticker===t?"#00e5a0":"#8892a4",padding:"2px 8px",borderRadius:3,fontSize:10,cursor:"pointer",transition:"all .15s"}}>
              {t==="ALL"?"TOUS":t}
            </button>
          ))}
          {ticker!=="ALL"&&<button onClick={()=>setTicker("ALL")} style={{fontSize:10,color:"#ff4f5a",border:"1px solid #ff4f5a30",borderRadius:3,padding:"2px 8px",background:"transparent",cursor:"pointer",marginLeft:4}}>✕</button>}
          <span style={{marginLeft:"auto",fontSize:11,color:"#8892a4"}}>{filtered.length} article{filtered.length!==1?"s":""}</span>
        </div>
      )}

      {/* Liste articles */}
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {filtered.map(a=>{
          const catColor=CAT_COLOR[a.category||"economie"]||"#8892a4";
          const catLabel=CAT_LABEL[a.category||"economie"]||"Éco";
          return(
            <a key={a.id} href={a.url} target="_blank" rel="noopener noreferrer"
              style={{display:"block",background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:"12px 14px",textDecoration:"none",borderLeft:"3px solid #1a2540",transition:"background .12s"}}
              onMouseEnter={e=>e.currentTarget.style.background="#0f1e30"}
              onMouseLeave={e=>e.currentTarget.style.background="#0d1829"}>
              <div style={{display:"flex",justifyContent:"space-between",gap:12,marginBottom:5,flexWrap:"wrap"}}>
                <div style={{fontSize:13,color:"#c8d3e8",fontWeight:600,lineHeight:1.4,flex:1}}>{a.title}</div>
                <span style={{fontSize:10,color:"#8892a4",whiteSpace:"nowrap",flexShrink:0}}>{fmtD(a.date)}</span>
              </div>
              {a.summary&&<div style={{fontSize:11,color:"#8892a4",lineHeight:1.6,marginBottom:7}}>{a.summary.slice(0,240)}{a.summary.length>240?"…":""}</div>}
              <div style={{display:"flex",gap:5,alignItems:"center",flexWrap:"wrap"}}>
                {catLabel&&<span style={{background:`${catColor}15`,border:`1px solid ${catColor}30`,borderRadius:3,padding:"1px 6px",fontSize:9,color:catColor,letterSpacing:.5}}>{catLabel}</span>}
                {(a.tickers||[]).map(t=>(
                  <span key={t} style={{background:"rgba(77,184,255,.1)",border:"1px solid rgba(77,184,255,.25)",borderRadius:3,padding:"1px 6px",fontSize:9,color:"#4db8ff",fontWeight:600}}>{codeDe(t)}</span>
                ))}
                <span style={{fontSize:10,color:"#8892a4",marginLeft:"auto"}}>{a.source}</span>
              </div>
            </a>
          );
        })}
      </div>
    </div>
  );
};

// ── SCORE PERSONNALISÉ ────────────────────────────────────────────────────────
// Recalcule un score d'affichage selon les composantes actives (F/T)
// Ne modifie PAS le score v5.3 stocké — lecture seule des sous-scores
/* Les composantes du score v5.3, transportées telles quelles depuis data.json.
   Déclarées ici, à côté de la fonction qui les consomme, plutôt que noyées
   dans le mapping de loadData où l'absence de score_tech est passée inaperçue
   pendant tout le temps qu'a duré le mode personnalisé. */
const CHAMPS_SCORE = ["score_tech", "score_fond"];

/* Les deux composantes telles qu'elles sont DANS LE FICHIER, ou `null`.
   Aucune n'est devinée : une composante absente reste absente. */
function composantesScore(r) {
  return {
    f: r.score_fond != null ? r.score_fond : null,            // 0-10
    t: r.score_tech != null ? r.score_tech : null,            // 0-10
  };
}

/* Ce qui MANQUE pour cette pondération. Une composante de poids nul n'est pas
   requise. */
function composantesManquantes(r, p) {
  if (!p || p.officiel) return [];
  const c = composantesScore(r), m = [];
  if ((p.f||0) > 0 && c.f == null) m.push("Fondamental");
  if ((p.t||0) > 0 && c.t == null) m.push("Technique");
  return m;
}

function computeDisplayScore(r, p) {
  // Le mode officiel rend le v5.3 du moteur TEL QUEL — bonus et malus compris.
  // Le recalculer ici donnerait un chiffre légèrement différent de celui du
  // bulletin, et personne ne saurait lequel croire.
  if (!p || p.officiel) return r.v53;

  /* ⚠️ AUCUN REPLI. Cette fonction rendait `r.bvc` quand `score_fond`
     manquait, et `RSI / 10` quand `score_tech` manquait.

     `r.bvc` est la note BVC DE RÉFÉRENCE, pas la note fondamentale : le mode
     personnalisé ne changeait donc pas seulement les POIDS mais les
     INGRÉDIENTS. Mesuré par l'audit du 09/09 : ADH 4,28 au lieu de 6,15.

     Le défaut a été corrigé côté moteur — mais il RESSORT pendant la fenêtre
     qui suit une fusion, tant que `data.json` n'a pas été régénéré : les
     composantes sont absentes de l'ancien fichier, et les replis reprenaient
     la main en silence. Mesuré le 11/09 : ADH réaffichait 5,01.

     Une note approchée ressemble à une note. Elle ne doit donc pas exister :
     si une composante requise manque, le score est INDISPONIBLE, et le tri
     comme l'export le traitent en tant que tel. */
  const total = (p.f||0) + (p.t||0);
  if (total === 0) return null;
  if (composantesManquantes(r, p).length) return null;

  const c = composantesScore(r);
  return +Math.min(10, Math.max(0,
    ((c.f ?? 0)*(p.f||0) + (c.t ?? 0)*(p.t||0)) / total
  )).toFixed(2);
}

function scoreModeLabel(p) {
  if (!p || p.officiel) return "OFFICIEL";
  return `F${p.f}/T${p.t}`;
}

// Les poids À AFFICHER — ceux qui ont réellement produit le chiffre montré.
//
// ⚠️ Signalé par Abd Moutalib le 09/09/2026 : « le curseur ne bouge pas quand
// je change les pourcentages ». Les quatre endroits qui dessinent la
// répartition lisaient `r.poids`, c'est-à-dire les poids que le MOTEUR a
// retenus pour ce titre (le WeightEngine les module par titre). Choisir 60/40
// changeait la note sans changer la barre : l'écran montrait donc une note
// calculée avec une répartition, à côté d'une répartition qui n'était pas
// celle-là.
//
// C'est exactement le défaut de la fiche détaillée du 08/09, à un autre
// endroit. Même leçon, deux fois de suite : un réglage qui traverse
// l'interface doit être vérifié PARTOUT où il s'applique.
function poidsAffiches(r, p) {
  if (!p || p.officiel) return r.poids || null;
  return {f: p.f || 0, t: p.t || 0};
}

/* ── FAVORIS : CE QUI A CHANGÉ DEPUIS LA DERNIÈRE VISITE (14/10/2026) ───────
   Diagnostic externe de l'interface, point 7. Un instantané par appareil
   (localStorage « bvc_fav_vu » : note, palier, confiance, date) est comparé
   à la visite suivante ; s'y ajoutent les documents AMMC publiés depuis,
   rattachés au titre par le collecteur d'actualités. Rien n'est calculé ici :
   on compare des valeurs publiées. */
const ChangementsFavoris=({rows,fav,ouvrir})=>{
  const [avant]=useState(()=>{try{return JSON.parse(localStorage.getItem("bvc_fav_vu")||"null");}catch(e){return null;}});
  const [pubs,setPubs]=useState([]);
  const suivis=rows.filter(r=>fav.includes(r.symbol||r.ticker));
  // ⚠️ Seulement sur les données CHARGÉES (avec `_meta`) : au premier rendu,
  // les lignes provisoires portent une note figée et une confiance 0, et
  // l'instantané les aurait prises pour une visite.
  const charges=suivis.length>0&&suivis.every(r=>r._meta);
  const cle=suivis.map(r=>`${r.symbol}:${r.v53}:${r.sig}`).join("|");
  useEffect(()=>{
    if(!charges)return;
    const snap={t:new Date().toISOString(),titres:{}};
    suivis.forEach(r=>{snap.titres[r.symbol]={v53:r.v53??null,sig:r.sig||null,conf:meta(r).conf};});
    try{localStorage.setItem("bvc_fav_vu",JSON.stringify(snap));}catch(e){}
  },[charges,cle]);
  useEffect(()=>{if(!avant||!avant.t)return;let vivant=true;
    fetch("news.json?t="+Math.floor(Date.now()/3600000)).then(r=>r.ok?r.json():null).then(d=>{if(!vivant||!d)return;
      setPubs((d.articles||[]).filter(a=>/AMMC/.test(a.source||"")&&(a.date||"")>avant.t.slice(0,19)
        &&(a.tickers||[]).some(t=>fav.includes(t))).slice(0,8));}).catch(()=>{});
    return()=>{vivant=false;};},[]);
  if(!charges)return null;
  const lignes=[];
  if(avant&&avant.titres)suivis.forEach(r=>{const a=avant.titres[r.symbol];if(!a)return;const sym=r.symbol;const c=[];
    if(a.sig!==(r.sig||null))c.push(`palier ${a.sig||"—"} → ${r.sig||"—"}`);
    if(a.v53!=null&&r.v53!=null&&Math.abs(a.v53-r.v53)>=0.05)c.push(`note ${fmt(a.v53)} → ${fmt(r.v53)}`);
    else if((a.v53==null)!==(r.v53==null))c.push(r.v53==null?"note retirée (données insuffisantes)":`note publiée : ${fmt(r.v53)}`);
    if(a.conf!==meta(r).conf)c.push(`confiance ${a.conf}/5 → ${meta(r).conf}/5`);
    if(c.length)lignes.push({sym,c});});
  const depuis=avant&&avant.t?maroc(avant.t).toLocaleString("fr-FR",{timeZone:"UTC",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):null;
  return <div className="carte" style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12,marginBottom:12}}>
    <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>
      {depuis?`Depuis votre dernière visite (${depuis})`:"Ce qui a changé"}</div>
    {!depuis&&<div style={{fontSize:12,color:"#8892a4"}}>Première visite sur cet appareil : les changements de note, de palier, de confiance et les nouvelles publications AMMC de vos favoris apparaîtront ici la prochaine fois.</div>}
    {depuis&&!lignes.length&&!pubs.length&&<div style={{fontSize:12,color:"#8892a4"}}>Rien de nouveau sur vos favoris : notes, paliers et confiance inchangés, aucune publication AMMC.</div>}
    {lignes.map(l=><div key={l.sym} style={{fontSize:12.5,color:"#c8d3e8",padding:"3px 0"}}>
      <button onClick={()=>ouvrir(l.sym)} style={{border:"none",background:"none",color:"#4db8ff",fontWeight:700,padding:"0 6px 0 0",cursor:"pointer",fontSize:12.5}}>{codeDe(l.sym)}</button>{l.c.join(" · ")}</div>)}
    {pubs.map((a,i)=><a key={i} href={a.url} target="_blank" rel="noopener noreferrer" style={{display:"block",fontSize:12,color:"#c8d3e8",padding:"3px 0",textDecoration:"none"}}>
      <b style={{color:"#00e5a0"}}>{(a.tickers||[]).filter(t=>fav.includes(t)).map(codeDe).join(", ")}</b> · publication AMMC : {a.title||a.titre} <span style={{color:"#5a6478"}}>({(a.date||"").slice(0,10).split("-").reverse().join("/")})</span></a>)}
  </div>;};

/* Vues qui lisent les cours et les notes de data.json (`rows`). Les autres
   (POIDS, COMMENT LIRE, ACTUALITÉS, MARCHÉS MONDIAUX) ont leurs propres
   fichiers et restent ouvertes quand data.json manque. */
const VUES_SUR_DONNEES=["accueil","ranking","heatmap","watchlist","detail","briefing"];
/* ⚠️ 28/10/2026 — onglets « smart » et « nlp » retirés (corpus WhatsApp
   supprimé, décision d'Abd Moutalib). Un lien ancien `#onglet=nlp` ouvrait
   une page vide : seule une vue connue est acceptée depuis l'adresse. */
const VUES_CONNUES=["accueil","ranking","briefing","heatmap","detail","watchlist","weights","news","monde","guide"];
/* État explicite tant que data.json n'a pas chargé — 22/10/2026. Aucun
   chiffre : ni ceux de la table de repli (elle n'en a plus), ni un écran
   de titres vides qui se lirait comme un marché sans cotation. */
const EtatDonnees=({etat,loading,onRetry})=>{
  if(etat==="chargement")return <Squelette blocs={[4,4]} titre="Chargement des données de la dernière séance"/>;
  return(
    <div className="carte" role="alert" style={{background:"#0d1829",border:"1px solid rgba(255,79,90,.45)",borderRadius:8,padding:"22px 20px",maxWidth:640,margin:"24px auto",textAlign:"center"}}>
      <div style={{fontSize:15,fontWeight:700,color:"#ff4f5a",marginBottom:10,textWrap:"balance"}}>Données indisponibles, réessayez</div>
      <div style={{fontSize:12,color:"#8892a4",lineHeight:1.6,marginBottom:16,textWrap:"pretty"}}>
        Le fichier des cours et des notes (data.json) n'a pas pu être chargé.
        Aucun chiffre n'est affiché plutôt qu'un chiffre ancien présenté comme actuel.
      </div>
      <button onClick={onRetry} disabled={loading}
        style={{background:"rgba(77,184,255,.12)",border:"1px solid rgba(77,184,255,.35)",color:"#4db8ff",borderRadius:4,padding:"10px 22px",minHeight:44,fontSize:13,cursor:loading?"default":"pointer",opacity:loading?.7:1,fontFamily:"var(--font)"}}>
        {loading?"↻ Chargement…":"↻ Réessayer"}</button>
    </div>);
};

function App(){
  /* ⚠️ 07/10/2026 — « à chaque fois que je lance le lien, il s'ouvre sur
     CMT ». Le dernier onglet était mémorisé (bvc_tab) : quitté sur une
     fiche, le terminal rouvrait la fiche, et le titre par défaut est CMT.
     L'ouverture se fait désormais TOUJOURS sur l'Accueil ; seul un lien
     explicite (#onglet=ranking) choisit un autre onglet. */
  const [tab,setTab]=useState(()=>{
    try{const m=/onglet=([a-z]+)/.exec(location.hash||"");if(m&&VUES_CONNUES.includes(m[1]))return m[1];}catch(e){}
    return "accueil";});
  const [sort,setSort]=useState("v53");
  const [scoreMode,setScoreMode]=useState(PONDERATIONS[0]);
  useEffect(()=>{setSort("v53");},[scoreMode]);
  const [sel,setSel]=useState(()=>{
    try{const m=/sym=([A-Z0-9]+)/.exec(location.hash||"");if(m)return m[1];}catch(e){}
    return "CMT";});
  /* ⚠️ 14/10/2026 — « quand je ferme une source, je retourne à l'accueil ».
     Une source s'ouvre dans un nouvel onglet ; au retour, l'iPhone recharge
     souvent la page, qui repartait sur l'Accueil (règle du 07/10). L'onglet
     et le titre ouverts sont donc inscrits dans l'adresse, SANS nouvelle
     entrée d'historique : un rechargement revient au même endroit, un
     lancement depuis l'icône (adresse nue) ouvre toujours l'Accueil. */
  useEffect(()=>{
    try{history.replaceState(null,"",location.pathname+location.search
      +"#onglet="+tab+(tab==="detail"?"&sym="+encodeURIComponent(sel):""));}catch(e){}
  },[tab,sel]);
  const [rows,setRows]=useState(STATIC);
  /* ⚠️ ÉTAT DES DONNÉES — 22/10/2026 (audit du 22/10, lot A).
     « chargement » → « ok » au premier data.json lu ; « indisponible » s'il
     échoue sans qu'aucun n'ait jamais chargé. Tant qu'il n'est pas « ok »,
     les vues qui lisent `rows` sont remplacées par un état explicite : STATIC
     ne porte que des libellés, et un écran de titres sans cours ni note se
     lirait comme un marché vide. Un rafraîchissement raté APRÈS un succès
     garde l'écran (data.json précédent, daté) et le dit dans l'en-tête. */
  const [etatDonnees,setEtatDonnees]=useState("chargement");
  const [fav,setFav]=useState(()=>{try{return JSON.parse(localStorage.getItem("bvc_fav")||"[]");}catch{return [];}});
  const toggleFav=useCallback(sym=>{setFav(prev=>{const next=prev.includes(sym)?prev.filter(x=>x!==sym):[...prev,sym];lsEcrire("bvc_fav",JSON.stringify(next));return next;});},[]);
  /* Vide tant que data.json n'a pas chargé : l'heure de l'appareil, qui
     s'affichait ici au départ, se lisait comme l'heure des données. */
  const [ts,setTs]=useState("");
  const [src,setSrc]=useState("connexion…");
  const [loading,setLoading]=useState(false);
  const [fetchErr,setFetchErr]=useState(null);   // null | "indisponible" | "rafraichissement"
  const [mktStatus,setMktStatus]=useState(getMarketStatus());
  const [masi,setMasi]=useState(null);

  // Update market status every 30s
  useEffect(()=>{
    const t=setInterval(()=>setMktStatus(getMarketStatus()),30000);
    return()=>clearInterval(t);
  },[]);

  // MASI index — refresh toutes les 2 min
  useEffect(()=>{
    const load=()=>{if(!LIVE_ACTIF)return; fetchMASI().then(m=>{if(m)setMasi(m);});};
    load();
    const t=setInterval(load,120000);
    return()=>clearInterval(t);
  },[]);

  // Retour visible du bouton Actualiser : neuf = données plus récentes qu'avant.
  const [majMsg,setMajMsg]=useState(null);
  const dernierUpd=useRef(null);
  const annonce=useCallback((texte,neuf)=>{
    setMajMsg({texte,neuf});
    setTimeout(()=>setMajMsg(null),6000);
  },[]);

  // Merge live quote data into rows (functional update, no dep on rows)
  const mergeLive=useCallback((liveMap)=>{
    const propres=o=>Object.fromEntries(Object.entries(o).filter(([,v])=>v!==undefined));
    setRows(prev=>{
      const fusion=prev.map(s=>{
        const live=liveMap[s.symbol];
        return live?{...s,...propres(live)}:s;
      });
      /* Un titre présent dans data.json mais absent du tableau STATIC ne
         s'affichait jamais : prev.map() ne fait que mettre à jour l'existant.
         Toute nouvelle introduction en bourse restait donc invisible tant
         qu'on ne l'ajoutait pas à la main au frontend — c'était le cas de
         T2S, cotée depuis le 27/07/2026.
         On exige `name` pour n'ajouter que depuis data.json : l'overlay live
         de séance ne porte que des cours, il créerait une ligne sans nom ni
         score. */
      const connus=new Set(prev.map(s=>s.symbol||s.ticker));
      const nouveaux=Object.entries(liveMap)
        .filter(([sym,live])=>!connus.has(sym)&&live&&live.name)
        .map(([sym,live])=>({symbol:sym,...propres(live)}));
      return nouveaux.length?[...fusion,...nouveaux]:fusion;
    });
  },[]);

  // Load data: data.json (backend pipeline) → overlay live IDBourse/Médias24 pendant session
  const loadData=useCallback(async(manuel=false)=>{
    setLoading(true);
    // Étape 1 : data.json — source principale (pipeline GitHub Actions)
    let pipelineLoaded=false;
    let nLive=0;
    try{
      const d=await fetch("data.json?t="+Date.now()).then(r=>r.ok?r.json():null);
      if(d?.tickers&&d.tickers.length>0){
        const m={};
        d.tickers.forEach(t=>{if(t.code_bvc)CODES_BVC[t.symbol]=t.code_bvc;});
        d.tickers.forEach(t=>{m[t.symbol]={
          price:t.price,chg:t.chg,vol:t.vol||0,open:t.open,close:t.close,
          name:t.name,sector:t.sector,code_bvc:t.code_bvc,_meta:t._meta,
          pe:t.pe,pe_annuel:t.pe_annuel,pe_capitalisation:t.pe_capitalisation,bpa_reserve:t.bpa_reserve,bpa:t.bpa,bpa_12m:t.bpa_12m,div_dh:t.div_dh,pe_base:t.pe_base,pb:t.pb,div:t.div,cap:t.cap,fwd:t.fwd,
          h90:t.h90,l90:t.l90,ma200:t.ma200,h52w:t.h52w,l52w:t.l52w,
          rsi:t.rsi,ma20:t.ma20,ma50:t.ma50,
          macd:t.macd,macd_signal:t.macd_signal,macd_hist:t.macd_hist,
          bb_upper:t.bb_upper,bb_mid:t.bb_mid,bb_lower:t.bb_lower,
          stoch_k:t.stoch_k,stoch_d:t.stoch_d,
          v53:t.v53,score_version:t.score_version,
          /* ⚠️ LES COMPOSANTES DU SCORE, oubliées jusqu'au 10/09/2026.
             `score_tech` existait dans data.json et n'arrivait jamais ici :
             computeDisplayScore retombait donc sur son repli `RSI / 10`, qui
             n'est pas la même formule (le moteur tient aussi compte des
             moyennes mobiles et de la position dans la fourchette). Mesuré :
             ADI 7,50 → 5,72 · ADH 6,70 → 4,99 · Taqa 6,70 → 4,80.
             Signalé par l'audit externe du 09/09. Elles passent par une liste
             NOMMÉE pour qu'un oubli futur se voie — une énumération de
             quarante champs cache ce qui lui manque. */
          ...Object.fromEntries(CHAMPS_SCORE.map(c=>[c,t[c]])),
          sig:t.sig,reference:t.reference,
          bonus:t.bonus,poids:t.poids,note_fond:t.note_fond,warn:t.warn,warnMsg:t.warnMsg,
          bear:t.bear,base:t.base,bull:t.bull,upside:t.upside,flags:t.flags,alertes:t.alertes,ratios_publies:t.ratios_publies,risque:t.risque,
          setup:t.setup,
          obv:t.obv,adx:t.adx,adx_pdi:t.adx_pdi,adx_mdi:t.adx_mdi,
          /* ⚠️ DEUX CHAMPS CALCULÉS QUI N'ARRIVAIENT PAS JUSQU'ICI — 25/09.
             `rang_secteur`, publié le 24/09, et `niveaux`, le 25/09 : les
             deux composants d'affichage existaient, les données ne leur
             parvenaient jamais. Le rang sectoriel est donc resté INVISIBLE
             depuis sa livraison.

             ⚠️ Le test qui devait l'empêcher cherchait la chaîne
             « rang_secteur » DANS index.html. Elle y était — dans le
             composant. Il ne vérifiait pas le CHEMIN DE DONNÉES, et c'est
             le seul endroit où la rupture se produit.

             Le commentaire ci-dessus annonçait pourtant le risque : « une
             énumération de quarante champs cache ce qui lui manque ». Elle
             l'a caché une fois de plus. */
          rang_secteur:t.rang_secteur, niveaux:t.niveaux,
          /* ⚠️ La note par famille, EN COMPARAISON (11/10/2026) : famille, poids
             de la grille disponible, critères avec leur état. Publiée à côté de
             `score_fond`, qu'elle ne remplace pas. */
          note_fond_metier:t.note_fond_metier,
          /* ⚠️ Le montant RÉEL de la séance et les bornes de réservation,
             collectés depuis le 25/09. `vol` était déjà là ; le montant,
             non — le projet l'approchait par `volume × clôture`. */
          echange_dh:t.echange_dh, seuil_bas:t.seuil_bas, seuil_haut:t.seuil_haut,
          /* Calibrage technique, 03/10/2026 : nouveau pilier EN ESSAI (mode
             ombre) et motif de neutralisation de l'ancien. */
          score_tech_v2:t.score_tech_v2, technique_neutralise:t.technique_neutralise, verdict_plafonne:t.verdict_plafonne
        };});
        REGIME_TECH=d.regime_technique||null;
        mergeLive(m);
        setEtatDonnees("ok");
        nLive=d.tickers.filter(t=>t.price>0).length;  // titres couverts (audit 11/10 : comptait les variations non nulles)
        /* data.json nomme la variation `change_pct`, l'en-tête lit `chg` :
           sans cette traduction la variation s'affiche « —% » dès que l'appel
           direct à la Bourse de Casablanca échoue, ce qui est le cas courant
           depuis un navigateur (CORS). */
        /* ⚠️ Le MASI 20 voyage DANS l'objet `masi` — ajouté le 25/09. Un état
           et une prop de plus à travers tout l'arbre pour deux chiffres
           affichés au même endroit ne se justifieraient pas. */
        if(d.masi) setMasi(m=>({...(m||{}),...d.masi,
                                chg:d.masi.change_pct!=null?d.masi.change_pct:(m&&m.chg),
                                masi20:d.masi20||(m&&m.masi20)||null,
                                }));
        const upd=d.updated?new Date(d.updated):null;
        const timeStr=upd?maroc(upd).toLocaleString("fr-FR",{timeZone:"UTC",hour:"2-digit",minute:"2-digit",second:"2-digit"}):"";
        const dateStr=upd?maroc(upd).toLocaleString("fr-FR",{timeZone:"UTC",day:"2-digit",month:"2-digit",year:"numeric"}):"";
        setTs(dateStr&&timeStr?`${dateStr} ${timeStr}`:"");
        if(manuel){
          const neuf=dernierUpd.current!==null&&d.updated!==dernierUpd.current;
          annonce(neuf?`✓ mis à jour · ${timeStr}`
                     :`déjà à jour · données de ${timeStr}`, neuf);
        }
        dernierUpd.current=d.updated;
        pipelineLoaded=true;
      }
    }catch{}

    const mktNow=getMarketStatus();

    // Étape 2 : overlay live — SEULEMENT pendant la session ouverte
    // Hors session (CLÔTURE/FERMÉ) : data.json est la source officielle, pas d'appels CORS
    if(LIVE_ACTIF&&mktNow.isOpen){
      try{
        const liveMap=await fetchQuotes();
        if(liveMap&&Object.keys(liveMap).length>0){
          mergeLive(liveMap);
          /* 22/10/2026 : des cours live sans data.json n'ont ni note ni date
             de séance — l'état reste « indisponible ». LIVE_ACTIF étant
             coupé, le cas est aujourd'hui théorique. */
          if(!pipelineLoaded)setEtatDonnees(e=>e==="ok"?"ok":"indisponible");
          const nIdb=Object.keys(liveMap).length;
          const srcs=Object.values(liveMap).map(v=>v.src).filter(Boolean);
          const mainSrc=srcs[0]||"live";
          setTs(maroc().toLocaleString("fr-FR",{timeZone:"UTC",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"}));
          setSrc(`${mainSrc} · ${nIdb} live ●`);
          setFetchErr(null);
          setLoading(false);return;
        }
      }catch{}
    }

    if(pipelineLoaded){
      const ageMin=nLive>0?0:Infinity;
      const label=mktNow.label==="CLÔTURE"?`Clôture · ${nLive} titres`
                 :`Pipeline · ${nLive} titres`;
      setSrc(label);
      setFetchErr(null);
      setLoading(false);return;
    }
    // Échec : rien de neuf. Jamais de chiffre de repli à la place.
    const dejaCharge=dernierUpd.current!==null;
    setFetchErr(dejaCharge?"rafraichissement":"indisponible");
    setEtatDonnees(e=>e==="ok"?"ok":"indisponible");
    setSrc(dejaCharge?"⚠ rafraîchissement impossible":"⚠ données indisponibles");
    setLoading(false);
  },[mergeLive,annonce]);

  // Chargement initial + auto-refresh toutes les 60s pendant la séance, 5 min hors séance
  useEffect(()=>{
    loadData();
    const getInterval=()=>{const s=getMarketStatus();return s.isOpen?60000:300000;};
    let iv=setInterval(()=>loadData(),getInterval());
    // Recalcule l'intervalle toutes les 10 min (transition ouverture/fermeture)
    const adjuster=setInterval(()=>{clearInterval(iv);iv=setInterval(()=>loadData(),getInterval());},600000);
    return()=>{clearInterval(iv);clearInterval(adjuster);};
  },[loadData]);

  /* ── PILE DE NAVIGATION ────────────────────────────────────────────────
     « Je veux aussi un bouton de retour en arrière » (Noure, 16/09). Le
     terminal n'a qu'une page : le bouton du navigateur ne revient pas à la vue
     précédente, il QUITTE le terminal. On tient donc notre propre pile.

     Une vue, ici, c'est un couple (onglet, titre sélectionné) — passer de
     CLASSEMENT à la fiche de Sothema, puis de Sothema à Cosumar, fait deux pas
     en arrière distincts.

     ⚠️ Les doublons sont écartés à l'empilement. Ouvrir une fiche depuis le
     classement appelle `setSel` PUIS `setTab` : sans cette garde, un seul geste
     empilerait deux fois la même vue et il faudrait deux retours pour un
     aller. */
  const pile=useRef([]);
  const [peutRevenir,setPeutRevenir]=useState(false);
  const empiler=(t,sl)=>{
    /* ⚠️ Premier jet fautif : la garde comparait la vue empilée à la vue
       courante — or on empile TOUJOURS la vue courante, donc elle sortait à
       chaque fois et la pile restait vide. Le bouton naissait grisé et le
       restait. Seul le doublon avec le SOMMET de la pile doit être écarté. */
    const haut=pile.current[pile.current.length-1];
    if(haut&&haut.tab===t&&haut.sel===sl)return;
    pile.current.push({tab:t,sel:sl});
    if(pile.current.length>60)pile.current.shift();
    setPeutRevenir(true);
  };
  const changeTab=(t)=>{if(t!==tab)empiler(tab,sel);setTab(t);};
  const choisirTitre=(sl)=>{if(sl!==sel)empiler(tab,sel);setSel(sl);};
  const revenir=()=>{
    const v=pile.current.pop();
    if(!v)return;
    setPeutRevenir(pile.current.length>0);
    setTab(v.tab);
    setSel(v.sel);
  };

  return(
    <div style={{minHeight:"100vh"}}>
      <Intro/>
      {etatDonnees==="ok"&&<TickerTape rows={rows}/>}
      <Header univers={rows.length} tab={tab} setTab={changeTab} peutRevenir={peutRevenir} onRetour={revenir} ts={ts} src={src} onRefresh={()=>loadData(true)} loading={loading} fetchErr={fetchErr} mktStatus={mktStatus} favCount={fav.length} scoreMode={scoreMode} setScoreMode={setScoreMode} masi={masi} majMsg={majMsg}/>
      <div style={{padding:14,maxWidth:1600,margin:"0 auto"}}>
        {etatDonnees!=="ok"&&VUES_SUR_DONNEES.includes(tab)
          ?<EtatDonnees etat={etatDonnees} loading={loading} onRetry={()=>loadData()}/>
          :<>
        {tab==="accueil"  &&<Accueil rows={rows} fav={fav} ouvrir={sym=>{choisirTitre(sym);changeTab("detail");}} setTab={changeTab}/>}
        {tab==="ranking"  &&<Ranking rows={rows} sort={sort} setSort={setSort} setSel={choisirTitre} setTab={changeTab} fav={fav} toggleFav={toggleFav} scoreMode={scoreMode}/>}
        {tab==="heatmap"  &&<Heatmap rows={rows} setSel={sym=>{choisirTitre(sym);changeTab("detail");}} setTab={changeTab}/>}
        {tab==="watchlist"&&<><ChangementsFavoris rows={rows} fav={fav} ouvrir={sym=>{choisirTitre(sym);changeTab("detail");}}/><Ranking rows={rows.filter(r=>fav.includes(r.symbol||r.ticker))} sort={sort} setSort={setSort} setSel={sym=>{choisirTitre(sym);changeTab("detail");}} setTab={changeTab} fav={fav} toggleFav={toggleFav} isWatchlist={true} scoreMode={scoreMode}/></>}
        {tab==="detail"   &&<Detail rows={rows} sel={sel} setSel={choisirTitre} fav={fav} toggleFav={toggleFav} scoreMode={scoreMode}/>}
        {tab==="weights"  &&<Weights/>}
        {tab==="guide"    &&<Guide setTab={changeTab}/>}
        {tab==="briefing" &&<Briefing rows={rows} masi={masi} ouvrir={sym=>{choisirTitre(sym);changeTab("detail");}}/>}
        {tab==="monde" &&<MarchesMondiaux/>}
        {tab==="news"     &&<NewsFeed/>}
          </>}
        <MentionLegale/>
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  render(){
    if(this.state.err){
      const msg=this.state.err?.message||String(this.state.err);
      return(
        <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#080d1a",flexDirection:"column",gap:16,padding:24}}>
          <div style={{color:"#ff4f5a",fontSize:18,fontWeight:700,fontFamily:"'IBM Plex Mono',monospace"}}>⚠ Erreur de rendu</div>
          <div style={{color:"#8892a4",fontSize:12,fontFamily:"'IBM Plex Mono',monospace",maxWidth:600,textAlign:"center",wordBreak:"break-word"}}>{msg}</div>
          <button onClick={()=>window.location.reload()} style={{background:"rgba(77,184,255,.12)",border:"1px solid rgba(77,184,255,.35)",color:"#4db8ff",borderRadius:4,padding:"8px 20px",fontSize:13,cursor:"pointer",fontFamily:"'IBM Plex Mono',monospace"}}>↻ Recharger la page</button>
        </div>
      );
    }
    return this.props.children;
  }
}

const root=document.getElementById("root");
if(root){
  ReactDOM.createRoot(root).render(<ErrorBoundary><App/></ErrorBoundary>);
}else{
  document.body.innerHTML='<div style="color:#ff4f5a;padding:40px;font-family:monospace">Erreur: élément #root introuvable</div>';
}
</script>

<!-- ── Mesure d'audience — facultative, sans cookie ─────────────────────────
     Isolée du moteur par construction :
       · exécutée après le rendu React, hors du bundle applicatif
       · chargement asynchrone (ne bloque jamais l'affichage)
       · try/catch : une panne du fournisseur ne peut pas casser le terminal
       · totalement inerte tant qu'aucun identifiant n'est renseigné ci-dessous
     Aucun cookie, aucun localStorage, aucune donnée personnelle conservée par
     le terminal — choix délibéré au regard de la CNDP.

     Pour activer, renseigner UN SEUL des deux identifiants :
       · GoatCounter : compte gratuit sur goatcounter.com → coller le code choisi
       · Cloudflare  : Web Analytics → coller le token du site
-->
<script>
(function () {
  var GOATCOUNTER = "bvc-analyzer";   // compte d'Abd Moutalib, créé le 13/10/2026 (bvc-analyzer.goatcounter.com)
  var CF_TOKEN    = "";   // ex. "a1b2c3d4e5f6..."
  try {
    var s;
    if (GOATCOUNTER) {
      s = document.createElement("script");
      s.async = true;
      s.src = "https://gc.zgo.at/count.js";
      s.setAttribute("data-goatcounter",
                     "https://" + GOATCOUNTER + ".goatcounter.com/count");
      document.body.appendChild(s);
    } else if (CF_TOKEN) {
      s = document.createElement("script");
      s.defer = true;
      s.src = "https://static.cloudflareinsights.com/beacon.min.js";
      s.setAttribute("data-cf-beacon", JSON.stringify({ token: CF_TOKEN }));
      document.body.appendChild(s);
    }
  } catch (e) {
    /* La mesure d'audience ne doit jamais empêcher le terminal de fonctionner. */
  }
})();
</script>
