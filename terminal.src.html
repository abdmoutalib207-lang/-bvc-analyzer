<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <title>BVC Analyzer v6.4 — Bourse de Casablanca</title>
  <meta name="description" content="Terminal d'analyse quantitative de la Bourse de Casablanca : 80 titres, dernière clôture vérifiée contre le bulletin de l'opérateur. Score composite Fondamental 65% · Technique 35%, modulé par titre."/>
  <meta name="theme-color" content="#080d1a"/>
  <!-- Emblème de la marque (13/10/2026) : taureau en costume, tiré du logo
       d'Abd Moutalib (assets/marque/logo-original.png), recoloré au dégradé
       du terminal. Favicon d'onglet et icône d'écran d'accueil du téléphone. -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/marque/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/marque/favicon-64.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="assets/marque/icone-192.png"/>
  <link rel="apple-touch-icon" href="assets/marque/apple-touch-icon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.10/babel.min.js"></script>
  <style>
    :root{--bg:#080d1a;--bg2:#0d1829;--bg3:#0a1220;--bd:#1a2540;--text:#c8d3e8;--dim:#8892a4;--green:#00e5a0;--blue:#4db8ff;--yel:#ffd740;--red:#ff4f5a;--pur:#b388ff;--org:#ff8f00;--font:'IBM Plex Mono','Courier New',monospace;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;}
    button{cursor:pointer;border:none;background:none;font-family:inherit;font-size:12px;}
    ::-webkit-scrollbar{width:5px;height:5px;} ::-webkit-scrollbar-track{background:var(--bg);} ::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px;}
    .tv-lightweight-charts{display:block!important;}
    .detail-grid{display:grid;grid-template-columns:290px 1fr;gap:12px;}
    .mobile-seul{display:none}
    /* L'étoile des favoris (07/10/2026) : #2a3550 sur le fond, contraste
       1,59 — invisible. Teinte --dim, et une boîte de 32 px au moins dont les
       marges négatives rendent l'encombrement : la ligne ne grandit pas. */
    .etoile{display:inline-flex;align-items:center;justify-content:center;min-width:32px;min-height:32px;margin:-9px -10px}
    /* ⚠️ 07/10/2026 : la ligne DÉFILAIT. À 390 px, la variation du MASI 20,
       les hausses/baisses et le bouton 📈 sortaient de l'écran, et le volume
       de la séance n'y figurait pas du tout (« je vois pas le volume
       global »). Elle passe à la ligne : tout est visible sans glisser. */
    .indices-ligne{display:none;align-items:center;gap:3px 7px;min-height:36px;padding:5px 10px;font-size:12px;flex-wrap:wrap;
      overflow-x:auto;scrollbar-width:none;border:1px solid rgba(77,184,255,.22);border-radius:8px;
      background:linear-gradient(180deg,rgba(77,184,255,.07),rgba(77,184,255,.02));font-variant-numeric:tabular-nums}
    .indices-ligne::-webkit-scrollbar{display:none}
    /* Gabarit de la carte des indices : les cadres restent, leur contenu est
       masqué, un reflet dit que ça charge. */
    [data-gabarit] .carte-ind *,[data-gabarit] .indices-ligne *{visibility:hidden}
    [data-gabarit] .carte-ind,[data-gabarit] .indices-ligne{position:relative;overflow:hidden}
    [data-gabarit] .carte-ind::after,[data-gabarit] .indices-ligne::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
      background:linear-gradient(90deg,transparent,rgba(200,211,232,.06),transparent);animation:reflet 1.2s ease-in-out infinite;}
    @media (prefers-reduced-motion:reduce){[data-gabarit] .carte-ind::after,[data-gabarit] .indices-ligne::after{display:none;}}
    .carte-indices{flex-basis:100%;width:100%;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1.2fr);gap:10px;margin-top:8px}
    @media(max-width:640px){.detail-grid{grid-template-columns:1fr!important;}}
    /* ⚠️ GABARIT À PANNEAUX DE LA FICHE — 20/10/2026, sur captures d'Abd
       Moutalib : à 1440 px la fiche tenait dans 290 px collés à gauche,
       1 100 px vides. Au-delà de 1200 px : liste des titres | graphique et
       fiche | note et chiffres. De 768 à 1199 px : note | graphique et fiche.
       Sous 768 px : une colonne, dans l'ordre du téléphone. */
    .liste-nom,.liste-var{display:none}
    /* Heatmap (20/10/2026) : un secteur par ligne laissait 93 % de la largeur
       vide à 1440 px. Au-delà de 768 px, les secteurs se rangent en colonnes. */
    @media(min-width:768px){.heatmap-secteurs{column-width:340px;column-gap:24px}.heatmap-secteurs>div{break-inside:avoid}}
    @media(max-width:767px){.detail-grid{grid-template-columns:1fr!important;gap:10px}}
    @media(min-width:768px){.fiche-graphique{order:-1}}
    @media(min-width:1200px){
      .fiche-gabarit{display:grid;grid-template-columns:272px minmax(0,1fr);gap:12px;align-items:start}
      .fiche-liste{position:sticky;top:calc(var(--h-entete,0px) + 8px);max-height:calc(100vh - var(--h-entete,0px) - 16px);
        display:flex;flex-direction:column;min-height:240px;background:#0d1829;border:1px solid #1a2540;border-radius:8px;padding:8px}
      .fiche-liste input{width:100%!important}
      .fiche-liste [data-liste="titres"]{flex-direction:column;flex-wrap:nowrap!important;max-height:none!important;flex:1 1 auto;min-height:0;gap:2px!important;margin-bottom:0!important}
      [data-liste="titres"]>button{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;
        flex:0 0 auto;min-height:30px;padding:4px 8px!important;font-size:11px!important}
      [data-liste="titres"]>button[aria-pressed="false"]{border-color:transparent!important}
      [data-liste="titres"]>button[aria-pressed="false"]:hover{background:#0a1220!important;color:#c8d3e8!important}
      .liste-nom{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8892a4;font-weight:400}
      .liste-var{display:block;font-variant-numeric:tabular-nums;font-weight:400}
      .detail-grid{grid-template-columns:minmax(0,1fr) clamp(300px,24vw,380px)}
      .fiche-note{grid-column:2;grid-row:1}
      .fiche-centre{grid-column:1;grid-row:1}
    }
    /* ⚠️ TÉLÉPHONE EN PAYSAGE — 10/10/2026, signalé par Abd Moutalib. Couché,
       le téléphone dépasse 640 px de large et reçoit l'en-tête COLLÉ de
       l'ordinateur. Mesuré à 844×390 : en-tête de 474 px pour 390 visibles,
       100 % de l'écran couvert, rien ne défile dessous. C'est la HAUTEUR qui
       décide : sous 600 px, l'en-tête défile avec la page. */
    @media(max-height:600px){.entete{position:static!important}}
    /* ⚠️ VERSION TÉLÉPHONE — 29/09/2026, sur captures d'Abd Moutalib (iPhone).
       Trois défauts : l'en-tête COLLÉ en haut couvrait plus de la moitié de
       l'écran et masquait le contenu au défilement ; le classement n'affichait
       que ticker, ouverture et clôture — score et signal hors de l'écran ; le
       badge de version et la barre MASI débordaient à droite.
       Tout passe par ces classes : sur ordinateur, RIEN ne change. */
    @media(max-width:640px){
      .entete{position:static!important;padding:8px 12px!important}
      .badge-version,.choix-score,.entete-droite{display:none!important}
      .bandeau-masi{flex-wrap:wrap!important;row-gap:4px}
      /* En-tête téléphone (07/10/2026) : 552 px sur 844, la 1re ligne du
         classement sous la ligne de flottaison. Le MENU donne déjà toutes
         les vues : la rangée d'onglets disparaît, seul RETOUR reste quand
         il y a une vue où revenir. Les indices tiennent sur une ligne. */
      .onglets .onglet{display:none!important}
      .onglets.sans-retour{display:none!important}
      .onglets button{padding:7px 12px!important}
      .mobile-seul{display:block!important}
      .carte-indices{grid-template-columns:1fr!important;gap:6px!important;margin-top:4px!important}
      .carte-indices>.carte-ind{display:none!important}
      .indices-ligne{display:flex!important}
      /* La fiche (07/10/2026) : les 80 boutons de titres prenaient l'écran
         avant la fiche elle-même ; on choisit un titre depuis le classement. */
      .selecteur-titres{display:none!important}
      /* Plancher de police (07/10/2026) : 413 textes sous 10 px dans le
         classement à 390 px, le plus petit à 8. Les tailles sont posées en
         ligne ; on relève ici toutes celles de 8 à 9,5 px. */
      [style*="font-size: 8px"],[style*="font-size: 8.5px"],[style*="font-size: 9px"],[style*="font-size: 9.5px"]{font-size:10px!important}
      /* Le classement garde : ticker, clôture (+ ouverture), variation
         (+ volume), score, couleur de la note. */
      .classement{min-width:0!important}
      .classement th:nth-child(1),.classement td:nth-child(1),
      .classement th:nth-child(3),.classement td:nth-child(3),
      .classement th:nth-child(n+6):nth-child(-n+8),.classement td:nth-child(n+6):nth-child(-n+8),
      .classement th:nth-child(10),.classement td:nth-child(10),
      .classement th:nth-child(12),.classement td:nth-child(12){display:none}
      .classement td,.classement th{padding:7px 3px!important}
      /* Colonne COULEUR (07/10/2026) : sur téléphone, la pastille seule —
         la note colorée est à côté. La mention « titre peu échangé » reste,
         en petit et sur deux lignes : elle explique une couleur sous la note. */
      .classement .pastille-texte{display:none}
      .classement .pastille-plafond{white-space:normal;line-height:1.2}
      /* 07/10/2026 : la colonne débordait de 33 px à 390 px (bord droit à
         409). Le remplissage 3px 5px s'appliquait à TOUT le contenu, rond
         compris : 92 px pour une colonne qui en a 60. Le rond passe au-dessus
         de sa mention, les étiquettes se coupent aux mots. */
      .classement th:nth-child(11),.classement td:nth-child(11){width:64px;max-width:64px}
      .classement td:nth-child(11) .pastille{flex-direction:column;align-items:flex-start;gap:3px}
      .classement td:nth-child(11) .rond{padding:0!important}
      .classement td:nth-child(11){padding-left:1px!important;padding-right:1px!important}
      .classement td:nth-child(11) .chip{padding:2px 3px!important;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
      /* La ligne « CMT ~hist ☆ » tenait la colonne TICKER à 124 px : elle
         peut désormais se replier. */
      .classement .ligne-ticker{flex-wrap:wrap;row-gap:2px}
      /* Le secteur prenait trop de largeur : sur téléphone, le code, un nom
         abrégé et le logo en miniature suffisent à reconnaître le titre. */
      .secteur-societe{display:none!important}
      /* Le logo reste, en miniature (demande du 30/09) : 26 px suffisent à
         reconnaître une société sans prendre la largeur d'une colonne. */
      .classement .logo-pastille{width:26px!important;height:26px!important;font-size:8px!important}
      .classement td:nth-child(2)>div{gap:7px!important}
      .nom-societe{max-width:80px!important;font-size:11px!important}
      .classement td:nth-child(11) *{font-size:10px!important;letter-spacing:0!important;white-space:normal!important}
      .classement td:nth-child(4),.classement td:nth-child(4) *{white-space:normal!important}
    }
    @keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
    .ticker-inner{display:inline-flex;align-items:center;animation:ticker 55s linear infinite;}
    .ticker-inner:hover{animation-play-state:paused;}

    /* ⚠️ COUCHE VISUELLE — 01/10/2026, demande d'Abd Moutalib : « même BVC
       Analyzer, plus fluide, plus propre, plus premium ». Ni couleur ni
       structure changées : seulement des transitions (150–250 ms), des états
       de survol et de clic, et une légère profondeur. Les styles posés sur les
       éléments gardent la main sur les couleurs ; cette couche n'ajoute que
       ce qu'ils ne fixent pas (ombre, filtre, transformation). */
    :root{--t-court:160ms;--t-moyen:220ms;--ease:cubic-bezier(.2,.7,.2,1);}
    button,select,a{transition:color var(--t-court) var(--ease),background-color var(--t-court) var(--ease),
      border-color var(--t-court) var(--ease),box-shadow var(--t-court) var(--ease),
      transform var(--t-court) var(--ease),filter var(--t-court) var(--ease);}
    button:not(:disabled):not([style*="not-allowed"]):hover,select:hover{filter:brightness(1.18);box-shadow:0 0 0 1px rgba(200,211,232,.10),0 2px 8px rgba(0,0,0,.25);}
    button:not(:disabled):not([style*="not-allowed"]):active{transform:scale(.97);filter:brightness(1.05);}
    button[style*="not-allowed"]{opacity:.75;}
    button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:2px;}
    button{-webkit-tap-highlight-color:transparent;}
    .carte{box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 6px 18px rgba(0,0,0,.28);
      animation:apparition var(--t-moyen) var(--ease) both;}
    @keyframes apparition{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
    html{scroll-behavior:smooth;}
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;
        transition-duration:1ms!important;scroll-behavior:auto!important;}
    }
    /* Squelettes de chargement (01/10/2026) : la forme de ce qui arrive, au
       lieu d'un texte « Chargement… » qui fait sauter la page à l'arrivée.
       Reflet animé par transform seulement (GPU). */
    .sq{background:#0d1829;border:1px solid #1a2540;border-radius:8px;position:relative;overflow:hidden;}
    .sq-l{height:10px;border-radius:4px;background:#13203a;margin:10px 0;}
    .sq::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
      background:linear-gradient(90deg,transparent,rgba(200,211,232,.06),transparent);
      animation:reflet 1.2s ease-in-out infinite;}
    @keyframes reflet{to{transform:translateX(100%);}}
    @media (prefers-reduced-motion:reduce){.sq::after{display:none;}}
    /* Mobile (01/10/2026). Mesuré à 390 px : les 107 boutons faisaient moins
       de 32 px de haut, le plus petit 14. Les agrandir tous aurait cassé la
       mise en page ; on agrandit plutôt leur ZONE TACTILE, invisible, à
       ≥ 44 px, et on donne une hauteur minimale modérée sur écran tactile. */
    @media (pointer:coarse){
      button,select{min-height:32px;touch-action:manipulation;}
      button{position:relative;}
      button::after{content:"";position:absolute;inset:-6px -2px;}
      input{font-size:16px!important;}
      /* Boutons du graphique (07/10/2026) : 26 à 36 px de large, zone de
         30 px pour ⟳. Largeur minimale 38 + 3 px de chaque côté = 44 ; les
         rangées s'écartent de 12 px pour que les zones (6 px au-dessus et
         au-dessous) ne se chevauchent pas. */
      .btn-graphe{min-width:38px;}
      .btn-graphe::after{inset:-6px -3px!important;}
      .barre-graphe{row-gap:12px!important;}
    }
    /* Menu principal (01/10/2026), demande d'Abd Moutalib : « les boutons se
       cachent, il faut toujours les chercher ». Un bouton bien visible, un
       panneau latéral qui regroupe toutes les vues par rubrique. */
    .menu-voile{position:fixed;inset:0;background:rgba(4,8,16,.6);z-index:300;animation:voile var(--t-moyen) var(--ease) both;}
    @keyframes voile{from{opacity:0;}to{opacity:1;}}
    .menu-panneau{position:fixed;top:0;left:0;bottom:0;width:min(320px,86vw);background:#0b1424;border-right:1px solid #1a2540;
      z-index:301;overflow-y:auto;box-shadow:12px 0 32px rgba(0,0,0,.45);animation:glisse var(--t-moyen) var(--ease) both;padding:18px 0 24px;}
    @keyframes glisse{from{transform:translateX(-100%);}to{transform:none;}}
    .menu-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:none;
      border-left:3px solid transparent;color:#c8d3e8;padding:12px 20px;font-family:var(--font);cursor:pointer;}
    .menu-item:hover{background:rgba(77,184,255,.07);box-shadow:none!important;}
    .menu-item.actif{border-left-color:#00e5a0;background:rgba(0,229,160,.08);color:#00e5a0;}
    .menu-flottant{display:none;}
    /* Légende S/R : 10 px sur téléphone, deux lignes au plus par niveau (21/10/2026).
       ⚠️ Le retrait passe de 8 à 6 px : à 390 px la ligne mesurait 318 px, soit
       52,99 signes de 6 px — le navigateur en loge 52, pas 53, et 12 % des
       niveaux de la fenêtre 3A repassaient à trois lignes (mesuré). */
    @media (max-width:640px){.legende-sr .sr-ligne{font-size:10px;}
      .legende-sr{padding-left:6px!important;padding-right:6px!important;}}
    @media (max-width:640px){
      .menu-flottant{display:flex;position:fixed;left:14px;bottom:18px;z-index:250;width:56px;height:56px;border-radius:50%;
        align-items:center;justify-content:center;background:#00e5a0;color:#080d1a;border:none;
        box-shadow:0 6px 20px rgba(0,229,160,.35),0 2px 6px rgba(0,0,0,.5);font-size:22px;}
    }
    /* Accueil en rangées et animation d'ouverture (01/10/2026), demande
       d'Abd Moutalib : « une ouverture comme Netflix ». */
    .rangee{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 14px;
      scrollbar-width:thin;scrollbar-color:#1a2540 transparent;-webkit-overflow-scrolling:touch;}
    .tuile{flex:0 0 168px;scroll-snap-align:start;background:#0d1829;border:1px solid #1a2540;border-radius:10px;
      padding:12px;cursor:pointer;text-align:left;font-family:var(--font);color:#c8d3e8;
      transition:transform var(--t-court) var(--ease),border-color var(--t-court) var(--ease),box-shadow var(--t-court) var(--ease);}
    .tuile:hover{transform:translateY(-3px) scale(1.03);border-color:rgba(77,184,255,.45);
      box-shadow:0 10px 24px rgba(0,0,0,.45)!important;filter:none!important;}
    .intro{position:fixed;inset:0;z-index:1000;background:#080d1a;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:14px;cursor:pointer;animation:intro-sortie 200ms ease-in 600ms both;}
    /* 07/10/2026 : ouverture ramenée de 2 s à 800 ms (logo 500, trait 150+450,
       sortie 600+200), et jouée une fois par appareil, plus une par onglet. */
    .intro-logo{font-size:clamp(28px,8vw,56px);font-weight:700;letter-spacing:.35em;}
    /* ⚠️ MÉTAL ET ÉCLAT — 13/10/2026, demande d'Abd Moutalib : « couleurs
       métalliques avec un coup d'éclat ». Le relief chromé est dans l'image
       (assets/marque) ; l'éclat est un reflet qui balaie l'emblème, découpé
       à sa silhouette par un masque, et le texte par un second fond. Toutes
       les 6 s, 0,9 s de passage ; aucun mouvement si l'appareil le refuse. */
    .metal-texte{background-image:linear-gradient(105deg,transparent 45%,rgba(255,255,255,.95) 50%,transparent 55%),
        linear-gradient(180deg,#f0fffa 0%,#7ff5d2 30%,#00b98a 48%,#0a4a46 52%,#7fd8ff 58%,#e8f6ff 70%,#4db8ff 100%);
      background-size:250% 100%,100% 100%;background-repeat:no-repeat;background-position:160% 0,0 0;
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
      animation:eclat-texte 6s ease-in-out 1.2s infinite;}
    @keyframes eclat-texte{0%,85%{background-position:160% 0,0 0;}100%{background-position:-60% 0,0 0;}}
    .eclat{position:relative;display:inline-block;line-height:0;}
    .eclat::after{content:"";position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(105deg,transparent 45%,rgba(255,255,255,.85) 50%,transparent 55%);
      background-size:300% 100%;background-repeat:no-repeat;background-position:160% 0;
      -webkit-mask:url(assets/marque/taureau-128.png) center/contain no-repeat;mask:url(assets/marque/taureau-128.png) center/contain no-repeat;
      mix-blend-mode:screen;animation:eclat 6s ease-in-out 1s infinite;}
    .eclat.grand::after{-webkit-mask-image:url(assets/marque/taureau-512.png);mask-image:url(assets/marque/taureau-512.png);animation-delay:.4s;}
    @keyframes eclat{0%,85%{background-position:160% 0;}100%{background-position:-60% 0;}}
    .intro-logo.metal-texte{animation:intro-logo 500ms cubic-bezier(.2,.7,.2,1) both,eclat-texte 6s ease-in-out .5s infinite;}
    @media (prefers-reduced-motion: reduce){.eclat::after,.metal-texte{animation:none;}}
    .intro-embleme{width:clamp(84px,22vw,140px);height:auto;filter:drop-shadow(0 0 18px rgba(0,229,160,.3));
      animation:intro-logo 500ms cubic-bezier(.2,.7,.2,1) both;}
    .intro-trait{height:2px;width:0;background:linear-gradient(90deg,#00e5a0,#4db8ff);
      animation:intro-trait 450ms 150ms cubic-bezier(.2,.7,.2,1) both;}
    @keyframes intro-logo{from{opacity:0;transform:scale(.92);letter-spacing:.6em;}to{opacity:1;transform:none;}}

// Fetch helper: essaie direct puis via proxy CORS
async function bvcGet(url){
  try{const r=await fetch(url,{cache:"no-store"});if(r.ok)return r.json();}catch{}
  for(const proxy of PROXY_LIST){
    try{const r=await fetch(proxy+encodeURIComponent(url),{cache:"no-store"});if(r.ok)return r.json();}catch{}
  }
  return null;
}
async function bvcGetHTML(url){
  for(const proxy of PROXY_LIST){
    try{const r=await fetch(proxy+encodeURIComponent(url),{cache:"no-store"});if(r.ok)return r.text();}catch{}
  }
  return null;
}

// IDBourse: tous les tickers en un seul appel
async function fetchIDB(){
  const data=await bvcGet(`${IDB_BASE}/api/proxy/get_all_data`);
  if(!Array.isArray(data)||data.length===0)return null;
  const out={};
  data.forEach(d=>{
    if(!d.dernier_cours)return;
    // Extraire le code BVC depuis l'URL (.../instruments/CSR → "CSR")
    const url=d.url||"";
    const fromUrl=url.includes("/instruments/")?url.split("/instruments/").pop().toUpperCase():"";
    let sym=fromUrl&&CONFIG.ISIN_MAP[fromUrl]?fromUrl:null;
    if(!sym){const n=(d.name||"").toUpperCase();sym=CONFIG.IDB_NAME_MAP[n]||n;}
    if(!CONFIG.ISIN_MAP[sym])return;
    // volume_en_titres: "3 726" (espaces insécables) → entier
    const volStr=String(d.volume_en_titres||"0").replace(/[ \s,]/g,"");
    const vol=volStr&&volStr!=="0"?Math.round(parseFloat(volStr))||0:0;
    // ouverture: "181,10" (virgule décimale française) → float
    const opnStr=String(d.ouverture||"").replace(",",".");
    const open=opnStr?parseFloat(opnStr)||null:null;
    out[sym]={price:+d.dernier_cours,chg:d.variation!=null?+d.variation:0,open,close:+d.dernier_cours,vol,live:true,src:"IDBourse"};
  });
  return Object.keys(out).length>0?out:null;
}

// Médias24: cours individuel par ISIN
async function fetchMed24Quote(sym){
  const isin=CONFIG.ISIN_MAP[sym];if(!isin)return null;
  const data=await bvcGet(`${MED_BASE}?method=getStockInfo&ISIN=${isin}&format=json`);
  const r=data?.result;if(!r)return null;
  const price=r.cours?+r.cours:null;
  if(!price||isNaN(price))return null;
  return{price,chg:r.variation?+r.variation:0,open:r.ouverture?+r.ouverture:price,close:price,live:true,src:"Médias24"};
}

// Médias24: historique OHLCV pour graphique (format: {date,value,max,min,volume})
async function fetchMed24History(sym,days){
  const isin=CONFIG.ISIN_MAP[sym];if(!isin)return null;
  const to=new Date();const from=new Date(+to-days*86400000);
  const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const data=await bvcGet(`${MED_BASE}?method=getPriceHistory&ISIN=${isin}&from=${fmt(from)}&to=${fmt(to)}&format=json`);
  const recs=data?.result;if(!Array.isArray(recs)||recs.length<5)return null;
  const candles=[];let prevClose=null;
  recs.forEach(rec=>{
    const raw=rec.date||"";
    let ts;
    if(raw.includes("/")){const[d,m,y]=raw.split("/");ts=new Date(+y,+m-1,+d).getTime();}
    else{ts=new Date(raw).getTime();}
    if(!ts||isNaN(ts))return;
    const c=+(rec.value||0),h=+(rec.max||rec.value)||c,l=+(rec.min||rec.value)||c;
    if(!c||c<=0)return;
    const o=prevClose!=null?prevClose:c; // open = veille clôture → couleurs rouge/vert correctes
    const vol=+(rec.volume||rec.vol||0);
    candles.push({x:ts,y:[o,Math.max(h,o,c),Math.min(l,o,c),c],vol});
    prevClose=c;
  });
  return candles.length>=5?candles:null;
}

// fetchQuotes: appelé UNIQUEMENT pendant session ouverte (isOpen=true)
// IDBourse (batch rapide) + patch Médias24 si chg=0 | Fallback → Médias24 titre par titre
async function fetchQuotes(){
  const out={};
  const mkt=getMarketStatus();

  // Pendant la session : IDBourse (batch rapide) + patch Médias24 si chg=0
  const idb=await fetchIDB();
  if(idb){
    Object.assign(out,idb);
    if(mkt.isOpen){
      const stale=Object.entries(out).filter(([,v])=>v.chg===0||v.chg==null).map(([k])=>k);
      if(stale.length>0){
        await Promise.all(stale.map(async sym=>{
          const q=await fetchMed24Quote(sym);
          if(q&&q.price&&q.price>0)out[sym]={...out[sym],...q};
        }));
      }
    }
    return out;
  }
  // Fallback : Médias24 par titre
  await Promise.all(STATIC.map(async s=>{
    const q=await fetchMed24Quote(s.symbol);
    if(q)out[s.symbol]=q;
  }));
  return Object.keys(out).length>0?out:null;
}

// fetchMed24Raw: Médias24 → [{d,o,h,l,c,v}] (même format que pipeline/candles)
async function fetchMed24Raw(sym,days){
  const isin=CONFIG.ISIN_MAP[sym];if(!isin)return null;
  const to=new Date();const from=new Date(+to-days*86400000);
  const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const data=await bvcGet(`${MED_BASE}?method=getPriceHistory&ISIN=${isin}&from=${fmt(from)}&to=${fmt(to)}&format=json`);
  const recs=data?.result;if(!Array.isArray(recs)||recs.length<2)return null;
  const rows=[];
  recs.forEach(rec=>{
    const raw=rec.date||"";
    let dt;
    if(raw.includes("/")){const[d,m,y]=raw.split("/");dt=`${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;}
    else{dt=raw.slice(0,10);}
    const c=+(rec.value||0);if(!c||c<=0)return;
    rows.push({d:dt,c:+c.toFixed(2),h:+(+(rec.max||c)).toFixed(2),l:+(+(rec.min||c)).toFixed(2),v:Math.round(+(rec.volume||0))});
  });
  if(rows.length<2)return null;
  // Calculer open = clôture J-1
  rows.sort((a,b)=>a.d.localeCompare(b.d));
  for(let i=0;i<rows.length;i++) rows[i].o=i===0?rows[i].c:+rows[i-1].c.toFixed(2);
  return rows;
}

   Chromium de contrôle, une heure d'avance. Le terminal applique donc le
   même registre que le moteur ; un test vérifie qu'ils restent identiques. */
const DECALAGES_MAROC=[["2018-10-28",1],["2026-02-08",0],["2026-03-29",1],["2026-09-20",0]];
const decalageMaroc=d=>{const j=new Date(d).toISOString().slice(0,10);let o=DECALAGES_MAROC[0][1];for(const [x,v] of DECALAGES_MAROC)if(j>=x)o=v;return o;};
const maroc=d=>{const t=d==null?new Date():new Date(d);return new Date(t.getTime()+decalageMaroc(t)*3600000);};
async function fetchChart(sym,range){
  /* ⚠️ La fenêtre la plus longue s'arrêtait à 365 jours alors que les fichiers
     de pipeline/candles/ en portent bien davantage — 802 séances pour 31 titres
     (depuis juin 2023) et 1 175 pour TGCC (depuis décembre 2021), médiane 548.
     Plus de la moitié de l'historique collecté était donc invisible à l'écran.
     `null` = aucune borne : on montre ce que le fichier contient, sans jamais
     prolonger la série au-delà. */
  const daysMap={"5d":7,"1mo":30,"3mo":90,"6mo":180,"1y":365,"3y":1095,"max":null};
  const days=range in daysMap?daysMap[range]:90;
  const _dCas=new Date(maroc().toLocaleString("en-US",{timeZone:"UTC"}));
  const todayStr=`${_dCas.getFullYear()}-${String(_dCas.getMonth()+1).padStart(2,"0")}-${String(_dCas.getDate()).padStart(2,"0")}`;

  // 1. Candles locales OHLCV
  let local=[];
  try{
    const r=await fetch(`./pipeline/candles/${sym}.json?t=${Math.floor(Date.now()/900000)}`);
    if(r.ok){const data=await r.json();local=Array.isArray(data)?data:(data.candles||[]);}
  }catch{}

  // 2. Si les candles locales ne couvrent pas aujourd'hui → enrichir avec Médias24 (15 jours)
  const lastLocal=local.length>0?local[local.length-1].d:"";
  if(LIVE_ACTIF&&local.length>=5&&lastLocal<todayStr){
    try{
      /* Enrichissement borné à 4 s. Médias24 passe par des proxies CORS
         publics : quand ils ne répondent pas, l'appel a été mesuré à 38 s.
         Le graphique restait alors vide en permanence — l'effet React se
         relance à chaque rafraîchissement des cours et annulait la requête
         avant qu'elle n'aboutisse. Les chandelles locales portent déjà la
         dernière clôture ; l'enrichissement est un bonus, pas une dépendance. */
      const fresh=await Promise.race([
        fetchMed24Raw(sym,15),
        new Promise(res=>setTimeout(()=>res(null),4000))
      ]);
      if(fresh&&fresh.length>0){
        const map={};
        local.forEach(c=>map[c.d]=c);
        // Ajouter les jours nouveaux (ne pas écraser les OHLCV réels locaux)
        fresh.forEach(c=>{if(!map[c.d])map[c.d]=c;});
        local=Object.values(map).sort((a,b)=>a.d.localeCompare(b.d));
      }
    }catch{}
  }

  // 3. Filtrer par fenêtre temporelle et convertir au format ApexCharts
  if(local.length>=5){
    let filtered=local;
    if(days!=null){
      const cutoff=new Date();cutoff.setDate(cutoff.getDate()-days);
      filtered=local.filter(c=>new Date(c.d)>=cutoff);
    }
    if(filtered.length>=5){
      let prevClose=null;
      return filtered.map(c=>{
        const o=c.o!=null?c.o:(prevClose!=null?prevClose:c.c);
        const h=c.h!=null?c.h:Math.max(o,c.c);
        const l=c.l!=null?c.l:Math.min(o,c.c);
        const ts=new Date(c.d).getTime();
        prevClose=c.c;
        return{x:ts,y:[o,h,l,c.c],vol:c.v||0};
      });
    }
  }

  // 4. Secours total : Médias24 (close uniquement)
  // ⚠️ Coupé avec la surcouche live (11/10/2026, revue de la PR #234) : une
  // autre source, d'une autre date, ouverture reconstituée sur la clôture
  // précédente. Sans historique local, le graphique reste vide plutôt que faux.
  if(!LIVE_ACTIF)return [];
  return fetchMed24History(sym,days!=null?days:1825);
}

// ── MARKET STATUS (BVC Casablanca, UTC+1 toute l'année) ───────────────────────
function getMarketStatus(){
  const d=new Date(maroc().toLocaleString("en-US",{timeZone:"UTC"}));
  const day=d.getDay(); // 0=dim, 6=sam
  if(day===0||day===6)return{label:"FERMÉ",color:"#ff4f5a",isOpen:false};
  const tot=d.getHours()*60+d.getMinutes();
  if(tot>=560&&tot<570)return{label:"PRÉ-OUVERTURE",color:"#ffd740",isOpen:false};  // 9h20-9h30
  if(tot>=570&&tot<930)return{label:"OUVERT",color:"#00e5a0",isOpen:true};           // 9h30-15h30
  if(tot>=930&&tot<940)return{label:"POST-CLÔTURE",color:"#4db8ff",isOpen:false};   // 15h30-15h40
  if(tot>=940)return{label:"CLÔTURE",color:"#ffd740",isOpen:false};                  // 15h40 → fin journée
  return{label:"FERMÉ",color:"#ff4f5a",isOpen:false};
}

const CBC_BASE="https://www.casablanca-bourse.com/bourseweb";
async function fetchMASI(){
  // 1. Casablanca Bourse officielle — Cours-Indices.aspx (scraping HTML)
  try{
    const html=await bvcGetHTML(`${CBC_BASE}/Cours-Indices.aspx`);
    if(html){
      const doc=new DOMParser().parseFromString(html,"text/html");
      const rows=doc.querySelectorAll("tr");
      for(const row of rows){
        const cells=[...row.querySelectorAll("td")];
        const labelCell=cells.find(c=>c.textContent.trim().toUpperCase().includes("MASI"));
        if(labelCell){
          // La valeur est généralement dans la cellule suivante ou celle d'après
          for(let i=cells.indexOf(labelCell)+1;i<cells.length;i++){
            const raw=cells[i].textContent.replace(/\s/g,"").replace(",",".");
            const v=parseFloat(raw);
            if(v>10000&&v<25000){
              // Chercher la variation dans les cellules restantes
              let c=0;
              for(let j=i+1;j<cells.length;j++){
                const vc=cells[j].textContent.replace(/\s/g,"").replace(",",".");
                const p=parseFloat(vc);
                if(!isNaN(p)&&Math.abs(p)<10)c=p;
              }
              return{value:v,chg:c,src:"CBC"};
            }
          }
        }
      }
    }
  }catch{}
  // 2. IDBourse — endpoint indices spécifique
  try{
    const data=await bvcGet(`${IDB_BASE}/api/proxy/get_indices`);
    if(Array.isArray(data)){
      const masi=data.find(d=>(d.code||d.ticker||d.symbol||d.name||"").toUpperCase().includes("MASI"));
      if(masi){
        const v=+(masi.cours||masi.valeur||masi.last||masi.value||0);
        const c=+(masi.variation||masi.chg||masi.change||0);
        if(v>0)return{value:v,chg:c,src:"IDB"};
      }
    }
  }catch{}
  // 3. IDBourse — scan get_all_data pour l'entrée MASI
  try{
    const data=await bvcGet(`${IDB_BASE}/api/proxy/get_all_data`);
    if(Array.isArray(data)){
      const e=data.find(d=>{
        const u=(d.url||"").toLowerCase();
        const n=(d.name||"").toUpperCase();
        return u.includes("/indices/masi")||u.includes("masi")||n==="MASI"||n.includes("MASI");
      });
      if(e&&e.dernier_cours)return{value:+e.dernier_cours,chg:e.variation!=null?+e.variation:0,src:"IDB"};
    }
  }catch{}
  // 4. Médias24 — méthode getIndexInfo
  try{
    const d=await bvcGet(`${MED_BASE}?method=getIndexInfo&index=MASI&format=json`);
    const r=d?.result;
    if(r?.valeur||r?.cours||r?.value){
      const v=+(r.valeur||r.cours||r.value);
      const c=+(r.variation||r.chg||0);
      if(v>0)return{value:v,chg:c,src:"M24"};
    }
  }catch{}
  // 5. Médias24 — historique MASI
  try{
    const to=new Date();const from=new Date(+to-2*86400000);
    const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const d=await bvcGet(`${MED_BASE}?method=getMASIHistory&from=${fmt(from)}&to=${fmt(to)}&format=json`);
    const recs=d?.result;
    if(Array.isArray(recs)&&recs.length>0){
      const last=recs[recs.length-1];
      const prev=recs.length>1?recs[recs.length-2]:null;
      const v=+(last.value||last.cours||0);
      const p=prev?+(prev.value||prev.cours||0):0;
      const c=p>0?+((v-p)/p*100).toFixed(2):0;
      if(v>0)return{value:v,chg:c,src:"M24"};
    }
  }catch{}
  return null;
}

// ── TECHNICAL CALCULATIONS ────────────────────────────────────────────────────
function calcRSI(closes,p=14){
  if(closes.length<p+1)return 50;
  let g=0,l=0;
  for(let i=1;i<=p;i++){const d=closes[i]-closes[i-1];if(d>0)g+=d;else l-=d;}
  let ag=g/p,al=l/p;
  for(let i=p+1;i<closes.length;i++){const d=closes[i]-closes[i-1];ag=(ag*(p-1)+Math.max(d,0))/p;al=(al*(p-1)+Math.max(-d,0))/p;}
  return al===0?100:+(100-100/(1+ag/al)).toFixed(1);
}

function calcMA(closes,p){
  return closes.map((_,i)=>i<p?null:+(closes.slice(i-p,i).reduce((a,b)=>a+b,0)/p).toFixed(2));
}

/* ⚠️ CONVENTION TRADINGVIEW (corrigée le 04/10/2026, relevée par Noure sur
   une capture de VCN). Le niveau 0 est le point 0, le niveau 1 le point 1,
   et chaque niveau vaut p0 + (p1 − p0) × r. Par défaut p0 = plus haut et
   p1 = plus bas : 0,618 se lit alors « 61,8 % de la hausse reperdus ».
   L'ancienne formule comptait depuis le bas : nos 0,382 et 0,618 (comme
   0,236 et 0,786) étaient inversés, seul 0,5 tombait juste. Au-delà de 1,
   ce sont les EXTENSIONS : des objectifs au-delà du point 1. */
const FIB_RETRACEMENTS=[0,0.236,0.382,0.5,0.618,0.786,1];
const FIB_EXTENSIONS=[1.272,1.414,1.618];
function calcFib(p0,p1,ratios=FIB_RETRACEMENTS){
  return ratios.map(r=>[r,+(p0+(p1-p0)*r).toFixed(2)]);
}

function calcEMA(arr,p){
  if(arr.length<p)return arr.map(()=>null);
  const k=2/(p+1);const res=new Array(p-1).fill(null);
  let ema=arr.slice(0,p).reduce((a,b)=>a+b,0)/p;
  res.push(+ema.toFixed(3));
  for(let i=p;i<arr.length;i++){ema=arr[i]*k+ema*(1-k);res.push(+ema.toFixed(3));}
  return res;
}

function calcMACD(closes,fast=12,slow=26,sig=9){
  const emaF=calcEMA(closes,fast),emaS=calcEMA(closes,slow);
  const macdLine=emaF.map((f,i)=>f!==null&&emaS[i]!==null?+(f-emaS[i]).toFixed(3):null);
  const validPairs=macdLine.map((v,i)=>({v,i})).filter(x=>x.v!==null);
  const sigEma=calcEMA(validPairs.map(x=>x.v),sig);
  const sigLine=new Array(macdLine.length).fill(null);
  validPairs.forEach((x,j)=>{if(sigEma[j]!==null)sigLine[x.i]=sigEma[j];});
  const hist=macdLine.map((m,i)=>m!==null&&sigLine[i]!==null?+(m-sigLine[i]).toFixed(3):null);
  return{macd:macdLine,signal:sigLine,hist};
}

function calcBollinger(closes,period=20,mult=2){
  const upper=[],middle=[],lower=[];
  for(let i=0;i<closes.length;i++){
    if(i<period-1){upper.push(null);middle.push(null);lower.push(null);continue;}
    const sl=closes.slice(i-period+1,i+1);
    const avg=sl.reduce((a,b)=>a+b,0)/period;
    const std=Math.sqrt(sl.reduce((a,b)=>a+(b-avg)**2,0)/period);
    upper.push(+(avg+mult*std).toFixed(2));
    middle.push(+avg.toFixed(2));
    lower.push(+(avg-mult*std).toFixed(2));
  }
  return{upper,middle,lower};
}

function calcIchimoku(candles){
  const highs=candles.map(c=>c.y[1]),lows=candles.map(c=>c.y[2]);
  const tenkan=[],kijun=[];
  for(let i=0;i<candles.length;i++){
    tenkan.push(i<8?null:+((Math.max(...highs.slice(i-8,i+1))+Math.min(...lows.slice(i-8,i+1)))/2).toFixed(2));
    kijun.push(i<25?null:+((Math.max(...highs.slice(i-25,i+1))+Math.min(...lows.slice(i-25,i+1)))/2).toFixed(2));
  }
  return{tenkan,kijun};
}

   · le CLASSEMENT est le nombre de contacts ; à égalité, le contact le plus
     récent, puis le plus proche du cours ;
   · on retient, dans cet ordre, au plus SR_PAR_COTE niveaux au-dessus du
     cours et SR_PAR_COTE au niveau ou en dessous ; un candidat à moins de
     l'ÉCART MINIMAL d'un niveau déjà retenu est ÉCARTÉ, pas fusionné — une
     fusion inventerait un prix jamais touché et un nombre de contacts à
     recompter ;
   · ÉCART MINIMAL = 1 ATR(14) relatif (moyenne des 14 dernières étendues
     vraies des séances cotées, rapportée à la dernière clôture cotée), avec
     un plancher de 2 × SR_TOL : en dessous, les bandes de contact de deux
     niveaux se chevaucheraient et partageraient leurs épisodes. Mesuré : un
     écart fixe de 3 % donne des totaux presque identiques ; l'ATR est
     retenu parce que l'ATR médian vaut 3,1 % mais va de 0,2 à 6,2 % selon
     le titre, et 3 % sépare mal deux niveaux d'un titre qui bouge de 6 % par
     séance ;
   · ⚠️ SR_TOL reste 1,2 % FIXE. Comparé à une tolérance de 0,4 ATR (même
     valeur au titre médian) : les niveaux retenus sont touchés 1,5 à 2,3 fois
     plus qu'un prix quelconque de la fenêtre dans les deux cas — aucun gain
     mesuré, et une règle à un seul chiffre se vérifie à l'œil.
   Aucun n'entre dans la note (R8) et aucun ne dit quoi faire : ce sont des
   séances passées, comptées et datées. Règles publiées dans « Comment lire ». */
const SR_TOL=0.012, SR_LB=3, SR_MIN_CONTACTS=2, SR_PAR_COTE=3, SR_ATR=14, SR_PROCHE_ATR=2;
const srCotee=c=>(c.vol||0)>0&&!c.live;
/* ATR(SR_ATR) relatif des séances cotées : moyenne des dernières étendues
   vraies (plus-haut − plus-bas, élargi à la clôture cotée précédente),
   rapportée à la dernière clôture cotée. null sans deux séances cotées. */
const srAtrRel=cot=>{
  if(!cot||cot.length<2)return null;
  const tr=[];
  for(let i=1;i<cot.length;i++){const[,h,l]=cot[i].y,pc=cot[i-1].y[3];tr.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));}
  const d=tr.slice(-SR_ATR),dc=cot[cot.length-1].y[3];

function calcSR(candles,price,min=SR_MIN_CONTACTS){
  const cot=(candles||[]).filter(srCotee);
  const ecartees=(candles||[]).length-cot.length;
  const n=cot.length;
  if(n<10)return{sup:[],res:[],ecartees,retires:0,ecartes:0,proches:0,cotees:n,atr:null,ecart:null};
  const atr=srAtrRel(cot);
  const ecart=Math.max(atr||0,2*SR_TOL);
  const highs=cot.map(c=>c.y[1]);
  const lows =cot.map(c=>c.y[2]);
  const lb=SR_LB;
  const pivots=[];
  for(let i=lb;i<n-lb;i++){
    if(highs.slice(i-lb,i).every(h=>h<=highs[i])&&highs.slice(i+1,i+lb+1).every(h=>h<=highs[i]))pivots.push(highs[i]);
    if(lows.slice(i-lb,i).every(l=>l>=lows[i])&&lows.slice(i+1,i+lb+1).every(l=>l>=lows[i]))pivots.push(lows[i]);
  }
  function cluster(arr,tol=SR_TOL){
    const s=[...arr].sort((a,b)=>a-b);const out=[];let i=0;
    while(i<s.length){
      let sum=s[i],cnt=1;
      while(i+cnt<s.length&&(s[i+cnt]-s[i])/s[i]<tol){sum+=s[i+cnt];cnt++;}
      out.push(+(sum/cnt).toFixed(2));i+=cnt;

  }
  /* Épisodes de contact sur les seules séances cotées. `support` dit le rôle
     attendu, déduit de la position du niveau par rapport au dernier cours. */
  const compter=(niveau,support)=>{
    let contacts=0,dansRole=0,tenus=0,autreRole=0,indetermines=0,premier=null,dernier=null;
    const roles=[];
    let i=0;
    while(i<n){
      const[,h,l]=cot[i].y;
      if(!(l<=niveau*(1+SR_TOL)&&h>=niveau*(1-SR_TOL))){i++;continue;}
      let j=i;
      while(j+1<n&&cot[j+1].y[2]<=niveau*(1+SR_TOL)&&cot[j+1].y[1]>=niveau*(1-SR_TOL))j++;
      contacts++;
      if(premier==null)premier=cot[i].x;
      dernier=cot[j].x;
      const avant=i>0?cot[i-1].y[3]:null,fin=cot[j].y[3];
      if(avant==null||avant===niveau)indetermines++;
      else{
        if(support?avant>niveau:avant<niveau){dansRole++;if(support?fin>=niveau:fin<=niveau)tenus++;}
        else autreRole++;
        const role=avant>niveau?"support":"résistance",k=roles[roles.length-1];
        if(k&&k.role===role){k.n++;k.dernier=cot[j].x;}
        else roles.push({role,n:1,premier:cot[i].x,dernier:cot[j].x});
      }
      i=j+1;
    }
    return{niveau,contacts,dansRole,tenus,autreRole,indetermines,premier,dernier,roles};
  };
  const tous=cluster(pivots).map(v=>compter(v,v<=price));
  const candidats=tous.filter(x=>x.contacts>=min)
    .sort((a,b)=>b.contacts-a.contacts||b.dernier-a.dernier||Math.abs(a.niveau-price)-Math.abs(b.niveau-price)||a.niveau-b.niveau);
  const pris=[];let nSup=0,nRes=0,ecartes=0;
  for(const L of candidats){
    const sup=L.niveau<=price;
    if(sup?nSup>=SR_PAR_COTE:nRes>=SR_PAR_COTE)continue;
    if(pris.some(P=>Math.abs(P.niveau-L.niveau)/Math.min(P.niveau,L.niveau)<ecart)){ecartes++;continue;}
    pris.push(L);if(sup)nSup++;else nRes++;
  }
  /* Niveaux PROCHES DU COURS — décision d'Abd Moutalib, 21/10/2026. Les
     3 + 3 ci-dessus ne bougent pas. De chaque côté, on AJOUTE au plus un
     niveau : le plus proche du cours parmi les candidats non retenus qui ont
     2 contacts au moins, respectent l'écart minimal vis-à-vis des niveaux
     déjà affichés, et sont à moins de SR_PROCHE_ATR ATR(14) de la dernière
     clôture cotée. Un niveau écarté pour son rang réapparaît donc quand le
     cours s'en approche. Côté support d'abord, puis résistance (vérifiée
     contre le support ajouté). Marqué `proche: true`. */
  const cloture=cot[n-1].y[3];
  let proches=0;
  for(const cote of [true,false]){
    const L=candidats.filter(x=>!pris.includes(x)&&(x.niveau<=price)===cote
        &&atr!=null&&cloture>0&&Math.abs(x.niveau-cloture)/cloture<SR_PROCHE_ATR*atr
        &&!pris.some(P=>Math.abs(P.niveau-x.niveau)/Math.min(P.niveau,x.niveau)<ecart))
      .sort((a,b)=>Math.abs(a.niveau-price)-Math.abs(b.niveau-price)||a.niveau-b.niveau)[0];
    if(L){L.proche=true;pris.push(L);proches++;}
  }
  const sup=pris.filter(x=>x.niveau<=price).sort((a,b)=>a.niveau-b.niveau);
  const res=pris.filter(x=>x.niveau>price).sort((a,b)=>a.niveau-b.niveau);
  return{sup,res,ecartees,retires:tous.length-candidats.length,ecartes,proches,cotees:n,atr,ecart};
}

/* ⚠️ NOTE PAR MÉTIER, EN COMPARAISON — 11/10/2026. Abd Moutalib a validé le
   principe d'une note fondamentale par famille de métier (banque, foncière,
   mines…) mais exige des corrections avant qu'elle entre dans la note : elle
   est donc calculée et affichée À CÔTÉ, jamais retenue dans le score, le
   signal ni la confiance. La fiche dit la famille, la part de la grille
   reposant sur des données (sous 50 % : pas de note) et, à l'ouverture, chaque
   critère : état (présent, absent, zéro confirmé, remplacement, suspendu),
   valeur, poids effectif et référence — une comparaison à la cote entière est
   étiquetée NON sectorielle. */
const FAMILLES_NOTE_LIB={banque:"banque",assurance:"assurance",financement:"financement et crédit-bail",
  paiement:"paiement",holding:"holding",fonciere:"foncière",promoteur:"promoteur immobilier",btp:"BTP",
  mines:"mines",telecom:"télécom",utility:"services collectifs",autre:"industrie, distribution, services"};

const ETATS_NOTE_LIB={present:"présent",absent:"absent",zero_confirme:"zéro confirmé",
  remplacement:"remplacement",suspendu:"suspendu"};
const NoteFond=({nf})=>{
  if(!nf) return null;
  /* Comparaison indisponible (erreur de calcul isolée côté moteur, 12/10/2026) :
     la note publiée n'est pas affectée, on le dit plutôt que de se taire. */
  if(nf.indisponible) return <div style={{marginTop:6,fontSize:10.5,color:"#5a6478"}}>Comparaison par métier indisponible sur cette mise à jour — la note publiée n'en dépend pas.</div>;
  const crit=nf.criteres||{};
  const pds=nf.poids_disponible??0;
  const fam=FAMILLES_NOTE_LIB[nf.famille]||nf.famille;
  const sansNote=nf.note==null;
  const dep=nf.dependance_cote;
  return (
    <details style={{marginTop:6,fontSize:10.5,color:"#8892a4"}}>
      <summary style={{cursor:"pointer"}}>
        Comparaison par métier, <b>non retenue dans la note</b> : <span style={{color:"#c8d3e8"}}>{sansNote?"non calculée":fmt(nf.note,1)}</span>
        {" · "}famille <span style={{color:"#c8d3e8"}}>{fam}</span>
        {" · "}couverture de la grille <span style={{color:sansNote?"#ff8a65":"#c8d3e8"}}>{pds} %</span>
        {sansNote&&<span style={{color:"#ff8a65"}}> — moins de la moitié</span>}
        {nf.partielle&&<span style={{color:"#ffb74d"}}> · note PARTIELLE (critère essentiel manquant : {(nf.criteres_essentiels_manquants||[]).map(k=>CRITERES_NOTE_LIB[k]||k).join(", ")})</span>}
      </summary>
      <div style={{marginTop:4,lineHeight:1.5}}>
        {Object.entries(crit).map(([k,c])=>(
          <div key={k} style={{color:["present","zero_confirme","remplacement"].includes(c.etat)?"#8892a4":"#5a6478"}}>
            <span style={{color:"#c8d3e8"}}>{CRITERES_NOTE_LIB[k]||k}</span>
            {" "}[{ETATS_NOTE_LIB[c.etat]||c.etat}] · poids {c.poids_nominal} % → effectif {c.poids_effectif} %
            {c.note!=null&&<> · note {fmt(c.note,1)}</>}
            {" — "}{c.mesure||c.motif}
            {c.reference&&c.reference.type==="cote_entiere"&&<span style={{color:"#ffb74d"}}> ⚠ comparaison à la cote entière, non sectorielle</span>}
          </div>
        ))}
        {dep&&dep.criteres&&dep.criteres.length>0&&
          <div style={{color:"#ffb74d"}}>Dépend de la cote entière ({dep.criteres.join(", ")}) :
            {dep.ecart_points!=null?` ${dep.ecart_points>0?"+":""}${dep.ecart_points} point(s) de note`:" la note n'existerait pas sans elle"}.</div>}
      </div>
    </details>
  );
};

          <div style={{fontSize:20,fontWeight:700,color:"#e8eef8",marginTop:2}}>{nb(m20.value)}</div>
          <div style={{display:"flex",gap:10,flexWrap:"wrap",fontSize:11,marginTop:2}}>
            {m20.change_pct!=null&&<span style={{color:coul(m20.change_pct),fontWeight:700}}>{fleche(m20.change_pct)} {pct(m20.change_pct)}</span>}
            {m20.ytd_pct!=null&&<span style={{color:"#8892a4"}}>depuis janvier <b style={{color:coul(m20.ytd_pct)}}>{pct(m20.ytd_pct)}</b></span>}
          </div>
        </div>}
      <div className="carte-ind" style={carte}>
        <div style={etiquette}>La séance</div>
        {/* 14/10/2026 : dans les premières minutes, la source compte des
            transactions sans servir ni volume ni largeur — le moteur les
            publie alors inconnues (jamais 0) et le dit ici. */}
        {masi.synthese_partielle&&<div style={{marginTop:6,fontSize:11,color:"#ffd740",lineHeight:1.5}}>
          Synthèse de séance pas encore consolidée{masi.transactions!=null?` : ${masi.transactions.toLocaleString("fr-FR")} transactions comptées`:""} — volume et largeur à venir.</div>}
        {masi.hausses!=null&&masi.baisses!=null&&tot>0&&<>
          <div title={`${masi.hausses} hausses · ${masi.baisses} baisses · ${masi.inchanges||0} inchangées sur ${masi.valeurs_traitees||tot} valeurs traitées`}
            style={{display:"flex",height:8,borderRadius:4,overflow:"hidden",marginTop:6,background:"#1a2540"}}>
            <div style={{width:`${100*masi.hausses/tot}%`,background:"#00e5a0"}}/>
            <div style={{width:`${100*(masi.inchanges||0)/tot}%`,background:"#5a6478"}}/>
            <div style={{width:`${100*masi.baisses/tot}%`,background:"#ff4f5a"}}/>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginTop:4}}>
            <span style={{color:"#00e5a0",fontWeight:700}}>{masi.hausses} ▲</span>
            <span style={{color:"#8892a4"}}>{masi.inchanges??0} =</span>
            <span style={{color:"#ff4f5a",fontWeight:700}}>{masi.baisses} ▼</span>
          </div>
        </>}
        {masi.volume_mad!=null&&
          <div style={{marginTop:6,fontSize:11,color:"#8892a4"}}
            title={`Volume global de la séance${masi.titres_echanges!=null?` : ${masi.titres_echanges.toLocaleString("fr-FR")} titres échangés`:""}${masi.transactions!=null?` en ${masi.transactions.toLocaleString("fr-FR")} transactions`:""}.`}>
            <b style={{color:"#e8eef8",fontSize:14}}>{volume}</b>
            {masi.transactions!=null&&<span> · {masi.transactions.toLocaleString("fr-FR")} transactions</span>}
          </div>}
      </div>
      {graphe&&!gabarit&&<div style={{...carte,gridColumn:"1/-1",padding:"8px 10px"}}><GraphiqueMASI/></div>}
