  );
};

/* Le volume de la séance, en DIRHAMS d'abord — 30/09/2026 : « au lieu
   d'afficher le volume en DH il affiche la quantité échangée ». Le montant
   est celui servi par la source (`echange_dh`) ; à défaut, le nombre de
   TITRES, étiqueté comme tel — jamais une quantité sous l'étiquette DH. */
/* Montant échangé EN ENTIER (demande d'Abd Moutalib, 14/10/2026) :
   « 152 470 312 DH » plutôt que « 152,5 M DH ». La forme abrégée ne subsiste
   que dans les tuiles de la carte des secteurs, faute de place. */
const montantEntier=dh=>dh==null||!isFinite(dh)?"—":`${Math.round(dh).toLocaleString("fr-FR").replace(/\u202f|\u00a0/g," ")} DH`;
const montantCompact=dh=>dh>=1e9?`${(dh/1e9).toFixed(2).replace(".",",")} Md DH`:dh>=1e6?`${(dh/1e6).toFixed(1).replace(".",",")} M DH`:dh>=1e3?`${Math.round(dh/1e3)} k DH`:`${Math.round(dh)} DH`;
const montantCourt=montantEntier;
const volumeCourt=r=>r.echange_dh!=null?montantCourt(r.echange_dh)
  :r.vol?`${r.vol.toLocaleString("fr-FR").replace(/\u202f|,/g," ")} titres`:"—";

function CompanyLogo({sym,logo,sector,size=32}){
  /* ⚠️ `sym` est le code AFFICHÉ (officiel : TGC, CFG, GTM) ; `logo` est NOTRE
     symbole (TGCC, CFGB, SGTM), qui nomme les fichiers. Les confondre ferait
     retomber silencieusement ces titres sur leur monogramme. */
  const cle=logo||sym;
  const [echec,setEchec]=useState(false);
  if(LOGOS.has(cle)&&!echec) return(
    <img className="logo-pastille" src={`logos/${cle}.png`} alt="" width={size} height={size} loading="lazy"
      onError={()=>setEchec(true)}
      style={{width:size,height:size,borderRadius:"50%",flexShrink:0,objectFit:"cover",
        background:"#fff",boxShadow:"0 1px 4px rgba(0,0,0,.45)"}}/>
  );
  const bg=SECTOR_COL[sector]||"#1a2540";
  const fs=Math.max(8,Math.round(size*0.30));
  const initials=sym.length<=3?sym:sym.slice(0,4);
  return(
    <div className="logo-pastille" style={{width:size,height:size,borderRadius:"50%",flexShrink:0,
      background:bg,display:"flex",alignItems:"center",justifyContent:"center",
      boxShadow:"0 2px 6px rgba(0,0,0,.5)"}}>
      <span style={{fontSize:fs,fontWeight:800,color:"#fff",fontFamily:"'Courier New',monospace",
          letterSpacing:-0.5,lineHeight:1,textAlign:"center",userSelect:"none"}}>{initials}</span>
    </div>
  );
}

const RSIGauge=({value})=>{
  /* ⚠️ UN RSI ABSENT N'EST PAS UN RSI DE 50 — 29/09/2026. `value||50`
     dessinait une jauge « NEUTRE » pour un titre sans historique, et
     transformait au passage un vrai RSI de 0 en 50. */
  if(value==null||!isFinite(value)) return(
    <div style={{textAlign:"center",fontSize:10,color:"#8892a4",padding:"18px 6px"}}>
      RSI (14) indisponible<br/><span style={{fontSize:9}}>moins de 15 séances cotées</span></div>);
  const v=Math.min(100,Math.max(0,value));
  const color=v>70?"#ff4f5a":v<30?"#00e5a0":"#ffd740";
  const label=v>70?"SURACHETÉ":v<30?"SURVENDU":"NEUTRE";
  const a=-Math.PI+Math.PI*(v/100);
  const cx=60,cy=58,r=44;
  const ex=cx+r*Math.cos(a),ey=cy+r*Math.sin(a);
  return(
    <div style={{textAlign:"center"}}>
      <svg width="120" height="70" viewBox="0 0 120 75">
        <path d={`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`} fill="none" stroke="#1a2540" strokeWidth="10" strokeLinecap="round"/>
        <path d={`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${ex} ${ey}`} fill="none" stroke={color} strokeWidth="10" strokeLinecap="round"/>
        <circle cx={ex} cy={ey} r={5} fill={color}/>
        <text x={cx} y={cy+2} textAnchor="middle" fill={color} fontSize="17" fontWeight="700" fontFamily="var(--font)">{v.toFixed(0)}</text>
        <text x={cx} y={cy+16} textAnchor="middle" fill="#8892a4" fontSize="8" fontFamily="var(--font)">{label}</text>
      </svg>
      <div style={{fontSize:9,color:"#8892a4",marginTop:-6}}>RSI (14)</div>
    </div>
  );
};

/* ── RED FLAGS ───────────────────────────────────────────────────────────────
   « Je veux une réponse sur les red flag, qu'est-ce que ça veut dire » (Noure,
   16/09). La réponse honnête tient en trois lignes, et elle n'est pas
   flatteuse : AUJOURD'HUI, CE NOMBRE N'EST PAS UNE MESURE.

   Il est écrit à la main, titre par titre, dans la table `FOND_DATA` du
   moteur (`update_data.py`) — la même table dont le `pb` s'est révélé être une
   constante tapée dans le code, fausse d'un facteur 3 à 9 sur trois titres.
   Aucun commentaire, aucun document du dépôt ne dit ce que chaque unité
   compte. Relevé le 16/09 sur les 80 titres publiés : 65 à zéro, 7 à un, 4 à
   deux, 2 à trois, 2 à quatre.

   Ce qu'il FAIT, en revanche, est parfaitement défini et vérifiable : au-delà
   de deux, il retire 0,30 point de note v5.3 par unité supplémentaire. Quatre
   titres sont dans ce cas — ADH, RDS, SNA, SRM.

   On l'affiche donc avec sa provenance. Publier un chiffre sans dire d'où il
   vient est exactement ce que l'audit du 09/09 reprochait au `pb_fige` : « une
   constante signalée comme figée reste une constante ». Le corriger demanderait
   de définir les critères ET de rejouer le backtest, puisqu'il entre dans la
   note — R8. Ce n'est pas un travail d'affichage. */
const RedFlags=({alertes})=>{
  /* ⚠️ ALERTES EXPLIQUÉES — 30/09/2026. Ce bouton affichait un nombre tiré
     d'une table écrite à la main, sans raison enregistrée, et ce nombre
     pénalisait la note. Désormais chaque alerte est CALCULÉE par le moteur
     (detecter_alertes) et arrive avec sa raison, son chiffre, son seuil, sa
     source et sa date. Elles informent ; elles ne pèsent plus sur la note.
     « Non évaluable » n'est pas « zéro » : sans fondamentaux, on ne sait pas. */
  const [ouvert,setOuvert]=useState(false);
  const a=alertes||{evaluable:false,liste:[]};
  const L=a.liste||[];
  const n=L.length;
  const NIV={"critique":"#ff4f5a","élevé":"#ff8f00","moyen":"#ffd740"};
  const c=!a.evaluable?"#8892a4":L.some(x=>x.niveau==="critique")?"#ff4f5a":n>=2?"#ff8f00":n===1?"#ffd740":"#00e5a0";
  const libelle=!a.evaluable?"non évaluable":n===0?"✅ aucune":`⚠️ ${n}`;
  const dateFr=d=>d?d.split("-").reverse().join("/"):"date inconnue";
  return(
    <>
      <button onClick={()=>setOuvert(v=>!v)} title="Cliquer pour lire chaque alerte et sa source"
        style={{fontSize:11,padding:"3px 8px",borderRadius:4,background:"#0a1220",color:c,border:`1px solid ${ouvert?c+"66":"#1a2540"}`,cursor:"pointer",fontFamily:"var(--font)"}}>
        Alertes : {libelle} <span style={{color:"#4a5570"}}>{ouvert?"▲":"▼"}</span>
      </button>
      {ouvert&&(
        <div style={{flexBasis:"100%",background:"#0a1220",border:`1px solid ${c}33`,borderRadius:6,padding:"10px 12px",fontSize:11,lineHeight:1.6,color:"#c8d3e8",marginTop:4}}>
          {!a.evaluable?(
            <div><b style={{color:"#8892a4"}}>Non évaluable.</b> Aucun ratio de dette ni de rentabilité du capital
              calculé sur les comptes publiés de ce titre : on ne peut ni signaler un risque, ni affirmer qu'il n'y en a pas.
              Les chiffres saisis à la main ne sont pas utilisés.</div>
          ):n===0?(
            <div><b style={{color:"#00e5a0"}}>Aucune alerte</b> sur les critères évalués parmi : dette nette / EBITDA,
              rentabilité du capital face à son coût, marge nette, conversion en trésorerie, surchauffe du RSI.</div>
          ):(
            <div>
              {L.map((x,k)=>(
                <div key={k} style={{padding:"6px 0",borderBottom:k<n-1?"1px solid #1a2540":"none"}}>
                  <div><span style={{color:NIV[x.niveau]||"#ffd740",fontWeight:700}}>● {x.raison}</span>
                    <span style={{color:"#5a6478",fontSize:10}}> · {x.theme}</span></div>
                  <div style={{marginTop:2}}>Mesuré : <b>{x.valeur}</b> <span style={{color:"#8892a4"}}>— {x.seuil}</span></div>
                  {x.source&&<div style={{color:"#5a6478",fontSize:10}}>{x.source}</div>}
                </div>
              ))}
            </div>
          )}
          {/* ⚠️ 06/10/2026 — plus aucune alerte sur un ratio saisi à la main :
              seuls les ratios calculés sur comptes AMMC sont lus. Ce qui n'a
              pas de ratio calculé est DIT non évalué, jamais compté comme sain. */}
          {a.evaluable&&(a.non_evalues||[]).length>0&&<div style={{color:"#8892a4",fontSize:10,marginTop:8}}>
            Non évalué, faute de ratio calculé sur les comptes : {a.non_evalues.join(", ")}.</div>}
          {a.evaluable&&<div style={{color:"#5a6478",fontSize:10,marginTop:6}}>
            Source : {a.source||"non précisée"}{a.date?` · calculés le ${dateFr(a.date)}`:""}.</div>}
          <div style={{color:"#8892a4",fontSize:10,marginTop:6}}>
            Information seulement : ces alertes n'entrent pas dans la note v5.3 (gel du 30/09/2026).</div>
        </div>
      )}
    </>
  );
};

/* Le tableau « Retracements Fibonacci · plage 90 jours » de la fiche a été
   retiré le 04/10/2026 à la demande de Noure : il retraçait une autre plage
   que le graphique et le contredisait. Le Fibonacci se lit désormais sur le
   graphique seul (bouton FIB, ancrage au clic). */

// ── STOCK CHART — Chandeliers + Volume + MACD ─────────────────────────────────
/* ── GRAPHIQUES FAÇON TRADINGVIEW — 03/10/2026, demande de Noure ──────────
   Sur la capture fournie : légende permanente O/H/B/C avec la variation de la
   séance, volume SOUS les bougies dans le même cadre, viseur pointillé avec
   ses étiquettes de prix et de date, et une MARGE À DROITE — la dernière
   bougie ne colle plus à l'échelle des prix.
   ⚠️ LE PLEIN ÉCRAN NE S'OUVRAIT PLUS. Mesuré au navigateur (390 × 844) : le
   cadre « plein écran » faisait 360 × 87 px, enfermé dans sa carte. L'animation
   d'apparition des cartes (#140) leur laisse une transformation CSS, et un
   élément `position:fixed` se cale alors sur ce parent, pas sur l'écran. Le
   plein écran est désormais rendu directement dans <body> (portail React). */
const TV_MARGE_DROITE=8;
const fmtPrixFR=p=>p==null||!isFinite(p)?"—":(+p).toLocaleString("fr-FR",{minimumFractionDigits:Math.abs(p)>=1000?0:2,maximumFractionDigits:2});
const fmtVolFR=v=>v==null||!isFinite(v)?"—":v>=1e6?`${(v/1e6).toLocaleString("fr-FR",{maximumFractionDigits:2})} M`:v>=1e3?`${(v/1e3).toLocaleString("fr-FR",{maximumFractionDigits:2})} K`:`${Math.round(v)}`;
const dateFR=t=>typeof t==="string"?`${t.slice(8,10)}/${t.slice(5,7)}/${t.slice(0,4)}`:"";
const optionsTV=(LW,w,h)=>({
  width:w,height:h,
  layout:{background:{color:"#0d1829"},textColor:"#8892a4",fontSize:11},
  grid:{vertLines:{color:"#1a254080"},horzLines:{color:"#1a254080"}},
  crosshair:{mode:LW.CrosshairMode.Normal,
    vertLine:{color:"#8892a4",width:1,style:LW.LineStyle.LargeDashed,labelBackgroundColor:"#2a3550"},
    horzLine:{color:"#8892a4",width:1,style:LW.LineStyle.LargeDashed,labelBackgroundColor:"#2a3550"}},
  rightPriceScale:{borderColor:"#1a2540"},
  timeScale:{borderColor:"#1a2540",rightOffset:TV_MARGE_DROITE,fixLeftEdge:true,timeVisible:false},
  localization:{locale:"fr-FR",priceFormatter:fmtPrixFR},
  kineticScroll:{touch:true,mouse:false},
  handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:false},
  handleScale:{axisPressedMouseMove:{time:true,price:true},mouseWheel:true,pinch:true},
});
// Vue de départ : toutes les séances chargées, plus la marge à droite.
// `fitContent()` l'aurait supprimée.
const vueEntiere=(ch,n,depuis=0)=>ch.timeScale().setVisibleLogicalRange({from:Math.max(0,depuis)-0.5,to:n-0.5+TV_MARGE_DROITE});
const PleinEcran=({titre,fermer,children})=>{
  useEffect(()=>{
    const h=e=>{if(e.key==="Escape")fermer();};
    window.addEventListener("keydown",h);
    const avant=document.body.style.overflow;document.body.style.overflow="hidden";
    return()=>{window.removeEventListener("keydown",h);document.body.style.overflow=avant;};
  },[]);
  return ReactDOM.createPortal(
    <div style={{position:"fixed",inset:0,zIndex:6000,background:"#060b16",padding:"10px 10px 14px",overflow:"auto"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8,gap:8}}>
        <span style={{fontSize:14,fontWeight:700,color:"#c8d3e8",letterSpacing:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{titre}</span>
        <button onClick={fermer} style={{fontSize:11,padding:"4px 12px",borderRadius:4,border:"1px solid #1a2540",background:"#0d1829",color:"#8892a4",cursor:"pointer",fontFamily:"var(--font)",flex:"0 0 auto"}}>✕ Fermer</button>
      </div>
      {children}
    </div>,document.body);
};

/* ── GRAPHIQUE DU MASI — 03/10/2026 ──
   Des CLÔTURES quotidiennes seulement (`pipeline/masi_history.json`) : pas
   d'ouverture, pas d'extrêmes, pas de volume. On trace donc une aire, comme
   TradingView le fait pour un indice — dessiner des bougies inventerait trois
   prix sur quatre. L'étendue réelle de la série est écrite sous le graphique. */
const GraphiqueMASI=()=>{
  const ref=useRef(null),refLeg=useRef(null),chart=useRef(null);
  const [serie,setSerie]=useState(null);
  const [fenetre,setFenetre]=useState("3M");
  const [plein,setPlein]=useState(false);
  const N={"1M":22,"3M":66,"6M":130,"1A":250,"3A":750,"TOUT":Infinity};
  useEffect(()=>{
    let vivant=true;
    fetch("pipeline/masi_history.json",{cache:"no-cache"}).then(x=>x.json())
      .then(j=>{if(vivant)setSerie(Object.entries(j.seances||{}).filter(([,v])=>v>0).sort(([a],[b])=>a<b?-1:1).map(([d,v])=>({time:d,value:+v})));})
      .catch(()=>{if(vivant)setSerie([]);});
    return()=>{vivant=false;};
  },[]);
  useEffect(()=>{
    if(chart.current){chart.current.remove();chart.current=null;}
    if(!ref.current||!serie||serie.length<2)return;
    ref.current.innerHTML="";
    const LW=window.LightweightCharts;
    const h=plein?Math.max(360,(window.innerHeight||800)-170):((window.innerWidth||1000)<640?300:280);
    const ch=LW.createChart(ref.current,{...optionsTV(LW,ref.current.offsetWidth||600,h),rightPriceScale:{borderColor:"#1a2540",scaleMargins:{top:0.22,bottom:0.08}}});
    chart.current=ch;
    const s=ch.addAreaSeries({lineColor:"#4db8ff",topColor:"rgba(77,184,255,.28)",bottomColor:"rgba(77,184,255,.02)",lineWidth:2,priceLineVisible:true,priceLineStyle:LW.LineStyle.Dotted,lastValueVisible:true});
    s.setData(serie);
    const n=serie.length;
    const legende=i=>{
      if(!refLeg.current)return;
      const k=Math.max(0,Math.min(n-1,i));
      const d=serie[k],p=k>0?serie[k-1].value:null;
      const dv=p!=null?d.value-p:null,dp=p?dv/p*100:null;
      const c=dv==null?"#8892a4":dv>=0?"#00e5a0":"#ff4f5a";
      refLeg.current.innerHTML=`<div><b style="color:#fff;font-size:13px">MASI</b> <span style="color:#8892a4">· J · ${dateFR(d.time)}</span></div>`+
        `<div><span style="color:#fff;font-weight:700">${fmtPrixFR(d.value)}</span>`+
        (dv!=null?` <span style="color:${c}">${dv>=0?"+":""}${fmtPrixFR(dv)} (${dp>=0?"+":""}${dp.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})} %)</span>`:"")+`</div>`;
    };
    legende(n-1);
    ch.subscribeCrosshairMove(prm=>legende(prm&&prm.logical!=null&&prm.point?Math.round(prm.logical):n-1));
    vueEntiere(ch,n,n-Math.min(n,N[fenetre]));
    const retour=()=>vueEntiere(ch,n,n-Math.min(n,N[fenetre]));
    const el=ref.current;el.addEventListener("dblclick",retour);
    const ro=new ResizeObserver(([e])=>{const w=Math.floor(e.contentRect.width);if(w>50)ch.applyOptions({width:w});});
    ro.observe(el);
    return()=>{ro.disconnect();el.removeEventListener("dblclick",retour);if(chart.current){chart.current.remove();chart.current=null;}};
  },[serie,fenetre,plein]);
  const b=(on)=>({background:on?"rgba(77,184,255,.15)":"transparent",border:on?"1px solid rgba(77,184,255,.4)":"1px solid #1a2540",color:on?"#4db8ff":"#8892a4",padding:"2px 8px",borderRadius:3,fontSize:10,cursor:"pointer",fontFamily:"var(--font)"});
  const n=serie?serie.length:0;
  const corps=(
    <div>
      <div className="barre-graphe" style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",marginBottom:6}}>
        {Object.keys(N).map(k=><button key={k} className="btn-graphe" onClick={()=>setFenetre(k)} style={b(fenetre===k)}>{k}</button>)}
        <button className="btn-graphe" onClick={()=>chart.current&&vueEntiere(chart.current,n,n-Math.min(n,N[fenetre]))} title="Revenir à la vue de départ (ou double-clic)" style={b(false)}>⟳</button>
        <button className="btn-graphe" onClick={()=>setPlein(v=>!v)} style={b(plein)}>{plein?"⤡ RÉDUIRE":"⤢ AGRANDIR"}</button>
      </div>
      <div style={{position:"relative"}}>
        <div ref={ref}/>
        <div ref={refLeg} style={{position:"absolute",top:6,left:8,zIndex:3,pointerEvents:"none",fontSize:12,lineHeight:1.45,textShadow:"0 0 4px #0d1829"}}/>
      </div>
      {serie&&serie.length<2&&<div style={{fontSize:11,color:"#8892a4",padding:8}}>Historique du MASI indisponible.</div>}
      {n>1&&<div style={{fontSize:9,color:"#8892a4",marginTop:4}}>Clôtures quotidiennes · {n} séances depuis le {dateFR(serie[0].time)} · pincer ou molette : zoom · glisser : déplacer · double-clic : vue de départ</div>}
    </div>
  );
  return plein?<PleinEcran titre="MASI — clôtures quotidiennes" fermer={()=>setPlein(false)}>{corps}</PleinEcran>:corps;
};

/* ── SIGNAUX TECHNIQUES EN ESSAI — 04/10/2026 ──────────────────────────────
   Le nouveau pilier technique tourne en MODE OMBRE : publié à côté de
   l'ancien, il n'entre pas dans la note tant qu'il n'a pas fait ses preuves
   sur des séances neuves. Chaque signal porte ce qu'il a donné sur la BVC —
   des fréquences MESURÉES, jamais des promesses.
   Source UNIQUE : datasets/frequences_publiees.json, produit par
   pipeline/frequences.py et recalculé par tests/test_frequences.py. Plus aucun
   chiffre en dur ici (06/10/2026) : effectif, période, IC de Wilson 95 % du
   % gagnants viennent du fichier. Titres liquides, écart au MASI à 60 séances
   en rendement total, frais non inclus. */
let REGIME_TECH=null;
let FREQ_PUB=null, FREQ_PUB_P=null;
const chargerFrequences=()=>FREQ_PUB_P||(FREQ_PUB_P=fetch("datasets/frequences_publiees.json?t="+Math.floor(Date.now()/3600000))
  .then(x=>x.ok?x.json():null).then(j=>{FREQ_PUB=j;return j;}).catch(()=>null));
const periodeFreq=p=>p?`${p.debut.slice(0,7)} → ${p.fin_donnees.slice(0,7)}`:"";
const SignauxTechniques=({r})=>{
  const [freq,setFreq]=useState(FREQ_PUB);
  useEffect(()=>{if(!freq)chargerFrequences().then(j=>j&&setFreq(j));},[]);
  const STATS_SIGNAUX=(freq&&freq.frequences)||{};
  const v2=r.score_tech_v2, neu=r.technique_neutralise, reg=REGIME_TECH;
  const coul=v=>v>0?"#00e5a0":v<0?"#ff4f5a":"#8892a4";
  // 14/10/2026 : une fréquence corrigée le DIT (errata du fichier publié).
  const ERRATA=(freq&&freq.errata)||[];
  const ligne=(k,actif)=>{const x=STATS_SIGNAUX[k];if(!x)return null;
    const al=x.alpha_moyen_pct, ic=x.ic95_gagnants||[];
    const er=ERRATA.filter(e=>e.frequence===k);
    return(
    <div key={k} style={{display:"flex",gap:8,alignItems:"baseline",padding:"5px 0",borderTop:"1px solid #1a2540",opacity:actif?1:.55,flexWrap:"wrap"}}>
      <span style={{color:actif?"#ffd740":"#5a6478",fontWeight:700,minWidth:14}}>{actif?"●":"○"}</span>
      <span style={{flex:"1 1 200px",color:actif?"#e8eef8":"#8892a4"}}>{x.libelle} <span style={{color:"#5a6478"}}>· {x.condition}</span></span>
      <span style={{fontSize:11,color:"#8892a4"}}><b style={{color:coul(al)}}>{al>0?"+":""}{al.toLocaleString("fr-FR")} %</b> d'écart moyen · {x.pct_gagnants.toLocaleString("fr-FR")} % gagnants (IC {ic[0].toLocaleString("fr-FR")}–{ic[1].toLocaleString("fr-FR")}) · {x.n} cas · {periodeFreq(x.periode_mesure)}</span>
      {er.map(e=><span key={e.date} title={e.cause} style={{flexBasis:"100%",fontSize:10,color:"#ffd740",paddingLeft:22}}>
        corrigé le {e.date.split("-").reverse().join("/")} : {e.avant.n} → {e.apres.n} cas, {e.avant.pct_gagnants.toLocaleString("fr-FR")} → {e.apres.pct_gagnants.toLocaleString("fr-FR")} % gagnants (historique de l'indice complété)</span>)}
    </div>);};
  return(
    <div className="carte" style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12}}>
      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:8}}>
        <span style={{fontSize:10,color:"#8892a4",letterSpacing:1,textTransform:"uppercase"}}>Signaux techniques</span>
        <span style={{fontSize:9,color:"#ffd740",border:"1px solid rgba(255,215,64,.4)",borderRadius:3,padding:"1px 6px"}}>EN ESSAI · n'entre pas dans la note</span>
        {reg&&<span title={`MASI ${reg.masi_sur_ma200?"au-dessus":"au-dessous"} de sa moyenne 200 séances · ${reg.part_titres_liquides_sur_ma200!=null?Math.round(reg.part_titres_liquides_sur_ma200*100)+" % des titres liquides au-dessus de la leur":"largeur inconnue"}`}
          style={{marginLeft:"auto",fontSize:11,fontWeight:700,color:reg.tendance?"#00e5a0":"#ff8f00"}}>
          Marché {reg.tendance?"EN TENDANCE":"HORS TENDANCE"}</span>}
      </div>
      {neu?(
        <div style={{fontSize:12,color:"#8892a4"}}>Technique non lisible sur ce titre ({neu.motif}) : avec si peu d'échanges, le graphique mesure surtout le bruit de la cotation. La note repose sur les fondamentaux.{r.verdict_plafonne&&<b style={{color:PALIERS[1].c}}> Couleur plafonnée au vert-jaune — titre peu échangé : la note fondamentale est bonne et reste affichée telle quelle, mais un titre qui s'échange si peu se négocie difficilement sans faire bouger son cours.</b>}</div>
      ):!v2?(
        <div style={{fontSize:12,color:"#8892a4"}}>Pas assez d'historique pour lire les signaux.</div>
      ):(<>
        <div style={{display:"flex",alignItems:"baseline",gap:10,flexWrap:"wrap",marginBottom:6}}>
          <span style={{fontSize:12,color:"#8892a4"}}>Nouvelle note technique (essai)</span>
          <b style={{fontSize:20,color:"#e8eef8"}}>{v2.score.toLocaleString("fr-FR")}</b><span style={{color:"#5a6478"}}>/10</span>
          {r.score_tech!=null&&<span style={{fontSize:11,color:"#5a6478"}}>actuelle : {(+r.score_tech).toLocaleString("fr-FR")}</span>}
          {v2.rang_mom120!=null&&<span style={{fontSize:11,color:"#8892a4",marginLeft:"auto"}}>force sur 6 mois : mieux que {Math.round(v2.rang_mom120*100)} % de la cote</span>}
        </div>
        {ligne("cassure",!!v2.cassure_recente)}
        {ligne("surachat",!!v2.surachat_recent)}
        {ligne(reg&&!reg.tendance?"pullback_off":"pullback_on",!!v2.pullback)}
        <div style={{fontSize:9,color:"#8892a4",marginTop:6}}>● signal présent dans les 20 dernières séances · chiffres mesurés sur la BVC (titres liquides) : écart au MASI 60 séances après le signal, dividendes compris, frais non inclus ; % gagnants = part des cas où l'écart est positif, IC = intervalle de Wilson à 95 %. Observations chevauchantes : l'incertitude réelle est plus large. Une fréquence passée, pas une promesse.</div>
      </>)}
    </div>
  );
};

/* Légende des supports et résistances, sous le graphique — 21/10/2026.
   Un paragraphe par niveau tracé, du plus haut au plus bas comme sur l'axe.
   Un contact = un épisode ; « tenu » ne se compte que dans le bon rôle (voir
   calcSR). Le mot suit la position du niveau par rapport à la dernière
   clôture. Deux formes, selon les séquences de rôle (`roles`) :
   · une inversion nette (deux séquences) — « Support 29,10 — 5 contacts :
     résistance jusqu'au 12/06 (2), support depuis (3, tenu 2) » : le rôle
     d'avant, la date de son dernier contact, puis le rôle d'après ; chaque
     séquence porte son nombre de contacts, et « tenu » celle du rôle actuel ;
   · sinon — un seul rôle, ou des rôles alternés — le décompte daté, sans
     nommer de rôle : « Support 34,50 — 20 contacts du 12/11/25 au 12/10/26 :
     12 par-dessus (tenu 8) · 8 par-dessous ».
   ⚠️ Deux lignes au plus à 390 px (lot 1 bis) : l'ancienne rédaction en
   prenait trois par niveau. Mesuré par simulation (chasse fixe, 53 signes à
   10 px) puis dans le navigateur. C'est pourquoi la plage « du … au » cède
   la place aux dates de rôle dans une inversion nette, et pourquoi le corps
   passe à 10 px sous 640 px de large.
   Les dates sont ÉCRITES : une infobulle ne s'ouvre pas au doigt. L'année
   n'apparaît que si la fenêtre affichée chevauche deux années. */
const srJour=(ts,an)=>{const d=new Date(ts),j=String(d.getUTCDate()).padStart(2,"0"),m=String(d.getUTCMonth()+1).padStart(2,"0");
  return an?`${j}/${m}/${String(d.getUTCFullYear()).slice(2)}`:`${j}/${m}`;};
/* Tout ce qui suit le mot et le prix, en texte : testé tel quel sous node. */
const srSuite=(L,support,an)=>{
  const j=ts=>srJour(ts,an);
  const tete=`${L.proche?" · proche":""} — ${L.contacts} contact${L.contacts>1?"s":""}`;
  const inconnu=L.indetermines>0?`${L.indetermines} sens inconnu`:null;
  const comptes=[L.dansRole>0?`${L.dansRole} ${support?"par-dessus":"par-dessous"} (tenu ${L.tenus})`:null,
                 L.autreRole>0?`${L.autreRole} ${support?"par-dessous":"par-dessus"}`:null,
                 inconnu].filter(Boolean).join(" · ");
  const R=L.roles||[],actuel=support?"support":"résistance";
  if(R.length===2){
    const part=r=>r.role===actuel&&L.dansRole>0?`${r.n}, tenu ${L.tenus}`:`${r.n}`;
    return `${tete} : ${R[0].role} jusqu'au ${j(R[0].dernier)} (${part(R[0])}), ${R[1].role} depuis (${part(R[1])})${inconnu?` · ${inconnu}`:""}`;
  }
  /* Un seul rôle, ou des rôles alternés : la période et les comptes, sans
     nommer de rôle. ⚠️ « Support 34,50 — 20 contacts, résistance depuis le
     18/09/26 » se lisait comme une contradiction : le nom vient de la
     position, le rôle du dernier contact (relecture du 21/10/2026). */
  return `${tete} du ${j(L.premier)} au ${j(L.dernier)} : ${comptes}`;
};
const pctFR=x=>(x*100).toFixed(1).replace(".",",");
const LegendeSR=({sr,candles,period})=>{
  if(!sr||!candles||!candles.length)return null;
  const an=new Date(candles[0].x).getUTCFullYear()!==new Date(candles[candles.length-1].x).getUTCFullYear();
  const lignes=[...[...sr.res].reverse().map(L=>["Résistance","#ff4f5a",L]),
                ...[...sr.sup].reverse().map(L=>["Support","#00e5a0",L])];
  return(
    <div className="legende-sr" style={{marginTop:6,padding:"5px 8px",background:"#0a1220",border:"1px solid #1a2540",borderRadius:4,fontSize:11,lineHeight:1.5,color:"#c8d3e8",fontVariantNumeric:"tabular-nums"}}>
      <div style={{fontSize:9,color:"#8892a4",letterSpacing:.6,textTransform:"uppercase",marginBottom:2}}>S/R · fenêtre {period} · séances échangées seulement</div>
      {lignes.length===0&&<div style={{color:"#8892a4"}}>{sr.cotees<10?`Aucun niveau : ${sr.cotees} séance${sr.cotees>1?"s":""} échangée${sr.cotees>1?"s":""} sur cette fenêtre, il en faut 10.`:`Aucun niveau touché au moins ${SR_MIN_CONTACTS} fois sur cette fenêtre.`}</div>}
      {lignes.map(([nom,c,L])=>(
        <div key={nom+L.niveau} className="sr-ligne" data-niveau={L.niveau} style={{textWrap:"pretty"}}>
          <span style={{color:c}}>{nom}</span> <b style={{color:"#e8eef8",fontWeight:600}}>{fmtPrixFR(L.niveau)}</b>{srSuite(L,nom==="Support",an)}
        </div>
      ))}
      <div style={{fontSize:9.5,color:"#8892a4",marginTop:2}}>
        {lignes.length>0&&sr.ecart!=null&&<>Les niveaux les plus touchés, {SR_PAR_COTE} au plus de chaque côté, plus un « proche du cours » s'il est à moins de {SR_PROCHE_ATR} ATR ; espacés d'au moins {pctFR(sr.ecart)} % ; contact à {pctFR(SR_TOL)} % du niveau. </>}
        {sr.ecartees>0&&<>{sr.ecartees} séance{sr.ecartees>1?"s":""} écartée{sr.ecartees>1?"s":""} du calcul (sans échange, ou bougie du jour reconstituée), toujours dessinée{sr.ecartees>1?"s":""}. </>}
        Séances passées, comptées et datées — pas un niveau annoncé. Règles : « Comment lire ».
      </div>
    </div>
  );
};

/* ── FIG · TEND · GAP — figures, obliques et gaps du graphique (21/10/2026) ──
   Faits DATÉS lus dans datasets/figures_publiees.json, produit par
   pipeline/figures_publiees.py : rien n'est détecté ni recalculé ici, aucun
   nom de champ n'est inventé. Le fichier (≈ 250 ko) n'est chargé qu'au
   PREMIER clic sur l'un des trois boutons : l'ouverture n'en paie rien.
   ⚠️ VISION PRODUIT. Une figure est un motif constaté, pas une annonce. La
   fréquence décrit ce qui a SUIVI des cassures passées ; sur une figure
   armée elle s'écrit « après une cassure, … » et jamais comme la chance de
   la figure elle-même. Sous 30 cas : « échantillon insuffisant », aucun
   pourcentage. Fonctions pures, exécutées sous node par
   tests/test_figures_graphique.py. */
let FIG_PUB=null,FIG_PUB_P=null;
const chargerFigures=()=>FIG_PUB_P||(FIG_PUB_P=fetch("datasets/figures_publiees.json?t="+Math.floor(Date.now()/3600000))
  .then(x=>x.ok?x.json():null).then(j=>{FIG_PUB=j;if(!j)FIG_PUB_P=null;return j;}).catch(()=>{FIG_PUB_P=null;return null;}));
const FIG_COURT={double_creux:"2C",double_sommet:"2S",ete:"ETE",ete_inversee:"ETE inv.",tasse_anse:"Tasse",
  triangle_ascendant:"Tri. asc.",triangle_descendant:"Tri. desc.",triangle_sym:"Tri. sym.",
  fibo_rebond_382_618:"Fib 38-62",fibo_au_dela_786:"Fib >78,6"};
// Ce qui précède la fréquence : la condition passée qu'elle décrit.
const FIG_APRES={triangle_sym_haut:"après une cassure par le haut",triangle_sym_bas:"après une cassure par le bas",
  canal_rebond_support:"après un rebond sur le support",canal_cassure_bas:"après une cassure du support par le bas",
  fibo_rebond_382_618:"après un tel rebond",fibo_au_dela_786:"après un tel retracement"};
const figCoul=s=>s>0?"#00e5a0":s<0?"#ff4f5a":"#b388ff";
const figSens=e=>e.orientation_classique==="haussiere"?1:e.orientation_classique==="baissiere"?-1
  :/_haut$/.test(e.signal||"")?1:/_bas$/.test(e.signal||"")?-1:0;
const figJour=(iso,an)=>iso?`${iso.slice(8,10)}/${iso.slice(5,7)}${an&&iso.slice(0,4)!==an?"/"+iso.slice(2,4):""}`:"—";
const figPct=x=>(+x).toLocaleString("fr-FR",{maximumFractionDigits:1});
const figMin=fp=>(fp&&fp.methode&&fp.methode.min_cas_pour_publier)||30;
const figUnivers=liq=>liq?{cle:"liquides",nom:"titres liquides"}:{cle:"tous",nom:"tous titres"};
// Années couvertes, lues dans les périodes publiées (« 2023-2026 »).
const figPeriode=fp=>{let a=null,b=null;
  Object.values((fp&&fp.frequences)||{}).forEach(f=>Object.values((f&&f.periodes)||{}).forEach(p=>{
    const d=String(p.debut||"").slice(0,4),e=String(p.fin||"").slice(0,4);
    if(/^\d{4}$/.test(d)&&(!a||d<a))a=d;if(/^\d{4}$/.test(e)&&(!b||e>b))b=e;}));
  return a&&b?`${a}-${b}`:null;};
/* « après une cassure, sur 89 cas (2023-2026, tous titres), 49,4 % ont fait
   mieux que le MASI à 20 séances, hors frais ». Sens baissier : « moins bien »
   — c'est ce que mesure `part_bon_sens_brute_pct` quand `sens_teste` vaut −1. */
const figFrequence=(fp,ref,liq,apres)=>{
  const f=fp&&fp.frequences&&fp.frequences[ref],U=figUnivers(liq);
  const u=f&&f.univers&&f.univers[U.cle];
  if(!u)return `${apres} : fréquence non publiée`;
  const per=figPeriode(fp),ou=`${per?per+", ":""}${U.nom}`;
  if(u.statut!=="publie"||!(u.n>=figMin(fp))||u.part_bon_sens_brute_pct==null)
    return `${apres}, échantillon insuffisant (${u.n} cas, ${ou})`;
  return `${apres}, sur ${u.n} cas (${ou}), ${figPct(u.part_bon_sens_brute_pct)} % ont fait ${f.sens_teste<0?"moins bien":"mieux"} que le MASI à ${f.horizon_seances||20} séances, hors frais`;
};
const figNiveau=nd=>!nd?null:nd.forme==="horizontal"?fmtPrixFR(nd.prix)
  :nd.prix_a_la_derniere_seance!=null?`${fmtPrixFR(nd.prix_a_la_derniere_seance)} à la dernière séance`:null;
/* Volume de la séance de cassure ÷ médiane des 20 séances échangées
   précédentes (`volume_cassure_ratio`, PR #300). INFORMATION SEULE : aucun
   jugement, aucun filtre — le chiffre, son unité, sa référence. */
const figVolume=e=>e&&e.volume_cassure_ratio!=null&&isFinite(e.volume_cassure_ratio)
  ?` (volume ×${(+e.volume_cassure_ratio).toLocaleString("fr-FR",{maximumFractionDigits:2})} la médiane des 20 séances précédentes)`:"";
const figLegende=(f,fp,liq,an)=>{
  const lib=f.libelle||f.type,j=d=>figJour(d,an),refs=f.frequence_ref||[];
  const fr=()=>refs.map(r=>figFrequence(fp,r,liq,FIG_APRES[r]||"après une cassure")).join(" ; ");
  if(f.statut==="armee"){const nv=figNiveau(f.niveau_declenchement),nb=figNiveau(f.niveau_declenchement_bas);
    return `${lib} — figure formée le ${j(f.date_confirmation)}, armée, pas encore cassée${nv?` (ligne de cou ${nv}${nb?`, bas ${nb}`:""})`:""} · ${fr()}`;}
  if(f.statut==="declenchee"){
    if(/^fibo_/.test(f.type))return `${lib} — constaté le ${j(f.date_constat||f.date_confirmation)} · ${fr()}`;
    return `${lib} — cassure le ${j(f.date_cassure)}${figVolume(f)} · ${fr()}`;}
  if(f.statut==="invalidee")return `${lib} — figure invalidée le ${j(f.date_fin)}, avant toute cassure`;
  if(f.statut==="expiree")return `${lib} — figure expirée le ${j(f.date_fin)}, sans cassure`;
  return lib;
};
const ligneLegende=(l,fp,liq,an)=>{
  const lib=l.libelle||l.type,j=d=>figJour(d,an),refs=l.frequence_ref||[];
  const fr=rs=>rs.map(r=>figFrequence(fp,r,liq,FIG_APRES[r]||"après une cassure")).join(" ; ");
  const pt=k=>j(l.points&&l.points[k]&&l.points[k].date),canal=l.type==="canal_haussier";
  const trace=`par les points du ${pt(0)} et du ${pt(1)}`;
  if(l.statut==="armee")return `${lib} — ${trace}, ${canal?"ni rebond ni sortie":"pas encore cassée"} · ${fr(refs)}`;
  if(l.statut==="declenchee"){
    const quoi=l.signal==="canal_rebond_support"?"rebond sur le support":l.signal==="canal_cassure_bas"?"sortie par le bas":"cassure";
    return `${lib} — ${trace} · ${quoi} le ${j(l.date_cassure)}${figVolume(l)} · ${fr(l.signal?[l.signal]:refs)}`;}
  if(l.statut==="invalidee")return `${lib} — ${trace}, ${canal?"invalidé":"invalidée"} le ${j(l.date_fin)}, avant toute cassure`;
  if(l.statut==="expiree")return `${lib} — ${trace}, ${canal?"expiré":"expirée"} le ${j(l.date_fin)}, sans cassure`;
  return `${lib} — ${trace}`;
};
/* « Gap haussier du 13/10, ouvert depuis 6 séances · sur 2023-2026, 70,5 %
   des gaps haussiers ont été comblés en 20 séances (264 cas, titres
   liquides) ». Un gap comblé est un fait clos : pas de fréquence. */
const gapLegende=(g,fp,liq,an)=>{
  const lib=g.libelle||g.type,j=d=>figJour(d,an),U=figUnivers(liq);
  const zone=`${fmtPrixFR(g.zone_basse)}–${fmtPrixFR(g.zone_haute)}`,age=g.age_seances;
  const s=n=>`${n} séance${n>1?"s":""}`;
  if(g.statut==="comble")return `${lib} du ${j(g.date)} (${zone}), comblé le ${j(g.date_comblement)}`;
  const tete=g.statut==="partiellement_comble"
    ?`${lib} du ${j(g.date)} (${zone}), partiellement comblé depuis le ${j(g.date_retour_dans_la_zone)}, ouvert depuis ${s(age)}`
    :`${lib} du ${j(g.date)} (${zone}), ouvert depuis ${s(age)}`;
  /* L'horizon suit l'âge du gap (décision du 21/10/2026) : un taux à 20
     séances ne dit rien d'un gap qui en a déjà 36. Moins de 20 séances :
     taux à 20 ; de 20 à 59 : taux à 60 ; 60 et plus : au-delà de ce qui a
     été mesuré, aucun taux. */
  if(age!=null&&age>=60)return `${tete}, au-delà de l'horizon mesuré (60 séances)`;
  const h=age!=null&&age>=20?"h60":"h20";
  const f=fp&&fp.frequences&&fp.frequences[g.type];
  const c=f&&f.univers&&f.univers[U.cle]&&f.univers[U.cle][h]&&f.univers[U.cle][h].toutes_periodes;
  const nom=g.type==="gap_baissier"?"gaps baissiers":"gaps haussiers",per=figPeriode(fp);
  if(!c)return `${tete} · fréquence non publiée`;
  if(c.statut!=="publie"||!(c.n>=figMin(fp))||c.pct_combles==null)return `${tete} · échantillon insuffisant (${c.n} cas, ${U.nom})`;
  const quand=h==="h60"?"dans les 60 séances suivant leur ouverture":"en 20 séances";
  return `${tete} · ${per?`sur ${per}, `:""}${figPct(c.pct_combles)} % des ${nom} ont été comblés ${quand} (${c.n} cas, ${U.nom})`;
};
// Un élément n'est retenu que si TOUTES ses dates tombent dans la fenêtre.
const figDebut=e=>e.pivots&&e.pivots.length?e.pivots[0].date:e.points&&e.points.length?e.points[0].date:e.date||null;
/* FIGURES PASSÉES (invalidées, expirées) : tracées en pâle par défaut
   (décision d'Abd Moutalib, 22/10/2026) ; un interrupteur de la légende les
   masque (`show.passees` faux), elles sont alors seulement comptées.
   Chaque élément porte un identifiant stable (`id`) : la légende s'en sert
   pour mettre une figure en évidence. */
const figPassee=e=>e.statut==="invalidee"||e.statut==="expiree";
const figElements=(t,debut,show)=>{
  const pris=[];let h=0,passees=0;
  if(!t||t.statut_titre!=="analyse")return{pris,hors:0,passees:0};
  [["figures",show.fig],["lignes",show.tend],["gaps",show.gap]].forEach(([k,on])=>{if(!on)return;
    (t[k]||[]).forEach((e,n)=>{const d=figDebut(e);
      if(!(d&&debut&&d>=debut)){h++;return;}
      if(k!=="gaps"&&figPassee(e)&&!show.passees){passees++;return;}
      pris.push([k,e,k+":"+n]);});});
  return{pris,hors:h,passees};

     et la période qu'elle décrit ; tant qu'elle ne correspond pas, l'état
     affiché est « chargement » et rien n'est dessiné. */
  const [serieDe,setSerieDe]=useState(null);
  const [showBB,setShowBB]=useState(false);
  const [showIchi,setShowIchi]=useState(false);
  const [showSR,setShowSR]=useState(true);
  const [showFib,setShowFib]=useState(false);
  /* FIG · TEND · GAP : éteints à l'ouverture ; le premier clic charge
     datasets/figures_publiees.json (une seule fois pour tout le terminal). */
  const [showFig,setShowFig]=useState(false);
  const [showTend,setShowTend]=useState(false);
  const [showGap,setShowGap]=useState(false);
  const [figPub,setFigPub]=useState(FIG_PUB);
  const [figEtat,setFigEtat]=useState(FIG_PUB?"ok":null);   // null · chargement · ok · erreur
  // Figures passées (invalidées, expirées) : masquées tant qu'on ne les demande pas.
  // Vrai : figures passées tracées en pâle (défaut). Le choix de les masquer est retenu.
  const [figPassees,setFigPassees]=useState(()=>{try{return localStorage.getItem("bvc_fig_passees_masquees")!=="1";}catch(e){return true;}});
  const basculePassees=()=>setFigPassees(v=>{try{localStorage.setItem("bvc_fig_passees_masquees",v?"1":"0");}catch(e){}return !v;});
  // Élément mis en évidence par un clic dans la légende (null : aucun).
  const [figFocus,setFigFocus]=useState(null);
  const basculeFig=set=>{
    set(v=>!v);
    if(FIG_PUB){setFigPub(FIG_PUB);setFigEtat("ok");return;}
    setFigEtat("chargement");
    chargerFigures().then(j=>{if(j){setFigPub(j);setFigEtat("ok");}else setFigEtat("erreur");});
  };
  /* Fibonacci ancré au clic : premier clic = point 1, second = point 0,
     chaque clic aimanté sur le plus haut ou le plus bas de la bougie visée.
     Le gestionnaire de clic vit avec le graphique ; il lit l'état par `fibRef`
     pour ne pas avoir à recréer le graphique à chaque clic. */
  const [fibAncres,setFibAncres]=useState(null);   // {p0, p1} ou null
  const [fibAttente,setFibAttente]=useState(null); // point 1 posé, point 0 attendu
  const fibRef=useRef({on:false,premier:null});
  useEffect(()=>{fibRef.current.on=showFib;if(!showFib){fibRef.current.premier=null;setFibAttente(null);}},[showFib]);
  /* ⚠️ LES MOYENNES NE SONT PLUS TRACÉES PAR DÉFAUT. Elles l'étaient toutes
     les deux, en permanence, et brouillaient les chandelles — c'est la demande
     de Noure. Le choix est mémorisé : on ne le refait pas à chaque fiche. */
  const [mas,setMas]=useState(()=>{
    try{const v=JSON.parse(localStorage.getItem("bvc_mas")||"null");
        if(v&&typeof v==="object")return{20:!!v[20],50:!!v[50],200:!!v[200]};}catch{}
    return{20:false,50:false,200:false};
  });
  const [plein,setPlein]=useState(false);
  const sym=r.symbol||r.ticker;
  const etat=serieDe===sym+"|"+period?etatBrut:"chargement";
  useEffect(()=>{fibRef.current.premier=null;setFibAttente(null);setFibAncres(null);},[sym]);
  const rangeMap={"5J":"5d","1M":"1mo","3M":"3mo","6M":"6mo","1A":"1y","3A":"3y","TOUT":"max"};
  const toDate=ts=>{const d=new Date(ts);return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;};
  const mapS=(fn)=>liveCandles.map((c,i)=>{const v=fn(i);return v!=null?{time:toDate(c.x),value:v}:null;}).filter(Boolean);
  const basculeMa=p=>setMas(m=>{const n={...m,[p]:!m[p]};try{localStorage.setItem("bvc_mas",JSON.stringify(n));}catch{}return n;});

  useEffect(()=>{
    let alive=true;
    setLiveCandles(null);setIsLive(false);setEtat("chargement");
    fetchChart(sym,rangeMap[period]||"3mo").then(c=>{
      if(!alive)return;
      if(c){
        // Injecter la bougie du jour si la dernière candle est antérieure à aujourd'hui
        const cur=r.price||r.prix||0;
        if(c.length>0&&cur>0){
          const now=new Date(maroc().toLocaleString("en-US",{timeZone:"UTC"}));
          const todayStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
          const todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
          const lastCandle=c[c.length-1];
          const lastDate=new Date(lastCandle.x);
          const lastDateStr=`${lastDate.getUTCFullYear()}-${String(lastDate.getUTCMonth()+1).padStart(2,"0")}-${String(lastDate.getUTCDate()).padStart(2,"0")}`;
          if(lastDateStr<todayStr&&now.getDay()!==0&&now.getDay()!==6){
            const prevClose=lastCandle.y[3];
            const openPrice=r.open||r.ouverture||prevClose;
            c.push({x:todayStart,y:[+openPrice.toFixed(2),+Math.max(openPrice,cur).toFixed(2),+Math.min(openPrice,cur).toFixed(2),+cur.toFixed(2)],vol:r.vol||0,live:true});
          }
        }
        setLiveCandles(c);setIsLive(true);
        setEtat(c.length>=5?"ok":(c.length>0?"court":"vide"));setSerieDe(sym+"|"+period);
      }else{
        setLiveCandles([]);setEtat("vide");setSerieDe(sym+"|"+period);
      }
    }).catch(()=>{if(alive){setLiveCandles([]);setEtat("vide");setSerieDe(sym+"|"+period);}});
    return()=>{alive=false;};
  },[sym,period,r.live,r.price,r.vol]);

  useEffect(()=>{
    [chartMain,chartMacd].forEach(ref=>{if(ref.current){ref.current.remove();ref.current=null;}});
    if(!refMain.current||!refMacd.current)return;
    // ⚠️ VIDER les conteneurs à chaque passage, y compris quand on ne dessine
    // rien : c'est l'oubli qui laissait le message d'indisponibilité collé
    // au-dessus du graphique.
    refMain.current.innerHTML="";refMacd.current.innerHTML="";
    if(refTooltip.current)refTooltip.current.innerHTML="";   // jamais la légende de l'ancien titre
    if(etat!=="ok"||!liveCandles||liveCandles.length<5)return;

    const candles=liveCandles;
    const closes=candles.map(c=>c.y[3]);
    const curPrice=closes[closes.length-1]||0;
    const maSeries={20:calcMA(closes,20),50:calcMA(closes,50),200:calcMA(closes,200)};
    const macdData=calcMACD(closes);
    const bbData=calcBollinger(closes);
    const ichiData=calcIchimoku(candles);

    const lwData=candles.map(c=>({time:toDate(c.x),open:c.y[0],high:c.y[1],low:c.y[2],close:c.y[3]}));
    const n=lwData.length;
    const LW=window.LightweightCharts;
    const W=refMain.current.offsetWidth||600;
    // Le volume est désormais DANS le cadre du cours (en bas, 20 % de la
    // hauteur), comme sur TradingView : le cadre principal reprend la hauteur
    // de l'ancien panneau de volume.
    const tel=(window.innerWidth||1000)<640;
    const H={main:plein?Math.max(380,(window.innerHeight||800)-230):(tel?340:300),macd:plein?110:80};

    // ── Graphique principal : chandeliers + volume + moyennes choisies ──
    const main=LW.createChart(refMain.current,{...optionsTV(LW,W,H.main),rightPriceScale:{borderColor:"#1a2540",scaleMargins:{top:0.2,bottom:0.22}}});
    chartMain.current=main;
    const vol=main.addHistogramSeries({priceScaleId:"vol",priceFormat:{type:"custom",formatter:fmtVolFR,minMove:1},priceLineVisible:false,lastValueVisible:false});
    main.priceScale("vol").applyOptions({scaleMargins:{top:0.82,bottom:0},visible:false});
    vol.setData(candles.map(c=>({time:toDate(c.x),value:c.vol||0,color:c.y[3]>=c.y[0]?"#00e5a066":"#ff4f5a66"})));
    const cs=main.addCandlestickSeries({upColor:"#00e5a0",downColor:"#ff4f5a",borderUpColor:"#00e5a0",borderDownColor:"#ff4f5a",wickUpColor:"#00e5a0",wickDownColor:"#ff4f5a",priceLineVisible:true,priceLineStyle:LW.LineStyle.Dotted,lastValueVisible:true});
    cs.setData(lwData);
    const COULEUR_MA={20:"#4db8ff",50:"#b388ff",200:"#ff9800"};
    const ligne=(opts,f)=>{const x=main.addLineSeries({priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,visible:false,...opts});x.setData(mapS(f));return x;};
    const ma={};
    [20,50,200].forEach(p=>{ma[p]=ligne({color:COULEUR_MA[p],lineWidth:1.5,lineStyle:p===50?LW.LineStyle.Dashed:LW.LineStyle.Solid},i=>maSeries[p][i]);});
    const bb=[ligne({color:"#ffd740",lineWidth:1,lineStyle:LW.LineStyle.Dashed},i=>bbData.upper[i]),
              ligne({color:"#ffd740",lineWidth:1,lineStyle:LW.LineStyle.Dashed},i=>bbData.lower[i])];
    const ichi=[ligne({color:"#ff6f40",lineWidth:1.5},i=>ichiData.tenkan[i]),
                ligne({color:"#66b0ff",lineWidth:1.5,lineStyle:LW.LineStyle.Dashed},i=>ichiData.kijun[i])];
    // Figures, obliques, gaps : une primitive de série, posée vide.
    const dessins=creerDessins();
    if(typeof cs.attachPrimitive==="function"){try{cs.attachPrimitive(dessins);}catch(e){}}
    series.current={cs,ma,bb,ichi,lignes:[],candles,curPrice,LW,dessins};

    /* Légende PERMANENTE, comme TradingView : dernière séance par défaut,
       séance visée dès que le doigt ou la souris passe sur le graphique.
       ⚠️ L'index vient de `logical`, pas de `time` : avec des dates écrites
       en texte, `time` peut revenir sous une autre forme selon la version de
       la bibliothèque — l'ancienne info-bulle affichait parfois l'objet brut.
       La variation se calcule sur la clôture PRÉCÉDENTE, pas sur l'ouverture. */
    const legende=i=>{
      if(!refTooltip.current)return;
      const k=Math.max(0,Math.min(n-1,i));
      const d=lwData[k],p=k>0?lwData[k-1].close:null;
      const col=d.close>=d.open?"#00e5a0":"#ff4f5a";
      const dv=p!=null?d.close-p:null,dp=p?dv/p*100:null;
      const cv=dv==null?"#8892a4":dv>=0?"#00e5a0":"#ff4f5a";
      const v=candles[k].vol||0;
      const lab=t=>`<span style="color:#c8d3e8">${t}</span>`;
      const val=x=>`<span style="color:${col}">${fmtPrixFR(x)}</span>`;
      refTooltip.current.innerHTML=
        `<div><b style="color:#fff;font-size:13px">${tk(r)}</b> <span style="color:#8892a4">${r.name?"· "+r.name:""} · J · ${dateFR(d.time)}${candles[k].live?" · en séance":""}</span></div>`+
        `<div>${lab("O")} ${val(d.open)}&nbsp; ${lab("H")} ${val(d.high)}&nbsp; ${lab("B")} ${val(d.low)}&nbsp; ${lab("C")} ${val(d.close)}`+
        (dv!=null?`&nbsp; <span style="color:${cv}">${dv>=0?"+":""}${fmtPrixFR(dv)} (${dp>=0?"+":""}${dp.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})} %)</span>`:"")+`</div>`+
        `<div>${lab("Vol")} <span style="color:${col}">${fmtVolFR(v)}</span></div>`;
    };
    legende(n-1);
    main.subscribeCrosshairMove(prm=>legende(prm&&prm.point&&prm.logical!=null?Math.round(prm.logical):n-1));
    main.subscribeClick(prm=>{
      const f=fibRef.current;
      if(!f.on||!prm||!prm.point||prm.logical==null)return;
      const k=Math.round(prm.logical);
      if(k<0||k>=n)return;
      const y=cs.coordinateToPrice(prm.point.y);
      if(y==null)return;
      const d=lwData[k];
      const p=Math.abs(y-d.high)<=Math.abs(y-d.low)?d.high:d.low;
      if(f.premier==null){f.premier=p;setFibAttente(p);}
      else{const p1=f.premier;f.premier=null;setFibAttente(null);if(p1!==p)setFibAncres({p0:p,p1});}
    });

    // ── MACD ────────────────────────────────────────────────
    const macdChart=LW.createChart(refMacd.current,{...optionsTV(LW,W,H.macd),timeScale:{borderColor:"#1a2540",rightOffset:TV_MARGE_DROITE,fixLeftEdge:true,timeVisible:false,visible:false}});
    chartMacd.current=macdChart;
    macdChart.__s=macdChart.addLineSeries({color:"#4db8ff",lineWidth:1.5,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
    macdChart.__s.setData(mapS(i=>macdData.macd[i]));
    macdChart.addLineSeries({color:"#ffd740",lineWidth:1.5,lineStyle:LW.LineStyle.Dashed,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false}).setData(mapS(i=>macdData.signal[i]));
    macdChart.addHistogramSeries({priceLineVisible:false,lastValueVisible:false}).setData(
      candles.map((c,i)=>macdData.hist[i]!=null?{time:toDate(c.x),value:macdData.hist[i],color:(macdData.hist[i]||0)>=0?"#00e5a045":"#ff4f5a45"}:null).filter(Boolean)
    );
    macdChart.addLineSeries({color:"#8892a440",lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false}).setData(mapS(()=>0));

    // ── Synchronisation des axes temporels et du viseur ─────
    const all=[main,macdChart];
    const macdS=macdChart.__s;
    main.subscribeCrosshairMove(param=>{
      try{param.time?macdChart.setCrosshairPosition(0,param.time,macdS):macdChart.clearCrosshairPosition();}catch(e){}
    });
    all.forEach(src=>{
      src.timeScale().subscribeVisibleLogicalRangeChange(range=>{
        if(syncing.current||!range)return;
        syncing.current=true;
        all.filter(t=>t!==src).forEach(t=>t.timeScale().setVisibleLogicalRange(range));
        syncing.current=false;
      });
    });
    vueEntiere(main,n);

    // Double-clic = revenir à la vue de départ (toutes les séances + la marge).
    const retour=()=>vueEntiere(main,n);
    refMain.current.addEventListener("dblclick",retour);

    // ── Responsive resize ───────────────────────────────────
    const ro=new ResizeObserver(([e])=>{
      const w=Math.floor(e.contentRect.width);
      if(w<50)return;
      all.forEach(chart=>chart.applyOptions({width:w}));
    });
    ro.observe(refMain.current.parentElement||refMain.current);

    const conteneur=refMain.current;
    return()=>{
      ro.disconnect();
      if(conteneur)conteneur.removeEventListener("dblclick",retour);
      series.current=null;
      [chartMain,chartMacd].forEach(ref=>{if(ref.current){ref.current.remove();ref.current=null;}});
    };
  },[sym,period,liveCandles,etat,plein]);

  /* Supports et résistances calculés UNE fois par série, en dehors de l'effet :
     les lignes de prix et la légende sous le graphique lisent le même résultat.
     ⚠️ Déclaré AVANT l'effet qui le cite dans ses dépendances — une constante
     lue avant sa déclaration casse tout le terminal (« Erreur de rendu »). */
  const sr=useMemo(()=>{
    if(!showSR||etat!=="ok"||!liveCandles||liveCandles.length<5)return null;
    return calcSR(liveCandles,liveCandles[liveCandles.length-1].y[3]||0);
  },[showSR,etat,liveCandles]);

  // ── Indicateurs : montrés ou cachés sans recréer le graphique ──
  useEffect(()=>{
    const x=series.current;
    if(!x)return;
    const{cs,ma,bb,ichi,candles,curPrice,LW}=x;
    [20,50,200].forEach(p=>ma[p].applyOptions({visible:!!mas[p]}));
    bb.forEach(s=>s.applyOptions({visible:!!showBB}));
    ichi.forEach(s=>s.applyOptions({visible:!!showIchi}));
    x.lignes.forEach(l=>{try{cs.removePriceLine(l);}catch(e){}});
    x.lignes=[];
    /* ⚠️ FIBONACCI SUR LA FENÊTRE AFFICHÉE, et c'est délibéré. Le tableau de
       la fiche, lui, retrace une plage de 90 jours figée dans data.json. Les
       deux ne peuvent pas coïncider dès qu'on regarde autre chose que trois
       mois — les faire passer pour la même chose tromperait l'œil. Chacun
       porte donc sa plage en toutes lettres. */
    if(showFib){
      const hh=candles.reduce((m,c)=>Math.max(m,c.y[1]),-Infinity);
      const ll=candles.reduce((m,c)=>Math.min(m,c.y[2]), Infinity);
      // Ancrage choisi au clic (point 1 puis point 0, comme TradingView),
      // sinon les extrêmes de la fenêtre affichée.
      const a=fibAncres||(isFinite(hh)&&isFinite(ll)&&hh>ll?{p0:hh,p1:ll}:null);
      if(a){
        const trace=(ratios,color)=>calcFib(a.p0,a.p1,ratios).forEach(([ratio,val])=>x.lignes.push(cs.createPriceLine({price:val,color,lineWidth:1,lineStyle:LW.LineStyle.Dotted,axisLabelVisible:true,title:`Fib ${ratio===0?"0.0":ratio===1?"1.0":ratio}`})));
        trace(FIB_RETRACEMENTS,"#ffd74070");
        trace(FIB_EXTENSIONS,"#b388ff70");
      }
      if(fibAttente!=null)x.lignes.push(cs.createPriceLine({price:fibAttente,color:"#ffd740",lineWidth:1,lineStyle:LW.LineStyle.Solid,axisLabelVisible:true,title:"Fib 1 — cliquez le point 0"}));
    }
    // Titre court sur la ligne (« S 89,90 · 4× ») ; le détail daté est dans
    // la légende sous le graphique — une infobulle ne s'ouvre pas au doigt.
    const srData=(showSR&&sr)||{sup:[],res:[]};
    srData.sup.forEach(L=>x.lignes.push(cs.createPriceLine({price:L.niveau,color:"#00e5a060",lineWidth:1,lineStyle:LW.LineStyle.Dashed,title:`S ${fmtPrixFR(L.niveau)} · ${L.contacts}×`})));
    srData.res.forEach(L=>x.lignes.push(cs.createPriceLine({price:L.niveau,color:"#ff4f5a60",lineWidth:1,lineStyle:LW.LineStyle.Dashed,title:`R ${fmtPrixFR(L.niveau)} · ${L.contacts}×`})));
  },[sym,period,liveCandles,etat,plein,showBB,showIchi,showSR,showFib,fibAncres,fibAttente,mas,sr]);

  /* Ce que FIG · TEND · GAP montrent sur la fenêtre affichée — calculé une
     fois, lu par le dessin ET par la légende. ⚠️ Déclaré AVANT l'effet qui le
     cite (même piège que `sr`). */
  // ⚠️ Après `const sym` : le citer plus haut casse tout le terminal (vu le 22/10).
  useEffect(()=>{setFigFocus(null);},[sym,period]);
  const figVue=useMemo(()=>{
    if(!(showFig||showTend||showGap)||!figPub||etat!=="ok"||!liveCandles||liveCandles.length<5)return null;
    const dates=liveCandles.map(c=>toDate(c.x));
    const t=(figPub.titres||{})[sym]||null;
    return{t,dates,el:figElements(t,dates[0],{fig:showFig,tend:showTend,gap:showGap,passees:figPassees})};
  },[showFig,showTend,showGap,figPassees,figPub,etat,liveCandles,sym]);
  useEffect(()=>{
    const x=series.current;
    if(!x||!x.dessins)return;
    let f=[];
    const focus=figVue&&figVue.el&&figVue.el.pris.some(p=>p[2]===figFocus)?figFocus:null;
    const tel=(window.innerWidth||1000)<640;
    try{f=figVue&&figVue.el?figFormes(figVue.el.pris,figVue.dates,figVue.t,focus,tel):[];}catch(e){f=[];}
    x.dessins.poser(f);
  },[figVue,figFocus,sym,period,liveCandles,etat,plein]);

  const changePeriod=(p)=>{setPeriod(p);lsEcrire("bvc_period",p);};
  const reinitialiser=()=>{if(chartMain.current&&liveCandles)vueEntiere(chartMain.current,liveCandles.length);};

  const Btn=({on,c,titre,onClick,children})=>(
    <button className="btn-graphe" onClick={onClick} title={titre} style={{background:on?`${c}26`:"transparent",border:`1px solid ${on?c+"66":"#1a2540"}`,color:on?c:"#8892a4",padding:"2px 8px",borderRadius:3,fontSize:10,cursor:"pointer",fontFamily:"var(--font)"}}>{children}</button>
  );

  /* Ce que l'on montre quand il n'y a pas de graphique. Trois phrases
     différentes pour trois situations différentes — et sur 34 pixels, pas 220. */
  const MESSAGES={
    chargement:["Chargement de l'historique…","#8892a4"],
    court:[`Moins de 5 séances sur « ${period} » — élargir la fenêtre`,"#ffd740"],
    vide:["Aucune chandelle pour ce titre","#8892a4"],
  };
  const msg=etat!=="ok"?MESSAGES[etat]:null;

  const corps=(
    <div>
      <div className="barre-graphe" style={{display:"flex",gap:6,marginBottom:6,alignItems:"center",flexWrap:"wrap"}}>
        <span style={{fontSize:10,color:"#8892a4"}}>PÉRIODE</span>
        {["5J","1M","3M","6M","1A","3A","TOUT"].map(p=>(
          <button key={p} className="btn-graphe" onClick={()=>changePeriod(p)} style={{background:period===p?"rgba(77,184,255,.15)":"transparent",border:period===p?"1px solid rgba(77,184,255,.4)":"1px solid #1a2540",color:period===p?"#4db8ff":"#8892a4",padding:"2px 8px",borderRadius:3,fontSize:10,cursor:"pointer",fontFamily:"var(--font)"}}>{p}</button>
        ))}
        <span style={{color:"#1a2540",margin:"0 2px"}}>|</span>
        <Btn on={mas[20]} c="#4db8ff" titre="Moyenne mobile 20 séances" onClick={()=>basculeMa(20)}>MA20</Btn>
        <Btn on={mas[50]} c="#b388ff" titre="Moyenne mobile 50 séances" onClick={()=>basculeMa(50)}>MA50</Btn>
        <Btn on={mas[200]} c="#ff9800" titre="Moyenne mobile 200 séances — exige 200 séances d'historique" onClick={()=>basculeMa(200)}>MA200</Btn>
        <span style={{color:"#1a2540",margin:"0 2px"}}>|</span>
        <Btn on={showBB} c="#ffd740" titre="Bandes de Bollinger (20, 2σ)" onClick={()=>setShowBB(v=>!v)}>BB</Btn>
        <Btn on={showIchi} c="#ff6f40" titre="Ichimoku (Tenkan 9 / Kijun 26)" onClick={()=>setShowIchi(v=>!v)}>ICHI</Btn>
        <Btn on={showSR} c="#00e5a0" titre="Supports et résistances : sommets et creux des séances échangées, tracés s'ils ont été touchés au moins 2 fois — détail daté sous le graphique" onClick={()=>setShowSR(v=>!v)}>S/R</Btn>
        <Btn on={showFib} c="#ffd740" titre="Fibonacci façon TradingView : extrêmes de la fenêtre affichée, ou deux clics sur le graphique (point 1 puis point 0). Extensions 1,272 · 1,414 · 1,618 en violet." onClick={()=>setShowFib(v=>!v)}>FIB</Btn>

// ── TICKER TAPE ───────────────────────────────────────────────────────────────
const TickerTape=({rows})=>{
  /* ⚠️ LE BANDEAU NE MONTRAIT QUE 40 TITRES SUR 80. Le `slice(0,40)` datait
     d'un temps où la liste venait du classement : la moitié de la cote ne
     passait jamais, et toujours la même moitié — celle qui figure en tête du
     tri du moment. Un bandeau de cotation qui trie est un bandeau qui cache.
     On prend désormais tout ce qui cote, dans l'ordre alphabétique du code
     affiché : stable d'un run à l'autre, et l'œil retrouve un titre. */
  const items=rows.filter(r=>r.price>0).slice().sort((a,b)=>tk(a).localeCompare(tk(b)));
  if(items.length===0)return null;
  const nc=c=>c>0?"#00e5a0":c<0?"#ff4f5a":"#8892a4";
  const doubled=[...items,...items];
  return(
    <div style={{background:"#060b16",borderBottom:"1px solid #1a2540",padding:"4px 0",overflow:"hidden",userSelect:"none"}}>
      {/* ⚠️ La durée suit le NOMBRE de titres, sinon doubler la liste double la
          vitesse de défilement : 55 s convenaient pour 40 titres, elles font
          filer les 80 deux fois plus vite. 1,4 s par titre redonne exactement
          l'allure d'avant. */}
      <div className="ticker-inner" style={{animationDuration:`${Math.max(40,Math.round(items.length*1.4))}s`}}>
        {doubled.map((r,i)=>(
          <span key={i} style={{display:"inline-flex",alignItems:"center",marginRight:24,gap:4,fontSize:11,whiteSpace:"nowrap"}}>
            <span style={{color:"#2a3550",fontSize:8}}>◆</span>
            <span style={{color:"#c8d3e8",fontWeight:600,letterSpacing:.5}}>{tk(r)}</span>
            <span style={{color:"#4db8ff"}}>{(r.price||0).toFixed(2)}</span>
            <span style={{color:nc(r.chg)}}>{varSeance(r)==null?NON_COTE:<>{r.chg>0?"▲":r.chg<0?"▼":"—"}{Math.abs(r.chg||0).toFixed(2)}%</>}{r.chg_alert&&<span title="Variation ≥ ±8% — approche limite BVC">⚡</span>}</span>
          </span>
        ))}
      </div>
    </div>
  );
};

// ⚠️ LE SON D'OUVERTURE — 01/10/2026. Une goutte d'eau, synthétisée par le
// navigateur (Web Audio) : aucun fichier, aucun droit d'auteur. Demande
// d'Abd Moutalib : « un son d'une goutte d'eau bien prononcé ».
// Une goutte, c'est une note pure dont la hauteur MONTE très vite (la bulle
// qui se referme), suivie d'un petit rebond plus aigu, et d'un écho.
// ⚠️ Les navigateurs bloquent le son tant que l'utilisateur n'a pas touché
// le site (Safari, donc tout iPhone, et Chrome) : l'ouverture reste alors
// silencieuse, sans erreur.
function contexteAudio(){
  try{const AC=window.AudioContext||window.webkitAudioContext;return AC?new AC():null;}catch(e){return null;}
}
function jouerSonOuverture(ctx){
  try{
    if(!ctx)return;
    const go=()=>{
      const t0=ctx.currentTime+0.12, sortie=ctx.createGain();
      sortie.gain.value=0.55; sortie.connect(ctx.destination);
      // Écho : une copie retardée et atténuée, au rythme de la goutte ralentie.
      const retard=ctx.createDelay(); retard.delayTime.value=0.16;
      const retour=ctx.createGain(); retour.gain.value=0.28;
      retard.connect(retour); retour.connect(retard); retour.connect(sortie);
      const plic=(t,f0,f1,vol,duree)=>{
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type="sine";
        o.frequency.setValueAtTime(f0,t);
        o.frequency.exponentialRampToValueAtTime(f1,t+duree*0.35);
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(vol,t+0.006);
        g.gain.exponentialRampToValueAtTime(0.0001,t+duree);
        o.connect(g); g.connect(sortie); g.connect(retard);
        o.start(t); o.stop(t+duree+0.02);
      };
      plic(t0,       260,820,0.95,0.45);   // la goutte (grave, ralentie)
      plic(t0+0.30,  450,1150,0.38,0.27);  // le rebond
      setTimeout(()=>{try{ctx.close();}catch(e){}},2200);
    };
    if(ctx.state==="suspended")ctx.resume().then(()=>{if(ctx.state==="running")go();}).catch(()=>{});
    else go();
  }catch(e){}
}

// ⚠️ L'ANIMATION D'OUVERTURE — 01/10/2026. 800 ms depuis le 07/10 (deux
// secondes avant), une fois par appareil (par onglet avant), passable d'un
// toucher ; absente si le système demande moins de
// mouvement. Elle ne retarde rien : les données se chargent dessous.
const Intro=()=>{
  const [vu,setVu]=useState(()=>{
    try{
      if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return true;
      // Une fois par APPAREIL (localStorage) : la revoir à chaque onglet
      // retardait la lecture sans rien apprendre. Stockage refusé → pas
      // d'ouverture plutôt qu'une ouverture à chaque visite.
      return localStorage.getItem("bvc_intro")==="1";
    }catch(e){return true;}
  });
  // ⚠️ « TOUCHER POUR ENTRER » — 01/10/2026. Abd Moutalib : « toujours pas
  // de son ». Normal : l'iPhone n'autorise aucun son avant un toucher. Si le
  // navigateur permet déjà le son, l'ouverture joue seule ; sinon elle
  // attend un toucher, qui débloque le son — comme le choix d'un profil chez
  // Netflix. Le toucher lance la goutte, puis le terminal s'ouvre.
  const ctx=useRef(null);
  const [phase,setPhase]=useState("auto");
  useEffect(()=>{
    if(vu)return;
    try{localStorage.setItem("bvc_intro","1");}catch(e){}
    ctx.current=contexteAudio();
    if(ctx.current&&ctx.current.state==="running"){
      jouerSonOuverture(ctx.current);
      const t=setTimeout(()=>setVu(true),800);
      return()=>clearTimeout(t);
    }
    setPhase(ctx.current?"attente":"auto");
    if(!ctx.current){const t=setTimeout(()=>setVu(true),800);return()=>clearTimeout(t);}
  },[vu]);
  const entrer=()=>{
    if(phase!=="attente"){setVu(true);return;}
    jouerSonOuverture(ctx.current);
    setPhase("sortie");
    setTimeout(()=>setVu(true),500);
  };
  useEffect(()=>{
    if(vu||phase!=="attente")return;
    const h=e=>{if(e.key==="Enter"||e.key===" ")entrer();};
    window.addEventListener("keydown",h);
    return()=>window.removeEventListener("keydown",h);
  });
  if(vu)return null;
  return(
    <div className={"intro"+(phase==="attente"?" attente":phase==="sortie"?" sortie":"")} onClick={entrer} role="button"
      aria-label="Entrer dans BVC Analyzer">
      <span className="eclat grand"><img className="intro-embleme" src="assets/marque/taureau-512.png" alt="" width="120" height="120"/></span>
      <div className="intro-logo metal-texte">BVC ANALYZER</div>
      <div className="intro-trait"/>
      {phase!=="auto"&&<div className="intro-toucher">{phase==="attente"?"TOUCHER POUR ENTRER":"\u00a0"}</div>}
    </div>);
};

const Accueil=({rows,fav,ouvrir,setTab})=>{
  const [b,setB]=useState(undefined);
  useEffect(()=>{
    // La lecture la plus récente ; à séance égale, celle de clôture, qui porte
    // la lecture rédigée.
    const t=Math.floor(Date.now()/3600000);
    const lire=f=>fetch(f+"?t="+t).then(r=>r.ok?r.json():null).catch(()=>null);
    Promise.all([lire("briefing.json"),lire("briefing_cloture.json")]).then(([j,c])=>{
      setB(c&&(!j||(c.seance||"")>=(j.seance||""))?c:j);
    });
  },[]);
  const par=Object.fromEntries(rows.map(r=>[r.symbol,r]));
  const frais=rows.filter(r=>!meta(r).stale&&r.chg!=null);
  const hausses=[...frais].filter(r=>r.chg>0).sort((a,b)=>b.chg-a.chg).slice(0,10);
  const baisses=[...frais].filter(r=>r.chg<0).sort((a,b)=>a.chg-b.chg).slice(0,10);
  // Titres non comparables (règle A, 27/10/2026) exclus : leur note ne se range pas avec les autres.
  const notes=[...rows].filter(r=>meta(r).conf>=2&&r.v53!=null&&!nonComparable(r)).sort((a,b)=>b.v53-a.v53).slice(0,10);
  const a=(b&&b.a_surveiller)||{};
  const surv=[...(a.a_publie||[]),...(a.a_bouge||[])].filter(z=>par[z.symbol]);
  const favs=rows.filter(r=>fav.includes(r.symbol||r.ticker));
  const red=b&&b.redaction&&b.redaction.texte;
  const premier=red?red.split(/\n\s*\n/).map(x=>x.replace(/^#+\s*/,"").trim()).filter(x=>x&&!/^l'essentiel$/i.test(x))[0]:null;
  const t=(r,ligne)=><Tuile key={r.symbol} r={r} ligne={ligne} onClick={()=>ouvrir(r.symbol)}/>;
  return(
    <div>
      <div className="carte" style={{background:"linear-gradient(135deg,rgba(0,229,160,.10),rgba(77,184,255,.06) 60%,#0d1829)",

            {premier?gras(premier):((b&&b.constats||[])[0]||"Le briefing de la dernière séance n'est pas encore publié.")}</div>}
        <button onClick={()=>setTab("briefing")} style={{marginTop:14,background:"#00e5a0",color:"#080d1a",border:"none",
          borderRadius:6,padding:"9px 18px",fontWeight:700,fontSize:12,letterSpacing:1,cursor:"pointer",fontFamily:"var(--font)"}}>
          LIRE LE BRIEFING ›</button>
      </div>
      {b===undefined&&<Squelette blocs={[1,1]} titre="Chargement de l'accueil"/>}
      <Rangee titre="Critères remplis aujourd'hui" sous="critères mesurés" vers="briefing" setTab={setTab}
        items={surv.map(z=>t(par[z.symbol],(z.criteres||[]).map(c=>c.texte).join(" · ")))}/>
      <Rangee titre="Plus fortes hausses" sous="séance du jour" vers="ranking" setTab={setTab} items={hausses.map(r=>t(r))}/>

      <Rangee titre="Mes favoris" vers="watchlist" setTab={setTab} items={favs.map(r=>t(r))}/>
    </div>);
};

const Ranking=({rows,sort,setSort,setSel,setTab,fav=[],toggleFav=()=>{},isWatchlist=false,scoreMode})=>{
  const [search,setSearch]=useState("");
  const [sector,setSector]=useState("ALL");
  const [group,setGroup]=useState("ALL"); // ALL = tous les titres / MASI1 = les 19 du MASI 1
  const [palierFiltre,setPalierFiltre]=useState(null);
  const [rsiZone,setRsiZone]=useState(null);
  const customMode=!!(scoreMode&&!scoreMode.officiel);
  const MASI1_TICKERS=new Set(["CMT","SMI","CASH","MNG","AKD","SOT","SGTM","MSA","CFGB","RIS","ADI","VCNE","CMGP","CSR","TGCC","ADH","SRM","SNA","RDS"]);
  const sectors=useMemo(()=>["ALL",...new Set(rows.map(r=>r.sector).filter(Boolean).sort())],[rows]);

  const filtered=useMemo(()=>{
    let r=rows;
    if(group==="MASI1") r=r.filter(x=>MASI1_TICKERS.has(x.symbol||x.ticker||""));
    if(sector!=="ALL") r=r.filter(x=>x.sector===sector);
    if(search.trim()){
      const q=search.trim().toUpperCase();
      r=r.filter(x=>(x.symbol||x.ticker||"").includes(q)||tk(x).includes(q)||(x.name||"").toUpperCase().includes(q));
    }
    /* Filtre par palier de NOTE (07/10/2026) : il remplace le filtre par
       signal. Il porte sur la note affichée, celle de la vue choisie. */
    if(palierFiltre!=null) r=r.filter(x=>palierDe(computeDisplayScore(x,scoreMode))===palierFiltre);
    if(rsiZone==="survendu") r=r.filter(x=>(x.rsi??x.rsi14)!=null&&(x.rsi??x.rsi14)<30);
    if(rsiZone==="surachete") r=r.filter(x=>(x.rsi??x.rsi14)!=null&&(x.rsi??x.rsi14)>70);
    return r;
  },[rows,sector,search,group,palierFiltre,rsiZone,scoreMode]);

  const sorted=useMemo(()=>[...filtered].sort((a,b)=>{
    if(sort==="az")  return (a.name||a.symbol||"").localeCompare(b.name||b.symbol||"","fr");
    if(sort==="v53"){
      /* ⚠️ Une note INDISPONIBLE n'est pas une note basse. Comparée comme 0,
         elle se rangerait parmi les pires titres — un classement faux. Elle
         sort donc du classement par le bas, explicitement. */
      const sa=computeDisplayScore(a,scoreMode), sb=computeDisplayScore(b,scoreMode);
      if(sa==null&&sb==null) return 0;
      if(sa==null) return 1;
      if(sb==null) return -1;
      /* Règle A (27/10/2026) : un titre NON COMPARABLE se classe après tous
         les titres comparables, quelle que soit sa note ou la pondération. */
      const na=!!nonComparable(a), nb=!!nonComparable(b);
      if(na!==nb) return na?1:-1;
      return sb-sa;
    }
    if(sort==="var") return (varSeance(b)??-Infinity)-(varSeance(a)??-Infinity)||0;
    if(sort==="rsi"){
      /* Un RSI absent n'est ni bas ni haut : en fin de liste. */
      const ra=a.rsi??a.rsi14,rb=b.rsi??b.rsi14;
      if(ra==null) return rb==null?0:1;
      if(rb==null) return -1;
      return ra-rb;
    }
    return 0;
  }),[filtered,sort,scoreMode]);
  const SORTS=[["az","A → Z"],["v53",customMode?"SCORE PERSO":("SCORE v5.3")],["var","VAR%"],["rsi","RSI"]];
  const scoreColLabel=customMode?scoreModeLabel(scoreMode):"SCORE";
  const HEADS=["#","TICKER","OUVERT","CLÔT.","VAR%","VOLUME","PE","DIV%",scoreColLabel,"RSI","COULEUR","POIDS"];
  if(isWatchlist&&rows.length===0) return(
    <div style={{textAlign:"center",padding:"60px 20px",color:"#8892a4"}}>
      <div style={{fontSize:52,marginBottom:16,color:"#2a3550"}}>★</div>
      <div style={{fontSize:16,marginBottom:8,color:"#c8d3e8"}}>Aucun favori</div>
      <div style={{fontSize:12}}>Cliquez sur ☆ dans le classement pour suivre un titre</div>
    </div>
  );
  return(
    <div>
      {/* ── Barre de recherche + filtre secteur ─────────────── */}
      <div style={{display:"flex",gap:8,marginBottom:10,alignItems:"center",flexWrap:"wrap"}}>
        <input
          value={search} onChange={e=>setSearch(e.target.value)}
          placeholder="Ticker ou société" aria-label="Rechercher un titre"
          style={{background:"#0d1829",border:"1px solid #1a2540",color:"#c8d3e8",borderRadius:4,padding:"5px 10px",fontSize:12,fontFamily:"var(--font)",width:220,outline:"none"}}
        />
        <select value={sector} onChange={e=>setSector(e.target.value)}
          style={{background:"#0d1829",border:"1px solid #1a2540",color:"#8892a4",borderRadius:4,padding:"5px 8px",fontSize:11,fontFamily:"var(--font)",cursor:"pointer"}}>
          {sectors.map(s=><option key={s} value={s}>{s==="ALL"?`Tous (${rows.length})`:s}</option>)}
        </select>
        {/* Filtre MASI 1 */}
        <div style={{display:"flex",gap:4,background:"#0a1220",borderRadius:4,padding:2,border:"1px solid #1a2540"}}>
          {[["MASI1","MASI 1","#00e5a0"],["ALL","ÉLARGI","#4db8ff"]].map(([g,lbl,c])=>(
            <button key={g} onClick={()=>setGroup(g)} style={{fontSize:10,fontWeight:600,padding:"3px 10px",borderRadius:3,border:"none",cursor:"pointer",background:group===g?`${c}18`:"transparent",color:group===g?c:"#8892a4",transition:"all .2s"}}>{lbl}</button>
          ))}
        </div>
        {(search||sector!=="ALL"||palierFiltre!=null||rsiZone)&&<button onClick={()=>{setSearch("");setSector("ALL");setPalierFiltre(null);setRsiZone(null);}} style={{fontSize:10,color:"#ff4f5a",border:"1px solid #ff4f5a30",borderRadius:3,padding:"3px 8px",background:"transparent"}}>✕ Réinitialiser</button>}
        <span style={{marginLeft:"auto",fontSize:11,color:"#8892a4"}}>{sorted.length}/{group==="MASI1"?19:rows.length} titres</span>
        <button onClick={()=>{
          // ⚠️ La pondération part avec le fichier : un CSV survit à l'écran
          // qui l'a produit, et une note sans sa formule est ininterprétable.
          const cols=["TICKER BVC","CODE INTERNE","NOM","SECTEUR","PRIX","VAR%","PE","DIV%","RSI","SCORE","PONDERATION","COULEUR_NOTE","VERSION_SCORE"];
          const rows_csv=sorted.map(r=>[tk(r),r.symbol,r.name||"",r.sector||"",r.price||"",r.chg||"",r.pe?.toFixed(1)||"",r.div?.toFixed(2)||"",r.rsi?.toFixed(1)||"",(sc=>sc==null?"indisponible":sc.toFixed(2))(computeDisplayScore(r,scoreMode)),scoreModeLabel(scoreMode),customMode?"":palierTexte(r),customMode?"":(r.score_version||"")]);
          const csv="﻿"+[cols,...rows_csv].map(r=>r.join(";")).join("\n");
          const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
          const url=URL.createObjectURL(blob);
          const a=document.createElement("a");
          a.href=url;

                  <td style={{padding:"8px 8px",fontSize:12,color:"#8892a4"}}>{/* ⚠️ Ouverture ABSENTE = « — ». Le repli `cours ÷ (1 + var.)` affichait la

                        Moutalib : « variation pas adéquate avec l'ouverture et la

                        la clôture de la VEILLE, que l'écran ne montrait pas. MNG :

                    {r.reference!=null&&<div style={{fontSize:9.5,color:"#8892a4",fontWeight:400,whiteSpace:"nowrap"}}

                      Le classement montrait la variation sans jamais dire sur

                      sur 40 titres échangés et un titre à +3 % sur 40 000 ne

                      ⚠️ DEUX UNITÉS, et l'une n'est pas l'autre : le nombre de

                  <td style={{padding:"8px 8px",fontSize:12,color:"#c8d3e8",whiteSpace:"nowrap"}}>

                      return <>
                        <div style={{color:bas?"#ff8f00":"#c8d3e8",fontWeight:600}}

                  <td style={{padding:"8px 8px"}}>
                    <div title={manque.length?`Score indisponible — composante absente : ${manque.join(", ")}`:undefined}

                  </td>

                  {/* ⚠️ Hors pondération officielle, la COULEUR disparaît. Elle

                      formules côte à côte sans le dire.
                      07/10/2026 : plus aucun mot d'action dans cette colonne,
                      seulement la couleur du palier de note (PastilleNote). */}
                  <td style={{padding:"8px 8px"}}>{customMode
                    ? <span title="La couleur n'existe que pour la pondération officielle"
                        style={{fontSize:11,color:"#8892a4",letterSpacing:1}}>—</span>
                    /* Un titre suspendu passe AVANT le test de confiance : sa
                       confiance est nulle, mais « Données insuffisantes » serait

                    : meta(r).susp

                       Un titre qui vient de reprendre sa cotation sortait à
                       « Données insuffisantes », alors que ses données sont
                       complètes : ce sont ses indicateurs TECHNIQUES qui sont
                       sans objet, parce qu'ils décrivent le régime de prix
                       d'avant la suspension. Le signal reste suspendu — on
                       corrige ce qui est dit, pas ce qui est calculé. */
                    : meta(r).reprise_recente
                    ? <Chip label="REPRISE DE COTATION" bg="rgba(255,215,64,.12)" fg="#ffd740" bd="#ffd74040"/>
                    : meta(r).conf<=1

                    {(()=>{const pw=poidsAffiches(r,scoreMode);return pw&&<>
                      <WBar f={pw.f} t={pw.t}/>
                      <div style={{fontSize:9,color:customMode?"#ffd740":"#8892a4",marginTop:2}}>F{pw.f}·T{pw.t}</div>
