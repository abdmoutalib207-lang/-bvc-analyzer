const signalBg = (s) => {
  if (s.includes("FORT") && s.includes("ACHAT")) return "rgba(0,229,160,0.25)";
  if (s.includes("★★") || s === "ACHETER") return "rgba(0,229,160,0.15)";
  if (s.includes("SURVEILLER") || s.includes("★")) return "rgba(255,215,64,0.15)";
  if (s.includes("ÉVITER FORT")) return "rgba(255,79,90,0.25)";
  if (s.includes("ÉVITER")) return "rgba(255,100,50,0.15)";
  return "rgba(136,146,164,0.1)";
};
const signalFg = (s) => {
  if (s.includes("FORT") && s.includes("ACHAT")) return "#00ffb3";
  if (s.includes("★★") || s === "ACHETER") return "#00e5a0";
  if (s.includes("SURVEILLER") || s.includes("★")) return "#ffd740";
  if (s.includes("ÉVITER FORT")) return "#ff4f5a";
  if (s.includes("ÉVITER")) return "#ff8f00";
  return "#8892a4";
};
const varFg = (v) => v > 0 ? "#00e5a0" : v < 0 ? "#ff4f5a" : "#8892a4";

const WeightPill = ({ poids }) => {
  const parts = poids.split(" ");
  const colors = { "Fond:": "#b388ff", "NLP:": "#00e5a0", "Tech:": "#4db8ff" };
  return (
    <div style={{ display:"flex", gap:3 }}>
      {parts.map((p, i) => {
        const prefix = Object.keys(colors).find(k => p.startsWith(k));
        return (
          <span key={i} style={{ fontSize:8, padding:"1px 4px", borderRadius:2,
            background:`${colors[prefix] || "#8892a4"}18`, color: colors[prefix] || "#8892a4",
            border:`1px solid ${colors[prefix] || "#8892a4"}30`, fontFamily:"monospace" }}>{p}</span>
        );
      })}
    </div>
  );
};

                      <div style={{ display:"flex", justifyContent:"space-between", marginBottom:3 }}><span style={{ fontSize:9, color:"#8892a4" }}>{label}</span><span style={{ fontSize:9, color }}>{desc}</span></div>
                      <ScoreBar value={val} max={max} color={color} height={5} />
                    </div>
                  ))}
                  <div style={{ marginTop:8, padding:"6px 8px", background:"#0a1220", borderRadius:4, border:"1px solid #1a2540" }}>
                    <div style={{ fontSize:8, color:"#8892a4", marginBottom:3 }}>Ajustements</div>
                    {sel.bonusDetails.length > 0 ? sel.bonusDetails.map((b,i) => <div key={i} style={{ fontSize:9, color: b.includes("-") ? "#ff8f00" : "#00e5a0" }}>{b.includes("-") ? "▼" : "▲"} {b}</div>) : <div style={{ fontSize:9, color:"#8892a4" }}>Aucun ajustement</div>}
                    <div style={{ marginTop:4, fontSize:9, fontWeight:700, color: sel.delta >= 0 ? "#00e5a0" : "#ff4f5a" }}>Total: {sel.delta >= 0?"+":""}{sel.delta.toFixed(2)} pts</div>
                  </div>
                </div>
                <div style={s.panel}>
                  <div style={s.label}>NLP — Groupe MASI 1 (6 ans)</div>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
                    {[["Biais groupe",sel.biais,sentFg(sel.smart)],["Smart Sentiment",`${sel.smart>0?"+":""}${(sel.smart*100).toFixed(0)}%`,sentFg(sel.smart)],["Win rate 6M",`${sel.win}%`,sel.win>=80?"#00e5a0":"#ffd740"],["Alpha hist.",`+${sel.alpha}%`,"#4db8ff"],["Convergence",sel.conv==="CONFIRME"?"✅ Confirmé":"⚠️ Divergence",sel.conv==="CONFIRME"?"#00e5a0":"#ffd740"],["Hype",`${(sel.hype*100).toFixed(0)}%`,"#ffd740"]].map(([k,v,c]) => (
                      <div key={k} style={{ background:"#0a1220", borderRadius:4, padding:"5px 7px", border:"1px solid #1a2540" }}>
                        <div style={{ fontSize:7, color:"#8892a4", marginBottom:2 }}>{k}</div>
                        <div style={{ fontSize:10, color:c, fontWeight:700 }}>{v}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
              <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                <div style={s.panel}>
                  <div style={s.label}>Valorisation — Scénarios</div>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, marginBottom:12 }}>
                    {[["BEAR",sel.bear,"#ff4f5a",`${((sel.bear-sel.prix)/sel.prix*100).toFixed(1)}%`],["BASE",sel.base,"#ffd740",`${((sel.base-sel.prix)/sel.prix*100).toFixed(1)}%`],["BULL",sel.bull,"#00e5a0",`+${upsidePct}%`]].map(([label,val,color,pct]) => (
                      <div key={label} style={{ background:"#0a1220", borderRadius:5, padding:"8px", border:`1px solid ${color}20`, textAlign:"center" }}>
                        <div style={{ fontSize:8, color:"#8892a4", marginBottom:3 }}>{label}</div>
                        <div style={{ fontSize:14, fontWeight:700, color }}>{val >= 1000 ? val.toLocaleString() : val}</div>
                        <div style={{ fontSize:9, color }}>{pct}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{ position:"relative", marginBottom:4 }}>
                    <div style={{ background:"linear-gradient(90deg,#ff4f5a,#ffd740,#00e5a0)", height:6, borderRadius:3 }} />
                    <div style={{ position:"absolute", left:`${Math.min(Math.max((sel.prix-sel.bear)/(sel.bull-sel.bear)*100,2),98)}%`, top:"50%", transform:"translate(-50%,-50%)", width:12, height:12, borderRadius:"50%", background:"#fff", border:"2px solid #0d1829", boxShadow:"0 0 8px rgba(255,255,255,0.5)" }} />
                  </div>
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:8, color:"#8892a4" }}>
                    <span>Bear {sel.bear}</span><span style={{ color:"#ffd740" }}>▲ {sel.prix.toLocaleString()} DH</span><span>Bull {sel.bull}</span>
                  </div>
                </div>
                <div style={s.panel}>
                  <div style={s.label}>Setup & Pondération Dynamique</div>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:10 }}>
                    <div style={{ background:"#0a1220", borderRadius:4, padding:"6px 8px" }}><div style={{ fontSize:7, color:"#8892a4", marginBottom:2 }}>SETUP BVC</div><div style={{ fontSize:9, color:"#ffd740" }}>{sel.setup}</div></div>
                    <div style={{ background:"#0a1220", borderRadius:4, padding:"6px 8px" }}><div style={{ fontSize:7, color:"#8892a4", marginBottom:2 }}>RED FLAGS</div><div style={{ fontSize:9, color: sel.flags>=3?"#ff4f5a":sel.flags>=1?"#ffd740":"#00e5a0" }}>{sel.flags===0?"✅ Aucun":`⚠️ ${sel.flags} flag(s)`}</div></div>
                  </div>
                  <div style={s.label}>Poids appliqués à {sel.ticker}</div>
                  <WeightPill poids={sel.poids} />
                </div>
                <div style={{ ...s.panel, fontFamily:"monospace", fontSize:9, lineHeight:1.8 }}>
                  <div style={{ color:"#00e5a0", marginBottom:4 }}>// Formule Score v5.3</div>
                  <div style={{ color:"#b388ff" }}>score_v53 =</div>
                  <div style={{ paddingLeft:12 }}>
                    <span style={{ color:"#b388ff" }}>fond</span><span style={{ color:"#8892a4" }}> × </span><span style={{ color:"#b388ff" }}>{parseInt(sel.poids.split(" ")[0].split(":")[1])}%</span>
                    <span style={{ color:"#8892a4" }}> + </span><span style={{ color:"#00e5a0" }}>nlp</span><span style={{ color:"#8892a4" }}> × </span><span style={{ color:"#00e5a0" }}>{parseInt(sel.poids.split(" ")[1].split(":")[1])}%</span>
                    <span style={{ color:"#8892a4" }}> + </span><span style={{ color:"#4db8ff" }}>tech</span><span style={{ color:"#8892a4" }}> × </span><span style={{ color:"#4db8ff" }}>{parseInt(sel.poids.split(" ")[2].split(":")[1])}%</span>
                  </div>
                  <div style={{ color:"#8892a4" }}>+ bonus_convergence + bonus_smart_money</div>
                  <div style={{ color:"#8892a4" }}>- malus_red_flags - malus_divergence</div>
                  <div style={{ marginTop:6, color:"#ffd740" }}>= {sel.scoreV53.toFixed(2)} ({sel.delta>=0?"+":""}{sel.delta.toFixed(2)} vs BVC {sel.scoreBVC.toFixed(2)})</div>
                </div>
              </div>
            </div>
          </div>
        )}

        {view === "weights" && (
          <div>
            <div style={{ ...s.panel, marginBottom:10 }}>
              <div style={s.label}>Architecture de Pondération v5.3</div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10, marginTop:8 }}>
                {[["Fondamental","47%","#b388ff","Marché semi-efficient, alpha long terme (6-12M). Données JSON validées sur 3 titres réels (MNG/ADI/RIS)."],["NLP Comportemental","28%","#00e5a0","896 907 messages, 6 ans. Smart Money backtesté 1994 signaux. Win rate 83% sur 12 mois."],["Technique","25%","#4db8ff","Timing d'entrée uniquement. Moins fiable sur marché peu liquide. RSI/MACD sur 492 séances réelles."]].map(([label,pct,color,desc]) => (
                  <div key={label} style={{ background:"#0a1220", borderRadius:6, padding:12, border:`1px solid ${color}20` }}>
                    <div style={{ fontSize:28, fontWeight:700, color, marginBottom:4 }}>{pct}</div>
                    <div style={{ fontSize:10, color:"#fff", marginBottom:6 }}>{label}</div>
                    <div style={{ fontSize:8, color:"#8892a4", lineHeight:1.6 }}>{desc}</div>
                  </div>
                ))}
              </div>
            </div>
            <div style={s.panel}>
              <div style={s.label}>Ajustements Dynamiques par Contexte</div>
              <table style={{ width:"100%", borderCollapse:"collapse", marginTop:8 }}>
                <thead><tr style={{ fontSize:8, color:"#8892a4", borderBottom:"1px solid #1a2540" }}>{["Situation","Fond","NLP","Tech","Justification"].map(h => <th key={h} style={{ padding:"4px 8px", textAlign:"left" }}>{h}</th>)}</tr></thead>
                <tbody>
                  {[["Marché ouvert (base)","47%","28%","25%","Pondération standard BVC"],["Marché fermé/férié","52%","28%","20%","Pas de prix live"],["Publication résultats","57%","25%","18%","Fondamentaux mis à jour"],["Hype spike (>2σ)","42%","36%","22%","Comportemental précoce"],["Smart Money Tier 1","44%","35%","21%","Win rate 83%+ → NLP fiable"],["Bear market MASI<-5%","55%","28%","17%","Défensif, fondamental refuge"],["Titre peu suivi","54%","18%","28%","NLP peu fiable"]].map(([sit,f,n,t,j],i) => (
                    <tr key={i} style={{ borderBottom:"1px solid #0d1829", fontSize:9 }}>
                      <td style={{ padding:"5px 8px", color:"#c8d3e8" }}>{sit}</td>
                      <td style={{ padding:"5px 8px", color:"#b388ff", fontWeight:700 }}>{f}</td>
                      <td style={{ padding:"5px 8px", color:"#00e5a0", fontWeight:700 }}>{n}</td>
                      <td style={{ padding:"5px 8px", color:"#4db8ff", fontWeight:700 }}>{t}</td>
                      <td style={{ padding:"5px 8px", color:"#8892a4" }}>{j}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {view === "smart" && (
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
            <div style={s.panel}>
              <div style={s.label}>Smart Money Tracker — Poids V3 Backtestés</div>
              {SMART_MONEY.map(m => (
                <div key={m.name} style={{ display:"flex", alignItems:"center", gap:10, padding:"6px 0", borderBottom:"1px solid #0d1829" }}>
                  <div style={{ width:130, fontSize:10, color:"#c8d3e8" }}>{m.name}</div>
                  <div style={{ width:70, fontSize:8, color: m.tier==="Admin"?"#ffd740":"#00e5a0" }}>{m.tier}</div>
                  <div style={{ flex:1 }}><div style={{ background:"#1a2035", borderRadius:2, overflow:"hidden", height:4 }}><div style={{ width:`${m.w*100}%`, height:"100%", background: m.tier==="Admin"?"#ffd740":"#00e5a0" }} /></div></div>
                  <div style={{ width:35, fontSize:9, color:"#8892a4", textAlign:"right" }}>{m.w.toFixed(2)}</div>
                  <div style={{ width:30, fontSize:9, color:"#4db8ff", textAlign:"right" }}>{m.snr}</div>
                  <div style={{ width:30, fontSize:9, color:"#00e5a0", textAlign:"right" }}>{m.win}</div>
                </div>
              ))}
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
              <div style={s.panel}>
                <div style={s.label}>Backtesting V3 — 1994 Signaux / 2020-2026</div>
                {[["Horizon 12M","83%","+38.3%","#00e5a0"],["Horizon 6M","80%","+18.1%","#00e5a0"],["Horizon 3M","78%","+8.7%","#ffd740"],["Horizon 1M","73%","+2.7%","#ff8f00"]].map(([h,wr,rdt,c]) => (
                  <div key={h} style={{ display:"flex", justifyContent:"space-between", padding:"5px 0", borderBottom:"1px solid #0d1829" }}>
                    <span style={{ fontSize:9, color:"#c8d3e8" }}>{h}</span>
                    <span style={{ fontSize:9, color:c }}>Win {wr}</span>
                    <span style={{ fontSize:9, color:c }}>Rdt {rdt}</span>
                  </div>
                ))}
              </div>
              <div style={s.panel}>
                <div style={s.label}>Contrarians V3 — Vente = Achat</div>
                {[["MNG","0%","100% du temps cours monte après signal vente"],["RDS","0%","0% de réussite pour le vendeur"],["SMI","19%","81% du temps cours monte après vente"],["TGCC","39%","Seul valide comme confirmation"]].map(([t,acc,note]) => (
                  <div key={t} style={{ padding:"5px 0", borderBottom:"1px solid #0d1829" }}>
                    <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                      <span style={{ fontSize:10, color:"#fff", fontWeight:700, width:45 }}>{t}</span>
                      <span style={{ fontSize:9, color: parseInt(acc)<20?"#00e5a0":"#ffd740" }}>Précision vente: {acc}</span>
                    </div>
                    <div style={{ fontSize:8, color:"#8892a4", marginTop:2 }}>{note}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<BVCTerminalV53 />);
  </script>
