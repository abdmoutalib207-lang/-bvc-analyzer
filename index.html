      </div>
      <div style={{fontSize:14,color:"#c8d3e8",fontWeight:600,marginBottom:12,display:"flex",alignItems:"center",gap:8}}>
        <span style={{display:"inline-block",width:9,height:9,borderRadius:"50%",background:"#00e5a0",boxShadow:"0 0 8px #00e5a060"}}/>
        3 DERNIÈRES MISES À JOUR SMART MONEY
        {filt!=="ALL"&&<span style={{fontSize:12,color:"#4db8ff"}}>— filtre: {filt}</span>}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:16}}>
        {top3.map(msg=>(
          <div key={msg.id} style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:16,borderLeft:`3px solid ${SC2(msg.signal)}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10,flexWrap:"wrap",gap:8}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <span style={{fontSize:13,fontWeight:700,color:"#fff",background:"#0a1220",border:"1px solid #1a2540",borderRadius:4,padding:"2px 8px"}}>{msg.member}</span>
                <span style={{fontSize:10,color:msg.tier==="Tier 1"?"#00e5a0":"#ffd740",background:msg.tier==="Tier 1"?"rgba(0,229,160,.08)":"rgba(255,215,64,.08)",border:`1px solid ${msg.tier==="Tier 1"?"rgba(0,229,160,.28)":"rgba(255,215,64,.28)"}`,borderRadius:3,padding:"1px 6px"}}>{msg.tier}</span>
                <span style={{fontSize:13,color:"#4db8ff",fontWeight:700}}>→ {msg.ticker}</span>
                <Chip label={msg.signal} bg={`${SC2(msg.signal)}15`} fg={SC2(msg.signal)} bd={`${SC2(msg.signal)}35`} sz={12}/>
              </div>
              <div style={{textAlign:"right",fontSize:12}}>
                <div style={{color:"#ffd740",fontWeight:600}}>{msg.time}</div>
                <div style={{color:"#8892a4"}}>{msg.date}</div>
              </div>
            </div>
            <div style={{fontSize:13,color:"#c8d3e8",lineHeight:1.7,background:"#0a1220",borderRadius:5,padding:"10px 14px",marginBottom:12,borderLeft:"2px solid #1a2540",fontStyle:"italic"}}>"{msg.msg}"</div>
            <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",gap:10}}>
              <div>
                <div style={{fontSize:10,color:"#8892a4",marginBottom:4,textTransform:"uppercase"}}>Score de confiance</div>
                <Conf v={msg.conf}/>
              </div>
              {[["SNR",msg.snr,"#4db8ff"],["Alpha 12M",`+${msg.alpha}%`,"#00e5a0"],["Contexte",msg.ctx,"#ffd740"]].map(([k,v,c])=>(
                <div key={k} style={{background:"#0a1220",borderRadius:4,padding:"6px 9px"}}>
                  <div style={{fontSize:9,color:"#8892a4",marginBottom:3,textTransform:"uppercase"}}>{k}</div>
                  <div style={{fontSize:12,color:c,fontWeight:700,lineHeight:1.3}}>{v}</div>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
      <div style={{padding:"10px 14px",background:"#0d1829",border:"1px solid #1a2540",borderRadius:6,fontSize:11,color:"#8892a4",lineHeight:1.9}}>
        <span style={{color:"#c8d3e8",fontWeight:600}}>Calcul confiance: </span>
        <span style={{color:"#4db8ff"}}>SNR × 2.5</span> + <span style={{color:"#00e5a0"}}>Alpha × 0.4</span> + <span style={{color:"#b388ff"}}>Win Rate × 0.25</span>, normalisé sur 100 &nbsp;|&nbsp;
        Données simulées basées backtesting V3 &nbsp;|&nbsp;
        <span style={{color:"#ffd740"}}>Connecter API WhatsApp/chat pour données live</span>
      </div>
    </div>
  );
};

function App() {
  const [tab,setTab]     = useState("ranking");
  const [sort,setSort]   = useState("v53");
  const [sel,setSel]     = useState("CMT");
  const [ts,setTs]       = useState("01/06/2026 · 16:00");
  const [loading,setLoading] = useState(false);
  const refresh = useCallback(()=>{
    setLoading(true);
    setTimeout(()=>{
      const n=new Date();
      setTs(n.toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}));
      setLoading(false);
    },1800);
  },[]);
  return (
    <div style={{minHeight:"100vh"}}>
      <Header tab={tab} setTab={setTab} ts={ts} onRefresh={refresh} loading={loading}/>
      <div style={{padding:16,maxWidth:1600,margin:"0 auto"}}>
        {tab==="ranking"&&<Ranking rows={TICKERS} sort={sort} setSort={setSort} setSel={setSel} setTab={setTab}/>}
        {tab==="detail" &&<Detail rows={TICKERS} sel={sel} setSel={setSel}/>}
        {tab==="weights"&&<Weights/>}
        {tab==="smart"  &&<Smart/>}
        {tab==="chat"   &&<Chat/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
