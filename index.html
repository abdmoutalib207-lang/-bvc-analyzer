// Fetch helper: essaie direct puis via proxy CORS
async function bvcGet(url){
  try{const r=await fetch(url,{cache:"no-store"});if(r.ok)return r.json();}catch{}
  for(const proxy of PROXY_LIST){
    try{const r=await fetch(proxy+encodeURIComponent(url),{cache:"no-store"});if(r.ok)return r.json();}catch{}
  }
  return null;
}

// IDBourse: tous les tickers en un seul appel
async function fetchIDB(){
  const data=await bvcGet(`${IDB_BASE}/api/proxy/get_all_data`);
  if(!Array.isArray(data)||data.length===0)return null;
  const out={};
  data.forEach(d=>{
    if(!d.dernier_cours)return;
    // Extraire le code BVC depuis l'URL (.../instruments/CSR → "CSR")
    const url=d.url||"";
    const fromUrl=url.includes("/instruments/")?url.split("/instruments/").pop().toUpperCase():"";
    let sym=fromUrl&&CONFIG.ISIN_MAP[fromUrl]?fromUrl:null;
    if(!sym){const n=(d.name||"").toUpperCase();sym=CONFIG.IDB_NAME_MAP[n]||n;}
    if(!CONFIG.ISIN_MAP[sym])return;
    // volume_en_titres: "3 726" (espaces insécables) → entier
    const volStr=String(d.volume_en_titres||"0").replace(/[ \s,]/g,"");
    const vol=volStr&&volStr!=="0"?Math.round(parseFloat(volStr))||0:0;
    // ouverture: "181,10" (virgule décimale française) → float
    const opnStr=String(d.ouverture||"").replace(",",".");
    const open=opnStr?parseFloat(opnStr)||null:null;
    out[sym]={price:+d.dernier_cours,chg:d.variation!=null?+d.variation:0,open,close:+d.dernier_cours,vol,live:true,src:"IDBourse"};
  });
  return Object.keys(out).length>0?out:null;
}

// Médias24: cours individuel par ISIN
async function fetchMed24Quote(sym){
  const isin=CONFIG.ISIN_MAP[sym];if(!isin)return null;
  const data=await bvcGet(`${MED_BASE}?method=getStockInfo&ISIN=${isin}&format=json`);
  const r=data?.result;if(!r)return null;
  const price=r.cours?+r.cours:null;
  if(!price||isNaN(price))return null;
  return{price,chg:r.variation?+r.variation:0,open:r.ouverture?+r.ouverture:price,close:price,live:true,src:"Médias24"};
}

// Médias24: historique OHLCV pour graphique (format: {date,value,max,min,volume})
async function fetchMed24History(sym,days){
  const isin=CONFIG.ISIN_MAP[sym];if(!isin)return null;
  const to=new Date();const from=new Date(+to-days*86400000);
  const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const data=await bvcGet(`${MED_BASE}?method=getPriceHistory&ISIN=${isin}&from=${fmt(from)}&to=${fmt(to)}&format=json`);
  const recs=data?.result;if(!Array.isArray(recs)||recs.length<5)return null;
  const candles=[];let prevClose=null;
  recs.forEach(rec=>{
    const raw=rec.date||"";
    let ts;
    if(raw.includes("/")){const[d,m,y]=raw.split("/");ts=new Date(+y,+m-1,+d).getTime();}
    else{ts=new Date(raw).getTime();}
    if(!ts||isNaN(ts))return;
    const c=+(rec.value||0),h=+(rec.max||rec.value)||c,l=+(rec.min||rec.value)||c;
    if(!c||c<=0)return;
    const o=prevClose!=null?prevClose:c; // open = veille clôture → couleurs rouge/vert correctes
    const vol=+(rec.volume||rec.vol||0);
    candles.push({x:ts,y:[o,Math.max(h,o,c),Math.min(l,o,c),c],vol});
    prevClose=c;
  });
  return candles.length>=5?candles:null;
}

// ── TECHNICAL CALCULATIONS ────────────────────────────────────────────────────
function calcRSI(closes,p=14){
  if(closes.length<p+1)return 50;
  let g=0,l=0;
  for(let i=1;i<=p;i++){const d=closes[i]-closes[i-1];if(d>0)g+=d;else l-=d;}
  let ag=g/p,al=l/p;
  for(let i=p+1;i<closes.length;i++){const d=closes[i]-closes[i-1];ag=(ag*(p-1)+Math.max(d,0))/p;al=(al*(p-1)+Math.max(-d,0))/p;}
  return al===0?100:+(100-100/(1+ag/al)).toFixed(1);
}

function calcMA(closes,p){
  return closes.map((_,i)=>i<p?null:+(closes.slice(i-p,i).reduce((a,b)=>a+b,0)/p).toFixed(2));
}

function calcFib(high,low){
  const d=high-low;
  return [0,0.236,0.382,0.5,0.618,0.786,1.0].map(r=>[r,+(low+d*r).toFixed(2)]);
}

function calcEMA(arr,p){
  if(arr.length<p)return arr.map(()=>null);
  const k=2/(p+1);const res=new Array(p-1).fill(null);
  let ema=arr.slice(0,p).reduce((a,b)=>a+b,0)/p;
  res.push(+ema.toFixed(3));
  for(let i=p;i<arr.length;i++){ema=arr[i]*k+ema*(1-k);res.push(+ema.toFixed(3));}
  return res;
}

function calcMACD(closes,fast=12,slow=26,sig=9){
  const emaF=calcEMA(closes,fast),emaS=calcEMA(closes,slow);
  const macdLine=emaF.map((f,i)=>f!==null&&emaS[i]!==null?+(f-emaS[i]).toFixed(3):null);
  const validPairs=macdLine.map((v,i)=>({v,i})).filter(x=>x.v!==null);
  const sigEma=calcEMA(validPairs.map(x=>x.v),sig);
  const sigLine=new Array(macdLine.length).fill(null);
  validPairs.forEach((x,j)=>{if(sigEma[j]!==null)sigLine[x.i]=sigEma[j];});
  const hist=macdLine.map((m,i)=>m!==null&&sigLine[i]!==null?+(m-sigLine[i]).toFixed(3):null);
  return{macd:macdLine,signal:sigLine,hist};
}

function calcBollinger(closes,period=20,mult=2){
  const upper=[],middle=[],lower=[];
  for(let i=0;i<closes.length;i++){
    if(i<period-1){upper.push(null);middle.push(null);lower.push(null);continue;}
    const sl=closes.slice(i-period+1,i+1);
    const avg=sl.reduce((a,b)=>a+b,0)/period;
    const std=Math.sqrt(sl.reduce((a,b)=>a+(b-avg)**2,0)/period);
    upper.push(+(avg+mult*std).toFixed(2));
    middle.push(+avg.toFixed(2));
    lower.push(+(avg-mult*std).toFixed(2));
  }
  return{upper,middle,lower};
}

function calcIchimoku(candles){
  const highs=candles.map(c=>c.y[1]),lows=candles.map(c=>c.y[2]);
  const tenkan=[],kijun=[];
  for(let i=0;i<candles.length;i++){
    tenkan.push(i<8?null:+((Math.max(...highs.slice(i-8,i+1))+Math.min(...lows.slice(i-8,i+1)))/2).toFixed(2));
    kijun.push(i<25?null:+((Math.max(...highs.slice(i-25,i+1))+Math.min(...lows.slice(i-25,i+1)))/2).toFixed(2));
  }
  return{tenkan,kijun};
}

const RSIGauge=({value})=>{
  const v=Math.min(100,Math.max(0,value||50));
  const color=v>70?"#ff4f5a":v<30?"#00e5a0":"#ffd740";
  const label=v>70?"SURACHETÉ":v<30?"SURVENDU":"NEUTRE";
  const a=-Math.PI+Math.PI*(v/100);
  const cx=60,cy=58,r=44;
  const ex=cx+r*Math.cos(a),ey=cy+r*Math.sin(a);
  return(
    <div style={{textAlign:"center"}}>
      <svg width="120" height="70" viewBox="0 0 120 75">
        <path d={`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`} fill="none" stroke="#1a2540" strokeWidth="10" strokeLinecap="round"/>
        <path d={`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${ex} ${ey}`} fill="none" stroke={color} strokeWidth="10" strokeLinecap="round"/>
        <circle cx={ex} cy={ey} r={5} fill={color}/>
        <text x={cx} y={cy+2} textAnchor="middle" fill={color} fontSize="17" fontWeight="700" fontFamily="var(--font)">{v.toFixed(0)}</text>
        <text x={cx} y={cy+16} textAnchor="middle" fill="#8892a4" fontSize="8" fontFamily="var(--font)">{label}</text>
      </svg>
      <div style={{fontSize:9,color:"#8892a4",marginTop:-6}}>RSI (14)</div>
    </div>
  );
};

const FibTable=({high,low,price})=>{
  const fibs=calcFib(high,low);
  return(
    <div>
      <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,marginBottom:8,textTransform:"uppercase"}}>Retracements Fibonacci</div>
      <div style={{fontSize:9,color:"#8892a4",marginBottom:4}}>Plage 90j: {px(low)} → {px(high)}</div>
      {fibs.map(([r,val])=>{
        const pctFromPrice=((val-price)/price*100).toFixed(1);
        const isNear=Math.abs(val-price)/price<0.03;
        return(
          <div key={r} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 0",borderBottom:"1px solid #0d1829",background:isNear?"rgba(255,215,64,.06)":"transparent"}}>
            <span style={{fontSize:10,color:"#ffd740",minWidth:36,fontWeight:isNear?700:400}}>{r===0?"0.0":r===1?"1.0":r}</span>
            <div style={{flex:1,background:"#0a1220",borderRadius:2,height:3}}>
              <div style={{width:`${Math.max(0,(val-low)/(high-low)*100)}%`,height:"100%",background:isNear?"#ffd740":"#ffd74040"}}/>
            </div>
            <span style={{fontSize:11,color:isNear?"#ffd740":"#c8d3e8",minWidth:60,textAlign:"right",fontWeight:isNear?700:400}}>{px(val)}</span>
            <span style={{fontSize:10,color:pctFromPrice>0?"#00e5a0":"#ff4f5a",minWidth:44,textAlign:"right"}}>{pctFromPrice>0?"+":""}{pctFromPrice}%</span>
            {isNear&&<span style={{fontSize:9,color:"#ffd740"}}>◀</span>}

        );
      })}
    </div>
  );
};

// ── STOCK CHART — Chandeliers + Volume + MACD ─────────────────────────────────
const StockChart=({r})=>{
  const refMain=useRef(null),refVol=useRef(null),refMacd=useRef(null);
  const instMain=useRef(null),instVol=useRef(null),instMacd=useRef(null);
  const [period,setPeriod]=useState(()=>localStorage.getItem("bvc_period")||"3M");
  const [liveCandles,setLiveCandles]=useState(null);
  const [isLive,setIsLive]=useState(false);
  const [showBB,setShowBB]=useState(false);
  const [showIchi,setShowIchi]=useState(false);
  const sym=r.symbol||r.ticker;
  const daysMap={"5J":7,"1M":22,"3M":65,"6M":130,"1A":260};
  const rangeMap={"5J":"5d","1M":"1mo","3M":"3mo","6M":"6mo","1A":"1y"};

  useEffect(()=>{
    let alive=true;
    setLiveCandles(null);setIsLive(false);
    fetchChart(sym,rangeMap[period]||"3mo").then(c=>{
      if(alive&&c){
        // Ajouter la bougie d'aujourd'hui si données live disponibles et dernière bougie < aujourd'hui
        if(r.live&&c.length>0){
          const now=new Date(new Date().toLocaleString("en-US",{timeZone:"Africa/Casablanca"}));
          const todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
          if(c[c.length-1].x<todayStart&&now.getDay()!==0&&now.getDay()!==6){
            const prevClose=c[c.length-1].y[3];
            const cur=r.price;
            if(cur&&cur>0){
              c.push({x:todayStart,y:[prevClose,Math.max(prevClose,cur),Math.min(prevClose,cur),cur].map(v=>+v.toFixed(2)),vol:r.vol||0});
            }
          }
        }
        setLiveCandles(c);setIsLive(true);
      }
    });
    return()=>{alive=false;};
  },[sym,period,r.live,r.price,r.vol]);

  useEffect(()=>{
    if(!refMain.current||!refVol.current||!refMacd.current)return;
    if(!liveCandles||liveCandles.length<5){
      [instMain,instVol,instMacd].forEach(ref=>{if(ref.current){ref.current.destroy();ref.current=null;}});
      refMain.current.innerHTML='<div style="height:220px;display:flex;align-items:center;justify-content:center;color:#8892a4;font-size:12px;font-family:var(--font)">Données historiques non disponibles pour ce titre</div>';
      refVol.current.innerHTML='';refMacd.current.innerHTML='';
      return;
    }
    const days=daysMap[period]||65;
    const candles=liveCandles;
    const closes=candles.map(c=>c.y[3]);
    const ma20=calcMA(closes,20);
    const ma50=calcMA(closes,50);
    const macdData=calcMACD(closes);
    const bbData=calcBollinger(closes);
    const ichiData=calcIchimoku(candles);
    const grp="bvc_"+sym+"_"+period;

    const ma20data=candles.map((c,i)=>({x:c.x,y:ma20[i]})).filter(p=>p.y!==null);
    const ma50data=candles.map((c,i)=>({x:c.x,y:ma50[i]})).filter(p=>p.y!==null);

    // Volume: couleur selon direction de la bougie
    const volData=candles.map(c=>({x:c.x,y:c.vol||0,fillColor:c.y[3]>=c.y[0]?"#00e5a045":"#ff4f5a45"}));

    // MACD: histogramme vert/rouge
    const macdLine=candles.map((c,i)=>({x:c.x,y:macdData.macd[i]})).filter(p=>p.y!==null);
    const sigLine=candles.map((c,i)=>({x:c.x,y:macdData.signal[i]})).filter(p=>p.y!==null);
    const histData=candles.map((c,i)=>({x:c.x,y:macdData.hist[i],fillColor:(macdData.hist[i]||0)>=0?"#00e5a045":"#ff4f5a45"})).filter(p=>p.y!==null);

    const xAxisBase={type:"datetime",labels:{style:{colors:"#8892a4",fontSize:"9px"},datetimeFormatter:{month:"MMM yy",day:"dd MMM"}}};

    // ── Séries dynamiques selon toggles BB / Ichimoku ──────
    const seriesMain=[
      {name:sym,type:"candlestick",data:candles},
      {name:"MA20",type:"line",data:ma20data},
      {name:"MA50",type:"line",data:ma50data},
    ];
    const swMain=[1,1.5,1.5],sdMain=[0,0,4],scMain=["","#4db8ff","#b388ff"],slMain=["#c8d3e8","#4db8ff","#b388ff"];
    if(showBB){
      const bbU=candles.map((c,i)=>({x:c.x,y:bbData.upper[i]})).filter(p=>p.y!==null);
      const bbL=candles.map((c,i)=>({x:c.x,y:bbData.lower[i]})).filter(p=>p.y!==null);
      seriesMain.push({name:"BB+",type:"line",data:bbU},{name:"BB−",type:"line",data:bbL});
      swMain.push(1,1);sdMain.push(2,2);scMain.push("#ffd740","#ffd740");slMain.push("#ffd740","#ffd740");
    }
    if(showIchi){
      const tkData=candles.map((c,i)=>({x:c.x,y:ichiData.tenkan[i]})).filter(p=>p.y!==null);
      const kjData=candles.map((c,i)=>({x:c.x,y:ichiData.kijun[i]})).filter(p=>p.y!==null);
      seriesMain.push({name:"Tenkan",type:"line",data:tkData},{name:"Kijun",type:"line",data:kjData});
      swMain.push(1.5,1.5);sdMain.push(0,4);scMain.push("#ff6f40","#66b0ff");slMain.push("#ff6f40","#66b0ff");
    }

    // ── Graphique principal : chandeliers + MA ──────────────
    const optsMain={
      chart:{id:"main_"+grp,group:grp,type:"candlestick",height:220,background:"#0d1829",
        toolbar:{show:true,tools:{zoom:true,reset:true,pan:true,download:false}},
        animations:{enabled:false}
      },
      series:seriesMain,
      stroke:{width:swMain,dashArray:sdMain},
      colors:scMain,
      xaxis:{...xAxisBase,labels:{show:false}},
      yaxis:{labels:{formatter:v=>v>=1000?v.toLocaleString("fr-FR"):v?.toFixed(2)||"",style:{colors:"#8892a4",fontSize:"10px"}}},
      grid:{borderColor:"#1a2540",padding:{bottom:0}},
      theme:{mode:"dark"},
      plotOptions:{candlestick:{colors:{upward:"#00e5a0",downward:"#ff4f5a"},wick:{useFillColor:true}}},
      legend:{show:true,labels:{colors:slMain},fontSize:"10px",fontFamily:"var(--font)"},
      annotations:{},
      tooltip:{theme:"dark",custom:function({seriesIndex,dataPointIndex,w}){
        const d=w.globals.initialSeries[0]?.data[dataPointIndex];
        if(!d||seriesIndex!==0)return"";
        const[o,h,l,c]=d.y;const col=c>=o?"#00e5a0":"#ff4f5a";
        return`<div style="padding:8px 10px;font-family:var(--font);font-size:11px;background:#0d1829;border:1px solid #1a2540;border-radius:4px"><b style="color:#fff">${sym}</b><br/><span style="color:#8892a4">O</span> <span style="color:#c8d3e8">${o}</span> <span style="color:#8892a4"> H</span> <span style="color:${col}">${h}</span> <span style="color:#8892a4"> L</span> <span style="color:#ff4f5a">${l}</span> <span style="color:#8892a4"> C</span> <span style="color:${col};font-weight:700">${c}</span></div>`;
      }}
    };

    // ── Volume ──────────────────────────────────────────────
    const optsVol={
      chart:{id:"vol_"+grp,group:grp,type:"bar",height:65,background:"#0d1829",
        toolbar:{show:false},animations:{enabled:false},sparkline:{enabled:false}
      },
      series:[{name:"Volume",data:volData}],
      dataLabels:{enabled:false},
      xaxis:{...xAxisBase,labels:{show:false}},
      yaxis:{labels:{show:false},min:0},
      grid:{borderColor:"#1a2540",padding:{top:0,bottom:0,left:0}},
      theme:{mode:"dark"},
      plotOptions:{bar:{columnWidth:"90%"}},
      tooltip:{theme:"dark",y:{formatter:v=>v>=1e6?`${(v/1e6).toFixed(1)}M`:v>=1e3?`${(v/1e3).toFixed(0)}K`:v||"N/A"}},
    };

    // ── MACD ────────────────────────────────────────────────
    const optsMacd={
      chart:{id:"macd_"+grp,group:grp,type:"line",height:80,background:"#0d1829",
        toolbar:{show:false},animations:{enabled:false}
      },
      series:[
        {name:"MACD",type:"line",data:macdLine},
        {name:"Signal",type:"line",data:sigLine},
        {name:"Hist",type:"bar",data:histData},
      ],
      stroke:{width:[1.5,1.5,1],dashArray:[0,4,0]},
      colors:["#4db8ff","#ffd740","#00e5a0"],
      dataLabels:{enabled:false},
      xaxis:xAxisBase,
      yaxis:{labels:{formatter:v=>v?.toFixed(1)||"",style:{colors:"#8892a4",fontSize:"8px"}}},
      grid:{borderColor:"#1a2540",padding:{top:0}},
      theme:{mode:"dark"},
      legend:{show:false},
      tooltip:{theme:"dark",x:{format:"dd MMM yy"}},
      annotations:{yaxis:[{y:0,borderColor:"#8892a440",borderWidth:1,label:{show:false}}]},
    };

    [instMain,instVol,instMacd].forEach(ref=>{if(ref.current){ref.current.destroy();ref.current=null;}});
    instMain.current=new ApexCharts(refMain.current,optsMain);
    instVol.current=new ApexCharts(refVol.current,optsVol);
    instMacd.current=new ApexCharts(refMacd.current,optsMacd);
    instMain.current.render();
    instVol.current.render();
    instMacd.current.render();

    return()=>{[instMain,instVol,instMacd].forEach(ref=>{if(ref.current){ref.current.destroy();ref.current=null;}});};
  },[sym,period,liveCandles,showBB,showIchi]);

  const changePeriod=(p)=>{setPeriod(p);localStorage.setItem("bvc_period",p);};

  return(
    <div>
      <div style={{display:"flex",gap:6,marginBottom:6,alignItems:"center"}}>
        <span style={{fontSize:10,color:"#8892a4"}}>PÉRIODE</span>
        {["5J","1M","3M","6M","1A"].map(p=>(
          <button key={p} onClick={()=>changePeriod(p)} style={{background:period===p?"rgba(77,184,255,.15)":"transparent",border:period===p?"1px solid rgba(77,184,255,.4)":"1px solid #1a2540",color:period===p?"#4db8ff":"#8892a4",padding:"2px 8px",borderRadius:3,fontSize:10}}>{p}</button>
        ))}
        <span style={{color:"#1a2540",margin:"0 2px"}}>|</span>
        <button onClick={()=>setShowBB(v=>!v)} title="Bollinger Bands (20,2)" style={{background:showBB?"rgba(255,215,64,.15)":"transparent",border:showBB?"1px solid rgba(255,215,64,.4)":"1px solid #1a2540",color:showBB?"#ffd740":"#8892a4",padding:"2px 8px",borderRadius:3,fontSize:10}}>BB</button>
        <button onClick={()=>setShowIchi(v=>!v)} title="Ichimoku (Tenkan 9 / Kijun 26)" style={{background:showIchi?"rgba(255,111,64,.15)":"transparent",border:showIchi?"1px solid rgba(255,111,64,.4)":"1px solid #1a2540",color:showIchi?"#ff6f40":"#8892a4",padding:"2px 8px",borderRadius:3,fontSize:10}}>ICHI</button>

      </div>

      <div ref={refMacd}/>
    </div>
  );
};

  return(
    <div>
      {/* ── Barre de recherche + filtre secteur ─────────────── */}
      <div style={{display:"flex",gap:8,marginBottom:10,alignItems:"center",flexWrap:"wrap"}}>
        <input
          value={search} onChange={e=>setSearch(e.target.value)}
          placeholder="Rechercher ticker ou nom…"
          style={{background:"#0d1829",border:"1px solid #1a2540",color:"#c8d3e8",borderRadius:4,padding:"5px 10px",fontSize:12,fontFamily:"var(--font)",width:220,outline:"none"}}
        />
        <select value={sector} onChange={e=>setSector(e.target.value)}
          style={{background:"#0d1829",border:"1px solid #1a2540",color:"#8892a4",borderRadius:4,padding:"5px 8px",fontSize:11,fontFamily:"var(--font)",cursor:"pointer"}}>
          {sectors.map(s=><option key={s} value={s}>{s==="ALL"?`Tous (${rows.length})`:s}</option>)}
        </select>
        {(search||sector!=="ALL")&&<button onClick={()=>{setSearch("");setSector("ALL");}} style={{fontSize:10,color:"#ff4f5a",border:"1px solid #ff4f5a30",borderRadius:3,padding:"3px 8px",background:"transparent"}}>✕ Réinitialiser</button>}
        <span style={{marginLeft:"auto",fontSize:11,color:"#8892a4"}}>{sorted.length}/{rows.length} titres</span>
      </div>
      {/* ── Tri ────────────────────────────────────────────────── */}
      <div style={{display:"flex",gap:8,marginBottom:14,alignItems:"center",flexWrap:"wrap"}}>
        <span style={{fontSize:12,color:"#8892a4",letterSpacing:1}}>TRIER PAR</span>
        {SORTS.map(([id,lbl])=>(
          <button key={id} onClick={()=>setSort(id)} style={{background:sort===id?"rgba(0,229,160,.12)":"transparent",border:sort===id?"1px solid rgba(0,229,160,.4)":"1px solid #1a2540",color:sort===id?"#00e5a0":"#8892a4",padding:"3px 10px",borderRadius:4,fontSize:11}}>{lbl}{sort===id?" ▼":""}</button>
        ))}
      </div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",minWidth:1220}}>
          <thead>
            <tr style={{borderBottom:"2px solid #1a2540"}}>
              {HEADS.map(h=><th key={h} style={{padding:"8px 8px",fontSize:10,color:"#8892a4",textAlign:"left",letterSpacing:.4,whiteSpace:"nowrap",fontWeight:500}}>{h}</th>)}
            </tr>
          </thead>
          <tbody>
            {sorted.map((r,i)=>{
              const s=SS(r.sig);const sym=r.symbol||r.ticker;
              const rsiVal=r.rsi||r.rsi14||50;
              const rsiColor=rsiVal>70?"#ff4f5a":rsiVal<30?"#00e5a0":"#ffd740";
              /* indicateurs tech estimés : MA20 = MA50 (données live non encore reçues) */
              const isStat=r.ma20>0&&r.ma50>0&&Math.abs(r.ma20-r.ma50)<0.01;
              return(
                <tr key={sym} onClick={()=>{setSel(sym);setTab("detail");}}
                  style={{borderBottom:"1px solid #0d1829",cursor:"pointer",transition:"background .12s"}}
                  onMouseEnter={e=>e.currentTarget.style.background="rgba(255,255,255,.025)"}
                  onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  <td style={{padding:"8px 8px",fontSize:12,color:"#8892a4"}}>{i+1}</td>
                  <td style={{padding:"8px 8px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:4}}>
                      <span style={{fontSize:14,color:"#fff",fontWeight:700}}>{sym}</span>
                      {r.warn&&<span title={r.warnMsg} style={{fontSize:10,cursor:"help"}}>⚠️</span>}
                      {isStat&&<span title="Indicateurs techniques estimés — données live en attente" style={{fontSize:9,color:"#8892a4",border:"1px solid #1a2540",borderRadius:2,padding:"1px 3px",cursor:"default"}}>~stat</span>}
                      <button onClick={e=>{e.stopPropagation();toggleFav(sym);}} title={fav.includes(sym)?"Retirer des favoris":"Ajouter aux favoris"}
                        style={{fontSize:13,color:fav.includes(sym)?"#ffd740":"#2a3550",border:"none",background:"none",cursor:"pointer",padding:"0 1px",lineHeight:1,transition:"color .15s"}}>
                        {fav.includes(sym)?"★":"☆"}
                      </button>
                    </div>
                    <div style={{fontSize:9,color:"#8892a4"}}>{r.sector}</div>
                  </td>
                  <td style={{padding:"8px 8px",fontSize:12,color:"#8892a4"}}>{px(r.open||+(( r.price||r.prix)/(1+(r.chg||0)/100)).toFixed(0))}</td>
                  <td style={{padding:"8px 8px",fontSize:13,color:"#c8d3e8",fontWeight:600}}>
                    {px(r.close||r.price||r.prix)}
                    {r.live&&<span style={{fontSize:8,color:"#00e5a0",marginLeft:3,verticalAlign:"super"}}>●</span>}
                  </td>
                  <td style={{padding:"8px 8px",fontSize:13,color:VC(r.chg),fontWeight:600}}>{r.chg>0?"▲":r.chg<0?"▼":"—"} {Math.abs(r.chg||0).toFixed(2)}%</td>
                  <td style={{padding:"8px 8px",fontSize:12,color:r.pe>25?"#ff8f00":"#c8d3e8"}}>{r.pe?.toFixed(1)||"—"}</td>
                  <td style={{padding:"8px 8px",fontSize:12,color:r.div>4?"#00e5a0":"#c8d3e8"}}>{r.div?.toFixed(1)||"—"}%</td>
                  <td style={{padding:"8px 8px",fontSize:13,color:SC(r.bvc)}}>{r.bvc.toFixed(2)}</td>
                  <td style={{padding:"8px 8px"}}>
                    <div style={{fontSize:15,color:SC(r.v53),fontWeight:700,marginBottom:2}}>{r.v53.toFixed(2)}</div>
                    <Bar v={r.v53} c={SC(r.v53)} h={4}/>
                  </td>
                  <td style={{padding:"8px 8px"}}><Delta d={r.delta}/></td>
                  <td style={{padding:"8px 8px",fontSize:13,color:NC(r.nlp),fontWeight:600}}>{r.nlp>0?"+":""}{(r.nlp*100).toFixed(0)}%</td>
                  <td style={{padding:"8px 8px",fontSize:12,color:r.win>=80?"#00e5a0":r.win>=70?"#ffd740":"#ff8f00",fontWeight:600}}>{r.win}%</td>
                  <td style={{padding:"8px 8px",fontSize:12,color:r.alpha>=0?"#00e5a0":"#ff4f5a",fontWeight:600}}>{r.alpha>0?"+":""}{r.alpha}%{r.alpha<0&&<span style={{fontSize:10}}>⚠️</span>}</td>
                  <td style={{padding:"8px 8px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:5}}>
                      <span style={{fontSize:12,color:isStat?"#8892a4":rsiColor,fontWeight:700}}>{isStat?"~":""}{rsiVal}</span>
                      {!isStat&&<div style={{width:30,background:"#0a1220",borderRadius:2,height:4}}>
                        <div style={{width:`${rsiVal}%`,height:"100%",background:rsiColor,borderRadius:2}}/>
                      </div>}
                    </div>
                  </td>
                  <td style={{padding:"8px 8px"}}><Chip label={r.sig} bg={s.bg} fg={s.fg} bd={s.bd}/></td>
                  <td style={{padding:"8px 8px",minWidth:85}}>
                    <WBar f={r.poids.f} n={r.poids.n} t={r.poids.t}/>
                    <div style={{fontSize:9,color:"#8892a4",marginTop:2}}>F{r.poids.f}·N{r.poids.n}·T{r.poids.t}</div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div style={{marginTop:12,padding:"10px 14px",background:"#0d1829",border:"1px solid #1a2540",borderRadius:6,fontSize:11,color:"#8892a4",lineHeight:1.9}}>
        <span style={{color:"#00e5a0"}}>●</span> Score v5.3 = Tech×25% + Fond×47% + NLP×28% (pondération dynamique) &nbsp;|&nbsp;
        <span style={{color:"#ffd740"}}>●</span> WIN = % signaux corrects 6 mois glissants (1994 signaux V3) &nbsp;|&nbsp;
        <span style={{color:"#b388ff"}}>●</span> Δ = différence v5.3 vs BVC original &nbsp;|&nbsp;
        <span style={{color:"#8892a4"}}>~stat</span> = indicateurs techniques estimés (RSI/MA calculés dès la prochaine mise à jour) &nbsp;|&nbsp;
        <span style={{color:"#ff4f5a"}}>⚠️</span> Alpha/RSI rouge = prudence &nbsp;|&nbsp; PE = Price/Earnings · DIV = dividende &nbsp;|&nbsp; Clic → vue détaillée
      </div>
    </div>
  );
};

// ── DETAIL ────────────────────────────────────────────────────────────────────
const Detail=({rows,sel,setSel,fav=[],toggleFav=()=>{}})=>{
  const [detSearch,setDetSearch]=useState("");
  const r=rows.find(x=>(x.symbol||x.ticker)===sel)||rows[0];
  const s=SS(r.sig);
  const price=r.price||r.prix;
  const h90=r.h90||r.high90;const l90=r.l90||r.low90;
  const upside=((r.bull-price)/price*100).toFixed(1);
  const pos=Math.min(98,Math.max(2,(price-r.bear)/(r.bull-r.bear)*100));
  const sym=r.symbol||r.ticker;
  const rsiVal=r.rsi||r.rsi14||50;

  const visRows=detSearch.trim()
    ? rows.filter(d=>{const q=detSearch.trim().toUpperCase();return (d.symbol||d.ticker||"").includes(q)||(d.name||"").toUpperCase().includes(q);})
    : rows;

  return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:8,alignItems:"center",flexWrap:"wrap"}}>
        <input value={detSearch} onChange={e=>setDetSearch(e.target.value)}
          placeholder="Filtrer ticker…"
          style={{background:"#0d1829",border:"1px solid #1a2540",color:"#c8d3e8",borderRadius:4,padding:"4px 8px",fontSize:11,fontFamily:"var(--font)",width:160,outline:"none"}}/>
        {detSearch&&<button onClick={()=>setDetSearch("")} style={{fontSize:10,color:"#8892a4",border:"none",background:"transparent"}}>✕</button>}
      </div>
      <div style={{display:"flex",gap:4,marginBottom:14,flexWrap:"wrap",maxHeight:96,overflowY:"auto",padding:"4px 0"}}>
        {visRows.map(d=>{const sym2=d.symbol||d.ticker;const ds=SS(d.sig);const a=sel===sym2;return(
          <button key={sym2} onClick={()=>setSel(sym2)} style={{background:a?ds.bg:"transparent",border:a?`1px solid ${ds.bd}`:"1px solid #1a2540",color:a?ds.fg:"#8892a4",padding:"2px 7px",borderRadius:3,fontSize:10,fontWeight:a?700:400,transition:"all .15s"}}>{sym2}</button>
        );})}
      </div>
      {r.warn&&<div style={{background:"rgba(255,215,64,.08)",border:"1px solid rgba(255,215,64,.3)",borderRadius:6,padding:"10px 14px",marginBottom:12,fontSize:13,color:"#ffd740"}}>⚠️ {r.warnMsg}</div>}

      <div style={{display:"grid",gridTemplateColumns:"290px 1fr",gap:12}}>
        {/* LEFT */}
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {/* Score card */}
          <div style={{background:`linear-gradient(135deg,${s.bg},#0d1829)`,border:`1px solid ${s.bd}`,borderRadius:8,padding:16,textAlign:"center"}}>
            <div style={{fontSize:12,color:"#8892a4",letterSpacing:2,marginBottom:4,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              <span>{sym} · {px(price)} DH <span style={{color:VC(r.chg),fontWeight:600}}>{r.chg>0?"▲":"▼"} {Math.abs(r.chg).toFixed(2)}%</span></span>
              <button onClick={()=>toggleFav(sym)} title={fav.includes(sym)?"Retirer des favoris":"Ajouter aux favoris"}
                style={{fontSize:18,color:fav.includes(sym)?"#ffd740":"#2a3550",border:"none",background:"none",cursor:"pointer",padding:"0 2px",lineHeight:1,transition:"color .2s"}}>
                {fav.includes(sym)?"★":"☆"}
              </button>
            </div>
            <div style={{fontSize:52,fontWeight:700,color:s.fg,textShadow:`0 0 30px ${s.fg}40`,lineHeight:1}}>{r.v53.toFixed(2)}</div>
            <div style={{fontSize:11,color:"#8892a4",margin:"4px 0 10px"}}>Score v5.3 / 10</div>
            <Chip label={r.sig} bg={s.bg} fg={s.fg} bd={s.bd} sz={12}/>
            <div style={{marginTop:8,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              <Delta d={r.delta}/><span style={{fontSize:11,color:"#8892a4"}}>vs BVC {r.bvc.toFixed(2)}</span>
            </div>
          </div>

          {/* Fundamentaux */}
          <div style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12}}>
            <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,marginBottom:10,textTransform:"uppercase"}}>Fondamentaux</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
              {[["PE Ratio",r.pe?.toFixed(1)||"—",r.pe>25?"#ff8f00":"#c8d3e8"],["P/Book",r.pb?.toFixed(2)||"—","#c8d3e8"],["Dividende",r.div?`${r.div.toFixed(1)}%`:"—",r.div>4?"#00e5a0":"#c8d3e8"],["Cap. Boursière",r.cap?fmtM(r.cap):"—","#4db8ff"],["Upside Base",`${((r.base-price)/price*100).toFixed(1)}%`,((r.base-price)/price)>0?"#00e5a0":"#ff4f5a"],["Alpha 12M",`${r.alpha>0?"+":""}${r.alpha}%`,r.alpha>=0?"#00e5a0":"#ff4f5a"]].map(([k,v,c])=>(
                <div key={k} style={{background:"#0a1220",borderRadius:4,padding:"6px 8px"}}>
                  <div style={{fontSize:8,color:"#8892a4",marginBottom:2,textTransform:"uppercase"}}>{k}</div>
                  <div style={{fontSize:13,color:c,fontWeight:700}}>{v}</div>
                </div>
              ))}
            </div>
          </div>

          {/* RSI + NLP */}
          <div style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,marginBottom:6,textTransform:"uppercase"}}>Indicateurs Techniques</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                  {[["MA20",px(r.ma20||0),"#4db8ff"],["MA50",px(r.ma50||0),"#b388ff"],["Haut 90j",px(h90),"#00e5a0"],["Bas 90j",px(l90),"#ff4f5a"]].map(([k,v,c])=>(
                    <div key={k} style={{background:"#0a1220",borderRadius:4,padding:"5px 7px"}}>
                      <div style={{fontSize:8,color:"#8892a4",marginBottom:1}}>{k}</div>
                      <div style={{fontSize:12,color:c,fontWeight:700}}>{v}</div>
                    </div>
                  ))}
                </div>
                {/* Indicateurs avancés si disponibles dans data.json */}
                {(r.macd!=null||r.bb_upper!=null||r.stoch_k!=null)&&(
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:5,marginTop:6}}>
                    {r.macd!=null&&(
                      <div style={{background:"#0a1220",borderRadius:4,padding:"5px 7px"}}>
                        <div style={{fontSize:8,color:"#8892a4",marginBottom:1}}>MACD</div>
                        <div style={{fontSize:11,color:r.macd>0?"#00e5a0":"#ff4f5a",fontWeight:700}}>{r.macd>0?"+":""}{r.macd?.toFixed(2)}</div>
                        <div style={{fontSize:9,color:"#8892a4"}}>{r.macd>0&&r.macd>(r.macd_signal||0)?"haussier":"baissier"}</div>
                      </div>
                    )}
                    {r.bb_upper!=null&&(
                      <div style={{background:"#0a1220",borderRadius:4,padding:"5px 7px"}}>
                        <div style={{fontSize:8,color:"#8892a4",marginBottom:1}}>BB(20,2)</div>
                        <div style={{fontSize:10,color:"#ffd740",fontWeight:700}}>{px(r.bb_upper)}</div>
                        <div style={{fontSize:9,color:"#8892a4"}}>{px(r.bb_lower)}</div>
                      </div>
                    )}
                    {r.stoch_k!=null&&(
                      <div style={{background:"#0a1220",borderRadius:4,padding:"5px 7px"}}>
                        <div style={{fontSize:8,color:"#8892a4",marginBottom:1}}>STOCH</div>
                        <div style={{fontSize:11,color:r.stoch_k>80?"#ff4f5a":r.stoch_k<20?"#00e5a0":"#ffd740",fontWeight:700}}>{r.stoch_k?.toFixed(0)}</div>
                        <div style={{fontSize:9,color:"#8892a4"}}>{r.stoch_k>80?"survente":r.stoch_k<20?"survente":"neutre"}</div>
                      </div>
                    )}
                  </div>
                )}
              </div>
              <RSIGauge value={rsiVal}/>
            </div>
          </div>

          {/* NLP */}
          <div style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12}}>
            <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,marginBottom:8,textTransform:"uppercase"}}>NLP — Groupe MASI 1 (6 ans)</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
              {[["Biais groupe",r.biais,NC(r.nlp)],["Smart Sentiment",`${r.nlp>0?"+":""}${(r.nlp*100).toFixed(0)}%`,NC(r.nlp)],["Win rate 6M",`${r.win}%`,r.win>=80?"#00e5a0":"#ffd740"],["Convergence",r.conv==="CONFIRME"?"✅ OK":"⚠️ Div.",r.conv==="CONFIRME"?"#00e5a0":"#ffd740"]].map(([k,v,c])=>(
                <div key={k} style={{background:"#0a1220",borderRadius:4,padding:"6px 8px"}}>
                  <div style={{fontSize:8,color:"#8892a4",marginBottom:2,textTransform:"uppercase"}}>{k}</div>
                  <div style={{fontSize:12,color:c,fontWeight:700}}>{v}</div>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* RIGHT */}
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {/* Chart */}
          <div style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12}}>
            <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,marginBottom:6,textTransform:"uppercase"}}>Graphique Chandeliers · MA20 · MA50 · Fibonacci</div>
            <StockChart r={r}/>
            <div style={{fontSize:9,color:"#8892a4",marginTop:6}}>
              <span style={{color:"#4db8ff"}}>── MA20</span> &nbsp; <span style={{color:"#b388ff",textDecoration:"underline dashed"}}>── MA50</span> &nbsp; <span style={{color:"#ffd740"}}>─ Fib niveaux</span> &nbsp; | <span style={{color:"#00e5a0"}}>●</span> IDBourse / Médias24 — données réelles uniquement
            </div>
          </div>

          {/* Fibonacci */}
          <div style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12}}>
            <FibTable high={h90} low={l90} price={price}/>
          </div>

          {/* Scénarios */}
          <div style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12}}>
            <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,marginBottom:10,textTransform:"uppercase"}}>Scénarios Prix (fondamentaux)</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
              {[["BEAR",r.bear,"#ff4f5a",`${((r.bear-price)/price*100).toFixed(1)}%`],["BASE",r.base,"#ffd740",`${((r.base-price)/price*100).toFixed(1)}%`],["BULL",r.bull,"#00e5a0",`+${upside}%`]].map(([lbl,val,c,pct])=>(
                <div key={lbl} style={{background:"#0a1220",borderRadius:6,padding:"10px 8px",border:`1px solid ${c}20`,textAlign:"center"}}>
                  <div style={{fontSize:9,color:"#8892a4",marginBottom:3,letterSpacing:1}}>{lbl}</div>
                  <div style={{fontSize:18,fontWeight:700,color:c,marginBottom:2}}>{px(val)}</div>
                  <div style={{fontSize:11,color:c}}>{pct}</div>
                </div>
              ))}
            </div>
            <div style={{position:"relative",margin:"4px 0"}}>
              <div style={{background:"linear-gradient(90deg,#ff4f5a,#ffd740,#00e5a0)",height:8,borderRadius:4}}/>
              <div style={{position:"absolute",left:`${pos}%`,top:"50%",transform:"translate(-50%,-50%)",width:14,height:14,borderRadius:"50%",background:"#fff",border:"3px solid #0d1829",boxShadow:"0 0 8px rgba(255,255,255,.5)"}}/>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#8892a4",marginTop:5}}>
              <span>Bear {px(r.bear)}</span><span style={{color:"#ffd740",fontWeight:600}}>▲ {px(price)} DH</span><span>Bull {px(r.bull)}</span>
            </div>
          </div>

          {/* Setup + formule */}
          <div style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12,fontFamily:"var(--font)",fontSize:12,lineHeight:1.9}}>
            <div style={{display:"flex",gap:6,marginBottom:10}}>
              {[[`Setup: ${r.setup}`,"#ffd740"],[`Flags: ${r.flags===0?"✅ 0":"⚠️ "+r.flags}`,r.flags>=3?"#ff4f5a":r.flags>=1?"#ffd740":"#00e5a0"],[`Fond:${r.poids.f}% NLP:${r.poids.n}% Tech:${r.poids.t}%`,"#8892a4"]].map(([lbl,c])=>(
                <span key={lbl} style={{fontSize:11,padding:"3px 8px",borderRadius:4,background:"#0a1220",color:c,border:"1px solid #1a2540"}}>{lbl}</span>
              ))}
            </div>
            <WBar f={r.poids.f} n={r.poids.n} t={r.poids.t}/>
            <div style={{marginTop:10}}>
              <span style={{color:"#b388ff"}}>fond×{r.poids.f}%</span><span style={{color:"#8892a4"}}> + </span>
              <span style={{color:"#00e5a0"}}>nlp×{r.poids.n}%</span><span style={{color:"#8892a4"}}> + </span>
              <span style={{color:"#4db8ff"}}>tech×{r.poids.t}%</span>
              <span style={{color:"#8892a4"}}> + bonus/malus =</span>
              <span style={{color:r.delta>=0?"#00e5a0":"#ff4f5a",fontWeight:700}}> {r.v53.toFixed(2)}</span>
              <span style={{color:"#8892a4",fontSize:11}}> ({r.delta>=0?"+":""}{r.delta.toFixed(2)} vs BVC {r.bvc.toFixed(2)})</span>
            </div>
            {r.bonus.length>0&&<div style={{marginTop:6,fontSize:11}}>
              {r.bonus.map((b,i)=><div key={i} style={{color:b.startsWith("-")?"#ff8f00":"#00e5a0"}}>{b.startsWith("-")?"▼":"▲"} {b.slice(1)}</div>)}
            </div>}
          </div>
        </div>
      </div>
    </div>
  );
};

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const [tab,setTab]=useState(()=>localStorage.getItem("bvc_tab")||"ranking");
  const [sort,setSort]=useState("v53");
  const [sel,setSel]=useState("CMT");
  const [rows,setRows]=useState(STATIC);
  const [fav,setFav]=useState(()=>{try{return JSON.parse(localStorage.getItem("bvc_fav")||"[]");}catch{return [];}});
  const toggleFav=useCallback(sym=>{setFav(prev=>{const next=prev.includes(sym)?prev.filter(x=>x!==sym):[...prev,sym];localStorage.setItem("bvc_fav",JSON.stringify(next));return next;});},[]);
  const [ts,setTs]=useState(new Date().toLocaleString("fr-FR",{timeZone:"Africa/Casablanca",hour:"2-digit",minute:"2-digit"}));
  const [src,setSrc]=useState("connexion…");
  const [loading,setLoading]=useState(false);
  const [fetchErr,setFetchErr]=useState(false);
  const [mktStatus,setMktStatus]=useState(getMarketStatus());

  // Update market status every 30s
  useEffect(()=>{
    const t=setInterval(()=>setMktStatus(getMarketStatus()),30000);
    return()=>clearInterval(t);
  },[]);

  // Merge live quote data into rows (functional update, no dep on rows)
  const mergeLive=useCallback((liveMap)=>{
    setRows(prev=>prev.map(s=>{
      const live=liveMap[s.symbol];
      if(!live)return s;
      return{...s,...live};
    }));
  },[]);

  // Load data: Yahoo Finance → data.json → STATIC (silent fallback chain)
  const loadData=useCallback(async()=>{
    setLoading(true);
    setFetchErr(false);
    // Étape 1 : data.json (pipeline GitHub Actions — base MA/RSI pour 77 tickers)
    let pipelineLoaded=false;
    let nLive=0;
    try{
      const d=await fetch("data.json?t="+Date.now()).then(r=>r.ok?r.json():null);
      if(d?.tickers){
        const m={};
        d.tickers.forEach(t=>{m[t.symbol]={
          price:t.price,chg:t.chg,vol:t.vol||0,open:t.open,close:t.close,
          name:t.name,sector:t.sector,
          pe:t.pe,pb:t.pb,div:t.div,cap:t.cap,
          h90:t.h90,l90:t.l90,rsi:t.rsi,ma20:t.ma20,ma50:t.ma50,
          macd:t.macd,macd_signal:t.macd_signal,macd_hist:t.macd_hist,
          bb_upper:t.bb_upper,bb_mid:t.bb_mid,bb_lower:t.bb_lower,
          stoch_k:t.stoch_k,stoch_d:t.stoch_d,
          bvc:t.bvc,v53:t.v53,delta:t.delta,nlp:t.nlp,
          alpha:t.alpha,win:t.win,sig:t.sig,sigBvc:t.sigBvc,biais:t.biais,
          bonus:t.bonus,poids:t.poids,warn:t.warn,warnMsg:t.warnMsg,
          bear:t.bear,base:t.base,bull:t.bull,upside:t.upside,flags:t.flags,
          conv:t.conv,setup:t.setup
        };});
        mergeLive(m);
        nLive=d.tickers.filter(t=>t.chg&&t.chg!==0).length;
        const upd=d.updated?new Date(d.updated):null;
        const timeStr=upd?upd.toLocaleString("fr-FR",{timeZone:"Africa/Casablanca",hour:"2-digit",minute:"2-digit"}):"";
        const dateStr=upd?upd.toLocaleString("fr-FR",{timeZone:"Africa/Casablanca",day:"2-digit",month:"2-digit"}):"";
        setTs(dateStr&&timeStr?`${dateStr} · ${timeStr}`:"");
        const mktNow=getMarketStatus();
        const ageMin=upd?(Date.now()-upd.getTime())/60000:Infinity;
        const stale=mktNow.isOpen&&ageMin>30;
        setSrc(`Pipeline${nLive?" · "+nLive+" live":""}${stale?" ⚠ >30min":""}${dateStr?" · "+dateStr:""}`);
        pipelineLoaded=true;
      }
    }catch{}
    // Étape 2 : prix live IDBourse/Médias24/Yahoo directement dans le navigateur (overlay sur data.json)
    try{
      const liveMap=await fetchQuotes();
      if(liveMap&&Object.keys(liveMap).length>0){
        mergeLive(liveMap);
        const nIdb=Object.keys(liveMap).length;
        const srcs=Object.values(liveMap).map(v=>v.src).filter(Boolean);
        const mainSrc=srcs[0]||"live";
        setTs(new Date().toLocaleString("fr-FR",{timeZone:"Africa/Casablanca",hour:"2-digit",minute:"2-digit"}));
        setSrc(`${mainSrc} · ${nIdb} live ●`);
        setLoading(false);return;
      }
    }catch{}
    if(pipelineLoaded){setLoading(false);return;}
    // Dernier recours : valeurs STATIC (avec avertissement visible)
    setFetchErr(true);
    setSrc("⚠ données statiques");
    setLoading(false);
  },[mergeLive]);

  // Chargement initial + auto-refresh toutes les 3 min pendant la séance, 10 min hors séance
  useEffect(()=>{
    loadData();
    const getInterval=()=>{const s=getMarketStatus();return s.isOpen?180000:600000;};
    let iv=setInterval(()=>loadData(),getInterval());
    // Recalcule l'intervalle toutes les 10 min (transition ouverture/fermeture)
    const adjuster=setInterval(()=>{clearInterval(iv);iv=setInterval(()=>loadData(),getInterval());},600000);
    return()=>{clearInterval(iv);clearInterval(adjuster);};
  },[loadData]);

  const changeTab=(t)=>{setTab(t);localStorage.setItem("bvc_tab",t);};

  return(
    <div style={{minHeight:"100vh"}}>
      <Header tab={tab} setTab={changeTab} ts={ts} src={src} onRefresh={loadData} loading={loading} fetchErr={fetchErr} mktStatus={mktStatus} favCount={fav.length}/>
      <div style={{padding:14,maxWidth:1600,margin:"0 auto"}}>
        {tab==="ranking"  &&<Ranking rows={rows} sort={sort} setSort={setSort} setSel={setSel} setTab={changeTab} fav={fav} toggleFav={toggleFav}/>}
        {tab==="watchlist"&&<Ranking rows={rows.filter(r=>fav.includes(r.symbol||r.ticker))} sort={sort} setSort={setSort} setSel={sym=>{setSel(sym);changeTab("detail");}} setTab={changeTab} fav={fav} toggleFav={toggleFav} isWatchlist={true}/>}
        {tab==="detail"   &&<Detail rows={rows} sel={sel} setSel={setSel} fav={fav} toggleFav={toggleFav}/>}
        {tab==="weights"  &&<Weights/>}
        {tab==="smart"    &&<Smart/>}
        {tab==="chat"     &&<Chat/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
