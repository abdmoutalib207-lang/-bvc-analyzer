// Fetch helper: essaie direct puis via proxy CORS
async function bvcGet(url){
  try{const r=await fetch(url,{cache:"no-store"});if(r.ok)return r.json();}catch{}
  for(const proxy of PROXY_LIST){
    try{const r=await fetch(proxy+encodeURIComponent(url),{cache:"no-store"});if(r.ok)return r.json();}catch{}
  }
  return null;
}
async function bvcGetHTML(url){
  for(const proxy of PROXY_LIST){
    try{const r=await fetch(proxy+encodeURIComponent(url),{cache:"no-store"});if(r.ok)return r.text();}catch{}
  }
  return null;
}

// IDBourse: tous les tickers en un seul appel
async function fetchIDB(){
  const data=await bvcGet(`${IDB_BASE}/api/proxy/get_all_data`);
  if(!Array.isArray(data)||data.length===0)return null;
  const out={};
  data.forEach(d=>{
    if(!d.dernier_cours)return;
    // Extraire le code BVC depuis l'URL (.../instruments/CSR → "CSR")
    const url=d.url||"";
    const fromUrl=url.includes("/instruments/")?url.split("/instruments/").pop().toUpperCase():"";
    let sym=fromUrl&&CONFIG.ISIN_MAP[fromUrl]?fromUrl:null;
    if(!sym){const n=(d.name||"").toUpperCase();sym=CONFIG.IDB_NAME_MAP[n]||n;}
    if(!CONFIG.ISIN_MAP[sym])return;
    // volume_en_titres: "3 726" (espaces insécables) → entier
    const volStr=String(d.volume_en_titres||"0").replace(/[ \s,]/g,"");
    const vol=volStr&&volStr!=="0"?Math.round(parseFloat(volStr))||0:0;
    // ouverture: "181,10" (virgule décimale française) → float
    const opnStr=String(d.ouverture||"").replace(",",".");
    const open=opnStr?parseFloat(opnStr)||null:null;
    out[sym]={price:+d.dernier_cours,chg:d.variation!=null?+d.variation:0,open,close:+d.dernier_cours,vol,live:true,src:"IDBourse"};
  });
  return Object.keys(out).length>0?out:null;
}

// Médias24: cours individuel par ISIN
async function fetchMed24Quote(sym){
  const isin=CONFIG.ISIN_MAP[sym];if(!isin)return null;
  const data=await bvcGet(`${MED_BASE}?method=getStockInfo&ISIN=${isin}&format=json`);
  const r=data?.result;if(!r)return null;
  const price=r.cours?+r.cours:null;
  if(!price||isNaN(price))return null;
  return{price,chg:r.variation?+r.variation:0,open:r.ouverture?+r.ouverture:price,close:price,live:true,src:"Médias24"};
}

// Médias24: historique OHLCV pour graphique (format: {date,value,max,min,volume})
async function fetchMed24History(sym,days){
  const isin=CONFIG.ISIN_MAP[sym];if(!isin)return null;
  const to=new Date();const from=new Date(+to-days*86400000);
  const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const data=await bvcGet(`${MED_BASE}?method=getPriceHistory&ISIN=${isin}&from=${fmt(from)}&to=${fmt(to)}&format=json`);
  const recs=data?.result;if(!Array.isArray(recs)||recs.length<5)return null;
  const candles=[];let prevClose=null;
  recs.forEach(rec=>{
    const raw=rec.date||"";
    let ts;
    if(raw.includes("/")){const[d,m,y]=raw.split("/");ts=new Date(+y,+m-1,+d).getTime();}
    else{ts=new Date(raw).getTime();}
    if(!ts||isNaN(ts))return;
    const c=+(rec.value||0),h=+(rec.max||rec.value)||c,l=+(rec.min||rec.value)||c;
    if(!c||c<=0)return;
    const o=prevClose!=null?prevClose:c; // open = veille clôture → couleurs rouge/vert correctes
    const vol=+(rec.volume||rec.vol||0);
    candles.push({x:ts,y:[o,Math.max(h,o,c),Math.min(l,o,c),c],vol});
    prevClose=c;
  });
  return candles.length>=5?candles:null;
}

    const raw=rec.date||"";
    let dt;
    if(raw.includes("/")){const[d,m,y]=raw.split("/");dt=`${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;}
    else{dt=raw.slice(0,10);}
    const c=+(rec.value||0);if(!c||c<=0)return;
    rows.push({d:dt,c:+c.toFixed(2),h:+(+(rec.max||c)).toFixed(2),l:+(+(rec.min||c)).toFixed(2),v:Math.round(+(rec.volume||0))});
  });
  if(rows.length<2)return null;
  // Calculer open = clôture J-1
  rows.sort((a,b)=>a.d.localeCompare(b.d));
  for(let i=0;i<rows.length;i++) rows[i].o=i===0?rows[i].c:+rows[i-1].c.toFixed(2);
  return rows;
}

// fetchChart: pipeline/candles EN PREMIER (OHLCV réel) + enrichissement Médias24 si données manquantes
async function fetchChart(sym,range){
  const daysMap={"5d":7,"1mo":30,"3mo":90,"6mo":180,"1y":365};
  const days=daysMap[range]||90;
  const _dCas=new Date(new Date().toLocaleString("en-US",{timeZone:"Africa/Casablanca"}));
  const todayStr=`${_dCas.getFullYear()}-${String(_dCas.getMonth()+1).padStart(2,"0")}-${String(_dCas.getDate()).padStart(2,"0")}`;

  // 1. Candles locales OHLCV
  let local=[];
  try{
    const r=await fetch(`./pipeline/candles/${sym}.json?t=${Math.floor(Date.now()/900000)}`);
    if(r.ok){const data=await r.json();local=Array.isArray(data)?data:(data.candles||[]);}
  }catch{}

  // 2. Si les candles locales ne couvrent pas aujourd'hui → enrichir avec Médias24 (15 jours)
  const lastLocal=local.length>0?local[local.length-1].d:"";
  if(local.length>=5&&lastLocal<todayStr){
    try{
      /* Enrichissement borné à 4 s. Médias24 passe par des proxies CORS
         publics : quand ils ne répondent pas, l'appel a été mesuré à 38 s.
         Le graphique restait alors vide en permanence — l'effet React se
         relance à chaque rafraîchissement des cours et annulait la requête
         avant qu'elle n'aboutisse. Les chandelles locales portent déjà la
         dernière clôture ; l'enrichissement est un bonus, pas une dépendance. */
      const fresh=await Promise.race([
        fetchMed24Raw(sym,15),
        new Promise(res=>setTimeout(()=>res(null),4000))
      ]);
      if(fresh&&fresh.length>0){
        const map={};
        local.forEach(c=>map[c.d]=c);
        // Ajouter les jours nouveaux (ne pas écraser les OHLCV réels locaux)
        fresh.forEach(c=>{if(!map[c.d])map[c.d]=c;});
        local=Object.values(map).sort((a,b)=>a.d.localeCompare(b.d));
      }
    }catch{}
  }

  // 3. Filtrer par fenêtre temporelle et convertir au format ApexCharts
  if(local.length>=5){
    const cutoff=new Date();cutoff.setDate(cutoff.getDate()-days);
    const filtered=local.filter(c=>new Date(c.d)>=cutoff);
    if(filtered.length>=5){
      let prevClose=null;
      return filtered.map(c=>{
        const o=c.o!=null?c.o:(prevClose!=null?prevClose:c.c);
        const h=c.h!=null?c.h:Math.max(o,c.c);
        const l=c.l!=null?c.l:Math.min(o,c.c);
        const ts=new Date(c.d).getTime();
        prevClose=c.c;
        return{x:ts,y:[o,h,l,c.c],vol:c.v||0};
      });
    }
  }

  // 4. Secours total : Médias24 (close uniquement)
  return fetchMed24History(sym,days);
}

// ── MARKET STATUS (BVC Casablanca, UTC+1 toute l'année) ───────────────────────
function getMarketStatus(){
  const d=new Date(new Date().toLocaleString("en-US",{timeZone:"Africa/Casablanca"}));
  const day=d.getDay(); // 0=dim, 6=sam
  if(day===0||day===6)return{label:"FERMÉ",color:"#ff4f5a",isOpen:false};
  const tot=d.getHours()*60+d.getMinutes();
  if(tot>=560&&tot<570)return{label:"PRÉ-OUVERTURE",color:"#ffd740",isOpen:false};  // 9h20-9h30
  if(tot>=570&&tot<930)return{label:"OUVERT",color:"#00e5a0",isOpen:true};           // 9h30-15h30
  if(tot>=930&&tot<940)return{label:"POST-CLÔTURE",color:"#4db8ff",isOpen:false};   // 15h30-15h40
  if(tot>=940)return{label:"CLÔTURE",color:"#ffd740",isOpen:false};                  // 15h40 → fin journée
  return{label:"FERMÉ",color:"#ff4f5a",isOpen:false};
}

const CBC_BASE="https://www.casablanca-bourse.com/bourseweb";
async function fetchMASI(){
  // 1. Casablanca Bourse officielle — Cours-Indices.aspx (scraping HTML)
  try{
    const html=await bvcGetHTML(`${CBC_BASE}/Cours-Indices.aspx`);
    if(html){
      const doc=new DOMParser().parseFromString(html,"text/html");
      const rows=doc.querySelectorAll("tr");
      for(const row of rows){
        const cells=[...row.querySelectorAll("td")];
        const labelCell=cells.find(c=>c.textContent.trim().toUpperCase().includes("MASI"));
        if(labelCell){
          // La valeur est généralement dans la cellule suivante ou celle d'après
          for(let i=cells.indexOf(labelCell)+1;i<cells.length;i++){
            const raw=cells[i].textContent.replace(/\s/g,"").replace(",",".");
            const v=parseFloat(raw);
            if(v>10000&&v<25000){
              // Chercher la variation dans les cellules restantes
              let c=0;
              for(let j=i+1;j<cells.length;j++){
                const vc=cells[j].textContent.replace(/\s/g,"").replace(",",".");
                const p=parseFloat(vc);
                if(!isNaN(p)&&Math.abs(p)<10)c=p;
              }
              return{value:v,chg:c,src:"CBC"};
            }
          }
        }
      }
    }
  }catch{}
  // 2. IDBourse — endpoint indices spécifique
  try{
    const data=await bvcGet(`${IDB_BASE}/api/proxy/get_indices`);
    if(Array.isArray(data)){
      const masi=data.find(d=>(d.code||d.ticker||d.symbol||d.name||"").toUpperCase().includes("MASI"));
      if(masi){
        const v=+(masi.cours||masi.valeur||masi.last||masi.value||0);
        const c=+(masi.variation||masi.chg||masi.change||0);
        if(v>0)return{value:v,chg:c,src:"IDB"};
      }
    }
  }catch{}
  // 3. IDBourse — scan get_all_data pour l'entrée MASI
  try{
    const data=await bvcGet(`${IDB_BASE}/api/proxy/get_all_data`);
    if(Array.isArray(data)){
      const e=data.find(d=>{
        const u=(d.url||"").toLowerCase();
        const n=(d.name||"").toUpperCase();
        return u.includes("/indices/masi")||u.includes("masi")||n==="MASI"||n.includes("MASI");
      });
      if(e&&e.dernier_cours)return{value:+e.dernier_cours,chg:e.variation!=null?+e.variation:0,src:"IDB"};
    }
  }catch{}
  // 4. Médias24 — méthode getIndexInfo
  try{
    const d=await bvcGet(`${MED_BASE}?method=getIndexInfo&index=MASI&format=json`);
    const r=d?.result;
    if(r?.valeur||r?.cours||r?.value){
      const v=+(r.valeur||r.cours||r.value);
      const c=+(r.variation||r.chg||0);
      if(v>0)return{value:v,chg:c,src:"M24"};
    }
  }catch{}
  // 5. Médias24 — historique MASI
  try{
    const to=new Date();const from=new Date(+to-2*86400000);
    const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const d=await bvcGet(`${MED_BASE}?method=getMASIHistory&from=${fmt(from)}&to=${fmt(to)}&format=json`);
    const recs=d?.result;
    if(Array.isArray(recs)&&recs.length>0){
      const last=recs[recs.length-1];
      const prev=recs.length>1?recs[recs.length-2]:null;
      const v=+(last.value||last.cours||0);
      const p=prev?+(prev.value||prev.cours||0):0;
      const c=p>0?+((v-p)/p*100).toFixed(2):0;
      if(v>0)return{value:v,chg:c,src:"M24"};
    }
  }catch{}
  return null;
}

// ── TECHNICAL CALCULATIONS ────────────────────────────────────────────────────
function calcRSI(closes,p=14){
  if(closes.length<p+1)return 50;
  let g=0,l=0;
  for(let i=1;i<=p;i++){const d=closes[i]-closes[i-1];if(d>0)g+=d;else l-=d;}
  let ag=g/p,al=l/p;
  for(let i=p+1;i<closes.length;i++){const d=closes[i]-closes[i-1];ag=(ag*(p-1)+Math.max(d,0))/p;al=(al*(p-1)+Math.max(-d,0))/p;}
  return al===0?100:+(100-100/(1+ag/al)).toFixed(1);
}

function calcMA(closes,p){
  return closes.map((_,i)=>i<p?null:+(closes.slice(i-p,i).reduce((a,b)=>a+b,0)/p).toFixed(2));
}

function calcFib(high,low){
  const d=high-low;
  return [0,0.236,0.382,0.5,0.618,0.786,1.0].map(r=>[r,+(low+d*r).toFixed(2)]);
}

function calcEMA(arr,p){
  if(arr.length<p)return arr.map(()=>null);
  const k=2/(p+1);const res=new Array(p-1).fill(null);
  let ema=arr.slice(0,p).reduce((a,b)=>a+b,0)/p;
  res.push(+ema.toFixed(3));
  for(let i=p;i<arr.length;i++){ema=arr[i]*k+ema*(1-k);res.push(+ema.toFixed(3));}
  return res;
}

function calcMACD(closes,fast=12,slow=26,sig=9){
  const emaF=calcEMA(closes,fast),emaS=calcEMA(closes,slow);
  const macdLine=emaF.map((f,i)=>f!==null&&emaS[i]!==null?+(f-emaS[i]).toFixed(3):null);
  const validPairs=macdLine.map((v,i)=>({v,i})).filter(x=>x.v!==null);
  const sigEma=calcEMA(validPairs.map(x=>x.v),sig);
  const sigLine=new Array(macdLine.length).fill(null);
  validPairs.forEach((x,j)=>{if(sigEma[j]!==null)sigLine[x.i]=sigEma[j];});
  const hist=macdLine.map((m,i)=>m!==null&&sigLine[i]!==null?+(m-sigLine[i]).toFixed(3):null);
  return{macd:macdLine,signal:sigLine,hist};
}

function calcBollinger(closes,period=20,mult=2){
  const upper=[],middle=[],lower=[];
  for(let i=0;i<closes.length;i++){
    if(i<period-1){upper.push(null);middle.push(null);lower.push(null);continue;}
    const sl=closes.slice(i-period+1,i+1);
    const avg=sl.reduce((a,b)=>a+b,0)/period;
    const std=Math.sqrt(sl.reduce((a,b)=>a+(b-avg)**2,0)/period);
    upper.push(+(avg+mult*std).toFixed(2));
    middle.push(+avg.toFixed(2));
    lower.push(+(avg-mult*std).toFixed(2));
  }
  return{upper,middle,lower};
}

function calcIchimoku(candles){
  const highs=candles.map(c=>c.y[1]),lows=candles.map(c=>c.y[2]);
  const tenkan=[],kijun=[];
  for(let i=0;i<candles.length;i++){
    tenkan.push(i<8?null:+((Math.max(...highs.slice(i-8,i+1))+Math.min(...lows.slice(i-8,i+1)))/2).toFixed(2));
    kijun.push(i<25?null:+((Math.max(...highs.slice(i-25,i+1))+Math.min(...lows.slice(i-25,i+1)))/2).toFixed(2));
  }
  return{tenkan,kijun};
}

function calcSR(candles,price){
  if(candles.length<10)return{sup:[],res:[]};
  const highs=candles.map(c=>c.y[1]);
  const lows =candles.map(c=>c.y[2]);
  const n=candles.length,lb=3;
  const swH=[],swL=[];
  for(let i=lb;i<n-lb;i++){
    if(highs.slice(i-lb,i).every(h=>h<=highs[i])&&highs.slice(i+1,i+lb+1).every(h=>h<=highs[i]))swH.push(highs[i]);
    if(lows.slice(i-lb,i).every(l=>l>=lows[i])&&lows.slice(i+1,i+lb+1).every(l=>l>=lows[i]))swL.push(lows[i]);
  }
  function cluster(arr,tol=0.012){
    const s=[...arr].sort((a,b)=>a-b);const out=[];let i=0;
    while(i<s.length){
      let sum=s[i],cnt=1;
      while(i+cnt<s.length&&(s[i+cnt]-s[i])/s[i]<tol){sum+=s[i+cnt];cnt++;}
      out.push(+(sum/cnt).toFixed(2));i+=cnt;
    }
    return out;
  }
  const sup=cluster(swL).filter(v=>v<price*1.03).slice(-3);
  const res=cluster(swH).filter(v=>v>price*0.97).slice(0,3);
  return{sup,res};
}

const RSIGauge=({value})=>{
  const v=Math.min(100,Math.max(0,value||50));
  const color=v>70?"#ff4f5a":v<30?"#00e5a0":"#ffd740";
  const label=v>70?"SURACHETÉ":v<30?"SURVENDU":"NEUTRE";
  const a=-Math.PI+Math.PI*(v/100);
  const cx=60,cy=58,r=44;
  const ex=cx+r*Math.cos(a),ey=cy+r*Math.sin(a);
  return(
    <div style={{textAlign:"center"}}>
      <svg width="120" height="70" viewBox="0 0 120 75">
        <path d={`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`} fill="none" stroke="#1a2540" strokeWidth="10" strokeLinecap="round"/>
        <path d={`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${ex} ${ey}`} fill="none" stroke={color} strokeWidth="10" strokeLinecap="round"/>
        <circle cx={ex} cy={ey} r={5} fill={color}/>
        <text x={cx} y={cy+2} textAnchor="middle" fill={color} fontSize="17" fontWeight="700" fontFamily="var(--font)">{v.toFixed(0)}</text>
        <text x={cx} y={cy+16} textAnchor="middle" fill="#8892a4" fontSize="8" fontFamily="var(--font)">{label}</text>
      </svg>
      <div style={{fontSize:9,color:"#8892a4",marginTop:-6}}>RSI (14)</div>
    </div>
  );
};

const FibTable=({high,low,price})=>{
  const fibs=calcFib(high,low);
  return(
    <div>
      <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,marginBottom:8,textTransform:"uppercase"}}>Retracements Fibonacci</div>
      <div style={{fontSize:9,color:"#8892a4",marginBottom:4}}>Plage 90j: {px(low)} → {px(high)}</div>
      {fibs.map(([r,val])=>{
        const pctFromPrice=((val-price)/price*100).toFixed(1);
        const isNear=Math.abs(val-price)/price<0.03;
        return(
          <div key={r} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 0",borderBottom:"1px solid #0d1829",background:isNear?"rgba(255,215,64,.06)":"transparent"}}>
            <span style={{fontSize:10,color:"#ffd740",minWidth:36,fontWeight:isNear?700:400}}>{r===0?"0.0":r===1?"1.0":r}</span>
            <div style={{flex:1,background:"#0a1220",borderRadius:2,height:3}}>
              <div style={{width:`${Math.max(0,(val-low)/(high-low)*100)}%`,height:"100%",background:isNear?"#ffd740":"#ffd74040"}}/>
            </div>
            <span style={{fontSize:11,color:isNear?"#ffd740":"#c8d3e8",minWidth:60,textAlign:"right",fontWeight:isNear?700:400}}>{px(val)}</span>
            <span style={{fontSize:10,color:pctFromPrice>0?"#00e5a0":"#ff4f5a",minWidth:44,textAlign:"right"}}>{pctFromPrice>0?"+":""}{pctFromPrice}%</span>
            {isNear&&<span style={{fontSize:9,color:"#ffd740"}}>◀</span>}
          </div>
        );
      })}
    </div>
  );
};

// ── STOCK CHART — Chandeliers + Volume + MACD ─────────────────────────────────
const StockChart=({r})=>{
  const refMain=useRef(null),refVol=useRef(null),refMacd=useRef(null),refTooltip=useRef(null);
  const chartMain=useRef(null),chartVol=useRef(null),chartMacd=useRef(null);
  const syncing=useRef(false);
  const [period,setPeriod]=useState(()=>localStorage.getItem("bvc_period")||"3M");
  const [liveCandles,setLiveCandles]=useState(null);
  const [isLive,setIsLive]=useState(false);
  const [showBB,setShowBB]=useState(false);
  const [showIchi,setShowIchi]=useState(false);
  const [showSR,setShowSR]=useState(true);
  const sym=r.symbol||r.ticker;
  const rangeMap={"5J":"5d","1M":"1mo","3M":"3mo","6M":"6mo","1A":"1y"};
  const toDate=ts=>{const d=new Date(ts);return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;};
  const mapS=(fn)=>liveCandles.map((c,i)=>{const v=fn(i);return v!=null?{time:toDate(c.x),value:v}:null;}).filter(Boolean);

  useEffect(()=>{
    let alive=true;
    setLiveCandles(null);setIsLive(false);
    fetchChart(sym,rangeMap[period]||"3mo").then(c=>{
      if(alive&&c){
        // Injecter la bougie du jour si la dernière candle est antérieure à aujourd'hui
        const cur=r.price||r.prix||0;
        if(c.length>0&&cur>0){
          const now=new Date(new Date().toLocaleString("en-US",{timeZone:"Africa/Casablanca"}));
          const todayStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
          const todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
          const lastCandle=c[c.length-1];
          const lastDate=new Date(lastCandle.x);
          const lastDateStr=`${lastDate.getUTCFullYear()}-${String(lastDate.getUTCMonth()+1).padStart(2,"0")}-${String(lastDate.getUTCDate()).padStart(2,"0")}`;
          if(lastDateStr<todayStr&&now.getDay()!==0&&now.getDay()!==6){
            const prevClose=lastCandle.y[3];
            const openPrice=r.open||r.ouverture||prevClose;
            c.push({x:todayStart,y:[+openPrice.toFixed(2),+Math.max(openPrice,cur).toFixed(2),+Math.min(openPrice,cur).toFixed(2),+cur.toFixed(2)],vol:r.vol||0,live:true});
          }
        }
        setLiveCandles(c);setIsLive(true);
      }
    });
    return()=>{alive=false;};
  },[sym,period,r.live,r.price,r.vol]);

  useEffect(()=>{
    [chartMain,chartVol,chartMacd].forEach(ref=>{if(ref.current){ref.current.remove();ref.current=null;}});
    if(!refMain.current||!refVol.current||!refMacd.current)return;
    if(!liveCandles||liveCandles.length<5){
      refMain.current.innerHTML='<div style="height:220px;display:flex;align-items:center;justify-content:center;color:#8892a4;font-size:12px;font-family:var(--font)">Données historiques non disponibles pour ce titre</div>';
      refVol.current.innerHTML='';refMacd.current.innerHTML='';
      return;
    }
    const candles=liveCandles;
    const closes=candles.map(c=>c.y[3]);
    const curPrice=closes[closes.length-1]||0;
    const ma20=calcMA(closes,20);
    const ma50=calcMA(closes,50);
    const macdData=calcMACD(closes);
    const bbData=calcBollinger(closes);
    const ichiData=calcIchimoku(candles);
    const srData=showSR?calcSR(candles,curPrice):{sup:[],res:[]};

    const lwData=candles.map(c=>({time:toDate(c.x),open:c.y[0],high:c.y[1],low:c.y[2],close:c.y[3]}));
    const LW=window.LightweightCharts;
    const W=refMain.current.offsetWidth||600;
    const baseOpts={
      layout:{background:{color:"#0d1829"},textColor:"#8892a4"},
      grid:{vertLines:{color:"#1a2540"},horzLines:{color:"#1a2540"}},
      crosshair:{mode:LW.CrosshairMode.Normal},
      timeScale:{timeVisible:false,borderColor:"#1a2540",fixRightEdge:true},
      handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:false},
      handleScale:{axisPressedMouseMove:{time:true,price:true},mouseWheel:true,pinch:true}
    };

    // ── Graphique principal : chandeliers + MA ──────────────
    const main=LW.createChart(refMain.current,{...baseOpts,width:W,height:220,rightPriceScale:{borderColor:"#1a2540"}});
    chartMain.current=main;
    const cs=main.addCandlestickSeries({upColor:"#00e5a0",downColor:"#ff4f5a",borderUpColor:"#00e5a0",borderDownColor:"#ff4f5a",wickUpColor:"#00e5a0",wickDownColor:"#ff4f5a"});
    cs.setData(lwData);
    main.addLineSeries({color:"#4db8ff",lineWidth:1.5,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false}).setData(mapS(i=>ma20[i]));
    main.addLineSeries({color:"#b388ff",lineWidth:1.5,lineStyle:LW.LineStyle.Dashed,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false}).setData(mapS(i=>ma50[i]));
    if(showBB){
      main.addLineSeries({color:"#ffd740",lineWidth:1,lineStyle:LW.LineStyle.Dashed,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false}).setData(mapS(i=>bbData.upper[i]));
      main.addLineSeries({color:"#ffd740",lineWidth:1,lineStyle:LW.LineStyle.Dashed,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false}).setData(mapS(i=>bbData.lower[i]));
    }
    if(showIchi){
      main.addLineSeries({color:"#ff6f40",lineWidth:1.5,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false}).setData(mapS(i=>ichiData.tenkan[i]));
      main.addLineSeries({color:"#66b0ff",lineWidth:1.5,lineStyle:LW.LineStyle.Dashed,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false}).setData(mapS(i=>ichiData.kijun[i]));
    }
    srData.sup.forEach(v=>cs.createPriceLine({price:v,color:"#00e5a060",lineWidth:1,lineStyle:LW.LineStyle.Dashed,title:`S ${v>=1000?v.toLocaleString("fr-FR"):v.toFixed(2)}`}));
    srData.res.forEach(v=>cs.createPriceLine({price:v,color:"#ff4f5a60",lineWidth:1,lineStyle:LW.LineStyle.Dashed,title:`R ${v>=1000?v.toLocaleString("fr-FR"):v.toFixed(2)}`}));

    main.subscribeCrosshairMove(param=>{
      if(!refTooltip.current)return;
      const bar=param.seriesData?.get(cs);
      if(!bar||!param.time){refTooltip.current.style.display="none";return;}
      const{open:o,high:h,low:l,close:c}=bar;
      const col=c>=o?"#00e5a0":"#ff4f5a";
      refTooltip.current.style.display="block";
      refTooltip.current.innerHTML=`<b style="color:#fff">${tk(r)}</b>&nbsp;<span style="color:#8892a4">O</span>&nbsp;<span style="color:#c8d3e8">${o}</span>&nbsp;<span style="color:#8892a4">H</span>&nbsp;<span style="color:${col}">${h}</span>&nbsp;<span style="color:#8892a4">L</span>&nbsp;<span style="color:#ff4f5a">${l}</span>&nbsp;<span style="color:#8892a4">C</span>&nbsp;<span style="color:${col};font-weight:700">${c}</span>`;
    });

    // ── Volume ──────────────────────────────────────────────
    const volChart=LW.createChart(refVol.current,{...baseOpts,width:W,height:65,rightPriceScale:{visible:false}});
    chartVol.current=volChart;
    volChart.addHistogramSeries({priceLineVisible:false,lastValueVisible:false}).setData(
      candles.map(c=>({time:toDate(c.x),value:c.vol||0,color:c.y[3]>=c.y[0]?"#00e5a045":"#ff4f5a45"}))
    );

    // ── MACD ────────────────────────────────────────────────
    const macdChart=LW.createChart(refMacd.current,{...baseOpts,width:W,height:80,timeScale:{...baseOpts.timeScale,timeVisible:true},rightPriceScale:{borderColor:"#1a2540"}});
    chartMacd.current=macdChart;
    macdChart.addLineSeries({color:"#4db8ff",lineWidth:1.5,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false}).setData(mapS(i=>macdData.macd[i]));
    macdChart.addLineSeries({color:"#ffd740",lineWidth:1.5,lineStyle:LW.LineStyle.Dashed,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false}).setData(mapS(i=>macdData.signal[i]));
    macdChart.addHistogramSeries({priceLineVisible:false,lastValueVisible:false}).setData(
      candles.map((c,i)=>macdData.hist[i]!=null?{time:toDate(c.x),value:macdData.hist[i],color:(macdData.hist[i]||0)>=0?"#00e5a045":"#ff4f5a45"}:null).filter(Boolean)
    );
    macdChart.addLineSeries({color:"#8892a440",lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false}).setData(mapS(()=>0));

    // ── Synchronisation des axes temporels ──────────────────
    const all=[main,volChart,macdChart];
    all.forEach(src=>{
      src.timeScale().subscribeVisibleLogicalRangeChange(range=>{
        if(syncing.current||!range)return;
        syncing.current=true;
        all.filter(t=>t!==src).forEach(t=>t.timeScale().setVisibleLogicalRange(range));
        syncing.current=false;
      });
    });
    main.timeScale().fitContent();

    // ── Responsive resize ───────────────────────────────────
    const ro=new ResizeObserver(([e])=>{
      const w=Math.floor(e.contentRect.width);
      if(w<50)return;
      all.forEach(chart=>chart.applyOptions({width:w}));
    });
    ro.observe(refMain.current.parentElement||refMain.current);

    return()=>{
      ro.disconnect();
      [chartMain,chartVol,chartMacd].forEach(ref=>{if(ref.current){ref.current.remove();ref.current=null;}});
    };
  },[sym,period,liveCandles,showBB,showIchi,showSR]);

  const changePeriod=(p)=>{setPeriod(p);localStorage.setItem("bvc_period",p);};

  return(
    <div>
      <div style={{display:"flex",gap:6,marginBottom:6,alignItems:"center"}}>
        <span style={{fontSize:10,color:"#8892a4"}}>PÉRIODE</span>
        {["5J","1M","3M","6M","1A"].map(p=>(
          <button key={p} onClick={()=>changePeriod(p)} style={{background:period===p?"rgba(77,184,255,.15)":"transparent",border:period===p?"1px solid rgba(77,184,255,.4)":"1px solid #1a2540",color:period===p?"#4db8ff":"#8892a4",padding:"2px 8px",borderRadius:3,fontSize:10}}>{p}</button>
        ))}
        <span style={{color:"#1a2540",margin:"0 2px"}}>|</span>
        <button onClick={()=>setShowBB(v=>!v)} title="Bollinger Bands (20,2)" style={{background:showBB?"rgba(255,215,64,.15)":"transparent",border:showBB?"1px solid rgba(255,215,64,.4)":"1px solid #1a2540",color:showBB?"#ffd740":"#8892a4",padding:"2px 8px",borderRadius:3,fontSize:10}}>BB</button>
        <button onClick={()=>setShowIchi(v=>!v)} title="Ichimoku (Tenkan 9 / Kijun 26)" style={{background:showIchi?"rgba(255,111,64,.15)":"transparent",border:showIchi?"1px solid rgba(255,111,64,.4)":"1px solid #1a2540",color:showIchi?"#ff6f40":"#8892a4",padding:"2px 8px",borderRadius:3,fontSize:10}}>ICHI</button>
        <button onClick={()=>setShowSR(v=>!v)} title="Support / Résistance (swing highs & lows)" style={{background:showSR?"rgba(0,229,160,.12)":"transparent",border:showSR?"1px solid rgba(0,229,160,.4)":"1px solid #1a2540",color:showSR?"#00e5a0":"#8892a4",padding:"2px 8px",borderRadius:3,fontSize:10}}>S/R</button>
        <span style={{marginLeft:"auto",fontSize:9,color:isLive?"#00e5a0":"#8892a4"}}>
          {isLive&&"● "}RSI:{(r.rsi||r.rsi14||50).toFixed(0)} · MA20:{px(r.ma20||0)} · MA50:{px(r.ma50||0)}
        </span>
      </div>
      <div style={{position:"relative"}}>
        <div ref={refMain}/>
        <div ref={refTooltip} style={{display:"none",position:"absolute",top:4,left:4,background:"rgba(13,24,41,.92)",border:"1px solid #1a2540",borderRadius:4,padding:"4px 8px",fontSize:10,fontFamily:"var(--font)",pointerEvents:"none",zIndex:10,whiteSpace:"nowrap"}}/>
      </div>
      <div style={{fontSize:8,color:"#8892a4",letterSpacing:1,marginTop:2}}>VOLUME</div>
      <div ref={refVol}/>
      <div style={{fontSize:8,color:"#8892a4",letterSpacing:1,marginTop:2}}>MACD (12,26,9) · <span style={{color:"#4db8ff"}}>MACD</span> · <span style={{color:"#ffd740"}}>Signal</span></div>
      <div ref={refMacd}/>
    </div>
  );
};

// ── TICKER TAPE ───────────────────────────────────────────────────────────────
const TickerTape=({rows})=>{
  const items=rows.filter(r=>r.price>0).slice(0,40);
  if(items.length===0)return null;
  const nc=c=>c>0?"#00e5a0":c<0?"#ff4f5a":"#8892a4";
  const doubled=[...items,...items];
  return(
    <div style={{background:"#060b16",borderBottom:"1px solid #1a2540",padding:"4px 0",overflow:"hidden",userSelect:"none"}}>
      <div className="ticker-inner">
        {doubled.map((r,i)=>(
          <span key={i} style={{display:"inline-flex",alignItems:"center",marginRight:24,gap:4,fontSize:11,whiteSpace:"nowrap"}}>
            <span style={{color:"#2a3550",fontSize:8}}>◆</span>
            <span style={{color:"#c8d3e8",fontWeight:600,letterSpacing:.5}}>{tk(r)}</span>
            <span style={{color:"#4db8ff"}}>{(r.price||0).toFixed(2)}</span>
            <span style={{color:nc(r.chg)}}>{r.chg>0?"▲":"▼"}{Math.abs(r.chg||0).toFixed(2)}%{r.chg_alert&&<span title="Variation ≥ ±8% — approche limite BVC">⚡</span>}</span>
          </span>
        ))}
      </div>
    </div>
  );
};

              l'utilisateur croit le bouton cassé. */}
          <button onClick={onRefresh} disabled={loading} title="Recharger data.json depuis le serveur"
                  style={{background:"rgba(77,184,255,.12)",border:"1px solid rgba(77,184,255,.35)",color:"#4db8ff",borderRadius:4,padding:"5px 14px",fontSize:12,opacity:loading?.7:1,cursor:loading?"default":"pointer"}}>
            {loading?"↻ Chargement…":"↻ Actualiser"}</button>
          {majMsg&&<span style={{fontSize:10,color:majMsg.neuf?"#00e5a0":"#8892a4",whiteSpace:"nowrap"}}>{majMsg.texte}</span>}
          {fetchErr&&<span style={{fontSize:10,color:"#ff4f5a",marginLeft:8}}>⚠️ Données live indisponibles — affichage statique</span>}
        </div>
        <div style={{textAlign:"right",fontSize:11}}>
          <div style={{color:"#8892a4"}}>BVC · {STATIC.length} titres</div>
          <div style={{color:"#ffd740"}}>{META.msgs} msgs · {META.years} ans · {META.signals} signaux</div>
        </div>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{background:tab===t.id?"rgba(0,229,160,.15)":"transparent",border:tab===t.id?"1px solid rgba(0,229,160,.5)":"1px solid #1a2540",color:tab===t.id?"#00e5a0":"#8892a4",padding:"5px 16px",borderRadius:4,fontSize:12,letterSpacing:1,fontWeight:tab===t.id?600:400,transition:"all .15s",position:"relative"}}>
            {t.label}
            {t.badge&&<span style={{position:"absolute",top:-7,right:-7,background:"#ffd740",color:"#080d1a",borderRadius:"50%",width:16,height:16,fontSize:9,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{t.badge}</span>}
          </button>
        ))}
      </div>
    </div>
  );
};

// ── RANKING ───────────────────────────────────────────────────────────────────
// ── HEATMAP SECTORIELLE ───────────────────────────────────────────────────────
const Heatmap=({rows,setSel,setTab})=>{
  const [hov,setHov]=useState(null);
  const chgClr=v=>v>0?`rgba(0,229,160,${Math.min(.15+v/3*.5,.65)})`:v<0?`rgba(255,79,90,${Math.min(.15+(-v)/3*.5,.65)})`:"#0d1829";
  const sectors=useMemo(()=>{
    const map={};
    rows.filter(r=>r.price>0).forEach(r=>{
      const s=r.sector||"Autre";
      if(!map[s])map[s]=[];
      map[s].push(r);
    });
    return Object.entries(map)
      .sort((a,b)=>b[1].reduce((s,r)=>s+(r.cap||0),0)-a[1].reduce((s,r)=>s+(r.cap||0),0))
      .map(([name,rs])=>({name,rows:rs.sort((a,b)=>(b.cap||0)-(a.cap||0)),avgChg:rs.reduce((s,r)=>s+(r.chg||0),0)/rs.length}));
  },[rows]);
  return(
    <div>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16,flexWrap:"wrap"}}>
        <span style={{fontSize:14,fontWeight:700,color:"#c8d3e8",letterSpacing:.5}}>HEATMAP SECTORIELLE</span>
        <span style={{fontSize:11,color:"#8892a4"}}>{rows.filter(r=>r.price>0).length} titres · VAR% journalière</span>
        <div style={{marginLeft:"auto",display:"flex",gap:6,alignItems:"center",fontSize:11}}>
          <span style={{background:"rgba(255,79,90,.45)",borderRadius:3,padding:"2px 8px",color:"#ff4f5a",fontWeight:600}}>Baisse</span>
          <span style={{background:"#131b2e",border:"1px solid #1a2540",borderRadius:3,padding:"2px 8px",color:"#8892a4"}}>Neutre</span>
          <span style={{background:"rgba(0,229,160,.45)",borderRadius:3,padding:"2px 8px",color:"#00e5a0",fontWeight:600}}>Hausse</span>
        </div>
      </div>
      {sectors.map(sec=>(
        <div key={sec.name} style={{marginBottom:16}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,paddingLeft:2}}>
            <span style={{fontSize:10,color:"#8892a4",letterSpacing:1,textTransform:"uppercase",fontWeight:600}}>{sec.name}</span>
            {sec.avgChg!==0&&<span style={{fontSize:9,color:sec.avgChg>0?"#00e5a0":"#ff4f5a"}}>
              {sec.avgChg>0?"▲":"▼"} {Math.abs(sec.avgChg).toFixed(2)}% moy.
            </span>}
            <span style={{fontSize:9,color:"#2a3550"}}>{sec.rows.length}×</span>
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
            {sec.rows.map(r=>{
              const sym=r.symbol||r.ticker;
              const isH=hov===sym;
              const chg=r.chg||0;
              return(
                <div key={sym}
                  onClick={()=>{setSel(sym);setTab("detail");}}
                  onMouseEnter={()=>setHov(sym)}
                  onMouseLeave={()=>setHov(null)}
                  title={`${r.name||sym} · ${px(r.price||0)} · ${chg>0?"▲":"▼"}${Math.abs(chg).toFixed(2)}% · v5.3=${r.v53?.toFixed(2)}`}
                  style={{background:chgClr(chg),border:`1px solid ${isH?"#c8d3e8":"rgba(255,255,255,.04)"}`,borderRadius:5,padding:"7px 10px",minWidth:88,cursor:"pointer",transition:"border-color .12s,transform .1s",transform:isH?"scale(1.05)":"scale(1)"}}>
                  <div style={{fontSize:12,fontWeight:700,color:"#fff",marginBottom:1}}>{tk(r)}</div>
                  <div style={{fontSize:10,color:"rgba(200,211,232,.7)",marginBottom:1}}>{px(r.price||0)}</div>
                  <div style={{fontSize:11,fontWeight:700,color:chg>0?"#00e5a0":chg<0?"#ff4f5a":"#8892a4"}}>
                    {chg>0?"▲":chg<0?"▼":"—"}{Math.abs(chg).toFixed(2)}%
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      ))}
      <div style={{marginTop:12,fontSize:10,color:"#4a5570",borderTop:"1px solid #0d1829",paddingTop:8}}>
        Clic sur une cellule → vue détaillée · Trié par capitalisation · Couleur = variation journalière
      </div>
    </div>
  );
};

const Ranking=({rows,sort,setSort,setSel,setTab,fav=[],toggleFav=()=>{},isWatchlist=false,scoreMode})=>{
  const [search,setSearch]=useState("");
  const [sector,setSector]=useState("ALL");
  const [group,setGroup]=useState("ALL"); // ALL = 77 titres / MASI1 = 19 tickers NLP
  const [sigFilter,setSigFilter]=useState(null);
  const [rsiZone,setRsiZone]=useState(null);
  const customMode=scoreMode&&!(scoreMode.f&&scoreMode.n&&scoreMode.t);
  const NLP_TICKERS=new Set(["CMT","SMI","CASH","MNG","AKD","SOT","SGTM","MSA","CFGB","RIS","ADI","VCNE","CMGP","CSR","TGCC","ADH","SRM","SNA","RDS"]);
  const sectors=useMemo(()=>["ALL",...new Set(rows.map(r=>r.sector).filter(Boolean).sort())],[rows]);

  const filtered=useMemo(()=>{
    let r=rows;
    if(group==="MASI1") r=r.filter(x=>NLP_TICKERS.has(x.symbol||x.ticker||""));
    if(sector!=="ALL") r=r.filter(x=>x.sector===sector);
    if(search.trim()){
      const q=search.trim().toUpperCase();
      r=r.filter(x=>(x.symbol||x.ticker||"").includes(q)||tk(x).includes(q)||(x.name||"").toUpperCase().includes(q));
    }
    if(sigFilter) r=r.filter(x=>(x.sig||"").startsWith(sigFilter));
    if(rsiZone==="survendu") r=r.filter(x=>(x.rsi||x.rsi14||50)<30);
    if(rsiZone==="surachete") r=r.filter(x=>(x.rsi||x.rsi14||50)>70);
    return r;
  },[rows,sector,search,group,sigFilter,rsiZone]);

  const sorted=useMemo(()=>[...filtered].sort((a,b)=>{
    if(sort==="az")  return (a.name||a.symbol||"").localeCompare(b.name||b.symbol||"","fr");
    if(sort==="v53") return computeDisplayScore(b,scoreMode)-computeDisplayScore(a,scoreMode);
    if(sort==="bvc") return b.bvc-a.bvc;
    if(sort==="delta") return b.delta-a.delta;
    if(sort==="nlp") return b.nlp-a.nlp;
    if(sort==="var") return b.chg-a.chg;
    if(sort==="alpha") return b.alpha-a.alpha;
    if(sort==="rsi") return (a.rsi||a.rsi14||50)-(b.rsi||b.rsi14||50);
    return 0;
  }),[filtered,sort,scoreMode]);
  const SORTS=[["az","A → Z"],["v53",customMode?"SCORE PERSO":("SCORE v5.3")],["bvc","BVC"],["delta","DELTA"],["nlp","NLP"],["var","VAR%"],["alpha","ALPHA"],["rsi","RSI"]];
  const scoreColLabel=customMode?scoreModeLabel(scoreMode):"SCORE";
  const HEADS=["#","TICKER","OUVERT","CLÔT.","VAR%","PE","DIV%","BVC",scoreColLabel,"Δ","NLP%","WIN","ALPHA","RSI","SIGNAL","POIDS"];
  if(isWatchlist&&rows.length===0) return(
    <div style={{textAlign:"center",padding:"60px 20px",color:"#8892a4"}}>
      <div style={{fontSize:52,marginBottom:16,color:"#2a3550"}}>★</div>
      <div style={{fontSize:16,marginBottom:8,color:"#c8d3e8"}}>Aucun favori</div>
      <div style={{fontSize:12}}>Cliquez sur ☆ dans le classement pour suivre un titre</div>
    </div>
  );
  return(
    <div>
      {/* ── Barre de recherche + filtre secteur ─────────────── */}
      <div style={{display:"flex",gap:8,marginBottom:10,alignItems:"center",flexWrap:"wrap"}}>
        <input
          value={search} onChange={e=>setSearch(e.target.value)}
          placeholder="Rechercher ticker ou nom…"
          style={{background:"#0d1829",border:"1px solid #1a2540",color:"#c8d3e8",borderRadius:4,padding:"5px 10px",fontSize:12,fontFamily:"var(--font)",width:220,outline:"none"}}
        />
        <select value={sector} onChange={e=>setSector(e.target.value)}
          style={{background:"#0d1829",border:"1px solid #1a2540",color:"#8892a4",borderRadius:4,padding:"5px 8px",fontSize:11,fontFamily:"var(--font)",cursor:"pointer"}}>
          {sectors.map(s=><option key={s} value={s}>{s==="ALL"?`Tous (${rows.length})`:s}</option>)}
        </select>
        {/* Filtre NLP group */}
        <div style={{display:"flex",gap:4,background:"#0a1220",borderRadius:4,padding:2,border:"1px solid #1a2540"}}>
          {[["MASI1","MASI 1 · NLP","#00e5a0"],["ALL","ÉLARGI","#4db8ff"]].map(([g,lbl,c])=>(
            <button key={g} onClick={()=>setGroup(g)} style={{fontSize:10,fontWeight:600,padding:"3px 10px",borderRadius:3,border:"none",cursor:"pointer",background:group===g?`${c}18`:"transparent",color:group===g?c:"#8892a4",transition:"all .2s"}}>{lbl}</button>
          ))}
        </div>
        {(search||sector!=="ALL"||sigFilter||rsiZone)&&<button onClick={()=>{setSearch("");setSector("ALL");setSigFilter(null);setRsiZone(null);}} style={{fontSize:10,color:"#ff4f5a",border:"1px solid #ff4f5a30",borderRadius:3,padding:"3px 8px",background:"transparent"}}>✕ Réinitialiser</button>}
        <span style={{marginLeft:"auto",fontSize:11,color:"#8892a4"}}>{sorted.length}/{group==="MASI1"?19:rows.length} titres{group==="MASI1"&&<span style={{color:"#00e5a0",marginLeft:4}}>NLP ✓</span>}</span>
        <button onClick={()=>{
          const cols=["TICKER BVC","CODE INTERNE","NOM","SECTEUR","PRIX","VAR%","PE","DIV%","RSI","SCORE","SIGNAL","ALPHA","WIN%","BVC"];
          const rows_csv=sorted.map(r=>[tk(r),r.symbol,r.name||"",r.sector||"",r.price||"",r.chg||"",r.pe?.toFixed(1)||"",r.div?.toFixed(2)||"",r.rsi?.toFixed(1)||"",computeDisplayScore(r,scoreMode).toFixed(2),r.sig||"",r.alpha||"",r.win||"",r.bvc?.toFixed(2)||""]);
          const csv="﻿"+[cols,...rows_csv].map(r=>r.join(";")).join("\n");
          const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
          const url=URL.createObjectURL(blob);
          const a=document.createElement("a");
          a.href=url; a.download=`bvc_${new Date().toISOString().slice(0,10)}.csv`;
          document.body.appendChild(a); a.click();
          document.body.removeChild(a); URL.revokeObjectURL(url);
        }} style={{fontSize:10,padding:"3px 10px",borderRadius:3,border:"1px solid #4db8ff40",color:"#4db8ff",background:"transparent",cursor:"pointer",letterSpacing:.5}}>
          ↓ CSV
        </button>
      </div>
      {/* ── Screener : filtres signal + RSI ──────────────────── */}
      <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:10,alignItems:"center"}}>
        <span style={{fontSize:10,color:"#8892a4",letterSpacing:.5,marginRight:2}}>SIGNAL</span>
        {[["ACHAT FORT","#00e5a0"],["ACHETER","#4db8ff"],["SURVEILLER","#ffd740"],["ATTENDRE","#ff8f00"],["ÉVITER","#ff4f5a"]].map(([s,c])=>(
          <button key={s} onClick={()=>setSigFilter(sigFilter===s?null:s)}
            style={{fontSize:10,padding:"3px 10px",borderRadius:12,border:`1px solid ${sigFilter===s?c:c+"35"}`,color:sigFilter===s?"#080d1a":c,background:sigFilter===s?c:"transparent",cursor:"pointer",fontFamily:"var(--font)",transition:"all .15s",fontWeight:sigFilter===s?700:400}}>
            {s}
          </button>
        ))}
        <span style={{marginLeft:8,fontSize:10,color:"#8892a4",letterSpacing:.5}}>RSI</span>
        {[["survendu","<30 survendu","#00e5a0"],["surachete",">70 suracheté","#ff4f5a"]].map(([z,lbl,c])=>(
          <button key={z} onClick={()=>setRsiZone(rsiZone===z?null:z)}
            style={{fontSize:10,padding:"3px 10px",borderRadius:12,border:`1px solid ${rsiZone===z?c:c+"35"}`,color:rsiZone===z?"#080d1a":c,background:rsiZone===z?c:"transparent",cursor:"pointer",fontFamily:"var(--font)",transition:"all .15s",fontWeight:rsiZone===z?700:400}}>
            {lbl}
          </button>
        ))}
      </div>
      {/* ── Tri ────────────────────────────────────────────────── */}
      <div style={{display:"flex",gap:8,marginBottom:14,alignItems:"center",flexWrap:"wrap"}}>
        <span style={{fontSize:12,color:"#8892a4",letterSpacing:1}}>TRIER PAR</span>
        {SORTS.map(([id,lbl])=>(
          <button key={id} onClick={()=>setSort(id)} style={{background:sort===id?"rgba(0,229,160,.12)":"transparent",border:sort===id?"1px solid rgba(0,229,160,.4)":"1px solid #1a2540",color:sort===id?"#00e5a0":"#8892a4",padding:"3px 10px",borderRadius:4,fontSize:11}}>{lbl}{sort===id?" ▼":""}</button>
        ))}
      </div>
      {customMode&&<div style={{marginBottom:10,padding:"6px 12px",background:"rgba(255,215,64,.07)",border:"1px solid rgba(255,215,64,.25)",borderRadius:5,display:"flex",alignItems:"center",gap:8,fontSize:11}}>
        <span style={{color:"#ffd740",fontWeight:700}}>✱ MODE PERSONNALISÉ</span>
        <span style={{color:"#8892a4"}}>Score affiché :</span>
        <span style={{color:"#ffd740"}}>{scoreModeLabel(scoreMode)}</span>
        <span style={{color:"#4a5570",fontSize:10}}>— Le score composite officiel et les signaux restent inchangés</span>
      </div>}
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",minWidth:1220}}>
          <thead>
            <tr style={{borderBottom:"2px solid #1a2540"}}>
              {HEADS.map(h=><th key={h} style={{padding:"8px 8px",fontSize:10,color:"#8892a4",textAlign:"left",letterSpacing:.4,whiteSpace:"nowrap",fontWeight:500}}>{h}</th>)}
            </tr>
          </thead>
          <tbody>
            {sorted.map((r,i)=>{
              const s=SS(r.sig);const sym=r.symbol||r.ticker;
              const displayScore=computeDisplayScore(r,scoreMode);
              const rsiVal=r.rsi||r.rsi14||50;
              const rsiColor=rsiVal>70?"#ff4f5a":rsiVal<30?"#00e5a0":"#ffd740";
              /* indicateurs tech estimés : MA20 = MA50 (données live non encore reçues) */
              const isStat=r.ma20>0&&r.ma50>0&&Math.abs(r.ma20-r.ma50)<0.01;
              return(
                <tr key={sym} onClick={()=>{setSel(sym);setTab("detail");}}
                  style={{borderBottom:"1px solid #0d1829",cursor:"pointer",transition:"background .12s"}}
                  onMouseEnter={e=>e.currentTarget.style.background="rgba(255,255,255,.025)"}
                  onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  <td style={{padding:"8px 8px",fontSize:12,color:"#8892a4"}}>{i+1}</td>
                  <td style={{padding:"10px 8px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <CompanyLogo sym={tk(r)} sector={r.sector} size={46}/>
                      <div style={{minWidth:0}}>
                        <div style={{display:"flex",alignItems:"center",gap:5}}>
                          <span style={{fontSize:16,color:"#fff",fontWeight:800,letterSpacing:.3}}>{tk(r)}</span>
                          {r.warn&&<span title={r.warnMsg} style={{fontSize:10,cursor:"help"}}>⚠️</span>}
                          {isStat&&<span title="Indicateurs techniques estimés — données live en attente" style={{fontSize:9,color:"#8892a4",border:"1px solid #1a2540",borderRadius:2,padding:"1px 3px",cursor:"default"}}>~stat</span>}
                          <button onClick={e=>{e.stopPropagation();toggleFav(sym);}} title={fav.includes(sym)?"Retirer des favoris":"Ajouter aux favoris"}
                            style={{fontSize:14,color:fav.includes(sym)?"#ffd740":"#2a3550",border:"none",background:"none",cursor:"pointer",padding:"0 1px",lineHeight:1,transition:"color .15s"}}>
                            {fav.includes(sym)?"★":"☆"}
                          </button>
                        </div>
                        {r.name&&<div style={{fontSize:12,color:"#c8d3e8",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:160,marginTop:1}}>{r.name}</div>}
                        <div style={{fontSize:10,color:"#6b7a99",marginTop:1}}>{r.sector}</div>
                      </div>
                    </div>
                  </td>
                  <td style={{padding:"8px 8px",fontSize:12,color:"#8892a4"}}>{px(r.open||+(( r.price||r.prix)/(1+(r.chg||0)/100)).toFixed(0))}</td>
                  <td style={{padding:"8px 8px",fontSize:13,color:"#c8d3e8",fontWeight:600}}>
                    {px(r.price||r.prix||r.close)}<Perime r={r}/>
                    {r.live&&<span style={{fontSize:8,color:"#00e5a0",marginLeft:3,verticalAlign:"super"}}>●</span>}
                  </td>
                  <td style={{padding:"8px 8px",fontSize:13,color:VC(r.chg),fontWeight:600}}>{r.chg>0?"▲":r.chg<0?"▼":"—"} {Math.abs(r.chg||0).toFixed(2)}%{r.chg_alert&&<span title="Variation ≥ ±8% — approche limite BVC" style={{marginLeft:3}}>⚡</span>}</td>
                  <td style={{padding:"8px 8px",fontSize:12,color:r.pe>25?"#ff8f00":"#c8d3e8"}}>{r.pe?.toFixed(1)||"—"}</td>
                  <td style={{padding:"8px 8px",fontSize:12,color:r.div>4?"#00e5a0":"#c8d3e8"}}>{r.div?.toFixed(1)||"—"}%</td>
                  <td style={{padding:"8px 8px",fontSize:13,color:SC(r.bvc)}}>{fmt(r.bvc)}</td>
                  <td style={{padding:"8px 8px"}}>
                    <div style={{fontSize:15,color:meta(r).conf<=1?"#8892a4":SC(displayScore),fontWeight:700,marginBottom:2}}>{fmt(displayScore)}{customMode&&<span style={{fontSize:8,color:"#ffd740",marginLeft:3,verticalAlign:"super"}}>✱</span>}</div>
                    <Bar v={displayScore||0} c={SC(displayScore)} h={4}/>
                  </td>
                  <td style={{padding:"8px 8px"}}><Delta d={customMode?(r.bvc!=null?+(displayScore-r.bvc).toFixed(2):null):r.delta}/></td>
                  <td style={{padding:"8px 8px",fontSize:13,color:NC(r.nlp),fontWeight:600}}>{r.nlp>0?"+":""}{(r.nlp*100).toFixed(0)}%</td>
                  <td style={{padding:"8px 8px",fontSize:12,color:r.win>=80?"#00e5a0":r.win>=70?"#ffd740":"#ff8f00",fontWeight:600}}>{r.win!=null?`${r.win}%`:"—"}</td>
                  <td style={{padding:"8px 8px",fontSize:12,color:r.alpha>=0?"#00e5a0":"#ff4f5a",fontWeight:600}}>{r.alpha!=null?<>{r.alpha>0?"+":""}{r.alpha}%{r.alpha<0&&<span style={{fontSize:10}}>⚠️</span>}</>:"—"}</td>
                  <td style={{padding:"8px 8px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:5}}>
                      <span style={{fontSize:12,color:isStat?"#8892a4":rsiColor,fontWeight:700}}>{isStat?"~":""}{rsiVal}</span>
                      {!isStat&&<div style={{width:30,background:"#0a1220",borderRadius:2,height:4}}>
                        <div style={{width:`${rsiVal}%`,height:"100%",background:rsiColor,borderRadius:2}}/>
                      </div>}
                    </div>
                  </td>
                  <td style={{padding:"8px 8px"}}>{meta(r).conf<=1
                    ? <Chip label="Données insuffisantes" bg="rgba(136,146,164,.12)" fg="#8892a4" bd="#2a3550"/>
                    : <Chip label={r.sig} bg={s.bg} fg={s.fg} bd={s.bd}/>}</td>
                  <td style={{padding:"8px 8px",minWidth:85}}>
                    {r.poids&&<WBar f={r.poids.f} n={r.poids.n} t={r.poids.t}/>}
                    {r.poids&&<div style={{fontSize:9,color:"#8892a4",marginTop:2}}>F{r.poids.f}·N{r.poids.n}·T{r.poids.t}</div>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div style={{marginTop:12,padding:"10px 14px",background:"#0d1829",border:"1px solid #1a2540",borderRadius:6,fontSize:11,color:"#8892a4",lineHeight:1.9}}>
        <span style={{color:"#00e5a0"}}>●</span> SCORE = Tech×25% + Fond×47% + NLP×28% (moteur v6.4) &nbsp;|&nbsp;
        <span style={{color:"#ffd740"}}>●</span> WIN = probabilité de surperformance 1 mois ({META.signals} signaux · {META.years} ans) &nbsp;|&nbsp;
        <span style={{color:"#b388ff"}}>●</span> Δ = différence SCORE vs BVC fondamental &nbsp;|&nbsp;
        <span style={{color:"#8892a4"}}>~stat</span> = indicateurs techniques estimés (RSI/MA calculés dès la prochaine mise à jour) &nbsp;|&nbsp;
        <span style={{color:"#ff4f5a"}}>⚠️</span> Alpha/RSI rouge = prudence &nbsp;|&nbsp; PE = Price/Earnings · DIV = dividende &nbsp;|&nbsp; Clic → vue détaillée
      </div>
    </div>
  );
};

// ── TICKER NEWS (inline dans Detail) ─────────────────────────────────────────
const TickerNews=({sym})=>{
  const [articles,setArticles]=useState([]);
  const [ok,setOk]=useState(false);
  useEffect(()=>{
    fetch("news.json?t="+Math.floor(Date.now()/3600000))
      .then(r=>r.ok?r.json():null)
      .then(d=>{if(d?.articles)setArticles((d.articles||[]).filter(a=>(a.tickers||[]).includes(sym)).slice(0,6));setOk(true);})
      .catch(()=>setOk(true));
  },[sym]);
  const SC=s=>s==="POSITIF"?"#00e5a0":s==="NEGATIF"?"#ff4f5a":"#8892a4";
  const fmtD=iso=>{try{return new Date(iso).toLocaleString("fr-FR",{timeZone:"Africa/Casablanca",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}catch{return "";}};
  if(!ok||articles.length===0)return null;
  return(
    <div style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12}}>
      <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,marginBottom:10,textTransform:"uppercase"}}>Actualités — {sym}</div>
      {articles.map(a=>(
        <a key={a.id} href={a.url} target="_blank" rel="noopener noreferrer"
          style={{display:"block",paddingLeft:8,paddingBottom:8,marginBottom:8,borderBottom:"1px solid #0a1220",borderLeft:`2px solid ${SC(a.sentiment)}`,textDecoration:"none"}}>
          <div style={{fontSize:11,color:"#c8d3e8",lineHeight:1.4,marginBottom:3}}>{a.title}</div>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <span style={{fontSize:9,color:SC(a.sentiment),fontWeight:700}}>{a.sentiment||"NEUTRE"}</span>
            <span style={{fontSize:9,color:"#8892a4"}}>{a.source}</span>
            <span style={{fontSize:9,color:"#2a3550",marginLeft:"auto"}}>{fmtD(a.date)}</span>
          </div>
        </a>
      ))}
    </div>
  );
};

// ── DETAIL ────────────────────────────────────────────────────────────────────
const Detail=({rows,sel,setSel,fav=[],toggleFav=()=>{}})=>{
  const [detSearch,setDetSearch]=useState("");
  const r=rows.find(x=>(x.symbol||x.ticker)===sel)||rows[0];
  const s=SS(r.sig);
  const price=r.price||r.prix;
  const h90=r.h90||r.high90;const l90=r.l90||r.low90;
  /* Les objectifs sont nullifiés côté pipeline quand ils ne sont plus à
     l'échelle du cours (opération sur titres, cible périmée). Sans garde,
     `null - price` valait 0 et l'écart s'affichait -100%. */
  const objectifs=r.bear!=null&&r.base!=null&&r.bull!=null;
  const ecart=v=>v==null||!price?"—":`${((v-price)/price*100).toFixed(1)}%`;
  const upside=objectifs?((r.bull-price)/price*100).toFixed(1):null;
  const pos=objectifs&&r.bull!==r.bear
    ?Math.min(98,Math.max(2,(price-r.bear)/(r.bull-r.bear)*100)):50;
  const sym=r.symbol||r.ticker;
  const rsiVal=r.rsi||r.rsi14||50;

  const visRows=detSearch.trim()
    ? rows.filter(d=>{const q=detSearch.trim().toUpperCase();return (d.symbol||d.ticker||"").includes(q)||tk(d).includes(q)||(d.name||"").toUpperCase().includes(q);})
    : rows;

  return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:8,alignItems:"center",flexWrap:"wrap"}}>
        <input value={detSearch} onChange={e=>setDetSearch(e.target.value)}
          placeholder="Filtrer ticker…"
          style={{background:"#0d1829",border:"1px solid #1a2540",color:"#c8d3e8",borderRadius:4,padding:"4px 8px",fontSize:11,fontFamily:"var(--font)",width:160,outline:"none"}}/>
        {detSearch&&<button onClick={()=>setDetSearch("")} style={{fontSize:10,color:"#8892a4",border:"none",background:"transparent"}}>✕</button>}
      </div>
      <div style={{display:"flex",gap:4,marginBottom:14,flexWrap:"wrap",maxHeight:96,overflowY:"auto",padding:"4px 0"}}>
        {visRows.map(d=>{const sym2=d.symbol||d.ticker;const ds=SS(d.sig);const a=sel===sym2;return(
          <button key={sym2} onClick={()=>setSel(sym2)} style={{background:a?ds.bg:"transparent",border:a?`1px solid ${ds.bd}`:"1px solid #1a2540",color:a?ds.fg:"#8892a4",padding:"2px 7px",borderRadius:3,fontSize:10,fontWeight:a?700:400,transition:"all .15s"}}>{tk(d)}</button>
        );})}
      </div>
      {r.warn&&<div style={{background:"rgba(255,215,64,.08)",border:"1px solid rgba(255,215,64,.3)",borderRadius:6,padding:"10px 14px",marginBottom:12,fontSize:13,color:"#ffd740"}}>⚠️ {r.warnMsg}</div>}

      <div className="detail-grid">
        {/* LEFT */}
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {/* Score card */}
          <div style={{background:`linear-gradient(135deg,${s.bg},#0d1829)`,border:`1px solid ${s.bd}`,borderRadius:8,padding:16,textAlign:"center"}}>
            <div style={{display:"flex",justifyContent:"center",marginBottom:10}}>
              <CompanyLogo sym={tk(r)} sector={r.sector} size={56}/>
            </div>
            <div style={{fontSize:12,color:"#8892a4",letterSpacing:2,marginBottom:4,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              <span>{tk(r)} · {px(price)} DH<Perime r={r}/> <span style={{color:VC(r.chg),fontWeight:600}}>{r.chg>0?"▲":"▼"} {Math.abs(r.chg).toFixed(2)}%{r.chg_alert&&<span title="Variation ≥ ±8% — approche limite BVC" style={{marginLeft:3}}>⚡</span>}</span></span>
              <button onClick={()=>toggleFav(sym)} title={fav.includes(sym)?"Retirer des favoris":"Ajouter aux favoris"}
                style={{fontSize:18,color:fav.includes(sym)?"#ffd740":"#2a3550",border:"none",background:"none",cursor:"pointer",padding:"0 2px",lineHeight:1,transition:"color .2s"}}>
                {fav.includes(sym)?"★":"☆"}
              </button>
            </div>
            {/* Le score reste affiché même à faible confiance — mais en gris,
                pour qu'il ne se lise pas comme une conclusion (CLAUDE.md). */}
            <div style={{fontSize:52,fontWeight:700,
                 color:meta(r).conf<=1?"#8892a4":s.fg,
                 textShadow:meta(r).conf<=1?"none":`0 0 30px ${s.fg}40`,
                 lineHeight:1}}>{fmt(r.v53)}</div>
            <div style={{fontSize:11,color:"#8892a4",margin:"4px 0 6px"}}>Score composite / 10</div>
            <div style={{marginBottom:10}}><Confiance r={r} sz={13}/></div>
            {/* Un signal calculé sur des données de repli induit en erreur :
                à confiance ≤ 1 on l'annonce comme tel plutôt que d'afficher
                un ACHETER que rien ne soutient (règle CLAUDE.md). */}
            {meta(r).conf<=1
              ? <Chip label="Données insuffisantes" bg="rgba(136,146,164,.12)" fg="#8892a4" bd="#2a3550" sz={12}/>
              : <Chip label={r.sig} bg={s.bg} fg={s.fg} bd={s.bd} sz={12}/>}
            <div style={{marginTop:8,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              <Delta d={r.delta}/><span style={{fontSize:11,color:"#8892a4"}}>vs BVC {fmt(r.bvc)}</span>
            </div>
          </div>

          {/* Fundamentaux */}
          <div style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12}}>
            <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,marginBottom:10,textTransform:"uppercase"}}>Fondamentaux</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
              {[["PE Ratio",r.pe?.toFixed(1)||"—",r.pe>25?"#ff8f00":"#c8d3e8"],["P/Book",r.pb?.toFixed(2)||"—","#c8d3e8"],["Dividende",r.div?`${r.div.toFixed(1)}%`:"—",r.div>4?"#00e5a0":"#c8d3e8"],["Cap. Boursière",r.cap?fmtM(r.cap):"—","#4db8ff"],["Upside Base",ecart(r.base),r.base!=null&&((r.base-price)/price)>0?"#00e5a0":"#ff4f5a"],["Alpha 12M",`${r.alpha>0?"+":""}${r.alpha}%`,r.alpha>=0?"#00e5a0":"#ff4f5a"]].map(([k,v,c])=>(
                <div key={k} style={{background:"#0a1220",borderRadius:4,padding:"6px 8px"}}>
                  <div style={{fontSize:8,color:"#8892a4",marginBottom:2,textTransform:"uppercase"}}>{k}</div>
                  <div style={{fontSize:13,color:c,fontWeight:700}}>{v}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Fondamentaux prévisionnels — IDBourse DATA+.
              Bloc distinct, jamais fondu dans celui du dessus : ces ratios
              portent sur le bénéfice ATTENDU, ceux du dessus sur le réalisé.
              Un PER de 7 réalisé et 29 attendu ne se contredisent pas, ils
              disent que le bénéfice est prévu en baisse. Le libellé et la date
              d'export sont affichés pour que la distinction se lise. */}
          {r.fwd&&(
          <div style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:10,gap:8,flexWrap:"wrap"}}>
              <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,textTransform:"uppercase"}}>Prévisionnel <span style={{color:"#4db8ff"}}>IDBourse DATA+</span></div>
              {/* Date d'export en entier, année comprise : l'export est
                  rafraîchi à la main et vieillit. « 01/07 » seul ne dit pas
                  qu'il a sept semaines, « 01/07/2026 » le laisse voir. */}
              <div style={{fontSize:9,color:"#8892a4"}}>estimations · export du {r.fwd.asof?r.fwd.asof.split("-").reverse().join("/"):"—"}</div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
              {[["PER 2026e",fmt(r.fwd.per_26e,1),r.fwd.per_26e>25?"#ff8f00":"#c8d3e8"],
                ["PER 2027e",fmt(r.fwd.per_27e,1),r.fwd.per_27e>25?"#ff8f00":"#c8d3e8"],
                ["Rendement 2026e",r.fwd.dy_26e!=null?`${fmt(r.fwd.dy_26e,1)}%`:"—",r.fwd.dy_26e>4?"#00e5a0":"#c8d3e8"],
                ["Rendement 2027e",r.fwd.dy_27e!=null?`${fmt(r.fwd.dy_27e,1)}%`:"—",r.fwd.dy_27e>4?"#00e5a0":"#c8d3e8"],
                ["ROE 2025",r.fwd.roe_25!=null?`${fmt(r.fwd.roe_25,1)}%`:"—",r.fwd.roe_25>=0?"#c8d3e8":"#ff4f5a"],
                ["Marge nette 2025",r.fwd.marge_nette_25!=null?`${fmt(r.fwd.marge_nette_25,1)}%`:"—",r.fwd.marge_nette_25>=0?"#c8d3e8":"#ff4f5a"]].map(([k,v,c])=>(
                <div key={k} style={{background:"#0a1220",borderRadius:4,padding:"6px 8px"}}>
                  <div style={{fontSize:8,color:"#8892a4",marginBottom:2,textTransform:"uppercase"}}>{k}</div>
                  <div style={{fontSize:13,color:c,fontWeight:700}}>{v}</div>
                </div>
              ))}
            </div>
            <div style={{fontSize:9,color:"#8892a4",marginTop:9,lineHeight:1.5}}>
              Estimations d'analystes, non retenues dans le score. Un tiret signale
              une valeur écartée comme invraisemblable.
            </div>
          </div>)}

          {/* RSI + NLP */}
          <div style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,marginBottom:6,textTransform:"uppercase"}}>Indicateurs Techniques</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:6}}>
                  {[["MA20",px(r.ma20||0),"#4db8ff"],["MA50",px(r.ma50||0),"#b388ff"],["MA200",r.ma200?px(r.ma200):"—","#ff9800"]].map(([k,v,c])=>(
                    <div key={k} style={{background:"#0a1220",borderRadius:4,padding:"5px 7px"}}>
                      <div style={{fontSize:8,color:"#8892a4",marginBottom:1}}>{k}</div>
                      <div style={{fontSize:12,color:c,fontWeight:700}}>{v}</div>
                    </div>
                  ))}
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                  {[["Haut 90j",px(h90),"#00e5a0"],["H 52s",r.h52w?px(r.h52w):"—","#00e5a0"],["Bas 90j",px(l90),"#ff4f5a"],["B 52s",r.l52w?px(r.l52w):"—","#ff4f5a"]].map(([k,v,c])=>(
                    <div key={k} style={{background:"#0a1220",borderRadius:4,padding:"5px 7px"}}>
                      <div style={{fontSize:8,color:"#8892a4",marginBottom:1}}>{k}</div>
                      <div style={{fontSize:12,color:c,fontWeight:700}}>{v}</div>
                    </div>
                  ))}
                </div>
                {/* Indicateurs avancés si disponibles dans data.json */}
                {(r.macd!=null||r.bb_upper!=null||r.stoch_k!=null)&&(
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:5,marginTop:6}}>
                    {r.macd!=null&&(
                      <div style={{background:"#0a1220",borderRadius:4,padding:"5px 7px"}}>
                        <div style={{fontSize:8,color:"#8892a4",marginBottom:1}}>MACD</div>
                        <div style={{fontSize:11,color:r.macd>0?"#00e5a0":"#ff4f5a",fontWeight:700}}>{r.macd>0?"+":""}{r.macd?.toFixed(2)}</div>
                        <div style={{fontSize:9,color:"#8892a4"}}>{r.macd>0&&r.macd>(r.macd_signal||0)?"haussier":"baissier"}</div>
                      </div>
                    )}
                    {r.bb_upper!=null&&(
                      <div style={{background:"#0a1220",borderRadius:4,padding:"5px 7px"}}>
                        <div style={{fontSize:8,color:"#8892a4",marginBottom:1}}>BB(20,2)</div>
                        <div style={{fontSize:10,color:"#ffd740",fontWeight:700}}>{px(r.bb_upper)}</div>
                        <div style={{fontSize:9,color:"#8892a4"}}>{px(r.bb_lower)}</div>
                      </div>
                    )}
                    {r.stoch_k!=null&&(
                      <div style={{background:"#0a1220",borderRadius:4,padding:"5px 7px"}}>
                        <div style={{fontSize:8,color:"#8892a4",marginBottom:1}}>STOCH</div>
                        <div style={{fontSize:11,color:r.stoch_k>80?"#ff4f5a":r.stoch_k<20?"#00e5a0":"#ffd740",fontWeight:700}}>{r.stoch_k?.toFixed(0)}</div>
                        <div style={{fontSize:9,color:"#8892a4"}}>{r.stoch_k>80?"survente":r.stoch_k<20?"survente":"neutre"}</div>
                      </div>
                    )}
                  </div>
                )}
                {/* OBV + ADX depuis candles OHLCV longues */}
                {(r.obv!=null||r.adx!=null)&&(
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5,marginTop:6}}>
                    {r.obv!=null&&(
                      <div style={{background:"#0a1220",borderRadius:4,padding:"5px 7px"}}>
                        <div style={{fontSize:8,color:"#8892a4",marginBottom:1}}>OBV</div>
                        <div style={{fontSize:11,color:r.obv>0?"#00e5a0":"#ff4f5a",fontWeight:700}}>{r.obv>0?"+":""}{(r.obv/1000).toFixed(0)}K</div>
                        <div style={{fontSize:9,color:"#8892a4"}}>{r.obv>0?"pression achat":"pression vente"}</div>
                      </div>
                    )}
                    {r.adx!=null&&(
                      <div style={{background:"#0a1220",borderRadius:4,padding:"5px 7px"}}>
                        <div style={{fontSize:8,color:"#8892a4",marginBottom:1}}>ADX(14)</div>
                        <div style={{fontSize:11,color:r.adx>25?"#ffd740":"#8892a4",fontWeight:700}}>{r.adx?.toFixed(0)}{r.adx_pdi!=null?` +${r.adx_pdi?.toFixed(0)}`:""}{r.adx_mdi!=null?`/-${r.adx_mdi?.toFixed(0)}`:""}</div>
                        <div style={{fontSize:9,color:"#8892a4"}}>{r.adx>40?"tendance forte":r.adx>25?"tendance":r.adx>20?"émergente":"range"}{r.adx_pdi>r.adx_mdi?" ▲":" ▼"}</div>
                      </div>
                    )}
                  </div>
                )}
              </div>
              <RSIGauge value={rsiVal}/>
            </div>
          </div>

          {/* NLP */}
          <div style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12}}>
            <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,marginBottom:8,textTransform:"uppercase"}}>NLP — {META.tickers} tickers ({META.years} ans)</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
              {[["Biais groupe",r.biais,NC(r.nlp)],["Smart Sentiment",`${r.nlp>0?"+":""}${(r.nlp*100).toFixed(0)}%`,NC(r.nlp)],["Win rate 6M",r.win!=null?`${r.win}%`:"—",r.win>=80?"#00e5a0":"#ffd740"],["Convergence",r.conv==="CONFIRME"?"✅ OK":"⚠️ Div.",r.conv==="CONFIRME"?"#00e5a0":"#ffd740"]].map(([k,v,c])=>(
                <div key={k} style={{background:"#0a1220",borderRadius:4,padding:"6px 8px"}}>
                  <div style={{fontSize:8,color:"#8892a4",marginBottom:2,textTransform:"uppercase"}}>{k}</div>
                  <div style={{fontSize:12,color:c,fontWeight:700}}>{v}</div>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* RIGHT */}
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {/* Chart */}
          <div style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12}}>

            <div style={{fontSize:9,color:"#8892a4",marginTop:6}}>
              <span style={{color:"#4db8ff"}}>── MA20</span> &nbsp; <span style={{color:"#b388ff"}}>── MA50</span> &nbsp; <span style={{color:"#00e5a0"}}>── S support</span> &nbsp; <span style={{color:"#ff4f5a"}}>── R résistance</span> &nbsp; | <span style={{color:"#00e5a0"}}>●</span> IDBourse / Médias24
            </div>
          </div>

          {/* Fibonacci */}
          <div style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12}}>

          {/* Scénarios */}
          <div style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12}}>
            <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,marginBottom:10,textTransform:"uppercase"}}>Scénarios Prix (fondamentaux)</div>
            {!objectifs&&<div style={{fontSize:11,color:"#ff8f00",marginBottom:10}}>Objectifs indisponibles — cible périmée écartée</div>}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
              {[["BEAR",r.bear,"#ff4f5a",ecart(r.bear)],["BASE",r.base,"#ffd740",ecart(r.base)],["BULL",r.bull,"#00e5a0",upside==null?"—":`+${upside}%`]].map(([lbl,val,c,pct])=>(
                <div key={lbl} style={{background:"#0a1220",borderRadius:6,padding:"10px 8px",border:`1px solid ${c}20`,textAlign:"center"}}>
                  <div style={{fontSize:9,color:"#8892a4",marginBottom:3,letterSpacing:1}}>{lbl}</div>
                  <div style={{fontSize:18,fontWeight:700,color:c,marginBottom:2}}>{px(val)}</div>
                  <div style={{fontSize:11,color:c}}>{pct}</div>
                </div>
              ))}

              <span>Bear {px(r.bear)}</span><span style={{color:"#ffd740",fontWeight:600}}>▲ {px(price)} DH</span><span>Bull {px(r.bull)}</span>
            </div>
          </div>

          {/* Setup + formule */}
          <div style={{background:"#0d1829",border:"1px solid #1a2540",borderRadius:8,padding:12,fontFamily:"var(--font)",fontSize:12,lineHeight:1.9}}>
            <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
              {[[`Setup: ${r.setup||"—"}`,"#ffd740"],[`Flags: ${(r.flags||0)===0?"✅ 0":"⚠️ "+(r.flags||0)}`,(r.flags||0)>=3?"#ff4f5a":(r.flags||0)>=1?"#ffd740":"#00e5a0"],[r.poids?`Fond:${r.poids.f}% NLP:${r.poids.n}% Tech:${r.poids.t}%`:"Poids: —","#8892a4"]].map(([lbl,c])=>(

const NewsFeed=()=>{
  const [allNews,setAllNews]=useState([]);

  const [scope,setScope]=useState("ALL");   // ALL | MAROC | INTERNATIONAL
  const [ticker,setTicker]=useState("ALL");

  const [total,setTotal]=useState(0);

  useEffect(()=>{
    fetch("news.json?t="+Math.floor(Date.now()/3600000))
      .then(r=>r.ok?r.json():null)
      .then(d=>{if(d?.articles){setAllNews(d.articles);setUpdated(d.updated||null);setTotal(d.count||d.articles.length);}setLoading(false);})
      .catch(()=>setLoading(false));
  },[]);

  const SC=s=>s==="POSITIF"?"#00e5a0":s==="NEGATIF"?"#ff4f5a":"#8892a4";
  const SBG=s=>s==="POSITIF"?"rgba(0,229,160,.1)":s==="NEGATIF"?"rgba(255,79,90,.1)":"rgba(136,146,164,.08)";
  const fmtD=iso=>{try{return new Date(iso).toLocaleString("fr-FR",{timeZone:"Africa/Casablanca",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}catch{return iso||"";}};
  const fmtFull=iso=>{try{return new Date(iso).toLocaleString("fr-FR",{timeZone:"Africa/Casablanca",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}catch{return iso||"";}};

  /* La portée géographique est posée par article dans news.json, comme sur le
     radar. Elle était auparavant déduite de la catégorie — « geopolitique » et
     « commodites » réputées internationales, tout le reste marocain — ce qui
     confondait le SUJET et le PAYS : « le taux d'emprunt des États-Unis au
     plus haut », relayé par BourseNews en catégorie « bvc », comptait comme
     marocain. Le radar a été corrigé le 19/08 mais pas cet onglet, d'où deux
     décomptes contradictoires : le radar affichait 90 articles internationaux
     sur une fenêtre de trois jours quand le moteur n'en comptait que 88 sur
     la totalité. Un sous-ensemble ne peut pas être plus grand que le tout.
     Un article d'archive sans `scope` retombe sur l'ancienne règle, le temps
     qu'il expire. */
  const INTL_CATS=new Set(["geopolitique","commodites"]);
  const estIntl=a=>a.scope?a.scope==="INTL":INTL_CATS.has(a.category||"economie");
  const CAT_LABEL={"bvc":"BVC","economie":"Éco","macro":"Macro","geopolitique":"Géopolitique","commodites":"Matières 1ères"};

  const scopeFiltered=useMemo(()=>{
    if(scope==="MAROC")         return allNews.filter(a=>!estIntl(a));
    if(scope==="INTERNATIONAL") return allNews.filter(a=> estIntl(a));
    return allNews;
  },[allNews,scope]);

  const tickersList=useMemo(()=>{
    const s=new Set();
    scopeFiltered.forEach(a=>(a.tickers||[]).forEach(t=>s.add(t)));
    return["ALL",...[...s].sort()];
  },[scopeFiltered]);

  const filtered=useMemo(()=>
    ticker==="ALL"?scopeFiltered:scopeFiltered.filter(a=>(a.tickers||[]).includes(ticker))
  ,[scopeFiltered,ticker]);

  const sentPos=scopeFiltered.filter(a=>a.sentiment==="POSITIF").length;
  const sentNeg=scopeFiltered.filter(a=>a.sentiment==="NEGATIF").length;

  const changeScope=s=>{setScope(s);setTicker("ALL");};

  if(loading)return<div style={{textAlign:"center",padding:"80px 20px",color:"#8892a4",fontSize:13}}>Chargement des actualités…</div>;

  if(allNews.length===0)return(
    <div style={{textAlign:"center",padding:"80px 20px",color:"#8892a4"}}>
      <div style={{fontSize:44,marginBottom:16,color:"#2a3550",letterSpacing:4}}>FIL VIDE</div>

        Le workflow <code style={{background:"#0d1829",padding:"1px 6px",borderRadius:3,color:"#4db8ff"}}>fetch_news.yml</code> doit s'exécuter pour générer <code style={{background:"#0d1829",padding:"1px 6px",borderRadius:3,color:"#4db8ff"}}>news.json</code>.<br/>
        Déclenchement : automatique lun–ven toutes les 2h, ou manuel via GitHub Actions.
      </div>
    </div>
  );

  const nMaroc=allNews.filter(a=>!estIntl(a)).length;
  const nIntl =allNews.filter(a=> estIntl(a)).length;

  return(
    <div>
      {/* Sélecteur national / international */}

            style={{
              flex:1,padding:"9px 10px",borderRadius:6,cursor:"pointer",

              border:scope===id?`1px solid ${color}60`:"1px solid #1a2540",

            }}>
            {label}
            <span style={{marginLeft:6,fontSize:10,opacity:.7}}>{count}</span>
          </button>
        ))}
      </div>

      {/* Stats bar */}

          <span style={{marginLeft:"auto",fontSize:11,color:"#8892a4"}}>{filtered.length} article{filtered.length!==1?"s":""}</span>
        </div>

      {/* Liste articles */}
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {filtered.map(a=>{
          const catColor=CAT_COLOR[a.category||"economie"]||"#8892a4";

          return(
            <a key={a.id} href={a.url} target="_blank" rel="noopener noreferrer"

              onMouseEnter={e=>e.currentTarget.style.background="#0f1e30"}
              onMouseLeave={e=>e.currentTarget.style.background="#0d1829"}>
              <div style={{display:"flex",justifyContent:"space-between",gap:12,marginBottom:5,flexWrap:"wrap"}}>
                <div style={{fontSize:13,color:"#c8d3e8",fontWeight:600,lineHeight:1.4,flex:1}}>{a.title}</div>
                <span style={{fontSize:10,color:"#8892a4",whiteSpace:"nowrap",flexShrink:0}}>{fmtD(a.date)}</span>
              </div>
              {a.summary&&<div style={{fontSize:11,color:"#8892a4",lineHeight:1.6,marginBottom:7}}>{a.summary.slice(0,240)}{a.summary.length>240?"…":""}</div>}
              <div style={{display:"flex",gap:5,alignItems:"center",flexWrap:"wrap"}}>
                <span style={{background:SBG(a.sentiment),border:`1px solid ${SC(a.sentiment)}35`,borderRadius:3,padding:"1px 7px",fontSize:9,color:SC(a.sentiment),fontWeight:700,letterSpacing:.5}}>{a.sentiment||"NEUTRE"}</span>
                {catLabel&&<span style={{background:`${catColor}15`,border:`1px solid ${catColor}30`,borderRadius:3,padding:"1px 6px",fontSize:9,color:catColor,letterSpacing:.5}}>{catLabel}</span>}
                {(a.tickers||[]).map(t=>(
                  <span key={t} style={{background:"rgba(77,184,255,.1)",border:"1px solid rgba(77,184,255,.25)",borderRadius:3,padding:"1px 6px",fontSize:9,color:"#4db8ff",fontWeight:600}}>{t}</span>
                ))}
                <span style={{fontSize:10,color:"#8892a4",marginLeft:"auto"}}>{a.source}</span>
              </div>
            </a>
          );
        })}
      </div>
    </div>
  );
};

// ── SCORE PERSONNALISÉ ────────────────────────────────────────────────────────
// Recalcule un score d'affichage selon les composantes actives (F/N/T)
// Ne modifie PAS le score v5.3 stocké — lecture seule des sous-scores
function computeDisplayScore(r, mode) {
  if (!mode || (mode.f && mode.n && mode.t)) return r.v53; // complet → v5.3 intact
  const sf = r.bvc ?? 5;                                   // Fondamental (0-10)
  const sn = ((r.nlp || 0) + 1) * 5;                      // NLP [-1,+1] → [0,10]
  const st = r.score_tech != null
    ? r.score_tech
    : Math.min(10, Math.max(0, (r.rsi || r.rsi14 || 50) / 10)); // fallback RSI/10
  const wf = mode.f ? (r.poids?.f || 47) : 0;
  const wn = mode.n ? (r.poids?.n || 28) : 0;
  const wt = mode.t ? (r.poids?.t || 25) : 0;
  const total = wf + wn + wt;
  if (total === 0) return 0;
  return +Math.min(10, Math.max(0, (sf*wf + sn*wn + st*wt) / total)).toFixed(2);
}

function scoreModeLabel(mode) {
  if (!mode || (mode.f && mode.n && mode.t)) return "COMPLET";
  const parts = [];
  if (mode.f) parts.push("FOND");
  if (mode.n) parts.push("NLP");
  if (mode.t) parts.push("TECH");
  if (parts.length === 0) return "—";
  return parts.join(" + ");
}
