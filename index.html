// Fetch helper: essaie direct puis via proxy CORS
async function bvcGet(url){
  try{const r=await fetch(url,{cache:"no-store"});if(r.ok)return r.json();}catch{}
  for(const proxy of PROXY_LIST){
    try{const r=await fetch(proxy+encodeURIComponent(url),{cache:"no-store"});if(r.ok)return r.json();}catch{}
  }
  return null;
}

// IDBourse: tous les tickers en un seul appel
async function fetchIDB(){
  const data=await bvcGet(`${IDB_BASE}/api/proxy/get_all_data`);
  if(!Array.isArray(data)||data.length===0)return null;
  const out={};
  data.forEach(d=>{
    if(!d.dernier_cours)return;
    // Extraire le code BVC depuis l'URL (.../instruments/CSR → "CSR")
    const url=d.url||"";
    const fromUrl=url.includes("/instruments/")?url.split("/instruments/").pop().toUpperCase():"";
    let sym=fromUrl&&CONFIG.ISIN_MAP[fromUrl]?fromUrl:null;
    if(!sym){const n=(d.name||"").toUpperCase();sym=CONFIG.IDB_NAME_MAP[n]||n;}
    if(!CONFIG.ISIN_MAP[sym])return;
    // volume_en_titres: "3 726" (espaces insécables) → entier
    const volStr=String(d.volume_en_titres||"0").replace(/[ \s,]/g,"");
    const vol=volStr&&volStr!=="0"?Math.round(parseFloat(volStr))||0:0;
    // ouverture: "181,10" (virgule décimale française) → float
    const opnStr=String(d.ouverture||"").replace(",",".");
    const open=opnStr?parseFloat(opnStr)||null:null;
    out[sym]={price:+d.dernier_cours,chg:d.variation!=null?+d.variation:0,open,close:+d.dernier_cours,vol,live:true,src:"IDBourse"};
  });
  return Object.keys(out).length>0?out:null;
}

// Médias24: cours individuel par ISIN
async function fetchMed24Quote(sym){
  const isin=CONFIG.ISIN_MAP[sym];if(!isin)return null;
  const data=await bvcGet(`${MED_BASE}?method=getStockInfo&ISIN=${isin}&format=json`);
  const r=data?.result;if(!r)return null;
  const price=r.cours?+r.cours:null;
  if(!price||isNaN(price))return null;
  return{price,chg:r.variation?+r.variation:0,open:r.ouverture?+r.ouverture:price,close:price,live:true,src:"Médias24"};
}

// Médias24: historique OHLCV pour graphique (format: {date,value,max,min,volume})
async function fetchMed24History(sym,days){
  const isin=CONFIG.ISIN_MAP[sym];if(!isin)return null;
  const to=new Date();const from=new Date(+to-days*86400000);
  const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const data=await bvcGet(`${MED_BASE}?method=getPriceHistory&ISIN=${isin}&from=${fmt(from)}&to=${fmt(to)}&format=json`);
  const recs=data?.result;if(!Array.isArray(recs)||recs.length<5)return null;
  const candles=[];let prevClose=null;
  recs.forEach(rec=>{
    const raw=rec.date||"";
    let ts;
    if(raw.includes("/")){const[d,m,y]=raw.split("/");ts=new Date(+y,+m-1,+d).getTime();}
    else{ts=new Date(raw).getTime();}
    if(!ts||isNaN(ts))return;
    const c=+(rec.value||0),h=+(rec.max||rec.value)||c,l=+(rec.min||rec.value)||c;
    if(!c||c<=0)return;
    const o=prevClose!=null?prevClose:c; // open = veille clôture → couleurs rouge/vert correctes
    const vol=+(rec.volume||rec.vol||0);
    candles.push({x:ts,y:[o,Math.max(h,o,c),Math.min(l,o,c),c],vol});
    prevClose=c;
  });
  return candles.length>=5?candles:null;
}

  const yfSym=CONFIG.YF_MAP[sym]||`${sym}.CS`;
  const data=await bvcGet(`${YF_BASE}/v8/finance/chart/${yfSym}?interval=1d&range=${range||"3mo"}&events=div`);
  const res=data?.chart?.result?.[0];if(!res)return null;
  const ts=res.timestamp||[];const q=res.indicators?.quote?.[0]||{};
  const candles=ts.map((t,i)=>({x:t*1000,y:[q.open?.[i],q.high?.[i],q.low?.[i],q.close?.[i]].map(v=>v!=null?+v.toFixed(2):null),vol:q.volume?.[i]||0})).filter(c=>c.y.every(v=>v!=null)&&c.y[1]>=c.y[2]&&c.y[0]>0);
  return candles.length>=5?candles:null;
}

// fetchQuotes: IDBourse (batch) → patch Médias24 si chg=0 → Médias24 complet → Yahoo Finance
async function fetchQuotes(){
  const out={};
  const idb=await fetchIDB();
  if(idb){
    Object.assign(out,idb);
    // Patch Médias24 pour les tickers où IDB renvoie chg=0 (cours figé/clôture)
    const mkt=getMarketStatus();
    if(mkt.isOpen){
      const stale=Object.entries(out).filter(([,v])=>v.chg===0||v.chg==null).map(([k])=>k);
      if(stale.length>0){
        await Promise.all(stale.map(async sym=>{
          const q=await fetchMed24Quote(sym);
          if(q&&q.price&&q.price>0)out[sym]={...out[sym],...q};
        }));
      }
    }
    return out;
  }
  // Médias24 par titre (plus lent mais fiable)
  await Promise.all(STATIC.map(async s=>{
    const q=await fetchMed24Quote(s.symbol);
    if(q)out[s.symbol]=q;
  }));
  if(Object.keys(out).length>0)return out;
  // Dernier recours: Yahoo Finance
  const syms=STATIC.map(s=>CONFIG.YF_MAP[s.symbol]||`${s.symbol}.CS`).join(",");
  const yf=await bvcGet(`${YF_BASE}/v7/finance/quote?symbols=${syms}`);
  yf?.quoteResponse?.result?.forEach(q=>{
    const sym=Object.keys(CONFIG.YF_MAP).find(k=>CONFIG.YF_MAP[k]===q.symbol)||(q.symbol||"").replace(".CS","");
    if(!sym)return;
    out[sym]={price:q.regularMarketPrice,chg:q.regularMarketChangePercent,open:q.regularMarketOpen,close:q.regularMarketPrice,live:true,src:"Yahoo Finance"};
  });
  return Object.keys(out).length>0?out:null;
}

// fetchChart: Médias24 → Yahoo Finance → genCandles (simulé)
async function fetchChart(sym,range){
  const daysMap={"5d":7,"1mo":30,"3mo":90,"6mo":180,"1y":365};
  const days=daysMap[range]||90;
  const med=await fetchMed24History(sym,days);
  if(med)return med;
  return fetchYFChart(sym,range);
}

// ── MARKET STATUS (BVC Casablanca, UTC+1 toute l'année) ───────────────────────
function getMarketStatus(){
  const d=new Date(new Date().toLocaleString("en-US",{timeZone:"Africa/Casablanca"}));
  const day=d.getDay(); // 0=dim, 6=sam
  if(day===0||day===6)return{label:"FERMÉ",color:"#ff4f5a",isOpen:false};
  const tot=d.getHours()*60+d.getMinutes();
  if(tot>=560&&tot<570)return{label:"PRÉ-OUVERTURE",color:"#ffd740",isOpen:false};  // 9h20-9h30
  if(tot>=570&&tot<930)return{label:"OUVERT",color:"#00e5a0",isOpen:true};           // 9h30-15h30
  if(tot>=930&&tot<940)return{label:"POST-CLÔTURE",color:"#4db8ff",isOpen:false};   // 15h30-15h40
  return{label:"FERMÉ",color:"#ff4f5a",isOpen:false};
}

// ── TECHNICAL CALCULATIONS ────────────────────────────────────────────────────
function mulberry32(seed){
  let s=seed>>>0;
  return function(){s+=0x6D2B79F5;let t=Math.imul(s^(s>>>15),s|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};
}

function genCandles(price,h90,l90,days=90){
  const rng=mulberry32(Math.round(price*137)>>>0);
  const data=[];
  const range=h90-l90;
  let cur=price*(0.75+rng()*0.15);
  const ref=new Date();
  for(let i=days;i>=0;i--){
    const d=new Date(ref);d.setDate(d.getDate()-i);
    const dow=d.getDay();if(dow===0||dow===6)continue;
    const vol=range/price*0.012;
    const pull=(price-cur)/price*0.04;
    const step=(rng()-0.47+pull)*vol*cur;
    cur=Math.max(l90*0.92,Math.min(h90*1.08,cur+step));
    const wk=cur*vol*(0.3+rng()*0.7);
    const o=cur;
    const h=o+wk*(0.2+rng()*0.6);
    const l=Math.max(o-wk*(0.2+rng()*0.6),1);
    const c=l+rng()*(h-l);
    cur=c;
    const volAmt=Math.round(range*800*(0.4+rng()*1.6));
    data.push({x:d.getTime(),y:[o,h,l,c].map(v=>+v.toFixed(2)),vol:volAmt});
  }
  return data;
}

function calcRSI(closes,p=14){
  if(closes.length<p+1)return 50;
  let g=0,l=0;
  for(let i=1;i<=p;i++){const d=closes[i]-closes[i-1];if(d>0)g+=d;else l-=d;}
  let ag=g/p,al=l/p;
  for(let i=p+1;i<closes.length;i++){const d=closes[i]-closes[i-1];ag=(ag*(p-1)+Math.max(d,0))/p;al=(al*(p-1)+Math.max(-d,0))/p;}
  return al===0?100:+(100-100/(1+ag/al)).toFixed(1);
}

function calcMA(closes,p){
  return closes.map((_,i)=>i<p?null:+(closes.slice(i-p,i).reduce((a,b)=>a+b,0)/p).toFixed(2));
}

function calcFib(high,low){
  const d=high-low;
  return [0,0.236,0.382,0.5,0.618,0.786,1.0].map(r=>[r,+(low+d*r).toFixed(2)]);
}

function calcEMA(arr,p){
  if(arr.length<p)return arr.map(()=>null);
  const k=2/(p+1);const res=new Array(p-1).fill(null);
  let ema=arr.slice(0,p).reduce((a,b)=>a+b,0)/p;
  res.push(+ema.toFixed(3));
  for(let i=p;i<arr.length;i++){ema=arr[i]*k+ema*(1-k);res.push(+ema.toFixed(3));}
  return res;
}

function calcMACD(closes,fast=12,slow=26,sig=9){
  const emaF=calcEMA(closes,fast),emaS=calcEMA(closes,slow);
  const macdLine=emaF.map((f,i)=>f!==null&&emaS[i]!==null?+(f-emaS[i]).toFixed(3):null);
  const validPairs=macdLine.map((v,i)=>({v,i})).filter(x=>x.v!==null);
  const sigEma=calcEMA(validPairs.map(x=>x.v),sig);
  const sigLine=new Array(macdLine.length).fill(null);
  validPairs.forEach((x,j)=>{if(sigEma[j]!==null)sigLine[x.i]=sigEma[j];});
  const hist=macdLine.map((m,i)=>m!==null&&sigLine[i]!==null?+(m-sigLine[i]).toFixed(3):null);
  return{macd:macdLine,signal:sigLine,hist};
}

function calcBollinger(closes,period=20,mult=2){
  const upper=[],middle=[],lower=[];
  for(let i=0;i<closes.length;i++){
    if(i<period-1){upper.push(null);middle.push(null);lower.push(null);continue;}
    const sl=closes.slice(i-period+1,i+1);
    const avg=sl.reduce((a,b)=>a+b,0)/period;
    const std=Math.sqrt(sl.reduce((a,b)=>a+(b-avg)**2,0)/period);
    upper.push(+(avg+mult*std).toFixed(2));
    middle.push(+avg.toFixed(2));
    lower.push(+(avg-mult*std).toFixed(2));
  }
  return{upper,middle,lower};
}

function calcIchimoku(candles){
  const highs=candles.map(c=>c.y[1]),lows=candles.map(c=>c.y[2]);
  const tenkan=[],kijun=[];
  for(let i=0;i<candles.length;i++){
    tenkan.push(i<8?null:+((Math.max(...highs.slice(i-8,i+1))+Math.min(...lows.slice(i-8,i+1)))/2).toFixed(2));
    kijun.push(i<25?null:+((Math.max(...highs.slice(i-25,i+1))+Math.min(...lows.slice(i-25,i+1)))/2).toFixed(2));
  }
  return{tenkan,kijun};
}

  const v=Math.min(100,Math.max(0,value||50));
  const color=v>70?"#ff4f5a":v<30?"#00e5a0":"#ffd740";
  const label=v>70?"SURACHETÉ":v<30?"SURVENDU":"NEUTRE";

const FibTable=({high,low,price})=>{
  const fibs=calcFib(high,low);
  return(
    <div>
      <div style={{fontSize:10,color:"#8892a4",letterSpacing:1,marginBottom:8,textTransform:"uppercase"}}>Retracements Fibonacci</div>
      <div style={{fontSize:9,color:"#8892a4",marginBottom:4}}>Plage 90j: {px(low)} → {px(high)}</div>
      {fibs.map(([r,val])=>{
        const pctFromPrice=((val-price)/price*100).toFixed(1);
        const isNear=Math.abs(val-price)/price<0.03;
        return(
          <div key={r} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 0",borderBottom:"1px solid #0d1829",background:isNear?"rgba(255,215,64,.06)":"transparent"}}>
            <span style={{fontSize:10,color:"#ffd740",minWidth:36,fontWeight:isNear?700:400}}>{r===0?"0.0":r===1?"1.0":r}</span>
            <div style={{flex:1,background:"#0a1220",borderRadius:2,height:3}}>
              <div style={{width:`${Math.max(0,(val-low)/(high-low)*100)}%`,height:"100%",background:isNear?"#ffd740":"#ffd74040"}}/>
            </div>
            <span style={{fontSize:11,color:isNear?"#ffd740":"#c8d3e8",minWidth:60,textAlign:"right",fontWeight:isNear?700:400}}>{px(val)}</span>
            <span style={{fontSize:10,color:pctFromPrice>0?"#00e5a0":"#ff4f5a",minWidth:44,textAlign:"right"}}>{pctFromPrice>0?"+":""}{pctFromPrice}%</span>
            {isNear&&<span style={{fontSize:9,color:"#ffd740"}}>◀</span>}
          </div>
        );
      })}
    </div>
  );
};

const StockChart=({r})=>{
  const refMain=useRef(null),refVol=useRef(null),refMacd=useRef(null);
  const instMain=useRef(null),instVol=useRef(null),instMacd=useRef(null);
  const [period,setPeriod]=useState(()=>localStorage.getItem("bvc_period")||"3M");
  const [liveCandles,setLiveCandles]=useState(null);
  const [isLive,setIsLive]=useState(false);
  const [showBB,setShowBB]=useState(false);
  const [showIchi,setShowIchi]=useState(false);
  const sym=r.symbol||r.ticker;
  const daysMap={"5J":7,"1M":22,"3M":65,"6M":130,"1A":260};
  const rangeMap={"5J":"5d","1M":"1mo","3M":"3mo","6M":"6mo","1A":"1y"};

  useEffect(()=>{
    let alive=true;
    setLiveCandles(null);setIsLive(false);
    fetchChart(sym,rangeMap[period]||"3mo").then(c=>{
      if(alive&&c){
        // Ajouter la bougie d'aujourd'hui si données live disponibles et dernière bougie < aujourd'hui
        if(r.live&&c.length>0){
          const now=new Date(new Date().toLocaleString("en-US",{timeZone:"Africa/Casablanca"}));
          const todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
          if(c[c.length-1].x<todayStart&&now.getDay()!==0&&now.getDay()!==6){
            const prevClose=c[c.length-1].y[3];
            const cur=r.price;
            if(cur&&cur>0){
              c.push({x:todayStart,y:[prevClose,Math.max(prevClose,cur),Math.min(prevClose,cur),cur].map(v=>+v.toFixed(2)),vol:r.vol||0});
            }
          }
        }
        setLiveCandles(c);setIsLive(true);
      }
    });
    return()=>{alive=false;};
  },[sym,period,r.live,r.price,r.vol]);

  useEffect(()=>{
    if(!refMain.current||!refVol.current||!refMacd.current)return;
    const days=daysMap[period]||65;
    const candles=liveCandles||genCandles(r.price||r.prix,r.h90||r.high90,r.l90||r.low90,days);
    const closes=candles.map(c=>c.y[3]);
    const ma20=calcMA(closes,20);
    const ma50=calcMA(closes,50);
    const macdData=calcMACD(closes);
    const bbData=calcBollinger(closes);
    const ichiData=calcIchimoku(candles);
    const grp="bvc_"+sym+"_"+period;

    const ma20data=candles.map((c,i)=>({x:c.x,y:ma20[i]})).filter(p=>p.y!==null);
    const ma50data=candles.map((c,i)=>({x:c.x,y:ma50[i]})).filter(p=>p.y!==null);

    // Volume: couleur selon direction de la bougie
    const volData=candles.map(c=>({x:c.x,y:c.vol||0,fillColor:c.y[3]>=c.y[0]?"#00e5a045":"#ff4f5a45"}));

    // MACD: histogramme vert/rouge
    const macdLine=candles.map((c,i)=>({x:c.x,y:macdData.macd[i]})).filter(p=>p.y!==null);
    const sigLine=candles.map((c,i)=>({x:c.x,y:macdData.signal[i]})).filter(p=>p.y!==null);

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const [tab,setTab]=useState(()=>localStorage.getItem("bvc_tab")||"ranking");
  const [sort,setSort]=useState("v53");
  const [sel,setSel]=useState("CMT");
  const [rows,setRows]=useState(STATIC);
  const [ts,setTs]=useState(new Date().toLocaleString("fr-FR",{timeZone:"Africa/Casablanca",hour:"2-digit",minute:"2-digit"}));
  const [src,setSrc]=useState("connexion…");
  const [loading,setLoading]=useState(false);
  const [fetchErr,setFetchErr]=useState(false);
  const [mktStatus,setMktStatus]=useState(getMarketStatus());

  // Update market status every 30s
  useEffect(()=>{
    const t=setInterval(()=>setMktStatus(getMarketStatus()),30000);
    return()=>clearInterval(t);
  },[]);

  // Merge live quote data into rows (functional update, no dep on rows)
  const mergeLive=useCallback((liveMap)=>{
    setRows(prev=>prev.map(s=>{
      const live=liveMap[s.symbol];
      if(!live)return s;
      return{...s,...live};
    }));
  },[]);

  // Load data: Yahoo Finance → data.json → STATIC (silent fallback chain)
  const loadData=useCallback(async()=>{
    setLoading(true);
    setFetchErr(false);
    // IDBourse → Médias24 → Yahoo Finance (chaîne automatique dans fetchQuotes)
    try{
      const liveMap=await fetchQuotes();
      if(liveMap&&Object.keys(liveMap).length>0){
        mergeLive(liveMap);
        setTs(new Date().toLocaleString("fr-FR",{timeZone:"Africa/Casablanca",hour:"2-digit",minute:"2-digit"}));
        // Show the actual source used (first non-null src field)
        const srcs=Object.values(liveMap).map(v=>v.src).filter(Boolean);
        const mainSrc=srcs[0]||"live";
        setSrc(`${mainSrc} ●`);
        setLoading(false);return;
      }
    }catch{}
    // Fallback: data.json (manually maintained)
    try{
      const d=await fetch("data.json?t="+Date.now()).then(r=>r.ok?r.json():null);
      if(d?.tickers){
        const m={};
        d.tickers.forEach(t=>{m[t.symbol]={
          price:t.price,chg:t.chg,vol:t.vol||0,open:t.open,close:t.close,
          pe:t.pe,pb:t.pb,div:t.div,cap:t.cap,
          h90:t.h90,l90:t.l90,rsi:t.rsi,ma20:t.ma20,ma50:t.ma50,
          bvc:t.bvc,v53:t.v53,delta:t.delta,nlp:t.nlp,
          alpha:t.alpha,win:t.win,sig:t.sig,biais:t.biais,
          bonus:t.bonus,poids:t.poids,warn:t.warn,warnMsg:t.warnMsg,
          bear:t.bear,base:t.base,bull:t.bull,upside:t.upside,flags:t.flags,
          conv:t.conv,setup:t.setup
        };});
        mergeLive(m);
        const upd=d.updated?new Date(d.updated):null;
        const timeStr=upd?upd.toLocaleString("fr-FR",{timeZone:"Africa/Casablanca",hour:"2-digit",minute:"2-digit"}):"";
        const dateStr=upd?upd.toLocaleString("fr-FR",{timeZone:"Africa/Casablanca",day:"2-digit",month:"2-digit"}):"";
        const maj=dateStr&&timeStr?`${dateStr} · ${timeStr}`:"";
        setTs(maj);
        const mktNow=getMarketStatus();
        const ageMin=upd?(Date.now()-upd.getTime())/60000:Infinity;
        const stale=mktNow.isOpen&&ageMin>30;
        setSrc(`BVC${stale?" ⚠ données >30min":""}${dateStr?" · "+dateStr:""}`);
        setLoading(false);return;
      }
    }catch{}
    // Last resort: keep STATIC values
    setFetchErr(true);
    setSrc("données statiques");
    setLoading(false);
  },[mergeLive]);

  // Initial load + auto-refresh every 5min (always, pipeline may have updated data.json)
  useEffect(()=>{
    loadData();
    const iv=setInterval(()=>loadData(),300000);
    return()=>clearInterval(iv);
  },[loadData]);

  const changeTab=(t)=>{setTab(t);localStorage.setItem("bvc_tab",t);};

  return(
    <div style={{minHeight:"100vh"}}>
      <Header tab={tab} setTab={changeTab} ts={ts} src={src} onRefresh={loadData} loading={loading} fetchErr={fetchErr} mktStatus={mktStatus}/>
      <div style={{padding:14,maxWidth:1600,margin:"0 auto"}}>
        {tab==="ranking"&&<Ranking rows={rows} sort={sort} setSort={setSort} setSel={setSel} setTab={changeTab}/>}
        {tab==="detail" &&<Detail rows={rows} sel={sel} setSel={setSel}/>}
        {tab==="weights"&&<Weights/>}
        {tab==="smart"  &&<Smart/>}
        {tab==="chat"   &&<Chat/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
